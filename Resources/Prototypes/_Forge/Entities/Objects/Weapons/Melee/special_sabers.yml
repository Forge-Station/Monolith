
- type: entity
  parent: BaseItem
  id: MeleeStanceExampleBlade
  name: Sabre of Sioner Officer
  description: Wow
  components:
  - type: Sprite
    sprite: _Forge/Objects/Weapons/Melee/sword_tsf.rsi
    layers:
    - state: icon
    - state: icon-unshaded
      visible: false
      shader: unshaded
      map: [ "blade" ]
  - type: Item
    size: Normal
    sprite: _Forge/Objects/Weapons/Melee/sword_tsf.rsi
  - type: PointLight
    radius: 2
    energy: 2
    color: white
  - type: MeleeWeapon
    heavyStaminaCost: 2.5
    attackRate: 1.5
    damage:
      types:
        Slash: 32
    soundHit:
        path: /Audio/Weapons/bladeslice.ogg
  - type: Reflect
    reflectProb: .1
    spread: 90
  - type: StaminaDamageOnHit
    damage: 0
  - type: ItemTogglePointLight
    toggleableVisualsColorModulatesLights: true
  - type: ItemToggleMeleeWeapon
    activatedSoundOnHit:
      path: /Audio/Weapons/eblade1.ogg
      params:
        variation: 0.250
    activatedSoundOnHitNoDamage:
      path: /Audio/Weapons/eblade1.ogg
      params:
        variation: 0.250
        volume: -10
    activatedSoundOnSwing:
      path: /Audio/Weapons/eblademiss.ogg
      params:
        variation: 0.125
  - type: Appearance
  - type: ToggleableVisuals
    spriteLayer: blade
    inhandVisuals:
      left:
      - state: inhand-left
        shader: icon-unshaded
      right:
      - state: inhand-right
        shader: icon-unshaded

