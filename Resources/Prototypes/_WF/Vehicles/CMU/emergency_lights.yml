# The emergency lights of CMU's ambulance, police car and paddywagon: an action the operator uses to cycle a red and blue
# lightbar through off, slow, medium and fast. The names are in Resources/Locale/en-US/_WF/Vehicles/cmu-civilian.ftl.

# Given to whoever operates a vehicle that has CMUEmergencyLights, and taken back when they stop.
- type: entity
  id: CMUActionVehicleEmergencyLights
  categories: [ WFVehicles ]
  components:
  - type: InstantAction
    autoPopulate: false
    icon:
      sprite: Structures/Wallmounts/Lighting/emergency_light.rsi
      state: emergency_light_off
    iconOn:
      sprite: Structures/Wallmounts/Lighting/emergency_light.rsi
      state: emergency_light_on
    event: !type:CMUEmergencyLightsActionEvent
    useDelay: 0.5
    checkCanInteract: false
    raiseOnUser: true
    itemIconStyle: BigAction

- type: entity
  id: CMUEmergencyLightbarBase
  abstract: true
  categories: [ HideSpawnMenu, WFVehicles ]
  save: false
  components:
  - type: PointLight
    radius: 5
    energy: 3
    softness: 1
    color: "#FF1A1A"

- type: entity
  parent: CMUEmergencyLightbarBase
  id: CMUEmergencyLightbarSlow
  components:
  - type: LightBehaviour
    behaviours:
    - !type:ColorCycleBehaviour
      interpolate: Nearest
      maxDuration: 1.2
      isLooped: true
      enabled: true
      colors:
      - "#FF1A1A"
      - "#1A3CFF"

- type: entity
  parent: CMUEmergencyLightbarBase
  id: CMUEmergencyLightbarMedium
  components:
  - type: LightBehaviour
    behaviours:
    - !type:ColorCycleBehaviour
      interpolate: Nearest
      maxDuration: 0.7
      isLooped: true
      enabled: true
      colors:
      - "#FF1A1A"
      - "#1A3CFF"

- type: entity
  parent: CMUEmergencyLightbarBase
  id: CMUEmergencyLightbarFast
  components:
  - type: LightBehaviour
    behaviours:
    - !type:ColorCycleBehaviour
      interpolate: Nearest
      maxDuration: 0.3
      isLooped: true
      enabled: true
      colors:
      - "#FF1A1A"
      - "#1A3CFF"
