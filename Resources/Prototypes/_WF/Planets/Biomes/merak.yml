    entities: [ChompTreeDesertPlanetMpalmtree, ChompTreeDesertPlanetPalmtree, TgFloraTreePalm, ChompTreeDesertPlanetSpalmtree]
  # Date palms in the thickest groves
  - !type:BiomeEntityLayer
    threshold: 0.8
    noise: { seed: 45, noiseType: OpenSimplex2, frequency: 0.3 }
    allowedTiles: [WFFloorMerakOasisDirt, WFFloorMerakOasisGrass]
    entities: [WFMerakDatePalm]
  - !type:BiomeEntityLayer
    threshold: 0.875
    noise: { seed: 41, noiseType: OpenSimplex2, frequency: 0.0075, fractalType: FBm, octaves: 2 }
    allowedTiles: [WFFloorMerakOasisDirt, WFFloorMerakOasisGrass]
    entities: [AuroraFloraBushKonyangReeds]
  - !type:BiomeEntityLayer
    threshold: 0.9
    noise: { seed: 41, noiseType: OpenSimplex2, frequency: 0.0075, fractalType: FBm, octaves: 2 }
    allowedTiles: [WFFloorMerakOasisDirt, WFFloorMerakOasisGrass]
    entities: [MonoFloorWaterEntity]
  - !type:BiomeTileLayer
    threshold: -1
    tile: WFFloorMerakOasisDirt
  - !type:BiomeTileLayer
    threshold: 0.86
    tile: WFFloorMerakOasisGrass
    noise: { seed: 41, noiseType: OpenSimplex2, frequency: 0.0075, fractalType: FBm, octaves: 2 }
