# ARREST: a stopped heart is MobState.Critical and looks dead to anyone examining it. The medical HUD is
# what tells the difference, so it gets its own icon instead of the ordinary critical one.

- type: healthIcon
  id: WFHealthIconWolfmedArrest
  parent: HealthIcon
  icon:
    sprite: /Textures/_WF/Wolfmed/Interface/health_icons.rsi
    state: Flatline

# M1a (plan §5.3): a Downed patient who called for help, shown on medical HUDs for a minute. Placeholder art:
# the stock critical icon on the other side of the sprite.
- type: healthIcon
  id: WFHealthIconWolfmedCallForHelp
  parent: HealthIcon
  locationPreference: Right
  icon:
    sprite: /Textures/Interface/Misc/health_icons.rsi
    state: Critical
