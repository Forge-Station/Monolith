#region R&D
- type: entity
  id: ForgeRnDRenegateServer
  parent: ResearchAndDevelopmentServer
  name: renegate R&D server
  description: Contains the collective knowledge of the Renegates in this sector.
  suffix: Ренегаты
  components:
  - type: TechnologyDatabase
    supportedDisciplines:
    - Industrial
    - Arsenal
    - Experimental
    - ShipArmory
    - CivilianServices
    - MechaEngineering
    - FactionUniversal
    - RenegateWeaponry
    - RenegateEquipment
    - RenegateVouchers
  - type: Sprite
    sprite: _Forge/Structures/Machines/server.rsi
    snapCardinals: true
    layers:
    - state: ren_server-off
    - state: ren_server-on
      visible: false
      map: ["enum.PowerDeviceVisualLayers.Powered"]
    - state: variant-ren
    - state: server_o
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: ResearchPointSource
    pointsPerSecond: 1
    active: true

- type: entity
  id: ResearchAndDevelopmentServerEmpire
  parent: BaseRdServerFaction
  name: Empire R&D server
  description: Contains the collective knowledge of the Phaethon Dynasty.
  components:
  - type: Sprite
    sprite: _Forge/Structures/Machines/server.rsi
    layers:
    - state: server
    - state: variant-empire
    - state: server_o
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: TechnologyDatabase
    supportedDisciplines:
    - Empire
    - FactionUniversal
    - Industrial
    - ShipArmory
    - Arsenal
    - Experimental
    - CivilianServices
    - MechaEngineering

#region Crew
- type: entity
  id: CrewMonitoringRenegadeServer
  parent: [CrewMonitoringServer, BaseStructureDisableToolUse]
  suffix: Renegade
  name: crew renegade monitoring server
  description: Receives and relays the status of all active renegade implant sensors.
  components:
    - type: Sprite
      sprite: _Forge/Structures/Machines/server.rsi
      layers:
        - state: server-crew
        - state: variant-crew-renegade
    - type: DeviceNetwork
      deviceNetId: Wireless
      transmitFrequencyId: CrewRenegadeMonitor
      receiveFrequencyId: SuitRenegadeSensor
      autoConnect: false

