# Sparse ambient wildlife.
# Table spawners produce mobile animals; placing mobs directly in a biome layer would anchor them.

- type: entityTable
  id: WFFaunaAsclepiu
  table: !type:GroupSelector
    children:
    - id: MobFox
      weight: 4
    - id: MobLizard
      weight: 3
    - id: MobCrab
      weight: 2
    - id: MobSnake
      weight: 1

- type: entity
  id: WFFaunaAsclepiu
  parent: MarkerBase
  name: asclepiu wildlife spawner
  categories: [HideSpawnMenu]
  components:
  - type: WFPlanetFaunaSpawner
    table: WFFaunaAsclepiu

- type: entityTable
  id: WFFaunaFervidus
  table: !type:GroupSelector
    children:
    # A bird flock (_WF/Birds); the leader spawns the rest.
    - id: WFMobBirdAshHawk
      weight: 2
    - id: WFMobArgocyteSlurvaBasalt
      weight: 6
    - id: WFMobArgocyteCrawlerBasalt
      weight: 3
    - id: WFMobArgocyteSwiperBasalt
      weight: 1

- type: entity
  id: WFFaunaFervidus
  parent: MarkerBase
  name: fervidus wildlife spawner
  categories: [HideSpawnMenu]
  components:
  - type: WFPlanetFaunaSpawner
    table: WFFaunaFervidus

# The table is in Life/aerumna.yml, with the other regions'.
- type: entity
  id: WFFaunaAerumna
