# Faction heavy shields: same chassis tiers as FSG-420 / 470P / 600C, tuned per doctrine (tradeoffs on ShipShieldEmitter).

# --- TSFMC — regulation-grade sustained combat; pays in baseline power or lockout ---

- type: entity
  id: ShieldGeneratorForgeTSFHeavy
  parent: ShieldGeneratorFSG420
  name: TSFMC SGS-440 "Citadel" shield generator
  suffix: tier 3
  description: >-
    A TSFMC-issue heavy screen with faster regeneration and a higher overload ceiling than civilian FSG-420,
    at the cost of noticeably higher idle and peak power draw.
  components:
  - type: Machine
    board: MachineShieldForgeTSFHeavyCircuitboard
  - type: ShipShieldEmitter
    shieldColor: "#48E8A8"
    healPerSecond: 125
    damageLimit: 12200
    damageExp: 1.04
    baseDraw: 47000
    maxDraw: 105000
  - type: Sprite
    sprite: Forge/Structures/Machines/shield_fsg_tier3.rsi
    snapCardinals: true
    layers:
    - state: control
    - state: control_on
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
      visible: false
      color: "#48E8A8"
  - type: PointLight
    enabled: false
    castShadows: true
    radius: 2
    energy: 1.5
    color: "#48E8A8"

- type: entity
  id: ShieldGeneratorForgeTSFPrismatic
  parent: ShieldGeneratorFSG470P
  name: TSFMC SGS-470P "Corona Array" shield generator
  suffix: tier 3
  description: >-
    A TSFMC prismatic array with a deeper damage buffer and quicker recovery from overload lockout;
    under sustained abuse it becomes more power-hungry than standard Lattice-class hardware.
