# Forge-Change-Start
- type: noiseChannel
  id: DensityClustered
  noiseType: Perlin
  fractalLacunarityByPi: 0.666666666
  remapTo0Through1: true
  clippingRanges:
  - 0.0, 0.62
  clippedValue: 0
  inputMultiplier: 2.2
  outputMultiplier: 180
  minimum: 0.4

- type: spaceBiome
  id: ForgeEmptyFallback
  priority: 0
  distanceRange: 0, 100000
  noiseRanges: {}

- type: spaceBiome
  id: ForgeAsteroidsGreen
  parent: NFBiomeBase
  priority: 40
  distanceRange: 2500, 7500
  chunkComponents:
  - type: DebrisFeaturePlacerController
    densityNoiseChannel: Density
  - type: SimpleDebrisSelector
    debrisTable:
    - id: NFAsteroidDebrisSmall
      prob: 0.8
      orGroup: debris
    - id: NFAsteroidDebrisMedium
      prob: 1.4
      orGroup: debris
    - id: NFAsteroidDebrisLarge
      prob: 1.8
      orGroup: debris
    - id: NFAsteroidDebrisExtraLarge
      prob: 0.7
      orGroup: debris
    - id: NFAsteroidDebrisHuge
      prob: 0.3
      orGroup: debris
    - id: NFAsteroidSandDebrisMedium
      prob: 0.4
      orGroup: debris
    - id: NFAsteroidScrapDebrisSmall
      prob: 0.3
      orGroup: debris
  - type: NoiseDrivenDebrisSelector
    debrisTable:
    - id: NFWreckDebrisSmall
      prob: 1
      orGroup: wreck
    - id: NFWreckDebrisMedium
      prob: 0.3
      orGroup: wreck
    - id: NFWreckDebrisLarge
      prob: 0.1
      orGroup: wreck
    - id: NFWreckDebrisExtraLarge
      prob: 0.03
      orGroup: wreck

