- type: entity
  id: GoblinThruster
  parent: Thruster
  name: thruster-goblin-name
  description: thruster-goblin-desc
  components:
    - type: Sprite
      sprite: Forge/Structures/Shuttles/thruster.rsi
      layers:
      - state: base_goblin
        map: ["enum.ThrusterVisualLayers.Base"]
      - state: base_goblin_light_unshaded
        map: ["enum.ThrusterVisualLayers.ThrustOn"]
        shader: unshaded
        visible: false
      - state: base_goblin_flame_unshade
        map: ["enum.ThrusterVisualLayers.ThrustingUnshaded"]
        shader: unshaded
        visible: false
        offset: 0, 0.5
    - type: Machine
      board: GoblinThrusterCircuitboard
    - type: Construction
      graph: goblin_machinery
      node: goblinThruster

- type: entity
  parent: Thruster
  id: ThrusterPartsT3
  suffix: T3 Parts
  components:
  - type: Machine
    partOverrides:
      Capacitor: SuperCapacitorStockPart

- type: entity
  parent: Thruster
  id: ThrusterPartsT4
  suffix: T4 Parts, ADS ONLY
  components:
  - type: Machine
    partOverrides:
      Capacitor: QuadraticCapacitorStockPart

- type: entity
  parent: Gyroscope
  id: GyroscopePartsT2
  suffix: T2 parts
  components:
  - type: Machine
    partOverrides:
      Capacitor: AdvancedCapacitorStockPart
      Manipulator: NanoManipulatorStockPart

- type: entity
  parent: Gyroscope
  id: GyroscopePartsT3
  suffix: T3 parts
  components:
  - type: Machine
    partOverrides:
      Capacitor: SuperCapacitorStockPart
      Manipulator: PicoManipulatorStockPart

- type: entity
  parent: Gyroscope
  id: GyroscopePartsT4
  suffix: T4 parts, ADS ONLY
  components:
  - type: Machine
    partOverrides:
      Capacitor: QuadraticCapacitorStockPart
      Manipulator: FemtoManipulatorStockPart

