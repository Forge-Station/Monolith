# region TSF
- type: entity
  parent: [ ClothingNeckBase, BaseFactionGearTSFT0 ]
  id: ClothingNeckMantleTSFMCFolded
  name: folded federation mantle
  description: A standard mantle folded for convenience, so it won't get in the way during combat. Subtle and tasteful.
  suffix: TSF
  components:
  - type: Sprite
    sprite: _Forge/Clothing/Neck/mantles/tsf_folded.rsi
  - type: Clothing
    sprite: _Forge/Clothing/Neck/mantles/tsf_folded.rsi

- type: entity
  parent: [ ClothingNeckBase, BaseStorageItem, BaseFactionGearTSFT0 ]
  id: ClothingNeckMantleTSFMCPouches
  name: federation mantle with pouches
  description: A custom-made Federation mantle from an unknown mercenary company. It has a small storage compartment for various needs.
  suffix: TSF
  components:
  - type: Sprite
    sprite: _Forge/Clothing/Neck/mantles/tsf_pouches.rsi
  - type: Clothing
    sprite: _Forge/Clothing/Neck/mantles/tsf_pouches.rsi
  - type: Storage
    maxItemSize: Small
    grid:
    - 0,0,3,1

