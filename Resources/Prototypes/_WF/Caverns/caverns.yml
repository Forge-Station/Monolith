# One cavern under each world, built at depth -1 with its planet network while wf.caverns is on.
# Mouths: each hole is grown from its own seed to the world's style and size range (CAVERNS_DESIGN.md 3.3).
# Avoid also lists each world's rock-outcrop spawner, so no mouth is walled in by an outcrop.

- type: wfCavern
  id: WFCavernAsclepiu
  surface: WFSurfaceAsclepiu
  name: wf-cavern-asclepiu-name
  level: WFCavernAsclepiuLevel
  seedOffset: 7901
  roofColor: "#070a08"
  shaftLight: 0.5
  mouths:
    style: Blob
    minTiles: 14
    maxTiles: 30
    elongation: 1.6
    roughness: 0.35
    cellSize: 96
    groundTiles: [FloorPlanetGrass, FloorPlanetDirt, FloorSnow]
    avoid: [MonoFloorWaterEntity, MonoPlanetmapOreBase, MonoPlanetmapOreSnow]
    landingTile: WFCavernFloorPoolbed
    landingEntity: MonoFloorWaterEntity
    shade: WFCavernShadeAsclepiu
    climbPoint: WFCavernClimbAsclepiu
    rim: [FloraRockSolid]
    rimCount: 2

