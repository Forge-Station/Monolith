- type: job
  id: NtMedic #TO-DO: rename it to trauma medic
  name: job-name-nt-medic
  description: job-description-nt-medic
  playTimeTracker: NtMedic
  requirements:
    - !type:OverallPlaytimeRequirement
      time: 21600 # 6 hrs
  startingGear: NtMedicGear
  alwaysUseSpawner: true
  icon: "JobIconntmedic"
  supervisors: job-supervisors-doc
  weight: 170
  displayWeight: 38
  assignedCompany: MD
  canBeAntag: false
  accessGroups:
  - BaseAccess
  - GeneralTraumaAccess
  special:
