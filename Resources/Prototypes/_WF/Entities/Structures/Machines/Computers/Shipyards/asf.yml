- type: entity
  parent: BaseCarrierComputer
  id: WFAsfComputerShipyard
  suffix: ASF
  components:
  - type: Sprite
    sprite: _NF/Structures/Machines/computers.rsi
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      sprite: _WF/Asf/Structures/shipyard_screen.rsi
      state: shipyard_asf
    - map: ["computerLayerKeys"]
      state: telesci_key
  - type: ShipyardListing
    shuttles:
    - WFAsfGleaner
    - WFAsfPorter
    - WFAsfLamplighter
    - WFAsfVigil
    - WFAsfBulwark
    - WFAsfGuardian
    - WFAsfLodestar
  # Checked by company, not ID: a buyer's only ID card is in the console's slot while they buy.
  - type: CompanyAccessReader
    requiredCompanies:
    - WFAsf