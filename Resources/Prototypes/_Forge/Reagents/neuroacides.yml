        time: 8
        refresh: false
        conditions:
        - !type:ReagentThreshold
          min: 5
      - !type:Drunk
        boozePower: 5
        slurSpeech: false
        conditions:
        - !type:ReagentThreshold
          min: 5
      - !type:TunnelVision
        intensity: 1.4
        pulse: 2.2
        darkness: 0.6
        color: "#9f7ab5FF"
        time: 4
        conditions:
        - !type:ReagentThreshold
          min: 8
      - !type:Jitter
        conditions:
        - !type:ReagentThreshold
          min: 10
      - !type:StaminaDamageEffect
        forceCrit: true
        conditions:
        - !type:ReagentThreshold
          min: 10
      - !type:GenericStatusEffect
