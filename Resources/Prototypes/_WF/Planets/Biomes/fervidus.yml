    threshold: 0.985
    noise: { seed: 118, noiseType: OpenSimplex2, frequency: 2 }
  # Burnt trees, solid and rare.
  - !type:BiomeEntityLayer
    allowedTiles: [WFFloorFervidusAshDust, WFFloorFervidusAshDirt]
    entities: [CoyoteFloraBurnedtree5]
    threshold: 0.985
    noise: { seed: 119, noiseType: OpenSimplex2, frequency: 2 }
  # Rarest of all, a lit dead tree.
  - !type:BiomeEntityLayer
    allowedTiles: [WFFloorFervidusAshDust, WFFloorFervidusAshDirt]
    entities: [ShiptestTreeDeadHell]
    threshold: 0.99
    noise: { seed: 120, noiseType: OpenSimplex2, frequency: 2 }

# The crust of cooled rock round the lava channels (laid by WFOpenBasalt on the same noise as the crust tiles):
# cinder slimes and the rare hellspawn, and ember flowers.
- type: biomeTemplate
  id: WFFervidusLavaCrust
  layers:
  - !type:BiomeEntityLayer
    allowedTiles: [WFFloorFervidusAshRock]
    entities: [WFFaunaFervidusCrust]
    threshold: 0.95
    noise: { seed: 37, noiseType: OpenSimplex2, frequency: 3 }
  # Spitting flowers.
  - !type:BiomeEntityLayer
    allowedTiles: [WFFloorFervidusAshRock]
    entities: [WFFloraPlasmaSpitter]
    threshold: 0.95
    noise: { seed: 131, noiseType: OpenSimplex2, frequency: 3 }
