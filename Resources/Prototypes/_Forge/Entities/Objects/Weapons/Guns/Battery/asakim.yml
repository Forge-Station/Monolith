- type: entity
  name: kunisa-pattern plasma machinegun
  parent: WeaponRifleADMAutopulserForge
  id: WeaponRifleADMMachinegunForge
  description: An advanced handheld plasma machinegun. It fires physically solid, razor-sharp shards of plasma that slice through targets on a monomolecular level.
