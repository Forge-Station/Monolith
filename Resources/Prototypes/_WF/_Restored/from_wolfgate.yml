  parent: BaseStructure
  id: CMBarricadeBase
  components:
  - type: Rotatable
  - type: Appearance
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,-0.38"
        density: 500
        mask:
        - FullTileMask
        layer:
        - TableLayer
  - type: RotationDrawDepth
  - type: Barricade
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: CMBarricade
  - type: DirectionalAttackBlocker
  - type: InteractionOutline
  - type: GenericVisualizer
    visuals:
      enum.BarbedWireVisualLayers.Wire:
        barbWired:
          UnWired: { state: metal_wire, visible: false }
          WiredClosed: { state: metal_wire, visible: true }
  - type: UserInterface
    interfaces:
      enum.RMCConstructionUpgradeUiKey.Key:
        type: RMCConstructionUpgradeBui
  - type: DamageReceivedModifierWhenUnanchored
  - type: ExaminableDamage
    messages: RMCBarricadeMessages

# Prototypes/_WF/Barricades/metal.yml entity CMBarricadeMetal
- type: entity
  parent: CMBarricadeBase
  id: CMBarricadeMetal
  name: metal barricade
  description: A sturdy and easily assembled barricade made of metal plates, often used for quick fortifications. Use a welder to repair.
  components:
  - type: Climbable
  - type: Anchorable
  - type: MeleeSound
    soundGroups:
      Brute:
        path: /Audio/_WF/Barricades/metalhit.ogg
  - type: Sprite
    sprite: _WF/Barricades/Structures/barricade.rsi
    drawdepth: WallTops
    layers:
    - state: DamageOverlay_0
      map: [ "enum.RMCDamageOverlayVisuals.DamageOverlay" ]
      sprite: _WF/Barricades/Structures/metal_barricade_cracks.rsi
    - state: metal_wire
      map: [ "barbWired" ]
      visible: false
  - type: InteractionPopup
    interactSuccessString: fence-rattle-success
    messagePerceivedByOthers: fence-rattle-success
    interactSuccessSound:
      collection: FenceRattle
  - type: Repairable
    doAfterDelay: 10
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 450
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 2
            max: 2
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: DamageVisuals
    thresholds: [4, 8, 12]
    damageDivisor: 28.125
    trackAllDamage: true
    overlay: false
    targetLayers:
    - enum.RMCDamageOverlayVisuals.DamageOverlay
    damageGroup: Brute
  - type: Barbed
    thornsDamage:
      types:
        Slash: 10
  - type: Construction
    graph: BarricadeMetalGraph
    node: nodeMetal
  - type: RMCConstructionUpgradeTarget
    upgrades: [ RMCExplosiveUpgrade, RMCBiohazardUpgrade, RMCBruteUpgrade ]
  - type: Tag
    tags:
    - RMCMetalBarricade

