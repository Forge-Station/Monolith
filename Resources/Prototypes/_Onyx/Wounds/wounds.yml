    - SystemicBleedingWound
  organDamage:
    # WOLFGATE(Wolfmed): P5-1/P5-D13: inert - see IpcBodyPartProfile above. Do NOT add maxAffected or limb rows.
    chances:
      Head: 0.05
      # WOLFGATE(Wolfmed): D9: Chest 0.04 + Groin 0.04 -> Torso 0.04 (see IpcBodyPartProfile above).
      Torso: 0.04

- type: fractureProfile
  id: OrganicFractureProfile
  damageType: Blunt
  wound: BoneFractureWound
  severityMultiplier: 1
  resetTreatmentOnDamage: true
  worsenMinimumDamage: 5
  minimumHitDamage: 3
  accumulationMultiplier: 0.4
  reductionMinimumGrade: Simple
  removeWoundWhenMended: true
  alert: BrokenBones
  alertMinimumGrade: Simple
  alertHiddenTreatments: [Mended]
  treatmentEffectScales:
    None: 1
    Reduced: 0.25
    Mended: 0
  # WOLFGATE(Wolfmed): DECISIONS §8.2-1: Onyx's manipulationModifier values are all below 1, but the formula is
  # `multiplier *= 1 + (modifier - 1) * partScale * treatmentScale`, so below 1 means FASTER — a shattered arm
  # made every do-after 25% quicker. Restored to the C# defaults in WoundPrototype.cs (1.1/1.25/1.5/2.0) so a
  # fractured arm slows hand work. movementModifier is untouched (correctly below 1, and read that way).
  grades:
    Hairline:
      threshold: 20
      creationChance: 0.05
      movementModifier: 0.625
      manipulationModifier: 1.1
    Simple:
      threshold: 35
      creationChance: 0.25
      movementModifier: 0.5
      manipulationModifier: 1.25
    Displaced:
      threshold: 50
      creationChance: 0.65
      movementModifier: 0
      manipulationModifier: 1.5
    Comminuted:
      threshold: 60
      creationChance: 1
      movementModifier: 0
      manipulationModifier: 2.0

- type: fractureProfile
  id: CyberneticFractureProfile
  damageType: Blunt
  wound: CyberneticFrameFractureWound
  severityMultiplier: 1
  resetTreatmentOnDamage: true
  worsenMinimumDamage: 5
  minimumHitDamage: 3
  accumulationMultiplier: 0.4
  reductionMinimumGrade: Simple
  removeWoundWhenMended: true
  alert: BrokenBones
  alertMinimumGrade: Simple
  alertHiddenTreatments: [Mended]
  treatmentEffectScales:
    None: 1
    Reduced: 0.25
    Mended: 0
  # WOLFGATE(Wolfmed): DECISIONS Sec 8.2-1: same inversion fix as OrganicFractureProfile above (wounds.yml) -
  # Onyx's 0.92/0.84/0.75/0.75 would make a shattered cybernetic arm do-afters 25% FASTER. Restored to the
  # C# defaults in WoundPrototype.cs. movementModifier is untouched (correctly below 1).
  grades:
    Hairline:
      threshold: 20
      creationChance: 0.05
      movementModifier: 0.625
      manipulationModifier: 1.1
    Simple:
      threshold: 35
      creationChance: 0.25
      movementModifier: 0.5
      manipulationModifier: 1.25
    Displaced:
      threshold: 50
      creationChance: 0.65
      movementModifier: 0
      manipulationModifier: 1.5
    Comminuted:
      threshold: 60
      creationChance: 1
      movementModifier: 0
      manipulationModifier: 2.0

- type: wound
  id: BluntWound
  name: wound-name-blunt
  damageTypes:
    Blunt:
      reopenMinimumDamage: 18
      severityMultiplier: 1
  maximumSeverity: 200
  healingMultiplier: 0.15 # WOLFGATE(Wolfmed): W0: Onyx's intended value. Damage removal barely closes a wound.
  behaviors:
  - !type:WoundPainBehavior
    painPerSeverity: 0.87
    minSeverity: 10
  - !type:WoundScarBehavior
    threshold: 20
    chance: 1
  stages:
    Minor:
      name: wound-stage-minor
      severity: 0
      behaviors:
      - !type:WoundBleedingBehavior
        rate: 0.05
        chance: 0.25
        minimumSeverity: 8
    Moderate:
      name: wound-stage-moderate
      severity: 25
      behaviors:
      - !type:WoundBleedingBehavior
        rate: 0.08
        chance: 0.35
        minimumSeverity: 8
    Severe:
      name: wound-stage-severe
      severity: 50
      behaviors:
      - !type:WoundFunctionalityBehavior
        state: Impaired
      - !type:WoundBleedingBehavior
        rate: 0.12
        chance: 0.5
        minimumSeverity: 8
    Critical:
      name: wound-stage-critical
      severity: 80
      behaviors:
      - !type:WoundFunctionalityBehavior
        state: Disabled
      - !type:WoundBleedingBehavior
        rate: 0.18
        chance: 0.7
        minimumSeverity: 8

- type: wound
  id: BoneFractureWound
  name: wound-name-bone-fracture
  analyzerCategory: Blunt # WOLFGATE(Wolfmed): UI2
  damageTypes: {}
  maximumSeverity: 200
  # WOLFGATE(Wolfmed): W0 balance: stage thresholds track WFWolfmedFractureProfile's grades
  # (_WF/Wolfmed/Body/fractures.yml), 20/35/50/60 -> 12/20/32/45. A fresh Hairline fracture would otherwise
  # sit below its own lowest stage and carry no pain or functionality effect at all. Hairline's pain
  # minSeverity follows its threshold down for the same reason. CyberneticFrameFractureWound is untouched:
  # CyberneticFractureProfile keeps Onyx's grades.
  stages:
    Hairline:
      name: wound-stage-fracture-hairline
      examineDescription: wound-examine-fracture-hairline
      severity: 12
      behaviors:
      - !type:WoundFunctionalityBehavior
        state: Impaired
      - !type:WoundPainBehavior
        painPerSeverity: 0.35
        minSeverity: 12
        oneTime: true
    Simple:
      name: wound-stage-fracture-simple
      examineDescription: wound-examine-fracture-simple
      severity: 20
      behaviors:
      - !type:WoundFunctionalityBehavior
        state: Disabled
      - !type:WoundPainBehavior
        painPerSeverity: 0.5
        minSeverity: 15
        oneTime: true
    Displaced:
      name: wound-stage-fracture-displaced
      examineDescription: wound-examine-fracture-displaced
      severity: 32
      behaviors:
      - !type:WoundFunctionalityBehavior
        state: Disabled
      - !type:WoundPainBehavior
        painPerSeverity: 0.65
        minSeverity: 15
        oneTime: true
    Comminuted:
      name: wound-stage-fracture-comminuted
      examineDescription: wound-examine-fracture-comminuted
      severity: 45
      behaviors:
      - !type:WoundFunctionalityBehavior
        state: Disabled
      - !type:WoundPainBehavior
        painPerSeverity: 0.8
        minSeverity: 15
        oneTime: true

