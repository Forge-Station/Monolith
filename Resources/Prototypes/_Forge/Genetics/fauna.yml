# Player bodies for hostile-fauna genes. They keep the creature's look and natural
# weapons, but not its AI, ghost role, or station-hostile faction. A minded body
# sleeps HTN, so the subject stays in control.

- type: entity
  parent: SimpleSpaceMobBase
  id: MobGeneFaunaBase
  abstract: true
  suffix: Genetics
  categories: [ HideSpawnMenu ]
  components:
  - type: NpcFactionMember
    factions:
    - SimpleNeutral
  - type: HTN
    rootTask:
      task: IdleCompound
  - type: CombatMode
  - type: Speech
    speechVerb: LargeMob
  - type: Puller
    needsHands: false
  - type: MovementAlwaysTouching
  - type: NoSlip

- type: entity
  parent: MobGeneFaunaBase
  id: MobGeneSpaceSpider
  name: space spider
  description: It's so glowing, it looks dangerous.
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: Mobs/Animals/spacespider.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: spacespider
    - map: [ "enum.DamageStateVisualLayers.BaseUnshaded" ]
      state: glow
      shader: unshaded
  - type: DamageStateVisuals
    states:
      Alive:
        Base: spacespider
        BaseUnshaded: glow
      Dead:
        Base: spacespider_dead
  - type: MobThresholds
    thresholds:
      0: Alive
      90: Dead
  - type: Stamina
    critThreshold: 150
  - type: MovementSpeedModifier
    baseWalkSpeed: 3
    baseSprintSpeed: 4
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 120
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Effects/bite.ogg
    angle: 0
    animation: WeaponArcBite
    damage:
      types:
        Piercing: 6
        Poison: 4
  - type: SolutionContainerManager
    solutions:
      melee:
        reagents:
        - ReagentId: ChloralHydrate
          Quantity: 40
  - type: MeleeChemicalInjector
    solution: melee
    transferAmount: 2
  - type: PointLight
    radius: 1.2
    energy: 2
    color: "#4faffb"
  - type: Speech
    speechVerb: Arachnid
    speechSounds: Arachnid
    allowedEmotes: ['Click', 'Chitter']
  - type: Vocal
    sounds:
      Unsexed: UnisexArachnid
  - type: TypingIndicator
    proto: spider

- type: entity
  parent:
  - MobGeneFaunaBase
  - FlyingMobBase
  id: MobGeneSpaceDragon
  name: space dragon
  description: A flying leviathan, loosely related to space carps. This one has no rift.
  components:
  - type: Sprite
    sprite: Mobs/Aliens/Carps/dragon.rsi
    noRot: true
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: alive
    - map: [ "enum.DamageStateVisualLayers.BaseUnshaded" ]
      state: alive-unshaded
      shader: unshaded
  - type: RandomSprite
    available:
    - enum.DamageStateVisualLayers.Base:
        alive: Rainbow
  - type: DamageStateVisuals
    states:
      Alive:
        Base: alive
        BaseUnshaded: alive-unshaded
      Critical:
        Base: crit
      Dead:
        Base: dead
        BaseUnshaded: dead-unshaded
  - type: MobThresholds
    thresholds:
      0: Alive
      180: Critical
      220: Dead
  - type: Stamina
    critThreshold: 200
  - type: MovementSpeedModifier
    baseWalkSpeed: 3.2
    baseSprintSpeed: 4.8
    baseWeightlessModifier: 1.6
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.40
        density: 100
        mask:
        - FlyingMobMask
        layer:
        - FlyingMobLayer
  - type: Flammable
    damage:
      types: {}
  - type: MeleeWeapon
    altDisarm: false
    soundHit:
      path: /Audio/Weapons/Xeno/alien_claw_flesh3.ogg
    angle: 0
    animation: WeaponArcClaw
    damage:
      types:
        Slash: 12
        Piercing: 8
  - type: ActionGun
    action: ActionDragonsBreath
    gunProto: DragonsBreathGun
  - type: InteractionPopup
    successChance: 0.25
    interactSuccessString: petting-success-dragon
    interactFailureString: petting-failure-dragon
    interactFailureSound:
      path: /Audio/Animals/space_dragon_roar.ogg
    soundPerceivedByOthers: false

- type: entity
