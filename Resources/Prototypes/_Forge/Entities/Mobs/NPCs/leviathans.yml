      state: alive
    - map: [ "enum.DamageStateVisualLayers.BaseUnshaded" ]
      state: alive-unshaded
      shader: unshaded
  - type: DamageStateVisuals
    states:
      Alive:
        Base: alive
        BaseUnshaded: alive-unshaded
      Critical:
        Base: crit
      Dead:
        Base: dead
        BaseUnshaded: dead-unshaded
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 3
        density: 400
        mask:
        - FlyingMobMask
        - MapGrid
        layer:
        - FlyingMobLayer
  - type: MovementSpeedModifier
    baseWalkSpeed: 110
    baseSprintSpeed: 120
    baseWeightlessModifier: 1.0
  - type: MobThresholds
    thresholds:
      0: Alive
      92000: Critical
      100000: Dead
  - type: MeleeWeapon
    altDisarm: false
    attackRate: 0.55
    range: 4
    animation: WeaponArcBite
    soundHit:
      path: /Audio/Effects/demon_consume.ogg
    damage:
      types:
        Piercing: 32
        Blunt: 18
        Caustic: 8
        Structural: 260
  - type: PointLight
    radius: 10
    energy: 3.2
    color: "#c8a090"
    castShadows: false
  - type: RadarBlip
    visibleFromOtherGrids: true
    radarColor: "#d8c4b0"
    scale: 2
    shape: Circle
  - type: Devourer
    foodPreference: All
    shouldStoreDevoured: true
    chemical: Ichor
    healRate: 22.0
    devourTime: 2.4
    structureDevourTime: 7.0
    whitelist:
      components:
      - MobState
      - Door
      tags:
      - Wall
  - type: VoidWorm
    minLength: 100
    maxLength: 300
    segmentSpacing: 5.4
    huntSpeed: 110
    minHealth: 100000
    maxHealth: 1000000
    segmentMinHealth: 50000
    segmentMaxHealth: 200000
  - type: ActionGrant
    actions:
    - ActionForgeVoidWormWarpBreach
    - ActionForgeVoidWormCoilSmash
    - ActionForgeVoidWormBroodBurst
  - type: ActionGun
    action: ActionForgeVoidWormAcid
    gunProto: ForgeVoidWormAcidGun
  - type: InteractionPopup
    successChance: 0.04
    interactSuccessString: petting-success-forge-void-worm
    interactFailureString: petting-failure-forge-void-worm
    interactFailureSound:
      path: /Audio/Effects/demon_consume.ogg
    soundPerceivedByOthers: false
  - type: Butcherable
    spawned:
    - id: FoodMeatForgeLeviathan
      amount: 8
  - type: MobPrice
    price: 15000

