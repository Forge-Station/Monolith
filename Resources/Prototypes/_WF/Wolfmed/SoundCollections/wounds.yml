# --- Bleeding out (G2) ------------------------------------------------------------------------------

# A wound throwing blood through the skin. New files, imported with the splatter art.
- type: soundCollection
  id: WFWolfmedBleedSpurt
  files:
  # Wet sounds only. Bleeding/blood1-6 are the light-bleed drips (WFWolfmedBloodDrip).
  - /Audio/_WF/Wolfmed/Bleeding/splatter.ogg
  # Playtest 4: the owner's arterial sprays alongside the splatter.
  - /Audio/_WF/Wolfmed/Bleeding/artery3.ogg

