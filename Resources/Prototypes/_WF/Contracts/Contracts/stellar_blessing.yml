# Stellar Blessing: colony stores and building stock; safe starter work next to Central.

- type: wfContract
  id: WFContractSBColonyStores
  contractor: WFContractorStellarBlessing
  category: Supply
  tier: 1
  title: wf-contract-sb-colony-stores
  briefing: wf-contract-sb-colony-stores-brief
  reward: 6250, 8750
  minutes: 45
  weight: 2
  objective: !type:WFContractSupply
    pick: 2
    premium: 1.5
    goods:
    - entity: DrinkWaterBottleFull
      count: 10, 20
    - entity: FoodBreadPlain
      count: 4, 8
    - stack: Gauze
      count: 20, 30
    - stack: Ointment
      count: 20, 30
    - entity: EmergencyOxygenTankFilled
      count: 4, 8

