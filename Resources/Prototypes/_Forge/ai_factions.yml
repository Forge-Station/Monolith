# Imperial forces — NPC faction relations (see TSFMC / TSFMCTurret pattern)
# EmpireTurret is intentionally NOT neutral to NanoTrasen: mercenaries, TSF
# (via TSFMC), and other outsiders are valid targets. Only Empire personnel
# are friendly. Pets / medics / contraband scanners stay ignored.

- type: npcFaction
  id: Empire
  friendly:
  - EmpireTurret
  neutral:
  - SimpleNeutral
  defaultHostile: true

- type: npcFaction
  id: EmpireTurret
  friendly:
  - Empire
  neutral:
  - Cat
  - PetsNT
  - SimpleNeutral
  - MD
  - ContrabandDetection
  - Mouse
  defaultHostile: true
