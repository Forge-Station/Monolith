- type: entity
  parent: BaseWeaponCommandBallisticTurret
  id: WeaponTurretMercenary
  name: mercenary ballistic turret
  suffix: Mercenary
  description: A mercenary ship turret. It obeys this ship's turret command console.
  components:
  - type: NpcFactionMember
    factions:
    - ShipTurret
  - type: TurretCommandLink
    faction: Ship
  - type: Construction
    deconstructionTarget: null
    graph: WeaponTurretMercenaryPackingGraph
    node: WeaponTurretMercenaryPacked

- type: entity
  parent: BaseItem
  id: WeaponTurretMercenaryPacked
  name: packed mercenary turret
  description: A disassembled mercenary ballistic turret. Deploy it on the deck.
  suffix: Mercenary, Packed
  components:
  - type: MultiHandedItem
  - type: SpawnAfterInteract
    prototype: WeaponTurretMercenary
    doAfter: 5
    removeOnInteract: true
  - type: Sprite
    sprite: Objects/Weapons/Guns/Turrets/turrets.rsi
    state: syndie_lethal
  - type: Item
    size: Ginormous
    shape:
    - 0,0,3,3

- type: constructionGraph
  id: WeaponTurretMercenaryPackingGraph
  start: WeaponTurretMercenaryPacked
  graph:
  - node: WeaponTurretMercenaryPacked
    entity: WeaponTurretMercenary
    edges:
    - to: WeaponTurretMercenaryPacked
      completed:
      - !type:SpawnPrototype
        prototype: WeaponTurretMercenaryPacked
        amount: 1
      - !type:EmptyAllContainers
      - !type:DeleteEntity {}
      steps:
      - tool: Screwing
        doAfter: 14

