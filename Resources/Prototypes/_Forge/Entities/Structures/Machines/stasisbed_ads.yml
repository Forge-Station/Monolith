- type: entity
  name: ancient stasis sleep unit
  id: CryogenicSleepUnitADS
  parent: BaseMachinePowered
  description: This is used to lie in, sleep in or strap on. Resting here provides slow healing.
  components:
  - type: StasisBed
    baseMultiplier: 10.0
  - type: HealOnBuckle # Mono: Adjusted types to be more broad
    damage:
      types:
        Poison: -0.1
        Blunt: -0.1
        Cold: -0.3
        Shock: -0.05
        Heat: -0.3
        Slash: -0.1
        Piercing: -0.1
        Asphyxiation: -0.05
  - type: ApcPowerReceiver
    powerLoad: 1000
  - type: ExtensionCableReceiver
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.05"
        density: 190
        mask:
        - LowImpassable
  - type: Sprite
    sprite: _Forge/Structures/Machines/stasisbed_ads.rsi
    layers:
    - state: icon
    - state: unlit
      shader: unshaded
      map: ["enum.StasisBedVisualLayers.IsOn"]
  - type: StasisBedVisuals
    noRot: true
  - type: Strap
    position: Down
    rotation: -90
    buckleOffset: 0.05, 0
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.StrapVisuals.State:
        buckledLayer:
          True: {visible: true}
          False: {visible: false}
        unbuckledLayer:
          True: {visible: false}
          False: {visible: true}
  - type: PlaceableSurface
    placeCentered: true
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 1
            max: 2
  - type: Transform
    anchored: true
    noRot: true
  - type: PowerSwitch
  - type: Anchorable
  - type: Pullable
