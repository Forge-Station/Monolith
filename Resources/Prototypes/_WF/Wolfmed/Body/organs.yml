# Wolfmed organ data. Values are Onyx's (Resources/Prototypes/Body/base_organs.yml @ 2f5bab9).
# health/maxHealth are omitted - WolfmedOrganComponent already defaults to 15/15, which is Onyx's
# OrganComponent C# default, and no Onyx organ prototype overrides it.
#
# Same shape as _WF/Wolfmed/Body/parts.yml: separate abstract ids, not re-declarations of the upstream
# OrganHuman* ids, because RT's ComponentRegistrySerializer throws "Duplicate ID" if a second file
# redeclares an existing id. Each is added to the upstream organ's `parent:` list with a one-line
# `# WOLFGATE` edit in Resources/Prototypes/Body/Organs/human.yml.
#
# Onyx keeps destructionWound/destructionWoundSeverity on its own OrganComponent; Wolfgate stays on
# Shitmed's (D8), so they live on WolfmedOrgan here. Organ damage is irreversible (DECISIONS.md §8.6-4):
# nothing in Wolfgate raises organ health, and Onyx's only healer is its own surgery (D7).
# Human lineage only (DECISIONS.md §8.6-7, P3-D7); the other ~20 organ roots stay silent no-ops.
#
# M3 (plan §8): OrganDamage's selectionWeight and damageMultipliers now drive a deterministic split (a hit
# past its part's organReach line); hitChance and maxDamageFraction are only read by Onyx's roll, which is
# left for parts without reach lines. Every organ is impaired under WolfmedOrgan.impairedBelow (0.5).

# Brain: no destruction wound - OrganHealthSystem kills the mob instead of destroying the organ.
# WolfmedBrain is BRAIN's oxygenation clock; only an organ that carries it runs one.
- type: entity
  id: WFWolfmedOrganBrain
  abstract: true
  components:
  - type: WolfmedOrgan
  - type: WolfmedBrain
  - type: OrganDamage
    hitChance: 0.8
    selectionWeight: 0.75
    damageMultipliers:
      Blunt: 0.115
      Slash: 0.25
      Piercing: 0.42
      Heat: 0.15
      Cold: 0.05
      Shock: 0.3125

