# Midnight Arms Co. personal weapons

#region Pistols

- type: entity
  name: МН-13 "Шуруповёрт"
  id: WeaponPistolMacMn13
  parent: WeaponPistolViper
  description: Тактический пистолет, разработанный МАС. Поставляется в калибре 9×19 мм, с встроенным ЛЦУ и увеличенной ёмкостью магазина. Получил своё название из-за крайне быстрого вращения пули после выхода из ствола, что гарантирует точность.
  components:
  - type: Sprite
    sprite: Forge/Objects/Weapons/Guns/Pistols/mac_mn13_screwdriver.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
    - map: ["barrelAttachment"]
  - type: Clothing
    sprite: Forge/Objects/Weapons/Guns/Pistols/mac_mn13_screwdriver.rsi
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: Magazine9x19mmPistolFMJ
        insertSound: /Audio/Weapons/Guns/MagIn/pistol_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/pistol_magout.ogg
        priority: 2
        whitelist:
          tags:
          - Magazine9x19mmPistolFMJ
          - Magazine9x19mmPistolHighCapacityFMJ
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        startingItem: Cartridge9x19mmFMJ
        priority: 1
        whitelist:
          tags:
          - Cartridge9x19mmFMJ
      attachment_barrel:
        insertSound: /Audio/Items/screwdriver.ogg
        ejectSound: /Audio/Items/screwdriver.ogg
        priority: 0
        whitelist:
          tags:
          - MonoSuppressorMulticalRifle
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
      attachment_barrel: !type:ContainerSlot
  - type: ESAttachableGun
    slots:
    - name: es-gun-attachments-slot-name-barrel
      containerId: attachment_barrel
      whitelist:
        tags:
        - MonoSuppressorMulticalPistol
  - type: ESItemMapper
    mappings:
      barrelAttachment:
      - containerId: attachment_barrel
        state: suppressed
        whitelist:
          tags:
          - MonoSuppressor
  - type: UnpoweredFlashlight
  - type: PointLight
    enabled: false
    radius: 4
    softness: 4
    autoRot: true
  - type: LaserPointer
    targetedColor: "#FF2E2E"
    defaultColor: "#FF2E2E"

- type: entity
  name: МН-12 "Тыква"
  id: WeaponPistolMacMn12
  parent: WeaponPistolMk58
  description: Тяжёлый пистолет производства МАС в калибре .45 ACP. МН-12 — устаревшая, однако любимая наёмниками модель тяжёлых пистолетов. ЛЦУ и брутальный вид заставляют МАС держать его в продаже уже порядка трёх десятков лет!
  components:
  - type: Sprite
    sprite: Forge/Objects/Weapons/Guns/Pistols/mac_mn12_pumpkin.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
    - map: ["barrelAttachment"]
  - type: Clothing
    sprite: Forge/Objects/Weapons/Guns/Pistols/mac_mn12_pumpkin.rsi
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: Magazine45_ACPPistolFMJ
        insertSound: /Audio/Weapons/Guns/MagIn/pistol_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/pistol_magout.ogg
        priority: 2
        whitelist:
          tags:
          - Magazine45_ACPPistolFMJ
          - Magazine45_ACPPistolHighCapacityFMJ
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        startingItem: Cartridge45_ACPFMJ
        priority: 1
        whitelist:
          tags:
          - Cartridge45_ACPFMJ
      attachment_barrel:
        insertSound: /Audio/Items/screwdriver.ogg
        ejectSound: /Audio/Items/screwdriver.ogg
        priority: 0
        whitelist:
          tags:
          - MonoSuppressorMulticalRifle
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
      attachment_barrel: !type:ContainerSlot
  - type: ESAttachableGun
    slots:
    - name: es-gun-attachments-slot-name-barrel
      containerId: attachment_barrel
      whitelist:
        tags:
        - MonoSuppressorMulticalPistol
  - type: ESItemMapper
    mappings:
      barrelAttachment:
      - containerId: attachment_barrel
        state: suppressed
        whitelist:
          tags:
          - MonoSuppressor
  - type: UnpoweredFlashlight
  - type: PointLight
    enabled: false
    radius: 4
    softness: 4
    autoRot: true
  - type: LaserPointer
    targetedColor: "#FF2E2E"
    defaultColor: "#FF2E2E"

#region Revolvers

- type: entity
  name: МН-4 "Дыня"
  id: WeaponRevolverMacMn4
  parent: WeaponRevolverPython
  description: Одна из первых моделей в линейке производства МАС! Этот не сильно технологичный, однако простой в использовании, надёжный и угрожающий револьвер калибра .45 Magnum всё ещё находит отклик в сердцах капитанов наёмников, офицеров частной охраны и всех... других потребителей товаров МАС.
  components:
  - type: Sprite
    sprite: Forge/Objects/Weapons/Guns/Revolvers/mac_mn4_melon.rsi
  - type: Clothing
    sprite: Forge/Objects/Weapons/Guns/Revolvers/mac_mn4_melon.rsi

- type: entity
  name: МН-15 "Мошка"
  id: WeaponRevolverMacMn15
  parent: WeaponEnergyRevolver
  description: Энергетический револьвер производства МАС. Питается от встроенной батареи в рукоятке и способен выпускать как парализующие, так и летальные энергозаряды. Цилиндр не крутится при стрельбе.
  components:
  - type: Sprite
    sprite: Forge/Objects/Weapons/Guns/Revolvers/mac_mn15_moska.rsi
    layers:
    - state: icon
      map: ["enum.GunVisualLayers.Base"]
    - state: icon
      shader: unshaded
      map: [ "Firemode" ]
      visible: false
  - type: Clothing
    sprite: Forge/Objects/Weapons/Guns/Revolvers/mac_mn15_moska.rsi
  - type: GenericVisualizer
    visuals:
      enum.EnergyGunFireModeVisuals.State:
        Firemode:
          Disabler: { state: icon, visible: false }
          Lethal: { state: icon, visible: false }
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true

#region SMG

- type: entity
  name: МН-А-6 "Бритва"
  id: WeaponSubMachineGunMacMna6
  parent: WeaponSubMachineGunWt550
  description: Пистолет-пулемёт производства МАС в калибре 4,6×30 мм. Быстрый, компактный и приятно строчит при стрельбе. Основной целевой аудиторией для данного оружия являются разведчики и любители ближнего боя, не желающие терять приятное «тррррр» под ухом.
  components:
  - type: Sprite
    sprite: Forge/Objects/Weapons/Guns/SMGs/mac_mna6_razor.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
    - map: ["gripAttachment"]
    - map: ["barrelAttachment"]
    - map: ["opticAttachment"]
  - type: Clothing
    sprite: Forge/Objects/Weapons/Guns/SMGs/mac_mna6_razor.rsi
  - type: Item
    sprite: Forge/Objects/Weapons/Guns/SMGs/mac_mna6_razor_inhands_64x.rsi
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true

