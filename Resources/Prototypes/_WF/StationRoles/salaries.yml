# Hourly wages of station roles. The ID is the job's ID. Jobs left out earn nothing: free agents with no assigned
# work (Contractor, TsfCivilian, WFAsfColonist, Fugitive, Godfather) and borgs, which have no bank.
# Wages come out of the sector account leaders draw on, so keep a faction's roster within its income
# (SectorBank in Resources/Prototypes/_NF/SectorServices/services.yml). No account means nothing is drawn.

# Caelestinus, Frontier account: 50K an hour.
- type: wfStationSalary
  id: StationRepresentative
  wage: 8000
  account: Frontier

- type: wfStationSalary
