# M5: condition alerts for toxins, radiation, cold and heat (plan §3.8-3.10, §5.2). Health category like every
# condition alert, so each replaces the last. The icons are stock placeholders (art debt): the toxin gas warning,
# the temperature warnings, and the Wolfmed downed and critical icons.

- type: alert
  id: WFWolfmedDownedToxin
  category: Health
  clickEvent: !type:WolfmedConditionAlertEvent
  icons:
  - sprite: /Textures/Interface/Alerts/breathing.rsi
    state: too_much_tox
  name: alerts-wolfmed-downed-toxin-name
  description: alerts-wolfmed-downed-toxin-desc

- type: alert
  id: WFWolfmedOutToxin
  category: Health
  clickEvent: !type:WolfmedConditionAlertEvent
  icons:
  - sprite: /Textures/_Crescent/Interface/Alerts/human_critical.rsi
    state: critical
  name: alerts-wolfmed-out-toxin-name
  description: alerts-wolfmed-out-toxin-desc

- type: alert
