# WOLFGATE(Wolfmed): WP7 -> P5-1: Onyx's Ipc/Slime/Plant/Cybernetic profiles and their wound sets were dropped
# for phase 1 (D3) and restored verbatim in phase 5 (14 of 30 -> 30 of 30). Only two classes of marked
# fold exist below: D9 (Chest+Groin -> Torso) and DECISIONS Sec 8.2-1 (manipulationModifier inversion,
# CyberneticFractureProfile).
- type: bodyPartProfile
  id: OrganicBodyPartProfile
  treatmentCapabilities: [Biological]
  bleedingMultiplier: 1.0
  acceptedDamageTypes:
    - Blunt
    - Slash
    - Piercing
    - Heat
    - Cold
    - Shock
    - Caustic # WOLFGATE(Wolfmed): D20 reversed - OrganicPart supports the whole Burn group, which includes Caustic
  supportedWounds:
    - BluntWound
    - SlashWound
    - PiercingWound
    - BurnWound
    - ElectricalWound
    - BoneFractureWound
    - SurgicalIncisionWound
    - DismembermentWound
    - AmputationConsequenceWound
    - InternalBleedingWound
    - MedicalScarWound
    - SystemicBleedingWound
    # WOLFGATE(Wolfmed): W1: ballistic wounds, created only by wolfmedWoundRule (see _WF/Wolfmed/Wounds).
    - WFWolfmedGrazeWound
    - WFWolfmedGunshotWound
    - WFWolfmedLodgedRoundWound
    - WFWolfmedShrapnelWound
    # WOLFGATE(Wolfmed): W2: slash and bite wounds, also created only by wolfmedWoundRule.
    - WFWolfmedArterialBleedWound
    - WFWolfmedTendonCutWound
    - WFWolfmedAvulsionWound
    # WOLFGATE(Wolfmed): W3: blunt trauma wounds, also created only by wolfmedWoundRule.
    - WFWolfmedCrushInjuryWound
    - WFWolfmedConcussionWound
    - WFWolfmedDislocationWound
    - WFWolfmedOrganContusionWound
    # WOLFGATE(Wolfmed): W4: burn wounds. Charring comes from WolfmedCharringSystem, the other three from rules.
    - WFWolfmedCharringWound
    - WFWolfmedFrostbiteWound
    - WFWolfmedChemicalBurnWound
    - WFWolfmedInternalBurnWound
    # WOLFGATE(Wolfmed): W5: dead tissue, left by WolfmedNecrosisSystem rather than by a hit.
    - WFWolfmedNecrosisWound
    # WOLFGATE(Wolfmed): EVISC: the torso laid open. Created only by WolfmedEviscerationSystem, never by a rule.
    - WFWolfmedEviscerationWound
  organDamage:
    chances:
      Head: 0.05
      # WOLFGATE(Wolfmed): D9: Onyx's Chest 0.04 and Groin 0.04 fold into Torso 0.04 (not summed - independent per-part rolls, one torso).
      Torso: 0.04
      Arm: 0.02
      Hand: 0.01
      Leg: 0.02
      Foot: 0.01
    maxAffected: 2

- type: bodyPartProfile
  id: IpcBodyPartProfile
  treatmentCapabilities: [Mechanical, Electrical]
  passiveRecoveryMultiplier: 0
  bedRecoveryMultiplier: 0
  # WOLFGATE(Wolfmed): playtest 3 IPC: 1 -> 0.4. A sealed hydraulic system leaks, it does not spurt: seven spear hits bled
  # a chassis at the bloodstream's 10 u per tick cap, as fast as a human. Now it takes about twice as long.
  bleedingMultiplier: 0.4
  scarrable: false
  acceptedDamageTypes:
    - Blunt
    - Slash
    - Piercing
    - Heat
    - Cold    # WOLFGATE(Wolfmed): P5-1/P5-D20, corrected M6: live. U13'(b) shipped: the parts' WFInorganicWolfmed
    - Shock   #   container (_WF/Wolfmed/Damage/containers.yml) takes the whole Burn group, as Onyx's SiliconIpc does.
    - Caustic # WOLFGATE(Wolfmed): P5-1/P5-D20, corrected M6: as above, live.
  supportedWounds:
    - IpcMechanicalDamageWound
    - ElectricalWound
    - SurgicalIncisionWound
    - DismembermentWound
    - AmputationConsequenceWound
    - SystemicBleedingWound
    # WOLFGATE(Wolfmed): W6: mechanical wounds, created only by wolfmedWoundRule (see _WF/Wolfmed/Wounds). None of
    # them appears in OrganicBodyPartProfile, and none of that profile's Wolfmed wounds appears here.
    - WFWolfmedDentWound
    - WFWolfmedBreachWound
    - WFWolfmedShortCircuitWound
    - WFWolfmedServoDamageWound
    - WFWolfmedOverheatingWound
    # WOLFGATE(Wolfmed): EVISC: the chassis torso opened up. Created only by WolfmedEviscerationSystem.
    - WFWolfmedChassisBreachWound
  organDamage:
    # WOLFGATE(Wolfmed): P5-1/P5-D13, corrected M6: live. The core and the pump carry OrganDamage since BRAIN, and the
    # IPC torso's organReach (M3) replaces this roll there. Do NOT add maxAffected - Onyx sets it only on
    # OrganicBodyPartProfile.
    chances:
      Head: 0.05
      # WOLFGATE(Wolfmed): D9: Onyx's Chest 0.04 and Groin 0.04 fold into Torso 0.04 (not summed - independent
      # per-part rolls, and Wolfgate has one torso).
      Torso: 0.04
      Arm: 0.02
      Hand: 0.01
      Leg: 0.02
      Foot: 0.01

- type: bodyPartProfile
  id: SlimeBodyPartProfile
  treatmentCapabilities: [Biological]
  bleedingMultiplier: 1.15
  scarrable: false
  acceptedDamageTypes:
    - Blunt
    - Slash
    - Piercing
    - Heat
    - Cold
    - Shock
    - Caustic
  supportedWounds:
    - SlimeBluntWound
    - SlimeSlashWound
    - SlimePiercingWound
    - SlimeBurnWound
    - ElectricalWound
    - SurgicalIncisionWound
    - DismembermentWound
    - AmputationConsequenceWound
    - InternalBleedingWound
    - SystemicBleedingWound
  organDamage:
    # WOLFGATE(Wolfmed): P5-1/P5-D13: inert - see IpcBodyPartProfile above. Do NOT add maxAffected or limb rows -
    # Onyx lists only Head/Chest/Groin here.
    chances:
      Head: 0.05
      # WOLFGATE(Wolfmed): D9: Chest 0.04 + Groin 0.04 -> Torso 0.04 (see IpcBodyPartProfile above).
      Torso: 0.04

- type: bodyPartProfile
  id: CyberneticBodyPartProfile
  treatmentCapabilities: [Mechanical, Electrical]
  canFeelPain: false
  passiveRecoveryMultiplier: 0
  bedRecoveryMultiplier: 0
  bleedingMultiplier: 0.5
  scarrable: false
  acceptedDamageTypes:
    - Blunt
    - Slash
    - Piercing
    - Heat
    - Cold    # WOLFGATE(Wolfmed): P5-1/P5-D20: inert unless U13'(b) ships - see IpcBodyPartProfile above.
    - Shock
    - Caustic # WOLFGATE(Wolfmed): P5-1/P5-D20: as above.
  supportedWounds:
    - CyberneticMechanicalDamageWound
    - ElectricalWound
    - CyberneticFrameFractureWound
    - SurgicalIncisionWound
    - DismembermentWound
    - AmputationConsequenceWound
    # WOLFGATE(Wolfmed): W6: as on IpcBodyPartProfile above - a cybernetic limb dents, breaches, shorts, loses a
    # servo and overheats exactly as an IPC chassis does.
    - WFWolfmedDentWound
    - WFWolfmedBreachWound
    - WFWolfmedShortCircuitWound
    - WFWolfmedServoDamageWound
    - WFWolfmedOverheatingWound
  # WOLFGATE(Wolfmed): no organDamage block on Onyx's original either - nothing to fold.

