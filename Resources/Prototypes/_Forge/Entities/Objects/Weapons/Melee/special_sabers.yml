- type: entity
  parent: BaseItem
  id: MeleeSiniorOfficer
  name: Sabre of Sioner Officer
  description: Wow
  components:
  - type: Sprite
    sprite: _Forge/Objects/Weapons/Melee/sword_tsf.rsi
    layers:
    - state: icon
    - state: icon-unshaded
      visible: true
      shader: unshaded
      map: [ "blade" ]
  - type: Item
    size: Normal
    sprite: _Forge/Objects/Weapons/Melee/sword_tsf.rsi
  - type: PointLight
    radius: 2
    energy: 2
    color: white
  - type: MeleeWeapon
    heavyStaminaCost: 2.5
    attackRate: 1.5
    damage:
      types:
          Heat: 10
          Slash: 50
          Structural: 100
    soundHit:
        path: /Audio/Weapons/bladeslice.ogg
    wideAnimationRotation: -135
  - type: Reflect
    reflectProb: .1
    spread: 90
  - type: StaminaDamageOnHit
    damage: 0
  - type: Appearance
  - type: JumpAbility
    jumpDistance: 2.5
    jumpSound: /Audio/Effects/Footsteps/suitstep2.ogg
    requireItemActivation: true
  - type: ActionGrant
    actions:
    - ActionGravityJump
  - type: ItemActionGrant
    actions:
    - ActionGravityJump

- type: entity
  parent: BaseItem
  id: MeleeAstraCardinal
  name: Sabre of Astra-Cardinal
  description: Wow
  components:
  - type: Sprite
    sprite: _Forge/Objects/Weapons/Melee/sword_siv.rsi
    layers:
    - state: icon
    - state: icon-unshaded
      visible: false
      shader: unshaded
      map: [ "blade" ]
  - type: Item
    size: Normal
    sprite: Objects/Weapons/Melee/e_sword-inhands.rsi
  - type: PointLight
    radius: 2
    energy: 2
    color: white
    enabled: false
  - type: MeleeWeapon
    heavyStaminaCost: 2.5
    attackRate: 1.5
    damage:
      types:
        Heat: 10
        Slash: 50
        Structural: 100
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
    wideAnimationRotation: -135
  - type: Reflect
    reflectProb: .1
    spread: 90
  - type: StaminaDamageOnHit
    damage: 0
  - type: Appearance
  - type: MeleeStance
    currentMode: 1
    attackDelayOnSwitch: 0.5
    switchSound:
      path: /Audio/Weapons/ebladeon.ogg
    modes:
    - name: melee-stance-siv-fire
      state: icon-unshaded
      fireStacks: 1.2
      damage:
        types:
          Heat: 50
          Slash: 10
          Structural: 100
      attackRate: 0.8
      canWideSwing: true
      reflectProb: .1
      size: Normal
      layers:
        blade:
          visible: true
          color: "#FFB300"
      lightColor: "#FFB300"
      lightRadius: 3
      lightEnabled: true
      components:
      - type: DisarmMalus
        malus: 0.6
    - name: melee-stance-base-siv
      state: icon
      fireStacks: 0
      damage:
        types:
          Heat: 10
          Slash: 50
          Structural: 100
      attackRate: 1.5
      canWideSwing: true
      layers:
        blade:
          visible: false
          color: "#ffffff"
      lightEnabled: false