# Remaining Kyphrus worlds, on existing art and biome templates; gravity and temperature are gameplay tuning.
# Thrascias deliberately has a solid frozen surface despite its ice-giant sector sprite.
# No biome marker layers: ore comes from the Mono ore spawners each biome lays (see planet_surfaces.yml).

- type: wfPlanetSurface
  id: WFSurfaceFervidus
  planetType: PlanetFervidus
  ground: WFFervidusSurface
  airLayers: 3
  cloudLayer: false
  orbitRange: 2000
  buildAtRoundStart: true
  sanctioned: true
  climate: wf-planet-scan-climate-fervidus
  hazards:
  - wf-planet-scan-hazard-ash-storms
  - wf-planet-scan-hazard-lava
  - wf-planet-scan-hazard-wildlife
  gravity: 0.9
  radius: 256
  pois: WFPoisFervidus
  seed: 20260914
  networkComponents:
  - type: MapAtmosphere
    space: false
    mixture:
      volume: 2500
      immutable: true
      temperature: 373.15
      moles: [0, 75, 25]
  groundComponents:
  - type: CEZLevelRoof
  - type: CEZGroundLayer
  airComponents:
  - type: MapLight
    ambientLightColor: "#a87866"
  - type: Gravity
    enabled: true
    inherent: true
  orbitComponents:
  - type: MapLight
    ambientLightColor: "#2a3340"

- type: planet
  id: WFFervidusSurface
  biome: WFBiomeFervidus
  mapName: wf-planet-fervidus-surface
  mapLight: "#c48b71"
  atmosphere:
    volume: 2500
    immutable: true
    temperature: 373.15
    moles: [0, 75, 25]

- type: biomeTemplate
  id: WFBiomeFervidus
  layers:
  # A guaranteed floor below the borrowed template prevents incidental noise gaps.
  - !type:BiomeTileLayer
    threshold: -1
    tile: FloorBasalt
  - !type:BiomeMetaLayer
    threshold: -1
    template: WFOpenBasalt
  # Wild slime patches (_WF/WildSlimes): a few sparse zones, each with a patch or two. The Cinder Vaults' slime layer
  # shares both noises.
  - !type:BiomeMetaLayer
    template: WFFervidusSlimeZone
    threshold: 0.68
    noise: { seed: 232, noiseType: OpenSimplex2, frequency: 0.005 }

- type: wfPlanetSurface
  id: WFSurfaceMerak
  planetType: PlanetMerak
  ground: WFMerakSurface
  airLayers: 3
  cloudLayer: false
  orbitRange: 2000
  buildAtRoundStart: true
  sanctioned: true
  climate: wf-planet-scan-climate-merak
  hazards:
  - wf-planet-scan-hazard-dust-storms
  - wf-planet-scan-hazard-wildlife
  gravity: 1.15
  radius: 320
  pois: WFPoisMerak
  seed: 20260915
  networkComponents:
  - type: MapAtmosphere
    space: false
    mixture:
      volume: 2500
      immutable: true
      # 32 C: the climate's afternoon swing, dust season and sandstorms add 18, short of where animals burn (MerakHeatTest).
      temperature: 305.15
      moles: [21.824879, 82.10312]
  groundComponents:
  - type: CEZLevelRoof
  - type: CEZGroundLayer
  airComponents:
  - type: MapLight
    ambientLightColor: "#c4ab80"
  - type: Gravity
    enabled: true
    inherent: true
  orbitComponents:
  - type: MapLight
    ambientLightColor: "#2a3340"

- type: planet
  id: WFMerakSurface
  biome: WFBiomeMerak
  mapName: wf-planet-merak-surface
  mapLight: "#dfc396"
  atmosphere:
    volume: 2500
    immutable: true
    temperature: 305.15
    moles: [21.824879, 82.10312]

- type: biomeTemplate
  id: WFBiomeMerak
  layers:
  # A guaranteed floor below the borrowed template prevents incidental noise gaps.
  - !type:BiomeTileLayer
    threshold: -1
    tile: WFFloorMerakDuneSand
  - !type:BiomeMetaLayer
    threshold: -1
    template: WFMerakDesert
  # Wild slime patches (_WF/WildSlimes) round the oases, over the desert: the oasis noise below the oasis. The Sandstone
  # Galleries' grotto layer shares both noises.
  - !type:BiomeMetaLayer
    template: WFMerakSlimeZone
    threshold: 0.7
    noise: { seed: 41, noiseType: OpenSimplex2, frequency: 0.0075, fractalType: FBm, octaves: 2 }

