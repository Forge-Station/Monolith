- type: entity
  id: NuclearReactorSmallConstructable
  parent: NuclearReactorSmall
  name: small nuclear reactor
  suffix: Constructable
  components:
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5, -2.5, 2.5, 0.5"
        density: 250
        mask:
        - MachineMask
        layer:
        - MachineLayer
        - HighImpassable
  - type: Sprite
    offset: 1,-1
  - type: NuclearReactor
    prefab: ReactorPrefabEmpty
    inletPos: 0, 0
    outletPos: 2, 0
    arrowPrototype: ReactorSmallFlowArrowConstructable
  - type: Machine
    board: NuclearReactorSmallMachineCircuitboard
  - type: Construction
    deconstructionTarget: null
    graph: Machine3x3
    node: machine
    containers:
    - machine_parts
    - machine_board
  - type: ContainerContainer
    containers:
      machine_board: !type:Container
      machine_parts: !type:Container

- type: entity
  id: ReactorSmallFlowArrowConstructable
  parent: ReactorFlowArrow
  categories: [ HideSpawnMenu ]
  components:
    - type: Sprite
      layers:
        - state: arrow
          rotation: 0
          offset: 0, 1
        - state: arrow
          rotation: 180
          offset: 2, 1
