  desc: reagent-desc-n611p
  physicalDesc: reagent-physical-desc-cloudy
  flavor: smokey
  color: "#9f7ab5FF"
  metabolisms:
    Poison:
      metabolismRate: 0.4
      effects:
      - !type:PopupMessage
        type: Local
        messages:
        - n611p-effect-first
        - n611p-effect-second
        - n611p-effect-third
