- type: entity
  parent: BaseComputerAiAccess
  id: ComputerTurretCommandShip
  name: ship turret command console
  description: Sets the doctrine and friend or foe list for mercenary and adventurer turrets on this ship. Uses the same ship lock as the helm and gunnery console.
  components:
  - type: TurretCommandServer
    faction: Ship
    accent: "#c4893a"
  - type: TurretCommandConsole
  - type: ShuttleConsoleLock
  - type: Computer
    board: TurretCommandShipCircuitboard
  - type: ActivatableUI
    key: enum.TurretCommandUiKey.Key
  - type: UserInterface
    interfaces:
      enum.TurretCommandUiKey.Key:
        type: TurretCommandBoundUserInterface
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
  - type: Sprite
    sprite: Structures/Machines/computers.rsi
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: comm
    - map: ["computerLayerKeys"]
      state: generic_keys
    - map: ["enum.WiresVisualLayers.MaintenancePanel"]
      state: generic_panel_open
