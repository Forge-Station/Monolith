# Colonial Marines xenomorph abilities.
# Icons taken from RMC-14.

- type: entity
  id: ActionForgeXenoRest
  name: Rest
  description: Lie down to recover plasma and wounds faster. Use again to stand.
  components:
  - type: InstantAction
    itemIconStyle: NoItem
    icon:
      sprite: _CM/Interface/Actions/xeno_actions.rsi
      state: resting
    event: !type:ForgeXenoRestActionEvent
    useDelay: 1

- type: entity
  id: ActionForgeXenoTailStab
  name: Tail stab
  description: Impale a nearby target with your tail.
  components:
  - type: EntityTargetAction
    itemIconStyle: NoItem
    icon:
      sprite: _CM/Interface/Actions/xeno_actions.rsi
      state: tail_attack
    event: !type:ForgeXenoTailStabActionEvent
      damage:
        groups:
          Brute: 30
    useDelay: 4
    range: 2.5

- type: entity
  id: ActionForgeXenoTailStabHeavy
  parent: ActionForgeXenoTailStab
  components:
  - type: EntityTargetAction
    event: !type:ForgeXenoTailStabActionEvent
      damage:
        groups:
          Brute: 48

- type: entity
  id: ActionForgeXenoTailStabQueen
  parent: ActionForgeXenoTailStab
  components:
  - type: EntityTargetAction
    event: !type:ForgeXenoTailStabActionEvent
      damage:
        groups:
          Brute: 54

