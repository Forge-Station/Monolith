# Wolfgate: fields with no consumer in this fork removed (see the port notes).
# Base Markings

- type: marking
  id: AvaliEarsBase
  bodyPart: HeadSide
  markingCategory: HeadSide
  followSkinColor: true
  forcedColoring: true
  speciesRestriction: [ Avali, ProtoAvali ]
  sprites:
  - sprite: _Starlight/Mobs/Customization/Avali/avali_parts.rsi
    state: ears_avalibase_primary
  - sprite: _Starlight/Mobs/Customization/Avali/avali_parts.rsi
    state: ears_avalibase_secondary

- type: marking
  id: AvaliTailBase
  bodyPart: Tail
  markingCategory: Tail
  followSkinColor: true
  forcedColoring: true
  speciesRestriction: [ Avali, ProtoAvali ]
  layering: # WOLFGATE - the south frame draws behind the body, so the tail never covers anatomy
    tail_avalibase_BEHIND: TailBehind
  colorLinks: # WOLFGATE - both halves of a tail share one colour
    tail_avalibase_BEHIND: tail_avalibase_FRONT
  sprites:
  - sprite: _WF/Mobs/Customization/TailSplit/_Starlight/Mobs/Customization/Avali/avali_parts.rsi # WOLFGATE - split art
    state: tail_avalibase_FRONT
  - sprite: _WF/Mobs/Customization/TailSplit/_Starlight/Mobs/Customization/Avali/avali_parts.rsi # WOLFGATE - south frame on TailBehind
    state: tail_avalibase_BEHIND

