- type: entity
  id: CrewMonitoringRenegadeServer
  parent: BaseMachinePowered
  name: сервер мониторинга ВКР # crew renegade monitoring server
  description: Получает и отправляет статус всех датчиков имплантов состава ВКР # Receives and relays the status of all active renegade implant sensors.
  components:
    - type: Sprite
      sprite: Structures/Machines/server.rsi
      layers:
        - state: server
        - state: variant-crew
    - type: Construction
      graph: Machine
      node: machine
      containers:
        - machine_board
        - machine_parts
    - type: Machine
      board: CrewMonitoringServerMachineCircuitboard
    - type: ContainerContainer
      containers:
        machine_board: !type:Container
        machine_parts: !type:Container
    - type: CrewMonitoringServer
    - type: SingletonDeviceNetServer
    - type: DeviceNetwork
      deviceNetId: Wireless
      transmitFrequencyId: CrewRenegadeMonitor
      receiveFrequencyId: SuitRenegadeSensor
      autoConnect: false
    - type: ApcPowerReceiver
      powerLoad: 200
    - type: ExtensionCableReceiver
    - type: Destructible
      thresholds:
        - trigger:
            !type:DamageTrigger
            damage: 600
          behaviors:
            - !type:DoActsBehavior
              acts: [ "Destruction" ]
        - trigger:
            !type:DamageTrigger
            damage: 300
          behaviors:
            - !type:DoActsBehavior
              acts: ["Destruction"]
            - !type:PlaySoundBehavior
              sound:
                collection: MetalGlassBreak
            - !type:SpawnEntitiesBehavior
              spawn:
                SheetSteel1:
                  min: 1
                  max: 2
    - type: AmbientOnPowered
    - type: AmbientSound
      volume: -9
      range: 5
      sound:
        path: /Audio/Ambience/Objects/server_fans.ogg

- type: entity
  parent: BaseFlatpack
  id: CrewMonitoringRenegadeServerFlatpack
  name: упакованный сервер мониторинга ВКР
  description: A flatpack used for constructing a crew monitoring server.
  components:
  - type: Flatpack
    entity: CrewMonitoringRenegadeServer

