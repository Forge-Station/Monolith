    tile: WFCavernFloorSandstone
    threshold: -1
  - !type:BiomeTileLayer
    tile: WFCavernFloorRuinStone
    threshold: 0.32
    noise: { seed: 101, noiseType: OpenSimplex2, fractalType: FBm, octaves: 2, frequency: 0.02 }
  - !type:BiomeEntityLayer
    allowedTiles: [WFCavernFloorSandstone, WFCavernFloorRuinStone]
    entities: [CrystalOrange, CrystalPink]
    threshold: 0.992
    noise: { seed: 304, noiseType: OpenSimplex2, frequency: 1 }
  - !type:BiomeEntityLayer
    allowedTiles: [WFCavernFloorSandstone, WFCavernFloorRuinStone]
    entities: [WFCavernLampAgave]
    threshold: 0.955
    noise: { seed: 317, noiseType: OpenSimplex2, frequency: 1 }
  # Fallen blocks.
  - !type:BiomeEntityLayer
    allowedTiles: [WFCavernFloorSandstone, WFCavernFloorRuinStone]
    entities: [BaySandstone]
    threshold: 0.975
    noise: { seed: 641, noiseType: OpenSimplex2, frequency: 1 }
  - !type:BiomeEntityLayer
    allowedTiles: [WFCavernFloorSandstone, WFCavernFloorRuinStone]
    entities: [GoonTombstone, GoonTombstone2]
    threshold: 0.985
    noise: { seed: 642, noiseType: OpenSimplex2, frequency: 1 }
  - !type:BiomeEntityLayer
    allowedTiles: [WFCavernFloorSandstone, WFCavernFloorRuinStone]
    entities: [WFCaveGravebloom]
    threshold: 0.93
    noise: { seed: 643, noiseType: OpenSimplex2, frequency: 1 }
  - !type:BiomeEntityLayer
    allowedTiles: [WFCavernFloorSandstone, WFCavernFloorRuinStone]
    entities: [WFCaveDustPod]
    threshold: 0.99
    noise: { seed: 644, noiseType: OpenSimplex2, frequency: 1 }
  - !type:BiomeEntityLayer
    allowedTiles: [WFCavernFloorSandstone, WFCavernFloorRuinStone]
    entities: [WFCavernFaunaMerakRuins]
    threshold: 0.95
    noise: { seed: 37, noiseType: OpenSimplex2, frequency: 3 }
  # Buried camps, a few tiles across.
  - !type:BiomeMetaLayer
