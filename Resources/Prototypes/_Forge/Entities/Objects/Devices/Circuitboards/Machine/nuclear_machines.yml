  name: small turbine machine board
  description: A machine printed circuit board for a small turbine.
  components:
  - type: Sprite
    state: engineering
  - type: MachineBoard
    prototype: TurbineSmallConstructable
    frameSize: 3x2
    minimumStockPartRating: 1
    flatpackable: false
    requirements:
      Capacitor: 5
    stackRequirements:
      Steel: 200
      Plastic: 50
      Plasteel: 50
      Plastitanium: 20
      Copper: 50
      Gold: 20
  - type: Tag
    tags:
    - MachineBoard3x2
