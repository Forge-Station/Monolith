- type: entity
  parent: [GasPipeLayerAlt1, GasVolumePumpOn]
  id: GasVolumePumpAlt1On
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Structures/Piping/Atmospherics/pump_alt1.rsi
    layers:
    - sprite: Structures/Piping/Atmospherics/pipe_alt1.rsi
      state: pipeStraight
      map: [ "enum.PipeVisualLayers.Pipe" ]
    - state: pumpVolume
      map: [ "enum.SubfloorLayers.FirstLayer", "enabled" ]

- type: entity
  parent: BaseGreeble
  id: GreebleAntenna3
  name: antenna
  description: Like antennas to hell. Usually part of a ship or station's UHF communication systems.
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    offset: 1,0
    sprite: _Mono/Structures/Decoration/Greeble/32x96.rsi
    layers:
    - state: antenna3
    - state: antenna3_unshaded
      shader: unshaded
