# Ability / specialty genes

- type: gene
  id: GeneTelekinesis
  name: gene-telekinesis-name
  description: gene-telekinesis-desc
  quality: Good
  instability: 30
  branch: Neural
  sequenceLength: 7
  glowColor: "#A060FF"
  glowEnergy: 1.2
  conflicts:
  - GeneStabilizedDna
  components:
