# Wolfmed wound surgeries. Six wound surgeries plus seven organ heals, expressed on Shitmed's step system
# (D7, P4-3). Every listing condition sits on the surgery, never on a step: SurgerySystem.RefreshUI raises
# SurgeryValidEvent on the surgery singleton only, so a condition on a step would bite at completion instead.

- type: entity
  parent: SurgeryBase
  id: WFSurgeryStopBleeding
  name: Stop Bleeding
  categories: [ HideSpawnMenu ]
  components:
  - type: Surgery
    steps:
    - WFSurgeryStepSutureBleeding
  - type: WolfmedSurgeryWoundCondition
    state: Open
    bleeding: true

- type: entity
  parent: SurgeryBase
  id: WFSurgeryStopInternalBleeding
  name: Stop Internal Bleeding
  categories: [ HideSpawnMenu ]
  components:
  - type: Surgery
    requirement: SurgeryOpenIncision
    steps:
    - WFSurgeryStepStopInternalBleeding
    - SurgeryStepSealTendWound
  - type: WolfmedSurgeryWoundCondition
    internalBleeding: true

- type: entity
  parent: SurgeryBase
  id: WFSurgeryMendFracture
  name: Mend Fracture
  categories: [ HideSpawnMenu ]
  components:
  - type: Surgery
    requirement: SurgeryOpenIncision
    steps:
    - WFSurgeryStepSetBone
    - WFSurgeryStepMendFracture
    - SurgeryStepSealTendWound
  - type: WolfmedSurgeryFractureCondition
    minGrade: Hairline

- type: entity
  parent: SurgeryBase
  id: WFSurgeryHealAmputationConsequence
  name: Repair Amputation Damage
  categories: [ HideSpawnMenu ]
  components:
  - type: Surgery
    requirement: SurgeryOpenIncision
    steps:
    - WFSurgeryStepHealAmputationConsequence
    - SurgeryStepSealTendWound
  - type: WolfmedSurgeryWoundCondition
    woundPrototype: AmputationConsequenceWound

- type: entity
  parent: SurgeryBase
  id: WFSurgeryTendWoundsBruteDeep
  name: Tend Deep Bruise Wounds
  categories: [ HideSpawnMenu ]
  components:
  - type: Surgery
    requirement: SurgeryOpenIncision
    steps:
    - SurgeryStepRepairBruteTissue
    - SurgeryStepSealTendWound
  - type: SurgeryWoundedCondition
    woundGroup: Brute
    minWoundSeverity: 100

- type: entity
  parent: SurgeryBase
  id: WFSurgeryTendWoundsBurnDeep
  name: Tend Deep Burn Wounds
  categories: [ HideSpawnMenu ]
  components:
  - type: Surgery
    requirement: SurgeryOpenIncision
    steps:
    - SurgeryStepRepairBurnTissue
    - SurgeryStepSealTendWound
  - type: SurgeryWoundedCondition
    woundGroup: Burn
    minWoundSeverity: 100

# Organ healing ---------------------------------------------------------------
