# The fortress shield round an anchor station; it runs on the anchor, not on power, and its field is drawn as a purple
# rooted Ward.
- type: entity
  parent: ShieldGeneratorPOI
  id: WFLatticeAnchorShield
  suffix: Lattice
  components:
  - type: ShipShieldEmitter
    damageLimit: 500000
    healPerSecond: 2000
    damageExp: 1
    baseDraw: 80000
    maxDraw: 150000
    unpoweredBonus: 7
    powerModifier: 0.1
    damageOverloadTimePunishment: 30
    shieldColor: "#B040E0"
    collisionResistanceMultiplier: 0.0
  - type: Sprite
    sprite: _Mono/Structures/ShuttleComponents/fobshield.rsi
    snapCardinals: true
    layers:
    - state: fobshield
    - state: fobshield_on
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
      visible: false
      color: "#B040E0"
  - type: ApcPowerReceiver
    needsPower: false
    powerLoad: 80000
  - type: PointLight
    enabled: false
    castShadows: true
    radius: 2
    energy: 1.5
    color: "#B040E0"
  # A one-node graph in place of the machine's: nothing takes it apart, and the component stays for the tests.
  - type: Construction
    graph: WFLatticeAnchorShield
    node: shield
    deconstructionTarget: null
  - type: WFLatticeAnchorShield

#region Asf
- type: entity
  parent: ShieldGeneratorPOI
  id: WFAsfShieldGenerator
  suffix: POI ONLY
  components:
  - type: ShipShieldEmitter
    shieldColor: "#A66BE0"
  - type: Sprite
    sprite: _Mono/Structures/ShuttleComponents/fobshield.rsi
    snapCardinals: true
    layers:
    - state: fobshield
    - state: fobshield_on
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
      visible: false
      color: "#A66BE0"
  - type: PointLight
    color: "#A66BE0"
