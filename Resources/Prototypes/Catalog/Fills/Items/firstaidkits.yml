        amount: 2
      # WOLFGATE(Wolfmed): PROTO E, P4-2: the tourniquet is back now that Medkit's grid is 6x2 (ITEMS).
      # WP12-9 withdrew it when the 4x2 grid overflowed. WolfmedAvailabilityTest spawns the kit.
      - id: Tourniquet
      # WOLFGATE(Wolfmed) START: playtest 5: ahead of the standard kit, a splint, an epinephrine pen and a painkiller
