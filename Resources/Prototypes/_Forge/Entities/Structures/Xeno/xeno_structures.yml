# Colonial Marines hive structures, doors, and floor growth for mapping.

- type: entity
  parent: DoorXenoResin
  id: DoorXenoResinOpen
  suffix: Forge, Xeno, CM, Open
  components:
  - type: Door
    state: Open
  - type: Occluder
    enabled: false
  - type: Physics
    canCollide: false
  - type: Airtight
    airBlocked: false
  - type: RadiationBlocker
    enabled: false

- type: entity
  parent: DoorXenoResinThick
  id: DoorXenoResinThickOpen
  suffix: Forge, Xeno, CM, Open
  components:
  - type: Door
    state: Open
  - type: Occluder
    enabled: false
  - type: Physics
    canCollide: false
  - type: Airtight
    airBlocked: false
  - type: RadiationBlocker
    enabled: false

- type: entity
  parent: XenoHiveStructureBase
  id: XenoRecoveryTower
  name: xeno recovery tower
  description: A pulsing resin spire. Something in the hive uses it to knit wounds.
  suffix: Forge, Xeno
  components:
  - type: Sprite
    sprite: Structures/Specific/xeno_building.rsi
    noRot: true
    layers:
    - state: recoverytower

- type: entity
  parent: XenoHiveStructureBase
  id: XenoFrenzyTower
  name: xeno frenzy tower
  description: A jagged resin spire. Standing near it feels like a bad idea.
  suffix: Forge, Xeno
  components:
  - type: Sprite
    sprite: Structures/Specific/xeno_building.rsi
    noRot: true
    layers:
    - state: frenzytower

- type: entity
  abstract: true
  id: XenoHiveStructureBase
  suffix: Forge, Xeno, CM
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: RangedDamageSound
    soundGroups:
      Brute:
        collection: MeatBulletImpact
    soundTypes:
      Heat:
        collection: MeatLaserImpact
  - type: Transform
    anchored: true
  - type: Clickable
  - type: InteractionOutline
  - type: Sprite
    noRot: true
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Metallic
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        mask:
        - FullTileMask
        layer:
        - WallLayer
        density: 1000
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 400
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: gib

- type: entity
  parent: XenoHiveStructureBase
  id: XenoHiveCore
  name: hive core
  description: The heart of a xenomorph hive. It should not be here.
  suffix: Forge, Xeno, CM
  components:
  - type: Sprite
    sprite: _CM/Structures/Xenos/hive_structures.rsi
    noRot: true
    layers:
    - state: core

- type: entity
  parent: XenoHiveStructureBase
  id: XenoEggMorpher
  name: egg morpher
  description: A swollen resin organ that grows eggs for the hive.
  suffix: Forge, Xeno, CM
  components:
  - type: Sprite
    sprite: _CM/Structures/Xenos/hive_structures.rsi
    noRot: true
    layers:
    - state: eggmorph

- type: entity
  parent: XenoHiveStructureBase
  id: XenoRecoveryNode
  name: recovery node
  description: A resin node that weeps healing plasma.
  suffix: Forge, Xeno, CM
  components:
  - type: Sprite
    sprite: _CM/Structures/Xenos/hive_structures.rsi
    noRot: true
    layers:
    - state: recovery

- type: entity
  parent: XenoHiveStructureBase
  id: XenoHivePylon
  name: hive pylon
  description: A resin pylon anchoring the hive's presence.
  suffix: Forge, Xeno, CM
  components:
  - type: Sprite
    sprite: _CM/Structures/Xenos/hive_structures.rsi
    noRot: true
    layers:
    - state: pylon

- type: entity
  parent: XenoHiveStructureBase
  id: XenoHiveCluster
  name: hive cluster
  description: A dense cluster of living resin.
  suffix: Forge, Xeno, CM
  components:
  - type: Sprite
    sprite: _CM/Structures/Xenos/hive_cluster.rsi
    noRot: true
    layers:
    - state: hive_cluster_idle

- type: entity
  parent: XenoHiveStructureBase
  id: XenoPlasmaCollector
  name: plasma collector
  description: A resin organ that gathers plasma from the weeds.
  suffix: Forge, Xeno, CM
  components:
  - type: Sprite
    sprite: _CM/Structures/Xenos/hive_structures.rsi
    noRot: true
    layers:
    - state: collector

- type: entity
  parent: XenoWeeds
  id: XenoWeedsChoke
  name: thick hive weeds
  description: A choking mat of resin. You can walk it, but every step fights you. Xenomorphs race across it.
  suffix: Forge, Xeno, CM, Corridor
  components:
  - type: Sprite
    drawdepth: FloorTiles
    sprite: _CM/Structures/Xenos/xeno_weeds.rsi
    layers:
    - state: hive_weed0
    - state: weednode
  - type: Icon
    sprite: _CM/Structures/Xenos/xeno_weeds.rsi
    state: hive_weed0
  - type: IconSmooth
    key: xeno_weeds_choke
    states:
    - !type:DirectionSpriteSmoothing
      mask: [ xeno_weeds_choke ]
      base: hive_weed
  - type: Fixtures
    fixtures:
      slips:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        hard: false
        layer:
        - SlipLayer
  - type: SpeedModifierContacts
    walkSpeedModifier: 0.5
    sprintSpeedModifier: 0.5
    ignoreWhitelist:
      components:
      - ForgeXeno
  - type: ForgeXenoWeeds
    xenoWalkSpeedModifier: 1.3
    xenoSprintSpeedModifier: 1.4
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 30
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  parent: XenoWeeds
  id: XenoWeedNode
  name: hive weed node
  description: A swollen node feeding weeds across the hive. Walkable resin, not a barricade.
  suffix: Forge, Xeno, CM
  components:
  - type: Sprite
    drawdepth: FloorTiles
    sprite: _CM/Structures/Xenos/xeno_weeds.rsi
    layers:
    - state: weed0
    - state: weednode
  - type: SpeedModifierContacts
    walkSpeedModifier: 0.6
    sprintSpeedModifier: 0.6
    ignoreWhitelist:
      components:
      - ForgeXeno
  - type: ForgeXenoWeeds
    xenoWalkSpeedModifier: 1.25
    xenoSprintSpeedModifier: 1.35

- type: entity
  parent: XenoEgg
  id: XenoEggOpened
  name: opened xenomorph egg
  description: The egg has already hatched. The occupant is someone else's problem now.
  suffix: Forge, Xeno, CM, Opened
  components:
  - type: Sprite
    sprite: _CM/Structures/Xenos/xeno_egg.rsi
    state: egg_opened
    noRot: true
  # Spent eggs keep the soft fixture but no longer stun.
  - type: ForgeXenoEggTrap
    stunSeconds: 0
    openedPrototype: XenoEggOpened
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 20
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

