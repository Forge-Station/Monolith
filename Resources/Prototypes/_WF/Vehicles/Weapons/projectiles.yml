# The rounds of the vehicle guns, on Wolfgate's bullet, cartridge and rocket bases. Damage numbers are RMC's. Every cartridge
# leaves no casing (deleteOnSpawn): a casing arriving on a client trips a test-client assert, and a vehicle gun has no
# floor to drop one on. The rounds that fly to a point and go off there (cannon shell, grenade, smoke, flare, rockets) carry
# IgnorePredictionHide, so the shooter's client leaves them to the server (see ShootAtFixedPointSystem).
#
# RMC's accuracy, armour piercing, damage falloff, area damage, shrapnel and knock-out components are not ported. A round's
# range limit is a TimedDespawn where RMC's falloff cut the damage off at a distance: the tiles of the range over the speed of
# the gun that fires it (53 tiles a second for the RMC guns, 62 for CMU's, 50 for the ACE autocannon).

- type: entity
  parent: MuzzleFlashEffect
  id: MuzzleFlashEffectVehicleOver
  categories: [ HideSpawnMenu, WFVehicles ]
  components:
  - type: Sprite
    drawdepth: Effects
    offset: 0, 0

- type: entity
  parent: MuzzleFlashEffectVehicleOver
  id: MuzzleFlashEffectVehicleOverLarge
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    drawdepth: Effects
    offset: 0.2, 0
    scale: "1.6, 1.6"

