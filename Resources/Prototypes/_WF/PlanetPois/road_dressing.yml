      RMCPropVehicleMonoSupronBlueDamaged5, RMCPropVehicleMonoSupronBlueDamaged5Flipped,
      RMCPropVehicleMonoSupronBlueDestroyed, RMCPropVehicleMonoSupronBlueDestroyedFlipped,
      RMCPropVehicleMonoSupronBrownDamaged1, RMCPropVehicleMonoSupronBrownDamaged1Flipped,
