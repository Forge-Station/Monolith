  - sprite: /Textures/_WF/Xenonids/Interface/Alerts/xeno_tracker.rsi
    state: trackon-northeast
  - sprite: /Textures/_WF/Xenonids/Interface/Alerts/xeno_tracker.rsi
    state: trackon-north
  - sprite: /Textures/_WF/Xenonids/Interface/Alerts/xeno_tracker.rsi
    state: trackon-northwest
  - sprite: /Textures/_WF/Xenonids/Interface/Alerts/xeno_tracker.rsi
