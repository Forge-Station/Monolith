# The halo is the pond's own noise one band below the water, so only real ponds get one.
- type: biomeTemplate
  id: WFMerakOasis
  layers:
  # Wildlife: goats and crabs, and very rarely a mimic
  - !type:BiomeEntityLayer
    threshold: 0.9
    noise: { seed: 0, noiseType: OpenSimplex2, frequency: 3 }
    allowedTiles: [WFFloorMerakOasisDirt, WFFloorMerakOasisGrass]
    entities: [WFFaunaMerakOasis]
  - !type:BiomeEntityLayer
    threshold: 0.99
    noise: { seed: 55, noiseType: OpenSimplex2, frequency: 3 }
    allowedTiles: [WFFloorMerakOasisDirt, WFFloorMerakOasisGrass]
    entities: [WFFaunaMerakMimic]
  # Desert grass, shade palms, bushes and reeds; later layers win.
  - !type:BiomeEntityLayer
    threshold: 0.1
    noise: { seed: 43, noiseType: OpenSimplex2, frequency: 0.25 }
    allowedTiles: [WFFloorMerakOasisDirt, WFFloorMerakOasisGrass]
    entities: [CMGrassDesertLightgrass7, CMGrassTallgrassDesert, CMGrassDesertLightgrass5, AuroraFloraGrassDesert]
  - !type:BiomeEntityLayer
    threshold: 0.7
    noise: { seed: 44, noiseType: OpenSimplex2, frequency: 0.3 }
    allowedTiles: [WFFloorMerakOasisDirt, WFFloorMerakOasisGrass]
    entities: [ChompFloraDesertPlanetPalmy, ChompFloraDesertPlanetBush, CoyoteFloraChompPalmy1]
  - !type:BiomeEntityLayer
    threshold: 0.7
