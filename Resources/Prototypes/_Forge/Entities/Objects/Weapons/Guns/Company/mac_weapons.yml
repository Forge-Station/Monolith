#region Sniper

- type: entity
  name: РАВ-32 "Оракул"
  id: WeaponSniperMacRav32
  parent: [WeaponRifleAK410, BaseGunWieldable]
  description: Тяжёлая снайперская винтовка МАС в калибре 7,62×54 ммR. Одна из новейших и технологичных поставок на рынок от МАС. Винтовка оснащена ЛЦУ с режимом видимого и инфракрасного луча, а также высокоточным компьютеризированным прицелом с автоматической системой учёта погоды, направления ветра и баллистики.
  components:
  - type: Sprite
    sprite: Forge/Objects/Weapons/Guns/Snipers/mac_rav32_oracle.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: Forge/Objects/Weapons/Guns/Snipers/mac_rav32_oracle.rsi
    slots:
    - Back
    - suitStorage
  - type: Item
    sprite: Forge/Objects/Weapons/Guns/Snipers/mac_rav32_oracle_inhands_64x.rsi
    size: Huge
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: Magazine762x54mmRFMJ
        insertSound: /Audio/Weapons/Guns/MagIn/ltrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/ltrifle_magout.ogg
        priority: 2
        whitelist:
          tags:
          - Magazine762x54mmRFMJ
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        startingItem: Cartridge762x54mmRFMJ
        priority: 1
        whitelist:
          tags:
          - Cartridge762x54mmRFMJ
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: ESAttachableGun
