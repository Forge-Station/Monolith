# What waits in a world's road tunnels (the roads' `tunnels` on its POI table): spiders in the dark and the risen crews
# of ships that came down nearby (wreck_crew.yml).

- type: entityTable
  id: WFTunnelLurkersVerda
  table: !type:GroupSelector
    children:
      - id: MobGiantSpiderAngry
        weight: 2
      - id: WFWreckZombieVerda

