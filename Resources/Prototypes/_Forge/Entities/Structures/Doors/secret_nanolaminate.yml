- type: entity
  parent: BaseSecretDoor
  id: WallNanolaminateSecret
  name: nanolaminate wall
  description: A dense wall of strange laminate. It hides a seam — only a linked button will open it.
  suffix: Forge, Secret, Button
  components:
  - type: Sprite
    sprite: _Forge/Structures/Doors/secret_nanolaminate.rsi
    layers:
    - state: closed
      map: ["enum.DoorVisualLayers.Base"]
  - type: Door
    bumpOpen: false
    clickOpen: false
    canCrush: false
    closeTimeOne: 0.2
    closeTimeTwo: 0.6
    openTimeOne: 0.6
    openTimeTwo: 0.2
    openingAnimationTime: 0.6
    closingAnimationTime: 0.6
  - type: DoorSignalControl
  - type: DeviceNetwork
    deviceNetId: Wireless
    receiveFrequencyId: BasicDevice
  - type: WirelessNetworkConnection
    range: 200
  - type: DeviceLinkSink
    ports:
    - Open
    - Close
    - Toggle
  - type: DeviceLinkSource
    ports:
    - DoorStatus
    lastSignals:
      DoorStatus: false
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 5000
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: RadiationBlocker
    resistance: 5
  - type: ArmorThickness
    thickness: 10

- type: entity
  parent: WallNanolaminateSecret
  id: WallNanolaminateSecretOpen
  suffix: Forge, Secret, Button, Open
  components:
  - type: Door
    state: Open
  - type: Occluder
    enabled: false
  - type: Physics
    canCollide: false
  - type: Airtight
    airBlocked: false
  - type: RadiationBlocker
    enabled: false
