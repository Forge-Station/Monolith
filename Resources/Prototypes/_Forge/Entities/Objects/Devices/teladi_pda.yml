- type: entity
  parent: BasePDA
  id: BaseTelAdiPDA
  description: A personal computer manufactured by Tel-Adi corporation. Smells faintly of profit.
  abstract: true
  components:
  - type: CartridgeLoader
    preinstalled:
    - CrewManifestCartridge
    - NotekeeperCartridge
    - NewsReaderCartridge
    - BountyContractsCartridge
    - AstroNavCartridge
  - type: Sprite
    sprite: Forge/Objects/Devices/pda.rsi
    layers:
    - map: [ "enum.PdaVisualLayers.Base" ]
      state: "pda-tel_ida"
    - sprite: _Mono/Objects/Devices/pda.rsi
      state: "light_overlay"
      map: [ "enum.PdaVisualLayers.Flashlight" ]
      shader: "unshaded"
      visible: false
    - sprite: _Mono/Objects/Devices/pda.rsi
      state: "id_overlay"
      map: [ "enum.PdaVisualLayers.IdLight" ]
      shader: "unshaded"
      visible: false
  - type: Icon
    sprite: Forge/Objects/Devices/pda.rsi
    state: pda-tel_ida

- type: entity
  parent: BaseTelAdiPDA
  id: TelAdiPDA
  name: Tel-Adi PDA
  suffix: ТелАди
  components:
  - type: Pda
    id: TelAdiIDCard
  - type: Appearance
    appearanceDataInit:
      enum.PdaVisuals.PdaType:
        !type:String
        pda-tel_ida
  - type: Geiger
    showExamine: true
    showControl: true
    isEnabled: true
    attachedToSuit: true
  - type: PdaBorderColor
    borderColor: "#cc0000"
