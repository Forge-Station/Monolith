# Carcinoma's red haze and fog came from WolfWeather's first schedule.
- type: wfPlanetWeather
  id: WFPlanetWeatherCarcinoma
  planetType: WFPlanetCarcinoma
  storms:
  - main: WFBloodRain
  - main: WFBloodHaze
  - telegraph: WFBloodHaze
    main: WFBloodFog
    end: WFBloodHaze
  - telegraph: WFBloodRain
    main: WFBloodStorm
    end: WFBloodRain
  wolfWeathers:
    WFBloodRain: WFBloodRainModerate
    WFBloodStorm: WFBloodStorm
    WFBloodHaze: WFBloodHaze
    WFBloodFog: WFBloodFog
  initialHour: 21
  # Body-warm and nearly steady; no seasons.
  dayTemperatureSwing: 1
  weatherTemperature:
    WFBloodRain: -1
    WFBloodStorm: -2
    WFBloodFog: -1

# Overlays and rain loops from /tg/station (weather_effects.dmi, sound/ambience/weather/rain).
- type: weather
  id: WFRainLow
  sprite:
    sprite: /Textures/_WF/Planets/Effects/weather_tg.rsi
    state: rain_low
  sound:
    path: /Audio/_WF/Planets/Weather/rain_start.ogg
