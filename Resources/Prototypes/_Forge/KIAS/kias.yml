- type: entity
  id: KiasDataCable
  name: KIAS data cable
  description: An underfloor automation bus with a two tile service radius.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
    noRot: true
  - type: Visibility
    layer: 1
  - type: Sprite
    sprite: _Forge/KIAS/Pack/cable.rsi
    color: "#65DEFF"
    layers:
    - state: data_0
      map: ["0"]
    drawdepth: ThinWire
  - type: Icon
    sprite: _Forge/KIAS/Pack/cable.rsi
    state: data_0
  - type: Appearance
  - type: CableVisualizer
    statePrefix: data_
  - type: SubFloorHide
  - type: Clickable
  - type: InteractionOutline
  - type: Cable
    cableType: Data
    cableDroppedOnCutPrototype: KiasDataCableStack1
  - type: KiasDataCable
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: [Destruction]

- type: stack
  id: KiasDataCable
  name: KIAS data cable
  icon: { sprite: /Textures/_Forge/KIAS/Pack/coil.rsi, state: coilmv-30 }
  spawn: KiasDataCableStack1
  maxCount: 100

- type: entity
  id: KiasDataCableStack
  parent: CableStack
  name: KIAS data cable coil
  components:
  - type: Stack
    stackType: KiasDataCable
    baseLayer: base
    layerStates: [coilmv-10, coilmv-20, coilmv-30]
  - type: Sprite
    sprite: _Forge/KIAS/Pack/coil.rsi
    color: White
    layers:
    - state: coilmv-30
      map: [base, "0"]
  - type: Item
    sprite: _Forge/KIAS/Pack/coil.rsi
    heldPrefix: coilmv
  - type: CablePlacer
    cablePrototypeID: KiasDataCable
    blockingWireType: Data
  - type: Appearance

- type: entity
  id: KiasDataCableStack1
  parent: KiasDataCableStack
  suffix: 1
  components:
  - type: Stack
    count: 1

- type: entity
  id: BaseKiasServer
  parent: BaseMachinePowered
  abstract: true
  components:
  - type: Construction
    graph: Machine
    node: machine
    containers: [machine_board, machine_parts]
  - type: ContainerContainer
    containers:
      machine_board: !type:Container
      machine_parts: !type:Container
  - type: Sprite
    sprite: Structures/Machines/server.rsi
    layers:
    - state: server
    - state: variant-crew
      color: Cyan
  - type: ApcPowerReceiver
    powerLoad: 100
  - type: ExtensionCableReceiver
  - type: KiasDevice
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.KiasVisuals.Status:
        0:
          enum.KiasDeviceStatus.Online: { color: White }
          enum.KiasDeviceStatus.Offline: { color: Gray }
          enum.KiasDeviceStatus.NoPower: { color: Gray }
          enum.KiasDeviceStatus.NoDataPath: { color: Orange }
          enum.KiasDeviceStatus.Disconnected: { color: Gray }
          enum.KiasDeviceStatus.DuplicateCore: { color: Red }

- type: entity
  id: BaseKiasWallDevice
  parent: BaseKiasServer
  abstract: true
  placement:
    mode: SnapgridCenter
    snap: [Wallmount]
  components:
  - type: Transform
    noRot: false
  - type: Rotatable
    rotateWhileAnchored: false
  - type: WallMount
    arc: 175
  - type: Sprite
    noRot: false
    drawdepth: WallMountedItems
    sprite: Structures/Wallmounts/air_monitors.rsi
    layers:
    - state: alarm0
  - type: Fixtures
    fixtures: {}

- type: entity
  id: KiasCore
  parent: BaseKiasServer
  name: KIAS core
  components:
  - type: Sprite
    sprite: _Forge/KIAS/KiasCore.rsi
    drawdepth: Mobs
    offset: 0, 0.5
    layers:
    - state: core
      map: ["0"]
  - type: GenericVisualizer
    visuals:
      enum.KiasVisuals.Status:
        0:
          enum.KiasDeviceStatus.Online: { color: White }
          enum.KiasDeviceStatus.Offline: { color: Gray }
          enum.KiasDeviceStatus.NoPower: { color: Gray }
          enum.KiasDeviceStatus.NoDataPath: { color: Orange }
          enum.KiasDeviceStatus.Disconnected: { color: Gray }
          enum.KiasDeviceStatus.DuplicateCore: { color: Red }
  - type: Machine
    board: KiasCoreBoard
  - type: KiasCore
  - type: KiasAudio
  - type: KiasClaimable
  - type: AccessReader
  - type: WiresPanel
  - type: Wires
    layoutId: KiasAccess
  - type: UserInterface
    interfaces:
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
  - type: KiasProtocol
    protocols:
    - presetId: battle-impact
      trigger: HullImpact
      actions:
      - kind: Announce
      - kind: Lights
        group: EMERGENCY
        value: true
      - kind: Pdc
        value: true
    - presetId: battle-flash
      trigger: WeaponFlash
      disposition: Hostile
      actions:
      - kind: Announce
      - kind: Lights
        group: EMERGENCY
        value: true
      - kind: Pdc
        value: true
    - presetId: battle-manual
      trigger: Manual
      actions:
      - kind: Announce
      - kind: Lights
        group: EMERGENCY
        value: true
      - kind: Pdc
        value: true
    - presetId: flash-unknown
      trigger: WeaponFlash
      disposition: Unknown
      actions: [{ kind: Announce }]
    - presetId: hull-damage
      trigger: HullDamage
      actions: [{ kind: Announce }]
    - presetId: collision
      trigger: Collision
      actions: [{ kind: Announce }]
    - presetId: atmosphere
      trigger: AtmosDanger
      actions: [{ kind: Announce }]
    - presetId: anomaly
      trigger: AnomalyGrowth
      actions: [{ kind: Announce }]
    - presetId: contact
      trigger: Contact
      actions: [{ kind: Announce }]
    - presetId: arrival
      trigger: Arrival
      actions: [{ kind: Announce }]
    - presetId: proximity
      trigger: Proximity
      actions: [{ kind: Announce }]
    - presetId: crew-critical
      trigger: CrewCritical
      actions: [{ kind: Announce }]
    - presetId: crew-dead
      trigger: CrewDead
      actions: [{ kind: Announce }]
    - presetId: vessel-critical
      trigger: VesselCritical
      actions: [{ kind: Announce }, { kind: Mayday }]
    - presetId: power-deficit
      trigger: PowerDeficit
      actions: [{ kind: Announce }]
    - presetId: fire
      trigger: Fire
      actions: [{ kind: Announce }]
    - presetId: radiation
      enabled: true
      trigger: Radiation
      actions:
      - kind: Announce
    - presetId: local-threat
      enabled: true
      trigger: LocalThreat
      actions:
      - kind: Announce
    - presetId: boarding
      enabled: true
      trigger: Boarding
      actions:
      - kind: Announce
    - presetId: greeting
      enabled: true
      trigger: CaptainGreeting
      actions:
      - kind: Announce
    - presetId: fire-clear
      enabled: true
      trigger: FireClear
      actions:
      - kind: Announce
    - presetId: atmos-clear
      enabled: true
      trigger: AtmosClear
      actions:
      - kind: Announce
    - presetId: medical-assistance
      enabled: true
      trigger: CrewUnavailable
      requireCrewUnavailable: true
      cooldown: 180
      actions:
      - kind: MedicalHelp
      - kind: Record
    - presetId: quiet
      enabled: false
      trigger: QuietMode
      actions:
      - kind: Lights
        group: QUIET
        value: false
    - presetId: power-lost
      trigger: PowerLost
      actions: [{ kind: Announce }]
    - presetId: boot
      trigger: Boot
      actions: [{ kind: Announce }]
    - presetId: shutdown
      trigger: Shutdown
      actions: [{ kind: Announce }]
  - type: KiasDevice
    role: Core

