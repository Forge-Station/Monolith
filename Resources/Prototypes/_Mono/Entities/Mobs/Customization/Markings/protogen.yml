- type: marking
  id: ProtogenTail
  bodyPart: Tail
  markingCategory: Tail
  speciesRestriction: [Protogen, ProtoAvali, ProtoDawi, ProtoFeline, ProtoHumie, ProtoKin, ProtoMoth, ProtoResomi, ProtoThaven, ProtoVox, ProtoVulp]
  # WOLFGATE - the south frame draws behind the body so it no longer covers the groin. The other three
  # facings move from Tail to the protogen TailOversuit slot, which sits above the anatomy anchors and,
  # since the layer order fix, above the neck slots, so the tail still draws over anatomy and cloaks.
  layering:
    tail_protogen_FRONT: TailOversuit
    tail_protogen_BEHIND: TailBehind
  colorLinks: # WOLFGATE
    tail_protogen_BEHIND: tail_protogen_FRONT
  sprites:
  - sprite: _WF/Mobs/Customization/protogen_tails.rsi # WOLFGATE - split art
    state: tail_protogen_FRONT # index 0 keeps the saved single colour
  - sprite: _WF/Mobs/Customization/protogen_tails.rsi
    state: tail_protogen_BEHIND

