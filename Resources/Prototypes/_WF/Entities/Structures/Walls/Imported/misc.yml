- type: entity
  abstract: true
  id: BaseWallBitmask
  components:
  - type: IconSmooth
    key: walls
    mode: Bitmask

- type: entity
  parent: BaseWall
  id: FrontierWallMeat
  components:
  - type: Tag
    tags:
      - Wall
      - Structure
  - type: Sprite
    sprite: _WF/DecorImport/Structures/Walls/meat_frontier.rsi
  - type: Icon
    sprite: _WF/DecorImport/Structures/Walls/meat_frontier.rsi
  - type: Construction
    graph: Girder
    node: meatWall
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100 # weak
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          Girder:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: IconSmooth
    key: walls
    base: meat

