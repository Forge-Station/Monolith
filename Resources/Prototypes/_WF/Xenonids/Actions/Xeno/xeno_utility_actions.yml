- type: entity
  id: ActionXenoTransferPlasma
  parent: ActionXenoBase
  name: Transfer plasma (50) # TODO RMC14 proper plasma costs
  description: Give plasma to a nearby xenonid.
  components:
  - type: EntityTargetAction
    itemIconStyle: NoItem
    icon:
      sprite: _WF/Xenonids/Actions/xeno_actions.rsi
      state: transfer_plasma
    range: 2
    event: !type:XenoTransferPlasmaActionEvent

- type: entity
  parent: ActionXenoBase
  id: ActionXenoHiveLeaderSquad
  name: View Hive Team
  description: Opens your hive squad panel, showing your team members and allowing you to send announcements to them.
  components:
  - type: InstantAction
    itemIconStyle: NoItem
    icon:
      sprite: _WF/Xenonids/Actions/xeno_actions.rsi
      state: xeno_lead
    useDelay: 1
    event: !type:HiveLeaderSquadActionEvent
