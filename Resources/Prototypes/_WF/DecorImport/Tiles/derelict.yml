# Derelict plating used by the Lattice anchor station. Standalone: DecorImportPlatingTileBase is not in this fork.
# itemDrop is a steel tile stack so prying the floor does not spawn a missing item.

- type: tile
  id: CitadelRPFloorDerelict1
  name: tiles-wf-citadel-rp-floor-derelict-1
  sprite: /Textures/_WF/DecorImport/Tiles/citadelrp_derelict/derelict_floor_1.png
  baseTurf: Plating
  isSubfloor: false
  deconstructTools: [ Prying ]
  footstepSounds:
    collection: FootstepPlating
  itemDrop: FloorTileItemSteel
  heatCapacity: 10000
  allowRotationMirror: true

