- type: entity
  name: wizard staff
  parent:
  - Shovel
  id: WizardStaffMeleeBase
  description: Symbol of wizard's mastery of arcane arts.
  components:
  - type: Item
    sprite: Objects/Weapons/Guns/Basic/staves.rsi
    heldPrefix: staff
  - type: Sprite
    sprite: Objects/Weapons/Guns/Basic/staves.rsi
    state: nothing
  - type: MeleeWeapon
    attackRate: 1.1
    wideAnimationRotation: -135
    damage:
      types:
        Blunt: 12
    angle: 0
    animation: WeaponArcThrust
  - type: Tag
    tags:
    - WizardStaff

- type: entity
  name: inert red wizard staff
  parent: WizardStaffMeleeBase
  id: WizardStaffMeleeRed
  components:
  - type: Item
    heldPrefix: animation
  - type: Sprite
    state: animation

- type: entity
  name: inert violet wizard staff
  parent: WizardStaffMeleeBase
  id: WizardStaffMeleeViolet
  components:
  - type: Item
    heldPrefix: chaos
  - type: Sprite
    state: chaos

- type: entity
  name: inert soap wizard staff
  parent: WizardStaffMeleeBase
  id: WizardStaffMeleeSoap
  components:
  - type: Item
    heldPrefix: healing
  - type: Sprite
    state: healing

# Blood Cult
- type: entity
  id: WizardStaffMeleeBlood
  name: inert cultist staff
  parent:
  - WizardStaffMeleeRed
  components:
  # WOLFGATE(Wolfmed) START: this staff cuts, so it speaks the throat lines its shovel parent replaced
  - type: Execution
    internalMeleeExecutionMessage: execution-popup-melee-initial-internal
    externalMeleeExecutionMessage: execution-popup-melee-initial-external
    completeInternalMeleeExecutionMessage: execution-popup-melee-complete-internal
    completeExternalMeleeExecutionMessage: execution-popup-melee-complete-external
    internalSelfExecutionMessage: execution-popup-self-initial-internal
    externalSelfExecutionMessage: execution-popup-self-initial-external
    completeInternalSelfExecutionMessage: execution-popup-self-complete-internal
    completeExternalSelfExecutionMessage: execution-popup-self-complete-external
  # WOLFGATE END
  - type: Sharp
  - type: MeleeWeapon
    wideAnimationRotation: -135
    damage:
      types:
        Slash: 13
    angle: 0
    animation: WeaponArcThrust
    soundHit:
      path: /Audio/Effects/bite.ogg

- type: entity
  id: WizardStaffDarkBolt
  name: cultist staff
  parent:
  - WizardStaffMeleeBlood
  suffix: "Dark bolt"
  components:
  - type: BasicEntityAmmoProvider
    proto: BulletBloodCultDarkBolt
    capacity: 10
    count: 10
