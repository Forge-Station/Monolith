# SYS-549 "Cloak"
- type: entity
  parent: [ClothingHeadHardsuitBaseMilitary, BaseToggleClothing, PowerCellSlotSmallItem, ClothingNightVision4Renegade, ShowMedicalIcons]
  id: ClothingHeadHelmetHardsuitRenegateStealth 
  name: hardsuit SYS-549 "Cloak"
  description: The interchangeable helmet system for the majority of SYS-549 hardsuits. Has a stealth generator.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Mono/Clothing/Head/Hardsuits/syndicate.rsi
  - type: Clothing
    sprite: _Mono/Clothing/Head/Hardsuits/syndicate.rsi
    equippedState: off-equipped-HELMET
  - type: PressureProtection
    highPressureMultiplier: 0.08
    lowPressureMultiplier: 1000
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.95
        Slash: 0.95
        Piercing: 0.95
        Heat: 0.95
  - type: HideLayerClothing
    slots:
    - Hair
    - Snout
    - HeadTop
    - HeadSide
  - type: ThermalVision
    flashDurationMultiplier: 2
    pulseTime: 3
    isEquipment: true
    toggleAction: PulseThermalVision
  - type: ToggleClothing
    action: ActionTogglePhaseCloak
    disableOnUnequip: true
  - type: ComponentToggler
    parent: true
    components:
    - type: Stealth
      minVisibility: 0.01
      maxVisibility: 1
      damageVisibilityModifier: 1
      attackVisibilityModifier: 1
    - type: StealthOnMove
      passiveVisibilityRate: -0.2
      movementVisibilityRate: 0
  - type: UseDelay
    delay: 2
  - type: PowerCellDraw
    drawRate: 2
  - type: ToggleCellDraw
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default

