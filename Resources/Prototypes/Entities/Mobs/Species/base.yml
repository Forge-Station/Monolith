  - type: AnimationPlayer
  - type: Buckle
  - type: CombatMode
    canDisarm: true
  - type: MeleeWeapon
    soundHit:
      collection: Punch
    angle: 30
    animation: WeaponArcFist
    attackRate: 1
    damage:
      types:
        Blunt: 5
  - type: SleepEmitSound
  - type: SSDIndicator
  - type: StandingState
  - type: Dna
  - type: MindContainer
  - type: MindExaminable
  - type: CanEnterCryostorage
  - type: InteractionPopup
    successChance: 1
    interactSuccessString: hugging-success-generic
    interactSuccessSound: /Audio/Effects/thudswoosh.ogg
    messagePerceivedByOthers: hugging-success-generic-others
  - type: CanHostGuardian
  - type: NpcFactionMember
    factions:
    - NanoTrasen
  - type: CreamPied
  - type: Stripping
  - type: UserInterface
    interfaces:
      enum.HumanoidMarkingModifierKey.Key:
        type: HumanoidMarkingModifierBoundUserInterface
      enum.StrippingUiKey.Key:
        type: StrippableBoundUserInterface
      # Shitmed
      enum.SurgeryUIKey.Key:
        type: SurgeryBui
  - type: Puller
  - type: Speech
    speechSounds: Alto
  - type: DamageForceSay
  - type: Vocal
    sounds:
      Male: MaleHuman
      Female: FemaleHuman
      Unsexed: MaleHuman
  - type: LanguageKnowledge # Einstein Engines - Languages (all mobs should speak TauCeti unless otherwise specified, to prevent universal.)
    speaks:
    - TauCetiBasic
    understands:
    - TauCetiBasic
  - type: Emoting
  - type: BodyEmotes
    soundsId: GeneralBodyEmotes
  - type: Grammar
    attributes:
      proper: true
  - type: MobPrice
    price: 1500 # Kidnapping a living person and selling them for cred is a good move.
    deathPenalty: 0.01 # However they really ought to be living and intact, otherwise they're worth 100x less.
  - type: CanEscapeInventory # Carrying system from nyanotrasen.
  - type: Tag
    tags:
    - CanPilot
    - FootstepSound
    - DoorBumpOpener
    - AnomalyHost
    - Humanoid # Mono
  - type: Targeting # Shitmed Change
  - type: SurgeryTarget # Shitmed Change
  - type: ExaminableCharacter # WWDP
  # Mono
  - type: ShipNpcTarget
    needGrid: NoGrid

- type: entity
  save: false
  parent:
  - MobBloodstream
  - MobRespirator
  - MobAtmosStandard
  - MobFlammable
  - BaseMobSpecies
  id: BaseMobSpeciesOrganic
  abstract: true
  components:
  # WOLFGATE(Wolfmed) START: D20-D22, P2-D7, P2-D9: organic species get wound hosting, pain and a Blunt gib threshold.
  # Wolfmed phase 1 (D21/D32). Non-organic descendants (protogen) have WoundHost stripped by
  # Content.Shared/_WF/Wolfmed/Body/WolfmedWoundHostExclusionSystem.cs; see the manifest for the full list.
  - type: WoundHost # D20: localizedDamageTypes left at Onyx's default, Caustic included
  # Wolfmed phase 2 (P2-D7). ONYX Resources/Prototypes/Body/species_base.yml:54 (<Onyx-PainShock>);
  # placed here rather than on BaseMobSpecies so only organic profiles carry it. Inert on D32-excluded
  # protogen: PainComponent is only ever ensured on wound hosts.
  - type: PainShockTarget
  # Wolfmed phase 2 (P2-D9). ONYX Resources/Prototypes/Body/species_base.yml:124-133
  # (<Onyx-PainSounds>). Key corrected from Onyx's `emotes:` to `emotesThreshold:` - Onyx's own YAML never
  # bound (the field is EmotesThreshold; RT drops unknown mapping keys). `emotes:` is left empty so
  # EmoteOnDamageSystem.OnDamage still returns at its Emotes.Count == 0 check - no double emote.
  # Gated to wound hosts in C# by P2-D22, not by this block.
  - type: EmoteOnDamage
    emotesThreshold:
      50: [ Scream ]
      80: [ Scream, Crying ]
    emoteChance: 0.6
    withChat: true
    hiddenFromChatWindow: true
    emoteCooldown: 8
  - type: Destructible # D22: part damage now projects onto the mob, so 400 is reachable from routine limb damage
    thresholds:
    - trigger:
        !type:DamageTypeTrigger
        damageType: Blunt
        damage: 1500
      behaviors:
      - !type:GibBehavior { }
  # WOLFGATE END
  - type: Satiation
    satiations:
      Hunger:
        prototype: NormalSatiationHunger
      Thirst:
        prototype: NormalSatiationThirst
  - type: SatiationSpeedModifier
    satiations:
      Hunger:
        Starving: 0.75
      Thirst:
        Parched: 0.75
  - type: Barotrauma
    damage:
      types:
        Blunt: 0.50 #per second, scales with pressure and other constants.
        Heat: 0.1
  - type: PassiveDamage # Slight passive regen. Assuming one damage type, comes out to about 4 damage a minute.
    allowedStates:
    - Alive
    damageCap: 20
    # WOLFGATE(Wolfmed) START: D29: passive regen is neutralised on wound hosts.
    # Onyx's per-part-profile recovery is the only passive heal on wound hosts.
    # damage:
    #   types:
    #     Heat: -0.07
    #   groups:
    #     Brute: -0.07
    damage: {}
    # WOLFGATE END
  - type: Fingerprint
  - type: Blindable
  # Other
  - type: Temperature
    heatDamageThreshold: 325
    coldDamageThreshold: 260
    currentTemperature: 310.15
    specificHeat: 42
    coldDamage:
      types:
        Cold: 0.1 #per second, scales with temperature & other constants
    heatDamage:
      types:
        Heat: 1.5 #per second, scales with temperature & other constants
  - type: TemperatureSpeed
    thresholds:
      293: 0.8
      280: 0.6
      260: 0.4
  - type: ThermalRegulator
    metabolismHeat: 800
    radiatedHeat: 100
    implicitHeatRegulation: 500
    sweatHeatRegulation: 2000
    shiveringHeatRegulation: 2000
    normalBodyTemperature: 310.15
    thermalRegulationTemperatureThreshold: 2
  - type: Perishable
  - type: Butcherable
    butcheringType: Spike # TODO human.
    spawned:
    - id: FoodMeat
      amount: 5
  - type: Respirator
    damage:
      types:
        Asphyxiation: 1.0
    damageRecovery:
      types:
        Asphyxiation: -1.0
  - type: FireVisuals
    alternateState: Standing
  - type: Carriable # Goobstation
  - type: LayingDown # WD EDIT
  - type: CPRTraining # Goobstation
  - type: PseudoItem # Mono - Everyone bluespace baggable
    storedOffset: -10,0
    shape:
      - 0, 0, 4, 4
      - 0, 3, 6, 5
  - type: CanMoveInAir # Monolith: Allow air movement for Z levels (:3)
  - type: EmitSoundOnInternalsActive # Crescent
    sound:
      collection: InternalsBreathing
      params:
        maxDistance: 3
        rolloffFactor: 2
        volume: -10

