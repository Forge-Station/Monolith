#Corporate War Lecter

- type: entity
  name: wayward NTSF-LTR-556 (5.56x45mm) # Forge-change 6.8x52mm Caseless->5.56x45mm
  parent: [BaseWeaponRifle, BaseFactionGearOtherFactionT3]
  id: WeaponRifleNtsfLtr
  description: An anomalous rifle. A Light Tactical Rifle ready for use by special forces operatives, chambered in 5.56x45mm. Also accepts 6.8x52mm due to it being a prototype. But... how do you know all this?
  components:
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Guns/Rifles/ntsf_ltr_556.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: _Mono/Objects/Weapons/Guns/Rifles/ntsf_ltr_556.rsi
  - type: ChamberMagazineAmmoProvider
    soundRack:
      path: /Audio/Weapons/Guns/Cock/sf_rifle_cock.ogg
  - type: Item # Forge-change
    size: Large # Forge-change Huge->Large
    shape: # Forge-change
    - 0,0,3,3 # Forge-change
  - type: GunWieldBonus
    minAngle: -33 # Forge-change -32->-33
    maxAngle: -35 # Forge-change -52->-35
  - type: Gun
    minAngle: 35 # Forge-change 45->35
    maxAngle: 45 # Forge-change 62->45
    angleIncrease: 1.25 # Forge-change 6->1.25
    angleDecay: 10 # Forge-change 40->10
    cameraRecoilScalar: 0
    fireRate: 7 # Forge-change 9->7
    projectileSpeed: 50 # Forge-change
    availableModes:
    - FullAuto
    soundGunshot:
      path: /Audio/_Mono/Weapons/Guns/SmallArms/Gunshots/light_rifle_3.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: Magazine556x45mmFMJ
        insertSound: /Audio/_Mono/Weapons/Guns/SmallArms/MagIn/m16_magin.ogg
        ejectSound: /Audio/_Mono/Weapons/Guns/SmallArms/MagOut/skm_magout.ogg
        priority: 2
        whitelist:
          tags:
          # - Magazine68x52mmCaseless # Forge-change
          - Magazine556x45mmFMJ
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        startingItem: Cartridge556x45mmFMJ
        priority: 1
        whitelist:
          tags:
          # - Cartridge68x52mmCaseless # Forge-change
          - Cartridge556x45mmFMJ
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
  - type: StaticPrice
    price: 750
  - type: PirateBountyItem
    id: StandardFactionLongarm
