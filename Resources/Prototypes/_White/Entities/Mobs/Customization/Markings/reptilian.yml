# TAIL
- type: marking
  id: SnakeLargeTail
  bodyPart: Tail
  markingCategory: Tail
  speciesRestriction: [Reptilian]
  layering: # WOLFGATE - the south frame draws behind the body, so the tail never covers anatomy
    snake_large_BEHIND: TailBehind
    snake_large_overlay_BEHIND: TailBehind
  colorLinks: # WOLFGATE - both halves of a tail share one colour
    snake_large_BEHIND: snake_large_FRONT
    snake_large_overlay_BEHIND: snake_large_overlay_FRONT
  sprites:
    - sprite: _WF/Mobs/Customization/TailSplit/_White/Mobs/Customization/reptilian_64x32.rsi # WOLFGATE - split art
      state: snake_large_FRONT
    - sprite: _WF/Mobs/Customization/TailSplit/_White/Mobs/Customization/reptilian_64x32.rsi # WOLFGATE - split art
      state: snake_large_overlay_FRONT
    - sprite: _WF/Mobs/Customization/TailSplit/_White/Mobs/Customization/reptilian_64x32.rsi # WOLFGATE - south frame on TailBehind
      state: snake_large_BEHIND
    - sprite: _WF/Mobs/Customization/TailSplit/_White/Mobs/Customization/reptilian_64x32.rsi # WOLFGATE - south frame on TailBehind
      state: snake_large_overlay_BEHIND

- type: marking
  id: SnakeLargeTailAnimated
  bodyPart: Tail
  markingCategory: Tail
  speciesRestriction: []
  layering: # WOLFGATE - the south frame draws behind the body, so the tail never covers anatomy
    snake_large_wagging_BEHIND: TailBehind
    snake_large_wagging_overlay_BEHIND: TailBehind
  colorLinks: # WOLFGATE - both halves of a tail share one colour
    snake_large_wagging_BEHIND: snake_large_wagging_FRONT
    snake_large_wagging_overlay_BEHIND: snake_large_wagging_overlay_FRONT
  sprites:
    - sprite: _WF/Mobs/Customization/TailSplit/_White/Mobs/Customization/reptilian_64x32.rsi # WOLFGATE - split art
      state: snake_large_wagging_FRONT
    - sprite: _WF/Mobs/Customization/TailSplit/_White/Mobs/Customization/reptilian_64x32.rsi # WOLFGATE - split art
      state: snake_large_wagging_overlay_FRONT
    - sprite: _WF/Mobs/Customization/TailSplit/_White/Mobs/Customization/reptilian_64x32.rsi # WOLFGATE - south frame on TailBehind
      state: snake_large_wagging_BEHIND
    - sprite: _WF/Mobs/Customization/TailSplit/_White/Mobs/Customization/reptilian_64x32.rsi # WOLFGATE - south frame on TailBehind
      state: snake_large_wagging_overlay_BEHIND

