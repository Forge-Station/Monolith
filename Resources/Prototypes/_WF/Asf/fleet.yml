# Hulls adapted from Hullrot: Eclipsion's DSM ships.
# Prices and loadouts are set against other factions' hulls of similar tile count; see Content.Shared/_WF/Asf/README.md.

- type: vessel
  id: WFAsfGleaner
  parent: BaseVessel
  name: ASF Gleaner
  description: A one-man mining pod with 2 M25 mining pulsers, an ore magnet and an ore box. No weapons, no shield.
  price: 25000
  category: Micro
  group: Custom
  shuttlePath: /SharedMaps/_WF/Asf/gleaner.yml
  guidebookPage: null
  class:
  - Salvage
  engine:
  - Plasma

- type: gameMap
  id: WFAsfGleaner
  mapName: 'ASF Gleaner'
  mapPath: /SharedMaps/_WF/Asf/gleaner.yml
  minPlayers: 0
  stations:
    WFAsfGleaner:
      stationProto: StandardFrontierVessel
      components:
      - type: StationNameSetup
        mapNameTemplate: 'Gleaner ASF{1}'
        nameGenerator:
          !type:NanotrasenNameGenerator
          prefixCreator: '14'
      - type: StationJobs
        availableJobs:
          WFAsfEnforcer: [ 0, 0 ]
          WFAsfFieldResearcher: [ 0, 0 ]
          WFAsfColonist: [ 0, 0 ]

