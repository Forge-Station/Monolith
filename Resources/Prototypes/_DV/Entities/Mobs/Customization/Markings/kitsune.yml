# All the Kitsune customization

# Tail Markings
# Wolfgate: ported from HardLight
- type: marking
  id: KitsuneTailDefault
  bodyPart: Tail
  markingCategory: Tail
  speciesRestriction: [Skrell, Thaven,Dwarf, Diona, Human, SlimePerson, Felinid, Oni, Harpy, Reptilian, Vulpkanin, Rodentia, Goblin, Sheleg, IPC, Feroxi, Moth, Arachnid, Kitsune, Chitinid, Canine]
  coloring:
    default:
      type: !type:CategoryColoring
        category: Hair
      fallbackTypes:
      - !type:SimpleColoring
        color: "#fffafa"
  layering: # WOLFGATE - the south frame draws behind the body, so the tail never covers anatomy
    kitsune_primary_BEHIND: TailBehind
    kitsune_secondary_BEHIND: TailBehind
  colorLinks: # WOLFGATE - both halves of a tail share one colour
    kitsune_primary_BEHIND: kitsune_primary_FRONT
    kitsune_secondary_BEHIND: kitsune_secondary_FRONT
  sprites:
  - sprite: _WF/Mobs/Customization/TailSplit/_DV/Mobs/Customization/kitsune/tails.rsi # WOLFGATE - split art
    state: kitsune_primary_FRONT
  - sprite: _WF/Mobs/Customization/TailSplit/_DV/Mobs/Customization/kitsune/tails.rsi # WOLFGATE - split art
    state: kitsune_secondary_FRONT
  - sprite: _WF/Mobs/Customization/TailSplit/_DV/Mobs/Customization/kitsune/tails.rsi # WOLFGATE - south frame on TailBehind
    state: kitsune_primary_BEHIND
  - sprite: _WF/Mobs/Customization/TailSplit/_DV/Mobs/Customization/kitsune/tails.rsi # WOLFGATE - south frame on TailBehind
    state: kitsune_secondary_BEHIND

