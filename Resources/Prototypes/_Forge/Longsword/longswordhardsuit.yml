- type: entity
  parent: ClothingOuterHardsuitBase
  id: ClothingOuterHardsuitLIlight
  name: LI-19
  suffix: Longsword, FallenSeraphim
  description: A lightweight hardsuit designed by Longsword International for complex industrial operations in space and maybe for another mission.
  components:
  - type: Sprite
    sprite: _Forge/Objects/Longsword/lilightskaf.rsi
  - type: Clothing
    sprite: _Forge/Objects/Longsword//lilightskaf.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.7
    lowPressureMultiplier: 1000
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.6
        Slash: 0.5
        Piercing: 0.55
        Radiation: 0.25 #salv is supposed to have radiation hazards in the future
        Caustic: 0.45
        Poison: 0.4
  - type: ClothingSpeedModifier
    walkModifier: 0.95
    sprintModifier: 0.87
  - type: HeldSpeedModifier
  - type: StaminaDamageResistance # Mono - Stamres
    coefficient: 0.6
  - type: ToggleableClothing # Goobstation - Modsuits change - Mono - this is a solution for helmet attachment/cover to not fit on hardsuits
    requiredSlot: outerclothing
    blockUnequipWhenAttached: false
    replaceCurrentClothing: true
    clothingPrototypes:
      head: ClothingHeadHelmetHardsuitLIlight
      helmetcover: ClothingHeadHelmetCoverBlock
      helmetattachment: ClothingHeadHelmetAttachmentBlock



- type: entity
  parent: [ ClothingHeadHardsuitBase, ClothingHeadSuitWithLightBase ]
  id: ClothingHeadHelmetHardsuitLIlight
  name: LI-19 helmet
  description: A sturdy helmet designed by Longsword International for complex industrial operations in space and maybe for another mission.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Forge/Objects/Longsword/lilightskafhelmet.rsi
    layers:
    - state: icon
    - state: icon-unshaded
      shader: unshaded
    - state: light-overlay
      visible: false
      shader: unshaded
      map: [ "light" ]
  - type: HandheldLight
    addPrefix: false
  - type: ToggleableVisuals
    clothingVisuals:
      head:
      - state: equipped-head-light
        shader: unshaded
      head-vox:
      - state: equipped-head-light-vox
        shader: unshaded
  - type: Clothing
    clothingVisuals:
      head:
      - state: equipped-head
      - state: equipped-head-unshaded
        shader: unshaded
      head-vox:
      - state: equipped-head-vox
      - state: equipped-head-unshaded-vox
        shader: unshaded
      head-hydrakin:
      - state: equipped-head-hydrakin
      - state: equipped-head-unshaded-hydrakin
        shader: unshaded
  - type: PointLight
    radius: 7 #6->7 Mono
  - type: PressureProtection
    highPressureMultiplier: 0.72
    lowPressureMultiplier: 1000


