- type: entity
  name: NEK'o Type-05 "Tiran" (5.7x28mm)
  parent: BaseWeaponPistol
  id: WeaponPistolTiran
  description: A modern looking semi-automatic pistol for resistance forces. Convenient and energy-efficient, but uses small caliber cartridges.
  components:
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Guns/Pistols/kuosame.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    sprite: _Mono/Objects/Weapons/Guns/Pistols/kuosame.rsi
  - type: Clothing
    sprite: _Mono/Objects/Weapons/Guns/Pistols/kuosame.rsi
  - type: Gun
    fireRate: 6.5
    projectileSpeed: 40
    damageModifier: 1.1
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/_Mono/Weapons/Guns/SmallArms/Gunshots/viper_fire.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: Magazine57x28mmPistolFMJ
        insertSound: /Audio/Weapons/Guns/MagIn/pistol_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/pistol_magout.ogg
        priority: 2
        whitelist:
          tags:
          - Magazine57x28mmPistolFMJ
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        startingItem: Cartridge57x28mmFMJ
        priority: 1
        whitelist:
          tags:
          - Cartridge57x28mmFMJ
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: StaticPrice
    price: 200