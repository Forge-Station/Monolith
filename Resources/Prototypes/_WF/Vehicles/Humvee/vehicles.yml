- type: entity
  parent: VehicleHumveeBase
  id: VehicleHumveeARC
  name: humvee (arc)
  description: A humvee configured for ARC interior layout.
  suffix: Drivable, Humvee, Base, ARC, Tracked
  components:
  - type: WFMilitaryVehicle
  - type: GridVehicleMover
    weightClass: Light
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: VehicleFrameARC # ARC damage modifier
  - type: HardpointIntegrity
    maxIntegrity: 800
    bypassEntryOnZero: true
  - type: VehicleEnter
    interiorPath: /Maps/_WF/Vehicles/Interiors/humvee_arc_interior.yml
    enterDoAfter: 1.0
    exitDoAfter: 1.0
    maxPassengers: 5
    entryPoints:
    - offset: -1,-0.1
      radius: 0.5
      interiorCoords: 3.56,-1.42
    - offset: 1,-0.1
      radius: 0.5
      interiorCoords: 3.56, -0.42
