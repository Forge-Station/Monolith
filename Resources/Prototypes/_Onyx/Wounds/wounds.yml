- type: wound
  id: SurgicalIncisionWound
  name: wound-name-surgical-incision
  analyzerCategory: Cut # WOLFGATE(Wolfmed): UI2
  damageTypes: {}
  mergeMode: SeparateInstances
  maximumSeverity: 200
  healingMultiplier: 0 # WOLFGATE(Wolfmed): W0: a bleed never closes from damage removal, only gauze, sutures or surgery.
  behaviors:
  # WOLFGATE(Wolfmed): W5: a patient left open on the table is the classic surgical site infection.
  - !type:WolfmedInfectionRiskBehavior
    riskMultiplier: 1.5
  - !type:WoundBleedingBehavior
    rate: 0.1
    awakeMultiplier: 3

- type: wound
  id: DismembermentWound
  name: wound-name-dismemberment
  analyzerCategory: Other # WOLFGATE(Wolfmed): UI2
  damageTypes: {}
  mergeMode: SeparateInstances
  maximumSeverity: 200
  healingMultiplier: 0 # WOLFGATE(Wolfmed): W0: a bleed never closes from damage removal, only gauze, sutures or surgery.
  behaviors:
  # WOLFGATE(Wolfmed): W5: an open stump is the worst thing in the model short of dead tissue.
  - !type:WolfmedInfectionRiskBehavior
    riskMultiplier: 2.5
  - !type:WoundBleedingBehavior
    rate: 0.2
    chance: 1
    awakeMultiplier: 1.5
    clottingMultiplier: 4
  # WOLFGATE(Wolfmed): playtest 4: a fresh stump hurt nothing (the lost part took its pain with it). One spike on the
  # part that keeps the stump, the stump's severity: an arm 120 (the cap: Downed until it fades), a hand 80.
  - !type:WoundPainBehavior
    painPerSeverity: 1
    oneTime: true

- type: wound
  id: IpcMechanicalDamageWound
  name: wound-name-ipc-mechanical-damage
  analyzerCategory: Mechanical # WOLFGATE(Wolfmed): UI2
  damageTypes:
    Blunt:
      reopenMinimumDamage: 18
      severityMultiplier: 1
    Slash:
      reopenMinimumDamage: 15
    Piercing:
      reopenMinimumDamage: 18
      severityMultiplier: 1
    Heat:
      reopenMinimumDamage: 15
    Cold:
      reopenMinimumDamage: 18
      severityMultiplier: 1
    Caustic:
      reopenMinimumDamage: 12
      severityMultiplier: 1
  maximumSeverity: 200
  healingMultiplier: 1 # WOLFGATE(Wolfmed): W0: exempt. A welder is the only thing that closes a chassis wound and it does so by removing damage; 0.15 would leave mechanical wounds permanently open.
  behaviors:
  - !type:WoundBleedingBehavior
