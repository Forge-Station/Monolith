# Cartridge kits for command turrets. The turret itself deploys empty.
- type: entity
  parent: BaseItem
  id: MagazineTurretBallistic
  name: ballistic turret cartridge kit
  description: Sixty rounds of 7.62x39mm. Load this into a ballistic command turret.
  components:
  - type: Tag
    tags:
    - MagazineTurretBallistic
  - type: Item
    size: Normal
  - type: BallisticAmmoProvider
    proto: Cartridge762x39mmFMJ
    capacity: 60
    mayTransfer: true
    whitelist:
      tags:
      - Cartridge762x39mmFMJ
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: _NF/Objects/Weapons/Guns/Ammunition/Magazine/Turret/box_mag.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 11
    zeroVisible: false
  - type: Appearance

