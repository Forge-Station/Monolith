  - type: Sprite
    state: nerve
  - type: ForgeXenoOrgan
    actions:
    - ActionForgeXenoPheromones
    - ActionForgeXenoScreech

- type: entity
  parent: OrganXenoBase
  id: OrganXenoQueen
  name: xenomorph royal gland
  description: Pheromones, screech, gut, zoom and plasma transfer. The queen's nervous system in one piece.
  components:
  - type: Sprite
    state: brain
  - type: ForgeXenoOrgan
    actions:
    - ActionForgeXenoPheromones
    - ActionForgeXenoScreech
    - ActionForgeXenoGut
    - ActionForgeXenoZoom
    - ActionForgeXenoTransferPlasma

- type: entity
  parent: OrganXenoBase
