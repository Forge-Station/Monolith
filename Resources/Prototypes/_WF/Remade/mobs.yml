- type: wfRemadeMob
  id: WFRemadeSlasher
  entity: WFRemadeSlasher
  cost: 50
  minStage: Growth
  # DS13 picks a slasher's look at 8 to 2 to 0.1 (plain, desiccated, carrion); the others are in variants.yml.
  spawnWeight: 4.75
  conversionWeight: 7.5
  compatibilityPower: -1

- type: wfRemadeMob
  id: WFRemadeSlasherEnhanced
  entity: WFRemadeSlasherEnhanced
  cost: 125
  minStage: Rapture
  spawnWeight: 2
  conversionWeight: 1

- type: wfRemadeMob
  id: WFRemadeInfector
  entity: WFRemadeInfector
  cost: 100
  minStage: Harvest
  spawnWeight: 1
  maxAlive: 1
  needsCorpses: true

- type: htnCompound
  id: WFRemadeHuntCompound
  branches:
  - tasks:
    - !type:HTNCompoundTask
      task: MeleeCombatCompound
  - preconditions:
    - !type:KeyExistsPrecondition
      key: WFRemadeHunt
    tasks:
    - !type:HTNPrimitiveTask
      # The Director owns this key and clears it when the Remade gets there. Letting the move drop it when the plan ended,
      # which a one-task plan does at once, left a Remade that took a single step towards what it heard and then wandered.
      operator: !type:MoveToOperator
        pathfindInPlanning: false
        targetKey: WFRemadeHunt
        removeKeyOnFinish: false
  - tasks:
    - !type:HTNCompoundTask
      task: IdleCompound

- type: htnCompound
  id: WFRemadeInfectorCompound
  branches:
  - tasks:
    - !type:HTNPrimitiveTask
      operator: !type:WFPickCorpseOperator
        targetKey: WFRemadeCorpse
        coordinatesKey: WFRemadeCorpseCoordinates
    - !type:HTNPrimitiveTask
      operator: !type:MoveToOperator
        pathfindInPlanning: false
        targetKey: WFRemadeCorpseCoordinates
        rangeKey: MeleeRange
    - !type:HTNPrimitiveTask
      operator: !type:WFReanimateOperator
        targetKey: WFRemadeCorpse
  - tasks:
    - !type:HTNCompoundTask
      task: WFRemadeHuntCompound
