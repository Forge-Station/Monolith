# Packed command turrets. They deploy empty; load a cartridge kit.
- type: entity
  parent: BaseItem
  id: WeaponTurretEmpirePacked
  name: packed imperial ballistic turret
  description: A disassembled command turret. Deploy it, then load a cartridge kit. It has no ammunition inside.
  suffix: Packed
  components:
  - type: MultiHandedItem
  - type: SpawnAfterInteract
    prototype: WeaponTurretEmpire
    doAfter: 5
    removeOnInteract: true
  - type: Sprite
    sprite: Objects/Weapons/Guns/Turrets/turrets.rsi
    state: syndie_lethal
  - type: Item
    size: Ginormous
    shape:
    - 0,0,3,3

- type: constructionGraph
  id: WeaponTurretEmpirePackingGraph
  start: WeaponTurretEmpirePacked
  graph:
  - node: WeaponTurretEmpirePacked
    entity: WeaponTurretEmpire
    edges:
    - to: WeaponTurretEmpirePacked
      completed:
      - !type:SpawnPrototype
        prototype: WeaponTurretEmpirePacked
        amount: 1
      - !type:EmptyAllContainers
      - !type:DeleteEntity {}
      steps:
      - tool: Screwing
        doAfter: 14

