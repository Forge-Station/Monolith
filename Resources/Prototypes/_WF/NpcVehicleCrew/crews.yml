# Vehicle crew rosters. Engage range / standoff in tiles: tank 18/10, APC 16/8, humvee 14/6. Only the humvee and APC fire
# on the move. A Hold crew guards its post and never pursues; a Patrol crew may. The civilian vehicles are unarmed: they
# patrol, never engage, and the server switches them to Flee when hit.

- type: wfVehicleCrew
  id: WFVehicleCrewPirateHumvee
  name: wf-vehicle-crew-name-pirate-humvee
  vehicle: VehicleHumvee
  driver: WFVehicleDriver
  gunner: WFVehicleGunner
  troopers: [ WFVehicleTrooper, WFVehicleTrooper ]
  profile: WFVehicleCrewProfilePirate
  faction: PirateNF
  behaviour: Patrol
  engagement: OnSight
  engageRange: 14
  standoff: 6
  fireOnTheMove: true
  skill: Green

- type: wfVehicleCrew
  id: WFVehicleCrewPirateTank
  name: wf-vehicle-crew-name-pirate-tank
  vehicle: WFVehicleTankArmed
  driver: WFVehicleDriver
  gunner: WFVehicleGunner
  profile: WFVehicleCrewProfilePirate
  faction: PirateNF
  behaviour: Patrol
  engagement: OnSight
  engageRange: 18
  standoff: 10
  fireOnTheMove: false
  skill: Green

- type: wfVehicleCrew
  id: WFVehicleCrewPirateApc
  name: wf-vehicle-crew-name-pirate-apc
  vehicle: WFVehicleAPCArmed
  driver: WFVehicleDriver
  gunner: WFVehicleGunner
  troopers: [ WFVehicleTrooper, WFVehicleTrooper, WFVehicleTrooper, WFVehicleTrooper ]
  profile: WFVehicleCrewProfilePirate
  faction: PirateNF
  behaviour: Patrol
  engagement: OnSight
  engageRange: 16
  standoff: 8
  fireOnTheMove: true
  skill: Green

