- type: entity
  parent: ClothingOuterHardsuitSyndie # to-do: give a better sprite.
  id: ClothingOuterHardsuitGodfather
  name: BR-238 Godfather hardsuit # WOLFGATE(ArmorBalance): grammar pass.
  description: A heavily reinforced hardsuit and a true symbol of wealth and power, however fleeting.
  components: 
  # WOLFGATE(ArmorSpecialization): ablative coat.
  - type: WFAblativeCoat
  - type: ToggleableClothing # Goobstation - Modsuits change - Mono - this is a solution for helmet attachment/cover to not fit on hardsuits
    requiredSlot: outerclothing
    blockUnequipWhenAttached: false
    replaceCurrentClothing: true
    clothingPrototypes:
      head:  ClothingHeadHelmetHardsuitGodfather
      helmetcover: ClothingHeadHelmetCoverBlock
      helmetattachment: ClothingHeadHelmetAttachmentBlock
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.6
        Slash: 0.6
        Piercing: 0.4
        Heat: 0.25
        Radiation: 0.25
        Caustic: 0.75
  - type: Sprite
    sprite: Clothing/OuterClothing/Hardsuits/syndiecommander.rsi
  - type: Clothing
    sprite: Clothing/OuterClothing/Hardsuits/syndiecommander.rsi
  - type: ClothingSpeedModifier
    walkModifier: 1.0
    sprintModifier: 1.0

- type: entity
  parent: [ ClothingOuterHardsuitBase, BaseC3SyndicateContraband ]
  id: ClothingOuterHardsuitWarlord
  name: UGR WL-01
  description: Nicknamed "Warlord", this was once state-of-the-art military equipment, and is now widespread on black markets after a critical security breach. It has been modified to withstand vacuum, making it spaceworthy. # WOLFGATE(ArmorBalance): grammar pass.
  components:
  # WOLFGATE(ArmorSpecialization): pain dampener.
  - type: WFPainDampener
    relief: 20
  - type: Sprite
    sprite: _Mono/Clothing/OuterClothing/Hardsuits/merc_warlordsuit.rsi
  - type: Clothing
    sprite: _Mono/Clothing/OuterClothing/Hardsuits/merc_warlordsuit.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.5
    lowPressureMultiplier: 1000
  - type: ExplosionResistance
    damageCoefficient: 0.5
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.65
        Slash: 0.6
        Piercing: 0.6
        Heat: 0.65
        Radiation: 0.6
        Caustic: 0.8
  - type: ClothingSpeedModifier
    walkModifier: 0.95
    sprintModifier: 0.95
  - type: HeldSpeedModifier
  - type: ToggleableClothing # Goobstation - Modsuits change - Mono - this is a solution for helmet attachment/cover to not fit on hardsuits
    requiredSlot: outerclothing
    blockUnequipWhenAttached: false
    replaceCurrentClothing: true
    clothingPrototypes:
      head: ClothingHelmetHardsuitWarlord
      helmetcover: ClothingHeadHelmetCoverBlock
      helmetattachment: ClothingHeadHelmetAttachmentBlock
  - type: PirateBountyItem
    id: ClothingOuterHardsuitTacsuit
  - type: StaminaDamageResistance
    coefficient: 0.6
