- type: entity
  id: KiasManagementConsole
  parent: BaseComputer
  name: KIAS management console
  components:
  - type: Computer
    board: KiasManagementConsoleBoard
  - type: KiasDevice
    role: Display
  - type: KiasDisplay
  - type: KiasManagement
  - type: KiasResourceMonitor
  - type: KiasClaimable
  - type: ActivatableUI
    key: enum.KiasUiKey.Key
  - type: UserInterface
    interfaces:
      enum.KiasUiKey.Key:
        type: KiasBoundUserInterface
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.45,-0.45,1.45,0.45"
        density: 190
        mask: [MachineMask]
        layer: [MachineLayer]
  - type: GenericVisualizer
    visuals:
      enum.ComputerVisuals.Powered:
        computerLayerBody:
          True: { color: White }
          False: { color: Gray }
  - type: Sprite
    sprite: _Forge/KIAS/Pack/management.rsi
    offset: 0.5, 0
    layers:
    - state: base
      map: [computerLayerBody, "0"]
    - state: blank
      map: ["computerLayerKeyboard"]
    - state: blank
      map: ["computerLayerScreen"]
    - state: blank
      map: ["computerLayerKeys"]
    - state: blank
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
- type: entity
  id: KiasManagementConsoleBoard
  parent: BaseComputerCircuitboard
