# A loose chunk for hand miners: pull it aboard and break it with a pickaxe, drill or kinetic accelerator, or crack
# it in space with a mining laser.
- type: entity
  parent: WFAsteroidRockBase
  id: WFAsteroidBoulder
  name: asteroid boulder
  description: A loose chunk of asteroid, small enough to break apart by hand.
  placement:
    mode: PlaceFree
  components:
  - type: Transform
    anchored: false
  - type: Physics
    bodyType: Dynamic
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.4
        density: 150
        mask:
        - MachineMask
        # Opaque so the mining laser's ray hits it; bullets stop on it too.
        layer:
        - MidImpassable
        - LowImpassable
        - Opaque
        - BulletImpassable
  - type: Pullable
  - type: Sprite
    sprite: _WF/AsteroidMining/Asteroids/boulder.rsi
    drawdepth: Objects
  - type: PointLight
    radius: 1.5
  - type: SoundOnGather
  - type: Gatherable
    toolWhitelist:
      tags:
      - Pickaxe
      components:
      - MiningGatheringHard
      - MiningGatheringSoft
  - type: WFAsteroid
    radius: 0.45
    looks:
      metallic: _WF/AsteroidMining/Asteroids/boulder_metallic.rsi
    minMass: 2
    maxMass: 4
    shatterDamage: 80
    # Easy to strip with any laser: no rock resistance, and anything from warm to nearly overcharged cracks it.
    crackTimeBase: 0.5
    resistanceScale: 0
    fixedWindow: 0.15, 0.8
# endregion

# The burst where a rock breaks, drawn by WFAsteroidCrackOverlay.
- type: entity
  id: WFAsteroidCrackEffect
  categories: [ HideSpawnMenu ]
  components:
  - type: WFAsteroidCrackEffect
    duration: 2.2
  # A little past the effect's duration, so a late state still has time to draw it out.
  - type: TimedDespawn
    lifetime: 2.5

# region Grids
- type: entity
  id: WFAsteroidGridBase
  abstract: true
  name: asteroid
  components:
  - type: MapGrid
  - type: LinkedLifecycleGridParent
  - type: GCAbleObject
    queue: WFAsteroids
  - type: ProtectedGrid
    preventFloorRemoval: true
    preventFloorPlacement: true
    preventRCDUse: true
    preventArtifactTriggers: true
  - type: IFF
    flags: HideLabel, HideLabelAlways, AlwaysShowColor
    color: "#d67e27"
  - type: WFAdminRadarUnlabelled
  - type: WFAsteroidGridVisuals
  - type: DetectedAtRangeMultiplier
    visualBias: 1024

- type: entity
  parent: WFAsteroidGridBase
  id: WFAsteroidSmall
  suffix: Small
  components:
  - type: WFAsteroidGrid
    rock: WFAsteroidRockSmall

- type: entity
  parent: WFAsteroidGridBase
  id: WFAsteroidMedium
  suffix: Medium
  components:
  - type: WFAsteroidGrid
    rock: WFAsteroidRockMedium

- type: entity
  parent: WFAsteroidGridBase
  id: WFAsteroidLarge
  suffix: Large
  components:
  - type: WFAsteroidGrid
    rock: WFAsteroidRockLarge

- type: entity
  parent: WFAsteroidGridBase
  id: WFAsteroidHuge
  suffix: Huge
  components:
  - type: WFAsteroidGrid
    rock: WFAsteroidRockHuge
# endregion

# region Clusters
# Worldgen swaps each ore tile asteroid for one of these (see replacement.yml). It fills its mass budget with rocks
# of its kind, a few of them rare metallic ones, then removes itself. Spawned by hand it fills the default budget.
- type: entity
  id: WFAsteroidClusterBase
  abstract: true
  name: asteroid cluster
  description: Fills itself with asteroids of its kind, then disappears.
  placement:
    mode: PlaceFree
  components:
  - type: Sprite
    sprite: Markers/cross.rsi
    state: green
  - type: WFAsteroidCluster
    composition: WFAsteroidRock
    rareComposition: WFAsteroidMetallic
    # Richer further out: 1% by the stations, about 4% on the 9 km ring, 5% in the Wilds, 8% Very Far.
    rareChance: 0.01
    rareChancePerKm: 0.0035
    # By count: medium and large rocks lead, so a cluster is a few big grids rather than many small ones.
    sizes:
      WFAsteroidSmall: 2
      WFAsteroidMedium: 4
      WFAsteroidLarge: 3
      WFAsteroidHuge: 1

