# Durasteel walls: plastitanium walls with five thirds the health of the wall they refit, keeping its resistances, so a
# straight hull wall takes three Cyrexa APHE shells where plastitanium takes two. Only a drydock refit makes them
# (WFRefitDurasteel); there is no recipe.

- type: entity
  parent: WallPlastitanium
  id: WFWallDurasteel
  name: durasteel wall
  description: A durasteel frame under plastitanium skin. Best in class for protection.
  components:
  - type: Sprite
    sprite: _WF/ShipArmor/durasteel.rsi
  - type: Icon
    sprite: _WF/ShipArmor/durasteel.rsi
  - type: Construction
    graph: WFDurasteelWall
    node: durasteelWall
  - type: ArmorThickness
    thickness: 13
    canBePierced: false
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 5000
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalSlam
    - trigger:
        !type:DamageTrigger
        damage: 5500
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalSlam
      - !type:ChangeConstructionNodeBehavior
        node: girder
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

