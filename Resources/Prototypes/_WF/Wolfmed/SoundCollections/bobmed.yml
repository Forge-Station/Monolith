  id: WFWolfmedMelee
  files:
  - /Audio/_WF/Wolfmed/Melee/melee1.ogg
  - /Audio/_WF/Wolfmed/Melee/melee2.ogg
  - /Audio/_WF/Wolfmed/Melee/melee3.ogg

