#region BorgType
- type: borgType
  id: ForerunnerAssault
  dummyPrototype: ForerunnerBorgChassisAssault
  extraModuleCount: 3
  moduleWhitelist:
    tags:
    - BorgModuleGeneric
    - BorgModuleSyndicate
    - BorgModuleSyndicateAssault
  defaultModules:
    - BorgModuleForerunnerWeaponHeavy
    - BorgModuleJetpackADM
    - BorgModuleTool
  addComponents:
  - type: ShowHealthBars
    damageContainers:
    - Inorganic
    - Silicon
  - type: ExplosionResistance
    damageCoefficient: 0.2
  - type: MobThresholds
    thresholds:
      0: Alive
      550: Critical
      600: Dead
  - type: SlowOnDamage
    speedModifierThresholds:
      475: 0.8
      550: 0.6
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 475
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Machines/warning_buzzer.ogg
          params:
            volume: 5
    - trigger:
        !type:DamageTrigger
         damage: 650
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:EmptyContainersBehaviour
        containers:
        - borg_brain
        - borg_module
        - cell_slot
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  inventoryTemplateId: borgShort
  spriteBodyState: synd_sec
  spriteHasMindState: synd_sec_e
  spriteNoMindState: synd_sec_e
  spriteToggleLightState: synd_sec_l
  petSuccessString: petting-success-syndicate-cyborg
  petFailureString: petting-failure-station-ai

- type: borgType
  id: ForerunnerAssaultDevastator
  dummyPrototype: ForerunnerBorgChassisAssaultDevastator
  extraModuleCount: 4
  moduleWhitelist:
    tags:
    - BorgModuleGeneric
    - BorgModuleSyndicate
    - BorgModuleSyndicateAssault
  defaultModules:
    - BorgModuleForerunnerDevastatorWeapon
    - BorgModuleForerunnerDevastatorExplosive
    - BorgModuleJetpackADM
    - BorgModuleTool
  addComponents:
  - type: ShowHealthBars
    damageContainers:
    - Inorganic
    - Silicon
  - type: OnUseTimerTrigger
    delay: 15
    examinable: false
    beepSound:
      path: /Audio/Effects/beep1.ogg
      params:
        volume: 15
    initialBeepDelay: 0
    beepInterval: 0.5
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: Default
    deleteAfterExplosion: true
    totalIntensity: 1500
    intensitySlope: 10
    maxIntensity: 50
  - type: MobThresholds
    thresholds:
      0: Alive
      600: Critical
      700: Dead
  - type: SlowOnDamage
    speedModifierThresholds:
      375: 0.7
      600: 0.4
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 650
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Machines/warning_buzzer.ogg
          params:
            volume: 5
    - trigger:
        !type:DamageTrigger
        damage: 700
      behaviors:
      - !type:TimerStartBehavior
    - trigger:
        !type:DamageTrigger
        damage: 800
      behaviors:
      - !type:TriggerBehavior
  inventoryTemplateId: borgShort
  spriteBodyState: synd_sec
  spriteHasMindState: synd_sec_e
  spriteNoMindState: synd_sec_e
  spriteToggleLightState: synd_sec_l
  petSuccessString: petting-success-syndicate-cyborg
  petFailureString: petting-failure-station-ai

