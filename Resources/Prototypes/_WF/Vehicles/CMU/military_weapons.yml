# CMU's five tank guns, under their CMU ids: the FV150's autocannon, hull machine gun, heavy electrolaser and smoke discharger,
# and the RE700 cupola of the Longstreet. They are written the way the armed roster writes the RMC guns (Weapons/ and
# Hardpoints/tank_weapons.yml): no IFF, accuracy or gun predict opt-out, a range limit where CMU cut the damage off at a distance,
# explicit projectileSpeed and recoil: 0, casing-less rounds. CMU's damage, fire rate, magazine and reserve numbers are kept,
# and so are its speeds: the guns CMU gives none fly at the engine default of CMU, 62.
#
# Every FV150 part carries HardpointCompatibilityTWETank, so it fits the FV150 only (Hardpoints are in military_hardpoints.yml).
# The autocannon and electrolaser share the turret's one cannon slot, the hull machine gun sits in the hull's secondary slot
# and the smoke discharger in its support slot. The RE700 has no compatibility id and fits the standard tank turret, the
# Longstreet's among them.
#
# CMU's weapon sounds have no attribution and were not copied; the RMC sounds already in the module stand in:
# the autocannon fires autocannon_fire.ogg, the electrolaser dual_autocannon_fire.ogg, the hull machine gun and the RE700 the
# M56 cupola's gun_ml66a_2.ogg, and the smoke discharger the stock grenade launcher sound.

- type: entity
  parent: VehicleTankHardpointBase
  id: VehicleTankAutocannonTWE
  name: Improper L26A2 45mm Autocannon
  description: Tosubishi Heavy Industrial Manufacturing main gun for the FV150. Its rapid fire rate and multipurpose ammunition offers stopping power against infantry, structures, and medium armor. Careful use can even disable tanks.
  components:
  - type: StaticPrice
    price: 22400
  - type: Sprite
    sprite: _WF/Vehicles/CMU/fv150/icons.rsi
    state: heavy_autocannon
  - type: HardpointItem
    compatibilityId: HardpointCompatibilityTWETank
    hardpointType: HardpointTypeCannon
    vehicleFamily: HardpointVehicleFamilyTank
    slotType: HardpointSlotTypeCannon
    damageMultiplier: 0.125
    repairRate: 0.01
  - type: HardpointIntegrity
    maxIntegrity: 500
  - type: VehicleTurretAttachment
  - type: VehicleTurret
    useBarrelDirectionForShots: true
    fireWhileRotatingGraceDegrees: 180
    offsetRotatesWithTurret: true
    showOverlay: true
    useDirectionalOffsets: true
    pixelOffsetNorth: "0,0"
    pixelOffsetEast: "0,0"
    pixelOffsetSouth: "0,0"
    pixelOffsetWest: "0,0"
    overlayRsi: _WF/Vehicles/CMU/fv150/exterior.rsi
    overlayState: heavy_autocannon_0
    overlayDamagedState: heavy_autocannon_1
  - type: GunUseGunOrigin
  - type: GunIgnoreContainerOwnerCollision
  - type: Gun
    recoil: 0
    fireRate: 1.6
    projectileSpeed: 50
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot: /Audio/_WF/Vehicles/weapons/autocannon_fire.ogg
    cameraRecoilScalar: 0
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: BallisticAmmoProvider
    cycleable: false
    proto: WFVehicleCartridgeAceAutocannonTWE
    capacity: 40
  - type: VehicleHardpointAmmo
    magazineSize: 40
    maxStoredMagazines: 2
  - type: GunFireArc
    arc: 120
  - type: RefillableByBulletBox
    bulletType: VehicleAmmoBoxAceAutocannon
  - type: GunMuzzleOffset
    applyToMuzzleFlash: true
    useDirectionalOffsets: true
    rotateDirectionalOffsets: true
    offsetEast: "0.45,-1.2"
    offsetWest: "-0.5,-1.2"
    offsetSouth: "0,-1.0"
    offsetNorth: "0, -1.4"
    useAimDirection: true
    useContainerOwner: false
  - type: HardpointVisual
    vehicleState: heavy_autocannon_0
    damagedVehicleState: heavy_autocannon_1

- type: entity
  parent: VehicleTankHardpointBase
  id: VehicleTankHeavyElectrolaserTWE
  name: Improper L215A1 Heavy Electrolaser
  description: An experimental prototype made by Tosubishi Heavy Industrial Manufacturing. An arcing electroshock laser assisted cannon, currently going through field testing. Theoretically it has limitless firing potential, as long as it is powered.
  components:
  - type: Sprite
    sprite: _WF/Vehicles/CMU/fv150/icons.rsi
    state: heavy_electrolaser
  - type: HardpointItem
    compatibilityId: HardpointCompatibilityTWETank
    hardpointType: HardpointTypeCannon
    vehicleFamily: HardpointVehicleFamilyTank
    slotType: HardpointSlotTypeCannon
    damageMultiplier: 0.125
    repairRate: 0.01
  - type: HardpointIntegrity
    maxIntegrity: 500
  - type: VehicleTurretAttachment
  - type: VehicleTurret
    useBarrelDirectionForShots: true
    fireWhileRotatingGraceDegrees: 180
    offsetRotatesWithTurret: true
    showOverlay: true
    useDirectionalOffsets: true
    pixelOffsetNorth: "0,0"
    pixelOffsetEast: "0,0"
    pixelOffsetSouth: "0,0"
    pixelOffsetWest: "0,0"
    overlayRsi: _WF/Vehicles/CMU/fv150/exterior.rsi
    overlayState: heavy_electrolaser_0
    overlayDamagedState: heavy_electrolaser_1
  - type: GunUseGunOrigin
  - type: GunIgnoreContainerOwnerCollision
  - type: Gun
    recoil: 0
    fireRate: 0.3
    projectileSpeed: 60
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot: /Audio/_WF/Vehicles/weapons/dual_autocannon_fire.ogg
    cameraRecoilScalar: 0
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: BallisticAmmoProvider
    cycleable: false
    proto: VehicleCartridgeElectrolaser
    capacity: 520
  - type: VehicleHardpointAmmo
    magazineSize: 520
    maxStoredMagazines: 1
  - type: GunFireArc
    arc: 120
  # CMU gave it no crate; every gun here has one, so this one takes the power bank crate of the module.
  - type: RefillableByBulletBox
    bulletType: WFVehicleAmmoBoxElectrolaser
  - type: GunMuzzleOffset
    applyToMuzzleFlash: true
    useDirectionalOffsets: true
    rotateDirectionalOffsets: true
    offsetEast: "0.45,-1.35"
    offsetWest: "-0.5,-1.35"
    offsetSouth: "0,-1.1"
    offsetNorth: "0, -1.4"
    useAimDirection: true
    useContainerOwner: false
  - type: HardpointVisual
    vehicleState: heavy_electrolaser_0
    damagedVehicleState: heavy_electrolaser_1

# Hull-fixed: it does not follow the turret and its shots leave along the hull. It sits in the secondary slot, not the turret's.
- type: entity
  parent: VehicleTankHardpointBase
  id: VehicleTankCupolaTWE
  name: Improper L98 10x28mm Hull General Purpose Machine Gun
  description: Imperial implementation of a hull machine gun in a powered cupola. Compact with integrated liquid cooling, and armored hull proofed to small arms. However, its angle of horizontal traverse is limited to the front arc, and its vertical no more than 23 degrees. The mounted weapon is a heavy barreled variant of the regular 10x28mm pulse-action general purpose machine gun. It is built under license from Armat by Weyland Yutani.
  components:
  - type: StaticPrice
    price: 9800
  - type: Sprite
    sprite: _WF/Vehicles/CMU/fv150/icons.rsi
    state: mounted_cupola
  - type: HardpointItem
    compatibilityId: HardpointCompatibilityTWETank
    hardpointType: HardpointTypeSecondary
    vehicleFamily: HardpointVehicleFamilyTank
    slotType: HardpointSlotTypeLauncher
    damageMultiplier: 0.0
    repairRate: 0.0125
  - type: HardpointIntegrity
    maxIntegrity: 350
  - type: VehicleTurretAttachment
  - type: VehicleTurret
    # On the FV150 the cupola sits in a hull slot, not on the turret, so nothing turns it but itself.
    rotateToCursor: true
    stabilizedRotation: false
    rotationSpeed: 180
    useBarrelDirectionForShots: true
    fireWhileRotatingGraceDegrees: 180
    offsetRotatesWithTurret: false
    useDirectionalOffsets: true
    offsetSpritePivot: true
    overlayDepthOffset: -1
    pixelOffsetNorth: "11,32"
    pixelOffsetEast: "28,-1"
    pixelOffsetSouth: "-11,-25"
    pixelOffsetWest: "-28,20"
    showOverlay: true
    overlayRsi: _WF/Vehicles/CMU/fv150/exterior.rsi
    overlayState: mounted_cupola_0
    overlayDamagedState: mounted_cupola_1
  - type: GunUseGunOrigin
  - type: GunIgnoreContainerOwnerCollision
  - type: Gun
    recoil: 0
    fireRate: 3.5
    projectileSpeed: 62
    minAngle: 2.3
    maxAngle: 2.3
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot: /Audio/_WF/Vehicles/guns/gun_ml66a_2.ogg
    cameraRecoilScalar: 0
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: BallisticAmmoProvider
    cycleable: false
    proto: WFVehicleCartridgeSentry10x50mmTWE
    capacity: 500
  - type: VehicleHardpointAmmo
    magazineSize: 500
    maxStoredMagazines: 1
  - type: GunFireArc
    arc: 180
  - type: RefillableByBulletBox
    bulletType: VehicleAmmoBoxCupola
  - type: GunMuzzleOffset
    offset: "0,0"
    useDirectionalOffsets: true
    offsetWest: "0,1"
    offsetEast: "0,-0.37"
    offsetNorth: "0.68,0"
    offsetSouth: "-0.68,0"
    muzzleOffset: "0.3,-1.1"
    useAimDirection: false
    useContainerOwner: false
  - type: HardpointVisual
    vehicleState: mounted_cupola_0
    damagedVehicleState: mounted_cupola_1

# The CMU smoke discharger on the standard launcher's path: three shells a shot that burst at the aimed point (Weapons/projectiles.yml).
# CMU also set the barrel-direction flag and the 0.2 second fuse on it; neither is kept, as on the RMC smoke launcher, because
# they would send the shells straight ahead of the hull and burst them 3.6 tiles out whatever the aim.
- type: entity
  parent: VehicleTankHardpointBase
  id: VehicleTankRocketLauncherTWE
  name: Improper L-39T Smoke Discharger
  description: A support module for the FV150, based off those used by the UA for their vehicles.
  components:
  - type: StaticPrice
    price: 7000
  - type: Sprite
    sprite: _WF/Vehicles/CMU/fv150/icons.rsi
    state: slauncher_0
  - type: HardpointItem
    compatibilityId: HardpointCompatibilityTWETank
    hardpointType: HardpointTypeSupport
    vehicleFamily: HardpointVehicleFamilyTank
    slotType: HardpointSlotTypeSupportAttachment
    damageMultiplier: 0.075
    repairRate: 0.0125
  - type: HardpointIntegrity
    maxIntegrity: 250
  - type: VehicleTurret
    useDirectionalOffsets: true
    pixelOffsetNorth: "0,0"
    pixelOffsetEast: "0,0"
    pixelOffsetSouth: "0,0"
    pixelOffsetWest: "0,0"
    showOverlay: true
    overlayRsi: _WF/Vehicles/CMU/fv150/exterior.rsi
    overlayState: slauncher_0
  - type: GunUseGunOrigin
  - type: GunIgnoreContainerOwnerCollision
  - type: Gun
    recoil: 0
    fireRate: 0.6
    projectileSpeed: 18
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot: /Audio/Weapons/Guns/Gunshots/grenade_launcher.ogg
    cameraRecoilScalar: 0
  - type: ShootAtFixedPoint
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: BallisticAmmoProvider
    cycleable: false
    proto: WFVehicleCartridgeSmoke
    capacity: 6
  - type: VehicleHardpointAmmo
    magazineSize: 6
    maxStoredMagazines: 2
  - type: GunFireArc
    arc: 360
  # CMU named the grenade launcher crate; that one holds HE grenades here, so the smoke launcher crate, which holds smoke shells, serves.
  - type: RefillableByBulletBox
    bulletType: VehicleAmmoBoxSmokeLauncher
  - type: GunMuzzleOffset
    offset: "0,0"
    useDirectionalOffsets: true
    offsetEast: "0,0.2"
    muzzleOffset: "0,-1"
    useAimDirection: true
    useContainerOwner: false
  - type: HardpointVisual
    vehicleState: slauncher_0

