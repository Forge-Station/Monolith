- type: entity
  parent: BaseWall
  id: FrontierWallSolidChitin
  components:
  - type: Tag
    tags:
      - Wall
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 400
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalSlam
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalSlam
      - !type:ChangeConstructionNodeBehavior
        node: girder
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Sprite
    sprite: _WF/DecorImport/Structures/Walls/xeno_frontier.rsi
  - type: Icon
    sprite: _WF/DecorImport/Structures/Walls/xeno_frontier.rsi
  - type: IconSmooth
    key: chitin
    base: solid
  - type: Construction
    graph: Girder
    node: wallChitin
  - type: RCDDeconstructable
    cost: 6
    delay: 8
    fx: EffectRCDDeconstruct8

- type: entity
  parent: BaseWall
  id: FrontierWallReinforcedChitin
  components:
  - type: Sprite
    sprite: _WF/DecorImport/Structures/Walls/xeno_frontier.rsi
  - type: Icon
    sprite: _WF/DecorImport/Structures/Walls/xeno_frontier.rsi
    state: rgeneric
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StructuralMetallicStrong
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 600
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalSlam
    - trigger:
        !type:DamageTrigger
        damage: 400
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalSlam
      - !type:ChangeConstructionNodeBehavior
        node: girder
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ReinforcedWallVisuals.DeconstructionStage:
        ReinforcedWallVisualLayers.Deconstruction:
          -1: { visible: false }
          0: { state: reinf_construct-0, visible: true}
          1: { state: reinf_construct-1, visible: true}
          2: { state: reinf_construct-2, visible: true}
          3: { state: reinf_construct-3, visible: true}
          4: { state: reinf_construct-4, visible: true}
          5: { state: reinf_construct-5, visible: true}
  - type: StaticPrice
    price: 250
  - type: RadiationBlocker
    resistance: 5
  - type: IconSmooth
    key: chitin
    base: reinf_over
  - type: Construction
    graph: Girder
    node: reinforcedWallChitin

- type: entity
  parent: [ BaseWallTierTwo, BaseWallBitmask ]
