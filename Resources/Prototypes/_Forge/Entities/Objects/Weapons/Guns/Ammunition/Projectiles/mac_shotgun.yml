# Midnight Arms Co. special shotgun projectiles

- type: entity
  id: Pellet12_gaugeMacFlechette
  name: pellet (12 gauge MAC flechette)
  parent: BaseBullet
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/projectiles2.rsi
    state: buckshot
  - type: Projectile
    damage:
      types:
        Piercing: 8
        Structural: 45
    armorPenetration: 0.65
  - type: Tracer
    color: "#c4c4c4"
    length: 3

- type: entity
  id: Pellet12_gaugeMacFlechetteSpread
  parent: Pellet12_gaugeMacFlechette
  categories: [ HideSpawnMenu ]
  components:
  - type: ProjectileSpread
    proto: Pellet12_gaugeMacFlechette
    count: 6
    spread: 10

- type: entity
