# What a crashed ship sometimes still has in its hold (a wreck theme's `loot`, WFPlanetPoiSystem.Wrecks): a crate of
# salvaged armament, one ship gun flatpack with the hardpoint it mounts on, or a crate of gunnery co-processor chips.
# The flatpacks are the exotic traders' (_WF/Traders/exotic_flatpacks.yml); the big guns turn up rarest.

- type: entityTable
  id: WFWreckLoot
  table: !type:GroupSelector
    children:
    - id: WFWreckShipgunCrate
      weight: 3
    - id: WFWreckGunneryChipCrate
      weight: 2

- type: entity
  parent: CrateGenericSteel
  id: WFWreckShipgunCrate
  name: salvaged armament crate
  description: A battered crate from a wrecked ship's hold. Something heavy and dangerous is packed inside.
  components:
  - type: Sprite
    sprite: Structures/Storage/Crates/weapon.rsi
  - type: Icon
    sprite: Structures/Storage/Crates/weapon.rsi
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:NestedSelector
        tableId: WFWreckShipgunBundles

- type: entity
  parent: CrateGenericSteel
  id: WFWreckGunneryChipCrate
  name: salvaged electronics crate
  description: A crate of carefully packed electronics, somehow intact after the crash.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:NestedSelector
        tableId: WFWreckGunneryChips

- type: entityTable
  id: WFWreckGunneryChips
  table: !type:GroupSelector
    rolls: !type:RangeNumberSelector
      range: 1, 2
    children:
    - id: WFGunneryChipBasic
      weight: 6
    - id: WFGunneryChipAdvanced
      weight: 3
    - id: WFGunneryChipMilitary
      weight: 1

