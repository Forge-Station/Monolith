        state: Impaired
      - !type:WoundBleedingBehavior
        rate: 0.2
        minimumSeverity: 9
    Critical:
      name: wound-stage-critical
      severity: 80
      behaviors:
      - !type:WoundFunctionalityBehavior
        state: Disabled
      - !type:WoundBleedingBehavior
        rate: 0.3
        minimumSeverity: 9

