#region Vinyls

- type: entity
  abstract: true
  id: BaseVinylDisk
  name: vinyl disk
  description: A vinyl disk containing music.
  parent: BaseItem
  components:
  - type: Vinyl
  - type: Sprite
    sprite: _Forge/Objects/Misc/RadioStation/vinyls.rsi #_Goobstation/Objects/Misc/RadioStation/vinyls.rsi
    state: placeholder     
  - type: EmbeddableProjectile
    sound: /Audio/Weapons/star_hit.ogg
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Wood
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 12
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          VinylDiskBroken:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: DamageOnLand
    ignoreResistances: true
    damage:
      types:
        Blunt: 5
  - type: DamageOtherOnHit
    damage:
      types:
        Slash: 5
  - type: Tag
    tags:
    - VinylSleeveFit



