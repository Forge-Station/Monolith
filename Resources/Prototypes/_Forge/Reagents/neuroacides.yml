- type: reaction
  id: N611
  requiredMixerCategories:
  - Centrifuge
  reactants:
    Desoxyephedrine:
      amount: 3
    Dylovene:
      amount: 1
    DexalinPlus:
      amount: 1
    NeuroAcidCobra:
      amount: 3
  products:
    N611: 1


- type: gas
  id: 13
  name: gases-n611
  specificHeat: 20
  heatCapacityRatio: 1.4
  molarMass: 20
  color: "#66CDAA"
  reagent: N611
  pricePerMole: 0
  gasOverlaySprite: /Textures/Effects/atmospherics.rsi
  gasOverlayState: n611
  gasMolesVisible: 1.5


- type: entity
  parent: StorageCanister
  id: N611Canister
  name: N-611 canister
  suffix: Filled
  description: Боевая канистра с газообразным нейротоксином N-611. Крайне опасна. Крепится к портам ключом.
  components:
  - type: GasCanister
    gasMixture:
      volume: 1500
      moles:
        N611: 1500
      temperature: 293.15

- type: reaction
  id: N611Vaporize
  requiredMixerCategories:
  - Electrolysis
  reactants:
    N611:
      amount: 1
  effects:
    - !type:CreateGas
      gas: N611
      multiplier: 3