# Prototypes referenced by the Frontier map. Ported from Wolfgate.
# Construction graphs named DecorBuild* are not in this repo, so those components are omitted.

- type: entity
  parent: Bed
  id: AuroraBunkBed
  components:
  - type: Sprite
    sprite: _WF/DecorImport/Structures/Furniture/bunk_beds.rsi
    state: zbunkbed
    snapCardinals: false
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: [ Destruction ]

