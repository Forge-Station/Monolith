# Frontier map derelict props. Ported from Wolfgate.

- type: entity
  abstract: true
  parent: BaseStructure
  id: CitadelRPDerelictPropBase
  components:
  - type: Sprite
    sprite: _WF/DecorImport/Structures/Decoration/derelict_props_citadelrp.rsi
  - type: InteractionOutline

- type: entity
  abstract: true
  parent: CitadelRPDerelictPropBase
  id: CitadelRPDerelictPodBase
  components:
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Glass
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          CitadelRPDerelictPodBroken:
            min: 1
            max: 1
        offset: 0
      - !type:DoActsBehavior
        acts: [ Destruction ]

- type: entity
  parent: CitadelRPDerelictPropBase
  id: CitadelRPDerelictJarShelf
  components:
  - type: Sprite
    state: jarshelf
    noRot: true

- type: entity
  parent: CitadelRPDerelictPodBase
  id: CitadelRPDerelictPod
  components:
  - type: Sprite
    layers:
    - state: active_pod
      map: [ "base" ]
  - type: RandomSprite
    available:
    - base:
        active_pod: ""
    - base:
        active_pod2: ""
    - base:
        active_pod3: ""
  - type: PointLight
    radius: 1.5
    energy: 0.6
    color: "#9a7cff"

- type: entity
  parent: CitadelRPDerelictPodBase
  id: CitadelRPDerelictPodOvergrown
  components:
  - type: Sprite
    state: overgrown_pod

- type: entity
  parent: CitadelRPDerelictPropBase
  id: CitadelRPDerelictPodBroken
  components:
  - type: Sprite
    state: broken_pod

- type: entity
  parent: CitadelRPDerelictPropBase
  id: CitadelRPDerelictTerminal
  components:
  - type: Sprite
    layers:
    - state: terminal1
      map: [ "base" ]
    noRot: true
  - type: RandomSprite
    available:
    - base:
        terminal1: ""
    - base:
        terminal2: ""
    - base:
        terminal3: ""
    - base:
        terminal4: ""
    - base:
        terminal5: ""
    - base:
        terminal6: ""

- type: entity
  parent: CitadelRPDerelictPropBase
  id: CitadelRPDerelictMonitor
  components:
  - type: Sprite
    state: monitor1
    noRot: true

- type: entity
  parent: CitadelRPDerelictPropBase
  id: CitadelRPDerelictServer
  components:
  - type: Sprite
    layers:
    - state: server1
      map: [ "base" ]
    noRot: true
  - type: RandomSprite
    available:
    - base:
        server1: ""
    - base:
        server2: ""

- type: entity
  parent: CitadelRPDerelictPropBase
  id: CitadelRPDerelictTube
  components:
  - type: Sprite
    layers:
    - state: tube1
      map: [ "base" ]
    noRot: true
  - type: RandomSprite
    available:
    - base:
        tube1: ""
    - base:
        tube2: ""

- type: entity
  parent: CitadelRPDerelictPropBase
  id: CitadelRPDerelictLamp
  components:
  - type: Sprite
    layers:
    - state: light2
      map: [ "base" ]
    noRot: true
  - type: RandomSprite
    available:
    - base:
        light2: ""
    - base:
        light3: ""
  - type: PointLight
    radius: 3
    energy: 1
    color: "#7fd4ff"

- type: entity
  parent: ChairBase
  id: CitadelRPChairDerelict
  components:
  - type: Sprite
    sprite: _WF/DecorImport/Structures/Decoration/derelict_props_citadelrp.rsi
    state: chair
    snapCardinals: false
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: [ Destruction ]

- type: entity
  parent: PottedPlantBase
  id: ParaLargeAlienAlien8
  components:
  - type: Sprite
    sprite: _WF/DecorImport/Structures/Furniture/potted_plants.rsi
    state: alien-8
    offset: "0.0,0.300"

- type: entity
  parent: BaseStructure
  id: NovaArtifactConsole
  components:
  - type: Sprite
    sprite: _WF/DecorImport/Structures/Decoration/artifacts_nova.rsi
    state: artifact_8_active
    noRot: true
  - type: InteractionOutline
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StructuralMetallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  parent: NovaArtifactConsole
  id: PolarisAlienTank
  components:
  - type: Sprite
    sprite: _WF/DecorImport/Structures/Decoration/alien_tank_polaris.rsi
    state: tank_larva
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          PolarisAlienTankBroken:
            min: 1
            max: 1
        offset: 0
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  parent: NovaArtifactConsole
  id: PolarisAlienTankBroken
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _WF/DecorImport/Structures/Decoration/alien_tank_polaris.rsi
    state: tank_broken

- type: entity
  parent: BaseStructure
  id: TGMCQueenSpecimenTank
  components:
  - type: Sprite
    sprite: _WF/DecorImport/Structures/Decoration/queencryo_tgmc.rsi
    layers:
    - state: bigqueencryo3
      offset: "0,0.5"
    - state: bigqueencryo4
      offset: "1,0.5"
    - state: bigqueencryo1
      offset: "0,2.5"
    - state: bigqueencryo2
      offset: "1,2.5"
  - type: PointLight
    radius: 3
    energy: 1
    color: "#FFB040"
    offset: "0.5,1.5"
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StructuralMetallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 500
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  id: TableAbductor
  parent: TableBase
  components:
  - type: Sprite
    sprite: _Shitmed/Structures/Tables/abductor_table.rsi
  - type: Icon
    sprite: _Shitmed/Structures/Tables/abductor_table.rsi
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepFloor
