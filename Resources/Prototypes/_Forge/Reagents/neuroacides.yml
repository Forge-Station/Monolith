        intensity: 1.4
        pulse: 2.2
        darkness: 0.6
        color: "#9f7ab5FF"
        time: 4
        conditions:
        - !type:ReagentThreshold
          min: 8
      - !type:Jitter
        conditions:
        - !type:ReagentThreshold
          min: 10
      - !type:StaminaDamageEffect
        forceCrit: true
        conditions:
        - !type:ReagentThreshold
          min: 10
      - !type:GenericStatusEffect
        key: ForcedSleep
        component: ForcedSleeping
        type: Add
        time: 5
        refresh: true
        conditions:
        - !type:ReagentThreshold
          min: 25
      - !type:HealthChange
        conditions:
        - !type:OrganType
          type: Yowie
          shouldHave: false
