# Colonial Marines / RMC-14 resin walls for mapping.
# Sprites taken from RMC-14 (cmss13 xeno wall masks).

- type: entity
  parent: BaseWallTierOne
  id: WallXeno
  name: xeno chitin wall
  description: Hardened alien chitin grown into a solid barrier.
  suffix: Forge, Xeno, Chitin
  components:
  - type: Sprite
    sprite: Structures/Walls/exo.rsi
  - type: Icon
    sprite: Structures/Walls/exo.rsi
  - type: IconSmooth
    key: walls-exo
    states:
    - !type:CardinalCornerSpriteSmoothing
      mask: [ walls-exo ]
      altMask:
      - windows
      - windows-reinf
      - windows-tinted
      - windows-plasma
      - windows-plasma-reinf
      - windows-uranium
      - windows-uranium-reinf
      - windows-exo
      - windows-shuttle
      - windows-plastitanium
      - windows-regal
      - walls-shuttle
      - walls-plastitanium
      - walls-material
      - walls-marble
      - walls
      - grilles
      - doors
      base: wall
  - type: RangedDamageSound
    soundGroups:
      Brute:
        collection: MeatBulletImpact
    soundTypes:
      Heat:
        collection: MeatLaserImpact

- type: entity
  parent: WallReinforcedChitin
  id: WallXenoReinforced
  name: reinforced xeno chitin wall
  description: Layers of alien chitin packed until they rival bulkheads.
  suffix: Forge, Xeno, Chitin, Reinforced

- type: entity
  parent: WallXenoResin
  id: WallXenoResinIndestructible
  suffix: Forge, Xeno, CM, Indestructible
  components:
  - type: Destructible
    thresholds:
    - trigger:
