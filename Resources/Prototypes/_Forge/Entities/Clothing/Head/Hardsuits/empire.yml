# костюм облегчённого джаггернаута HV-2
- type: entity
  parent: [ClothingHeadHardsuitBaseMilitary, ClothingNightVision2Empire, ShowMedicalIcons]
  id: ClothingHeadHelmetHardsuitHV2
  name: шлем костюма HV-2 # HV-2 helmet
  description: Шлем облегчённого джаггернаута HV-2. Иммет встроенные визоры для удобства. # A hardsuit issued to Imperial guardian operating in low-pressure and high-risk environments. Specialized in bullet protection.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Forge/Clothing/Head/Hardsuits/empirelight.rsi
  - type: Clothing
    sprite: Forge/Clothing/Head/Hardsuits/empirelight.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.08
    lowPressureMultiplier: 1000
  - type: Armor
    modifiers:
      flatReductions:
        Blunt: 10
        Slash: 10
        Piercing: 10
  - type: HideLayerClothing
    slots:
    - Hair
    - Snout
    - HeadTop
    - HeadSide

