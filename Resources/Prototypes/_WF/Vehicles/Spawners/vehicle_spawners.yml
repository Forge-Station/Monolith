# Random spawners for mappers: drivable vehicles (green), loose vehicle parts (blue) and scenery vehicles (red),
# damaged and destroyed variants included. Scenery tables weight each family, so the many car colours don't crowd
# out the trucks.

- type: entity
  parent: MarkerBase
  id: WFRandomCivilianVehicleSpawner
  name: random civilian vehicle spawner
  suffix: Civilian
  components:
  - type: Sprite
    layers:
    - state: green
    - sprite: _WF/Vehicles/van.rsi
      state: van_base
      scale: 0.25, 0.25
  - type: EntityTableSpawner
