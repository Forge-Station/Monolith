# The Bobmed sound pack (playtest 4, package SOUNDS). The owner's picks from Bobstation reignited, plus the emote
# sounds the emote audit ported from Bob and Nova. Every sound a system plays is one of these collections, so a file
# is retuned here without touching code. The dying gasp is the upstream MaleGasp / FemaleGasp pair
# (SoundCollections/gasp.yml), re-pointed at Audio/_WF/Wolfmed/Gasp.

# --- Bodies (WolfmedBodySoundSystem, WolfmedBleedDripSystem) -----------------------------------------------------

# A body bleeding lightly: one drip every wolfmed.drip_sound_interval seconds.
- type: soundCollection
  id: WFWolfmedBloodDrip
  files:
  - /Audio/_WF/Wolfmed/Bleeding/blood1.ogg
  - /Audio/_WF/Wolfmed/Bleeding/blood2.ogg
  - /Audio/_WF/Wolfmed/Bleeding/blood3.ogg
  - /Audio/_WF/Wolfmed/Bleeding/blood4.ogg
  - /Audio/_WF/Wolfmed/Bleeding/blood5.ogg
  - /Audio/_WF/Wolfmed/Bleeding/blood6.ogg

# A bone breaking, or a break getting worse.
- type: soundCollection
  id: WFWolfmedBoneCrack
  files:
  - /Audio/_WF/Wolfmed/Bone/crack1.ogg
  - /Audio/_WF/Wolfmed/Bone/crack2.ogg
  - /Audio/_WF/Wolfmed/Bone/crack3.ogg

# A tendon cut through.
- type: soundCollection
  id: WFWolfmedTendonSnap
  files:
  - /Audio/_WF/Wolfmed/Bone/tendon_snap1.ogg
  - /Audio/_WF/Wolfmed/Bone/tendon_snap2.ogg

# --- Melee on flesh (WolfmedOrganicSoundSystem) -------------------------------------------------------------------

