# What each kind of asteroid holds. Every unit of rock mass is one vein of the picked ore, so yields follow the ore
# prototypes that vein rocks use. Ore weights and the inert share start from each kind's soft mineral table
# (Resources/Prototypes/_NF/Entities/Markers/Spawners/Random/Salvage/minerals.yml), tilted towards iron and coal, which
# steel and plasteel need, at the expense of malachite, quartz and salt; each kind keeps its signature ores. Lithium,
# the economy's main tuning knob, keeps its share and comes mostly from chromite as before. Volatility feeds the
# overcharge blast.

# Plain and gas-bearing rock asteroids (NFRockMineralSoft): about 38% plain rock.
- type: wfAsteroidComposition
  id: WFAsteroidRock
  minInert: 0.28
  maxInert: 0.48
  minResistance: 0.05
