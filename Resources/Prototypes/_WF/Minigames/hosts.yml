# NPCs who play games for a stake (Content.Server/_WF/Minigames). Each PlayMinigame dialogue option names an offer of
# the WFMinigameHost component by index in its argument.

# A trader with the game window. UserInterface.interfaces is replaced wholesale by a child, so WFBaseTrader's entries
# are carried forward.
- type: entity
  id: WFBaseMinigameHost
  parent: WFBaseTrader
  abstract: true
  components:
  - type: UserInterface
    interfaces:
      enum.HumanoidMarkingModifierKey.Key:
        type: HumanoidMarkingModifierBoundUserInterface
      enum.StrippingUiKey.Key:
        type: StrippableBoundUserInterface
      # Shitmed
      enum.SurgeryUIKey.Key:
        type: SurgeryBui
      enum.TraderUiKey.Dialogue:
        type: TraderBoundUserInterface
        interactionRange: 3.5
      enum.TraderUiKey.Shop:
        type: TraderBoundUserInterface
        interactionRange: 3.5
      enum.TraderUiKey.UsedShips:
        type: TraderBoundUserInterface
        interactionRange: 3.5
      enum.WFMinigameUiKey.Key:
        type: MinigameBoundUserInterface
        interactionRange: 3.5

# Off the station: killable and unarmed, and runs when hurt (TraderFleeSystem).
- type: entity
  id: WFBaseMinigameHostWild
  parent: WFBaseMinigameHost
  abstract: true
  components:
  - type: WFCowardice
  - type: HTN
    rootTask:
      task: WFTraderCompound
    blackboard:
      NavInteract: !type:Bool
        true

# Vesna Kade, the card and dice dealer at Caelestinus Central.
- type: humanoidProfile
  id: WFMinigameDealerProfile
  profile:
    name: Vesna Kade
    species: Human
    age: 34
    sex: Female
    gender: Female
    appearance:
      hair: HumanHairBun
      hairColor: "#2B1B14"
      facialHair: FacialHairShaved
      facialHairColor: "#2B1B14"
      eyeColor: "#4A6B3A"
      skinColor: "#D8A982"

- type: startingGear
  id: WFMinigameDealerGear
  equipment:
    jumpsuit: ClothingUniformJumpsuitBartender
    outerClothing: ClothingOuterVest
    neck: ClothingNeckTieRed
    shoes: ClothingShoesColorBlack

- type: traderDialogue
  id: WFMinigameDealerDialogue
  greeting: wf-minigame-dealer-greeting
  farewell: wf-minigame-dealer-farewell
  options:
  - prompt: wf-minigame-dealer-prompt-cards
    response: wf-minigame-dealer-response-cards
    action: PlayMinigame
    argument: "0"
  - prompt: wf-minigame-dealer-prompt-dice
    response: wf-minigame-dealer-response-dice
    action: PlayMinigame
    argument: "1"
  - prompt: wf-minigame-dealer-prompt-lock
    response: wf-minigame-dealer-response-lock
    action: PlayMinigame
    argument: "2"
  - prompt: wf-minigame-prompt-rules
    response: wf-minigame-dealer-response-rules

- type: entity
  id: WFMinigameDealer
  parent: WFBaseMinigameHost
  name: Vesna Kade
  description: Deals cards, rolls dice and keeps a lockbox. Pay to play; the house pays big when it loses.
  suffix: Minigames, Dealer
  components:
  - type: HumanoidAppearance
    species: Human
    initial: WFMinigameDealerProfile
  - type: Loadout
    prototypes: [ WFMinigameDealerGear ]
  - type: Trader
    dialogue: WFMinigameDealerDialogue
  - type: WFMinigameHost
    dailyCap: 40000
    offers:
    - game: HigherLower
      difficulty: Normal
      stake: 1000
    - game: LiarsDice
      difficulty: Normal
      stake: 2000
    - game: Lockbox
      difficulty: Normal
      stake: 2500

