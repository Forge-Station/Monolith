    enabled: false
    radius: 5
    softness: 3
    autoRot: true
  - type: LaserPointer
    targetedColor: "#FF2E2E"
    defaultColor: "#FF2E2E"

#region Shotguns

- type: entity
  name: АРО-9 "Груз"
  id: WeaponShotgunMacAro9
  parent: WeaponShotgunBulldog
  description: Тяжёлый автоматический дробовик МАС 12-го калибра. Является одним из самых простых продуктов МАС — простой магазинный автоматический дробовик. Качество исполнения при этом ни капли не уступает любому другому оружию.
  components:
  - type: Sprite
    sprite: Forge/Objects/Weapons/Guns/Shotguns/mac_aro9_cargo.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: Forge/Objects/Weapons/Guns/Shotguns/mac_aro9_cargo_inhands_64x.rsi
    slots:
    - Back
    - suitStorage
  - type: Item
    sprite: Forge/Objects/Weapons/Guns/Shotguns/mac_aro9_cargo_inhands_64x.rsi
    size: Large
  - type: Gun
    soundGunshot:
      path: /Audio/_Forge/Weapons/Guns/Gunshots/shotgun_auto.ogg
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true

- type: entity
  name: АРО-15 "Перекрёсток"
  id: WeaponShotgunMacAro15
  parent: WeaponShotgunEnforcer
  description: Тяжёлый полуавтоматический дробовик производства МАС 12-го калибра. Экспериментальная модель компании, призванная испытать технологию умных дробовиков. В результате чрезмерной сложности и малой эффективности системы умного огня это оружие почти исчезло из продаж.
  components:
  - type: Sprite
    sprite: Forge/Objects/Weapons/Guns/Shotguns/mac_aro15_crossroads.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: Forge/Objects/Weapons/Guns/Shotguns/mac_aro15_crossroads_inhands_64x.rsi
    slots:
    - Back
    - suitStorage
  - type: Item
    sprite: Forge/Objects/Weapons/Guns/Shotguns/mac_aro15_crossroads_inhands_64x.rsi
    size: Large
  - type: BallisticAmmoProvider
    whitelist:
      tags:
      - ShellShotgun12_gaugeBuckshot
      - ShellShotgun12_gaugeLight
      - ShellShotgunMac
      - Cartridge
  - type: SmartGun
    requiresWield: true
  - type: LaserPointer
    targetedColor: "#FF2E2E"
    defaultColor: "#FF2E2E"
  - type: WieldedCrosshair
    rsi:
      sprite: _RMC14/Interface/MousePointer/smartgun_mouse.rsi
      state: all

#region Heavy

- type: entity
  name: РПВ-2 "Махина"
  id: WeaponMinigunMacRpv2
  parent: WeaponMinigun
  description: Многоствольный пулемёт производства МАС в калибре .10. Он огромен. Он тяжёл. Он ужасающен. 8 стволов, электропривод для вращения и ленточный магазин. Сам факт, что вы держите его в руках — невероятная победа конструкторов МАС. Не может быть сложен куда-либо в связи с невероятным весом.
  components:
  - type: Sprite
    sprite: Forge/Objects/Weapons/Guns/HMGs/mac_rpv2_machina.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    sprite: Forge/Objects/Weapons/Guns/HMGs/mac_rpv2_machina_inhands_64x.rsi
    size: Ginormous
  - type: BallisticAmmoProvider
    capacity: 500
  - type: GunRequiresWield
  - type: ClothingSpeedModifier
    walkModifier: 0.6
    sprintModifier: 0.5

- type: entity
  name: РПВ-41 "Каст"
  id: WeaponLauncherMacRpv41
  parent: [WeaponLauncherRocket, BaseGunWieldable]
  description: Реактивный гранатомёт производства МАС. Тяжёлый, опасный в обращении и чертовски эффектный ракетомёт под одноразовые реактивные снаряды. Позволяет дать бой как технике и укреплениям, так и обычной бронепехоте. Исключительно для доверенных покупателей. В связи с перебоями в поставках на Фронтире вместо стандартных РПГ-снарядов этот ракетомёт был адаптирован под корабельные лёгкие торпеды.
  components:
  - type: Sprite
    sprite: Forge/Objects/Weapons/Guns/Launchers/mac_rpv41_cast.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: Forge/Objects/Weapons/Guns/Launchers/mac_rpv41_cast_inhands_64x.rsi
    slots:
    - Back
    - suitStorage
  - type: Item
    sprite: Forge/Objects/Weapons/Guns/Launchers/mac_rpv41_cast_inhands_64x.rsi
    size: Huge
    storedRotation: -90
  - type: BallisticAmmoProvider
    proto: CartridgeMacCastRocket
    capacity: 1
    cycleable: false
    whitelist:
      tags:
      - CartridgeMacCastRocket
  - type: Gun
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/rocket_launcher.ogg
  - type: GunRequiresWield
  - type: WieldDelay
    baseDelay: 1.5
    modifiedDelay: 1.5
    preventFiring: true
  - type: SpeedModifiedOnWield
    walkModifier: 0.7
    sprintModifier: 0.6
  - type: WieldedCrosshair
    rsi:
      sprite: _RMC14/Interface/MousePointer/explosive_mouse.rsi
      state: all
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: false

#region Energy

- type: entity
  name: Z-O
  id: WeaponEnergyPistolMacZo
  parent: WeaponLaserPistolNF
  description: Экспериментальный образец технологий МАС — лазерный пистолет Z-O. Питается от энергоячейки и стреляет сфокусированными лазерными импульсами. Он был одобрен в производство со скрипом, так как создание его влекло за собой высокорисковые инвестиции в сборочную линию лазерного оружия, однако он здесь! Элегантная форма и фирменный ЛЦУ знаменуют пришествие далеко НЕ слабого взаимодействия.
  components:
  - type: Sprite
    sprite: Forge/Objects/Weapons/Guns/Battery/mac_zo_laser_pistol.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-unshaded-5
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: Clothing
    sprite: Forge/Objects/Weapons/Guns/Battery/mac_zo_laser_pistol.rsi
  - type: Item
    size: Small
    sprite: Forge/Objects/Weapons/Guns/Battery/mac_zo_laser_pistol.rsi
    inhandVisuals:
      left:
      - state: inhand-left
      right:
      - state: inhand-right
  - type: MagazineVisuals
    magState: mag
    steps: 6
    zeroVisible: true
  - type: UnpoweredFlashlight
  - type: PointLight
    enabled: false
    radius: 4
    softness: 4
    autoRot: true
  - type: LaserPointer
    targetedColor: "#FF2E2E"
    defaultColor: "#FF2E2E"
