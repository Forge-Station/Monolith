# Glands that carry a caste's abilities. A xenomorph grows them;
# butchering drops each one with a 5% chance. A hand or a pocket grants nothing.
# A surgeon grafts one into a humanoid torso (ribcage open). Two glands at most.

- type: entity
  parent: BaseItem
  id: OrganXenoBase
  abstract: true
  name: xenomorph gland
  description: A wet gland cut from a xenomorph. Silent until a surgeon grafts it into a body.
  components:
  - type: Sprite
    sprite: Mobs/Species/Human/organs.rsi
    state: stomach
  - type: Item
    size: Small
  - type: Organ
    slotId: xeno_graft_a
  - type: ForgeXenoOrgan
    actions: []

- type: entity
  parent: OrganXenoBase
  id: OrganXenoRest
  name: xenomorph rest gland
  description: A slow gland. The owner can lie down and knit itself back together.
  components:
  - type: Sprite
    state: liver
  - type: ForgeXenoOrgan
    actions:
    - ActionForgeXenoRest

- type: entity
  parent: OrganXenoBase
  id: OrganXenoTail
  name: xenomorph tail gland
  description: The muscle that drives a tail stab.
  components:
  - type: Sprite
    state: muscle
  - type: ForgeXenoOrgan
    actions:
    - ActionForgeXenoTailStab

- type: entity
  parent: OrganXenoTail
  id: OrganXenoTailHeavy
  name: xenomorph heavy tail gland
  description: A thicker tail gland. The stab hits harder.
  components:
  - type: ForgeXenoOrgan
    actions:
    - ActionForgeXenoTailStabHeavy

- type: entity
  parent: OrganXenoTail
  id: OrganXenoTailQueen
  name: xenomorph royal tail gland
  description: The queen's tail. It does not miss gently.
  components:
  - type: ForgeXenoOrgan
    actions:
    - ActionForgeXenoTailStabQueen

- type: entity
  parent: OrganXenoBase
  id: OrganXenoAcidWeak
  name: xenomorph weak acid gland
  description: A small acid sac. Enough for a weak glob.
  components:
  - type: Sprite
    state: stomach
  - type: ForgeXenoOrgan
    actions:
    - ActionForgeXenoAcidWeak

- type: entity
  parent: OrganXenoBase
  id: OrganXenoAcidSpit
  name: xenomorph acid spit gland
  description: Acid, and the reflex to spit it.
  components:
  - type: Sprite
    state: stomach
  - type: ForgeXenoOrgan
    actions:
    - ActionForgeXenoAcidWeak
    - ActionForgeXenoSpit

- type: entity
  parent: OrganXenoBase
  id: OrganXenoSpitter
  name: xenomorph spitter gland
  description: A swollen acid sac with a heavy spit behind it.
  components:
  - type: Sprite
    state: stomach
  - type: ForgeXenoOrgan
    actions:
    - ActionForgeXenoAcid
    - ActionForgeXenoSpit
    - ActionForgeXenoSpitHeavy

- type: entity
  parent: OrganXenoBase
  id: OrganXenoBoiler
  name: xenomorph boiler gland
  description: Acid under pressure. The spit is slow and heavy.
  components:
  - type: Sprite
    state: stomach
  - type: ForgeXenoOrgan
    actions:
    - ActionForgeXenoAcid
    - ActionForgeXenoSpitHeavy

- type: entity
  parent: OrganXenoBase
  id: OrganXenoPraetorianAcid
  name: xenomorph praetorian acid gland
  description: A soldier's acid sac. Spit, not a boiler's lob.
  components:
  - type: Sprite
    state: stomach
  - type: ForgeXenoOrgan
    actions:
    - ActionForgeXenoAcid
    - ActionForgeXenoSpit

- type: entity
  parent: OrganXenoBase
  id: OrganXenoAcid
  name: xenomorph acid gland
  description: Corrosive acid, nothing else.
  components:
  - type: Sprite
    state: stomach
  - type: ForgeXenoOrgan
    actions:
    - ActionForgeXenoAcid

- type: entity
  parent: OrganXenoBase
  id: OrganXenoWeeds
  name: xenomorph weed gland
  description: Secretes a patch of hive weeds and nothing more ambitious.
  components:
  - type: Sprite
    state: appendix
  - type: ForgeXenoOrgan
    actions:
    - ActionForgeXenoPlantWeeds

- type: entity
  parent: OrganXenoBase
  id: OrganXenoResin
  name: xenomorph resin gland
  description: Weeds, walls, membranes, doors and sticky resin.
  components:
  - type: Sprite
    state: appendix
  - type: ForgeXenoOrgan
    actions:
    - ActionForgeXenoPlantWeeds
    - ActionForgeXenoResinWall
    - ActionForgeXenoResinMembrane
    - ActionForgeXenoResinDoor
    - ActionForgeXenoStickyResin

- type: entity
  parent: OrganXenoResin
  id: OrganXenoResinFast
  name: xenomorph fast resin gland
  description: A builder's full resin kit, including the quick secretion.
  components:
  - type: ForgeXenoOrgan
    actions:
    - ActionForgeXenoPlantWeeds
    - ActionForgeXenoResinWall
    - ActionForgeXenoResinMembrane
    - ActionForgeXenoResinDoor
    - ActionForgeXenoStickyResin
    - ActionForgeXenoFastResin

- type: entity
  parent: OrganXenoBase
  id: OrganXenoPheromone
  name: xenomorph pheromone gland
  description: A chemical shout the rest of the hive can feel.
  components:
  - type: Sprite
    state: nerve
  - type: ForgeXenoOrgan
    actions:
    - ActionForgeXenoPheromones

- type: entity
