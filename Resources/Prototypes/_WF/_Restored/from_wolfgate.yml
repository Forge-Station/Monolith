# Hunters run a ship down with no speed limit but the hull's own. Dock speeds are the raider's, so the last stretch
# of a boarding run is flown as carefully as a raider's.

# Prototypes/_WF/NpcCrew/navigation.yml wfCrewNavigation WFCrewNavigationWarship
- type: wfCrewNavigation
  id: WFCrewNavigationWarship
  name: wf-crew-navigation-warship
  settings:
    cruiseSpeed: 23
    followSpeed: 26
    loiterSpeed: 14
    circleSpeed: 12
    attackSpeed: 16
    nearTargetSpeed: 6
    maximumTurnRate: 0.4
    thrustMultiplier: 1
    angularThrustMultiplier: 1
    dockApproachSpeed: 9
    dockCreepSpeed: 2.5
    undockSpeed: 7
    attackRange: 300

# Raiders fly flat out, at the ceiling the travel budgets allow, and the docking run is quick and forgiving, to board a
# ship that is trying to shake them off. The run in is braked along a curve from cruise to the approach speed, so the
# approach speed here is what the last stretch is flown at, and the creep speed what the port is closed at.

