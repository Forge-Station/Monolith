#"Map":
# - changed-files:
#   - any-glob-to-any-file: "Resources/Maps/**/*.yml" # All .yml files in the Resources/Maps directory, recursive.

"Map-Admin":
- changed-files:
  - any-glob-to-any-file: "Resources/Maps/_NF/Admin/**/*.yml" # Grid Files

"Map-Bluespace":
- changed-files:
  - any-glob-to-any-file: "Resources/Maps/_NF/Bluespace/**/*.yml" # Grid Files

"Map-Event":
- changed-files:
  - any-glob-to-any-file: "Resources/Maps/_Forge/Event/**/*.yml" # Grid Files

"Map-Dungeon":
- changed-files:
  - any-glob-to-any-file: "Resources/Maps/_NF/Dungeon/**/*.yml" # Grid Files

"Map-Outpost":
- changed-files:
  - any-glob-to-any-file:
    - "Resources/Maps/_Forge/Outpost/*.yml" # Map Files
    - "Resources/Prototypes/_Forge/Outpost/*.yml" # Prototypes Files

"Map-Shuttle":
- changed-files:
  - any-glob-to-any-file:
    - "Resources/SharedMaps/_Forge/Shuttles/**/*.yml" # Grid Files
    - "Resources/Prototypes/_Forge/Shipyard/**/*.yml" # Prototypes Files
    - "Resources/SharedMaps/_Mono/Shuttles/**/*.yml" # Grid Files
    - "Resources/Prototypes/_Mono/Shipyard/**/*.yml" # Prototypes Files

"Map-POI":
- changed-files:
  - any-glob-to-any-file:
    - "Resources/Maps/_Forge/POI/**/*.yml" # Grid Files
    - "Resources/Prototypes/_Forge/PointsOflnterest/**/*.yml" # Prototypes Files
    - "Resources/Maps/_Mono/POI/**/*.yml" # Grid Files
    - "Resources/Prototypes/_Mono/PointsOfInterest/**/*.yml" # Prototypes Files
    - "Resources/Maps/_NF/POI/**/*.yml" # Grid Files
    - "Resources/Prototypes/_NF/PointsOfInterest/**/*.yml" # Prototypes Files


"Sprites":
- changed-files:
  - any-glob-to-any-file:
    - "**/*.rsi/*.png"
    - "**/*.rsi/*.json"

"UI":
- changed-files:
  - any-glob-to-any-file: "**/*.xaml*"

"C#":
- changed-files:
  - any-glob-to-any-file: "**/*.cs"

"Shaders":
- changed-files:
  - any-glob-to-any-file: '**/*.swsl'

"Audio":
- changed-files:
  - any-glob-to-any-file: '**/*.ogg'

"No C#":
- changed-files:
  - all-globs-to-all-files: "!**/*.cs"

"Docs":
- changed-files:
  - any-glob-to-any-file:
    - "**/*.xml"
    - "**/*.md"

"FTL":
- changed-files:
  - any-glob-to-any-file: "Resources/Locale/**/*.ftl"

"YML":
- all:
  - changed-files:
    - any-glob-to-any-file: "**/*.yml"
    - all-globs-to-any-file:
      - "!Resources/Maps/**/*.yml"
      - "!Resources/Prototypes/Maps/**/*.yml"
      - "!Resources/SharedMaps/**/*.yml"

"DB Migration":
- changed-files:
  - any-glob-to-any-file: "Content.Server.Database/Migrations/**/*.cs"
