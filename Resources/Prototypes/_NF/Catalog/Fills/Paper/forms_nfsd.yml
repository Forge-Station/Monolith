# Station Representative Forms
# Sources: https://discord.com/channels/1123826877245694004/1182366744266932224/1182366744266932224
#          https://docs.google.com/document/d/1jDX9numj-VHKBJ2FiiEo1GIlHESffOUIHIIXaqhEnls/edit?pli=1#heading=h.ru93r8n0fb7m
# These forms should be kept up-to-date with changes to Space Law.

# Filled Folder
- type: entity
  id: FillNfsdForms
  abstract: true
  components:
  - type: StorageFill
    contents:
    - id: PaperWrittenNfsdWarrant
    - id: PaperWrittenNfsdReport
    - id: PaperWrittenNfsdArrestWarrant
    - id: PaperWrittenNfsdArrestReport
    - id: PaperWrittenNfsdDutyLog
    - id: PaperWrittenNfsdAuthorization
    - id: PaperWrittenNfsdContrabandAmnesty
    - id: PaperWrittenNfsdContrabandTurnover
    - id: PaperWrittenNfsdContrabandPermit
    - id: Paper
      prob: 0.5
    - id: Paper
      prob: 0.5

- type: entity
  id: BoxFolderNfsdForms
  parent: [FillNfsdForms, BoxFolderPalGreen]
  name: TSFMC form folder
  description: A folder filled with TSFMC paperwork templates.
  suffix: Forms, Green

- type: entity
  id: BoxFolderNfsdFormsBrown
  parent: [FillNfsdForms, BoxFolderPalBrown]
  name: TSFMC form folder
  description: A folder filled with TSFMC paperwork templates.
  suffix: Forms, Brown

