- type: entity
  name: PA Typewriter (.45 ACP)
  parent: [BaseWeaponSubMachineGun, BaseGunWieldable]
  id: WeaponSubMachineGunTypewriter
  description: A modern take on the classic design used by mobsters throughout space and time. Uses .45 ACP ammo.
  components:
  - type: Sprite
    sprite: _DV/Objects/Weapons/Guns/SMGs/typewriter.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: _DV/Objects/Weapons/Guns/SMGs/typewriter.rsi
  - type: GunWieldBonus
    minAngle: -27 # Forge-change -20->-27
    maxAngle: -34 # Forge-change -30->-34
  - type: Gun
    minAngle: 30 # Forge-change 21->30
    maxAngle: 55 # Forge-change 45->55
    angleIncrease: 1.75 # Forge-change 5->1.75
    angleDecay: 20
    fireRate: 8
    projectileSpeed: 45 # Forge-change
    damageModifier: 0.9 # Forge-change
    soundGunshot:
      path: /Audio/_DV/Weapons/Guns/Gunshots/typewriter.ogg
  - type: ChamberMagazineAmmoProvider
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: Magazine45_ACPSubMachineGunFMJ
        insertSound: /Audio/Weapons/Guns/MagIn/hpistol_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/sfrifle_magout.ogg
        priority: 2
        whitelist:
          tags:
            - Magazine45_ACPSubMachineGunFMJ
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        startingItem: Cartridge45_ACPFMJ
        priority: 1
        whitelist:
          tags:
            - Cartridge45_ACPFMJ
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
