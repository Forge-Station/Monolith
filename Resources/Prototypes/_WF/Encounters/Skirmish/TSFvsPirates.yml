# Two sides fighting each other where they meet: a TSF patrol and the pirates it has run down, each ship on its own opponent
# and on the next once that one is beaten. They wait for a player to come within sight before they begin, and nobody here is
# after the players. Whoever helps one side beat the other is paid by it, and the one they helped counts them an ally.
- type: wfEncounter
  id: WFEncounterSkirmishPatrol
  leash: 2500
  name: wf-encounter-name-skirmish-patrol
  announcement: wf-encounter-announce-skirmish-patrol
  announcementSender: wf-encounter-sender-traffic
  start: Scheduled
  category: Threat
  icon: Swords
  cost: 2
  weight: 0.75
  minPlayers: 3
  startRadius: 1800
  cooldown: 3000
  duration: 1800
  minDistance: 2500
  maxDistance: 4500
  stationClearance: 3000
  rewards:
  - side: tsf
    spesos: 28000
    credits: 22
    creditEntity: FederationMilitaryCredit1
    creditCompanies: [ TSF, TSFCivilian ]
    thanks: wf-encounter-reward-thanks-skirmish-tsf
  - side: pirates
    spesos: 18000
    thanks: wf-encounter-reward-thanks-skirmish-pirates
  ships:
  - key: patrol
    navigation: WFCrewNavigationWarship
    vessel: QJ271
    deckhands: 0
    captain: false
    roles: [ WFCrewPilot, WFCrewGunner ]
    side: tsf
    faction: TSFMC
    company: TSF
    profile: WFCrewProfileTsf
    skill: Regular
    evades: false
    iffColor: "#6fb6ff"
    objectives:
    - kind: Attack
      target: raider
    - kind: Attack
      target: wing
  - key: escort
    navigation: WFCrewNavigationWarship
    vessel: QJ271
    deckhands: 0
    captain: false
    roles: [ WFCrewPilot, WFCrewGunner ]
    offset: 160, 0
    side: tsf
    faction: TSFMC
    company: TSF
    profile: WFCrewProfileTsf
    skill: Regular
    evades: false
    objectives:
    - kind: Attack
      target: wing
    - kind: Attack
      target: raider
  - key: raider
    navigation: WFCrewNavigationRaider
    vessels: [ Carrion, Horsefly, Tick, Hazel ]
    deckhands: 0
    captain: false
    roles: [ WFCrewPilot, WFCrewGunner ]
    offset: 0, 550
    side: pirates
    faction: PirateNF
    distress: false
    company: WFAshfallReavers
    profile: WFCrewProfilePirate
    skill: Regular
    evades: false
    iffColor: "#ff5c5c"
    objectives:
    - kind: Attack
      target: patrol
    - kind: Attack
      target: escort
  - key: wing
    navigation: WFCrewNavigationRaider
    vessels: [ Carrion, Horsefly, Tick, Hazel ]
    deckhands: 0
    captain: false
    roles: [ WFCrewPilot, WFCrewGunner ]
    offset: 160, 570
    side: pirates
    faction: PirateNF
    distress: false
    company: WFAshfallReavers
    profile: WFCrewProfilePirate
    skill: Regular
    evades: false
    objectives:
    - kind: Attack
      target: escort
    - kind: Attack
      target: patrol


