        Дополнен перевод аплинков, их товаров и предметов внутри покупаемых
        наборов.
    - type: Add
      message: >-
        Переведены недостающие названия и подсказки способностей, включая
        персональные щиты, ночное зрение, виляние хвостом и герметизацию
        MOD-скафандров.
    - type: Add
      message: >-
        Переведены недостающие названия и описания частей MOD-скафандров,
        кубиков различных видов и блюд из резоми.
    - type: Fix
      message: >-
        Дополнен перевод меню крафта, рецептов и необходимых для строительства
        предметов и материалов.
    - type: Fix
      message: >-
        Переведены интерфейсы подстанции, СМЭСа и генератора гравитации.
        Исправлено наложение подписей в интерфейсе ЛКП.
    - type: Fix
      message: >-
        Дополнен перевод воздушной сигнализации, консоли мониторинга атмосферной
        сети и консоли утилизаторских экспедиций, включая погодные модификаторы
        и биомы.
    - type: Fix
      message: >-
        Дополнены переводы научного оборудования, газодобытчиков и устройств
        автоматизации.
    - type: Fix
      message: >-
        Переведены недостающие кнопки и заголовки интерфейсов, включая
        повторение очереди и пропуск при нехватке материалов в фабрикаторах.
    - type: Fix
      message: >-
        Названия экипировки ТСФ согласованы с текущими должностями, а названия
        оружейных плат и портативных орудий - с основными моделями пушек.
    - type: Fix
      message: >-
        Названия покрытий и напольных решёток в РСУ согласованы с названиями
        тайлов.
    - type: Fix
      message: Дополнены переводы химер и мозгового червя.
    - type: Fix
      message: >-
        Исправлены отсутствующие описания, некорректные ссылки и названия,
        отображавшиеся как технические обозначения прототипов.
