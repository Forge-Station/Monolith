- type: entity
  parent: VendingMachineCredit
  id: WFAsfDrobe
  components:
  - type: VendingMachine
    pack: WFAsfDrobeInventory
    offState: off
    brokenState: broken
    normalState: normal-unshaded
    requiresCash: true
  - type: Advertise
    pack: WFAsfDrobeAds
  - type: Sprite
    sprite: _WF/Asf/Structures/drobe.rsi
    layers:
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.Base"]
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.BaseUnshaded"]
      shader: unshaded
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: AccessReader
    access: [["WFAsf"]]

