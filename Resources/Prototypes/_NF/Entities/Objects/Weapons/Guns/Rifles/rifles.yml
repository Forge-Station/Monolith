# Upstream
- type: entity
  parent: WeaponRifleLecter
  id: WeaponRifleLecterRubber
  suffix: Non-lethal
  components:
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: Magazine68x52mmCaselessRubber
        insertSound: /Audio/Weapons/Guns/MagIn/ltrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/ltrifle_magout.ogg
        priority: 2
        whitelist:
          tags:
            - Magazine68x52mmCaseless
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        startingItem: Cartridge68x52mmCaselessRubber
        priority: 1
        whitelist:
          tags:
            - Cartridge68x52mmCaseless
      # Mono
      attachment_barrel:
        insertSound: /Audio/Items/screwdriver.ogg
        ejectSound: /Audio/Items/screwdriver.ogg
        priority: 0
        whitelist:
          tags:
          - MonoSuppressorMulticalRifle
      # Mono
      attachment_grip:
        insertSound: /Audio/Items/screwdriver2.ogg
        ejectSound: /Audio/Items/screwdriver2.ogg
        priority: 0
        whitelist:
          tags:
          - MonoGripErebusRailmount
      # Mono
      attachment_optic:
        insertSound: /Audio/Items/screwdriver2.ogg
        ejectSound: /Audio/Items/screwdriver2.ogg
        priority: 0
        whitelist:
          tags:
          - MonoOpticErebusRailmount

