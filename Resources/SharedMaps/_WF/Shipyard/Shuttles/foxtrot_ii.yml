        reapply: False
      content: >-
        Esteemed helmsman,


        The Sultan has deemed you and your company fit to field one of the most powerful weapons in the Vanguard, consider it a great honor.


        The Foxtrot-II has a heat signature of roughly 1.8km with it's sterling engines on, and can be lowered further by reducing their output.


        The batteries will last 17 minutes on a full charge.


        Uranium generators should only be used to charge the batteries while not underway, as they will greatly reduce stealth capability.


        Good hunting. Piety to the Sultan.
