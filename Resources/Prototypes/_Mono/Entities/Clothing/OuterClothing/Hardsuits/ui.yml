- type: entity
  parent: [ ClothingOuterHardsuitBase, BaseC3SyndicateContrabandT2 ]
  id: ClothingOuterHardsuitUIEnforcer
  name: U.I. ENFORCER combat tacsuit
  description: Infamously one of the most reliable combat tacsuits the black market has to offer, developed by Ullman Industries. "Heads-up display sold separately!" # WOLFGATE(ArmorBalance): grammar pass.
  components:
  # WOLFGATE(ArmorSpecialization): insulation.
  - type: WFWoundWard
    examine: wf-armor-spec-insulation-examine
    blocks:
    - WFWolfmedInternalBurnWound
    - WFWolfmedShortCircuitWound
  - type: Sprite
    sprite: _Mono/Clothing/OuterClothing/Hardsuits/ullman_industries_enforcer.rsi
  - type: Clothing
    sprite: _Mono/Clothing/OuterClothing/Hardsuits/ullman_industries_enforcer.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.5
    lowPressureMultiplier: 1000
  - type: ExplosionResistance
    damageCoefficient: 0.65
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.5
        Slash: 0.45
        Piercing: 0.40
        Heat: 0.65
        Radiation: 0.65
        Caustic: 0.65
  - type: ClothingSpeedModifier
    walkModifier: 0.85
    sprintModifier: 0.825
  - type: HeldSpeedModifier
  - type: ToggleableClothing # Goobstation - Modsuits change - Mono - this is a solution for helmet attachment/cover to not fit on hardsuits
    requiredSlot: outerclothing
    blockUnequipWhenAttached: false
    replaceCurrentClothing: true
    clothingPrototypes:
      head: ClothingHelmetHardsuitUIEnforcer
      helmetcover: ClothingHeadHelmetCoverBlock
      helmetattachment: ClothingHeadHelmetAttachmentBlock
  - type: StaminaDamageResistance
    coefficient: 0.55

- type: entity
  parent: [ ClothingOuterHardsuitBaseNoPlateholder, MonoEnergyShieldClothing, BaseC3SyndicateContrabandT3 ]
  id: ClothingOuterHardsuitUIEnforcerMKII
  name: U.I. ENFORCER MKII combat tacsuit
  description: Based on the infamous MKI design, with versatility in mind. This is Ullman Industries' top-of-the-line combat suit. Whether it be slipping away from the feds, taking out the competition, or serving your corporate overlords, this marvel of engineering will make sure that you get it done. # WOLFGATE(ArmorBalance): grammar pass.
  components:
  - type: Sprite
    sprite: _Mono/Clothing/OuterClothing/Hardsuits/ullman_industries_enforcermkii.rsi
  - type: Clothing
    sprite: _Mono/Clothing/OuterClothing/Hardsuits/ullman_industries_enforcermkii.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.5
    lowPressureMultiplier: 1000
  - type: ExplosionResistance
    damageCoefficient: 0.5
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.7
        Slash: 0.75
        Piercing: 0.6
        Heat: 0.5
        Radiation: 0.6
        Caustic: 0.7
  - type: WFSoftShield # WOLFGATE(SoftShield): hard shields are retired; brute damage bleeds through the field dampened.
  - type: PersonalShield
    shield:
      maxCharge: 300
      regenRate: 6
      spinupTime: 1
      breakCooldown: 30
      powerDraw: 0.5
  - type: Battery
    maxCharge: 60
    startingCharge: 60
  - type: BatterySelfRecharger
    autoRecharge: true
    autoRechargeRate: 0.1
  - type: ClothingSpeedModifier
    walkModifier: 1
    sprintModifier: 0.65 # SIX FIVE SIX FIVE!!
  - type: HeldSpeedModifier
  - type: ToggleableClothing # Goobstation - Modsuits change - Mono - this is a solution for helmet attachment/cover to not fit on hardsuits
    requiredSlot: outerclothing
    blockUnequipWhenAttached: false
    replaceCurrentClothing: true
    clothingPrototypes:
      head: ClothingHelmetHardsuitUIEnforcerMKII # Ullman Enforcer MKII helmet
      helmetcover: ClothingHeadHelmetCoverBlock
      helmetattachment: ClothingHeadHelmetAttachmentBlock
  - type: StaminaDamageResistance
    coefficient: 0.45
  - type: ExtendDescription
    descriptionList:
    - description: Alt-click or otherwise interact to toggle additional shielding.
      color: "#4f94ad"
      requireDetailRange: true

