# Typical anatomy per species group, offered by the creator's preset menu and used to seed a newly included organ.
# Never applied automatically. Colours are not stored here: GenitalColorDefaults applies them when a preset is used.
# Every roundstart species except the excluded ones must be listed exactly once (GenitalPresetTest).

- type: genitalPreset
  id: GenitalPresetDefault
  fallback: true
  explicitFallback: [ Human, Dwarf, Goblin, Oni, Diona, SlimePerson, Synth, Protogen, ProtoHumie, ProtoKin, ProtoDawi, ProtoDionae, ProtoSlimePerson, ProtoThaven, Thaven, Shadekin ]
  male:
    penis: { shape: GenitalShapePenisHuman, lengthCm: 15 }
    testicles: { type: External, size: 2 }
  female:
    vagina: { shape: GenitalShapeVaginaHuman }
    womb: true
    breasts: { shape: GenitalShapeBreastsPair, cup: 3 }

