# Wolfgate: ported from HardLight
- type: marking
  id: VulpTailVulp
  bodyPart: Tail
  markingCategory: Tail
  speciesRestriction: [Vulpkanin, Canine]
  layering: # WOLFGATE - the south frame draws behind the body, so the tail never covers anatomy
    vulp_BEHIND: TailBehind
    vulp-tip_BEHIND: TailBehind
  colorLinks: # WOLFGATE - both halves of a tail share one colour
    vulp_BEHIND: vulp_FRONT
    vulp-tip_BEHIND: vulp-tip_FRONT
  sprites:
    - sprite: _WF/Mobs/Customization/TailSplit/Mobs/Customization/Vulpkanin/tail_markings.rsi # WOLFGATE - split art
      state: vulp_FRONT
    - sprite: _WF/Mobs/Customization/TailSplit/Mobs/Customization/Vulpkanin/tail_markings.rsi # WOLFGATE - split art
      state: vulp-tip_FRONT
    - sprite: _WF/Mobs/Customization/TailSplit/Mobs/Customization/Vulpkanin/tail_markings.rsi # WOLFGATE - south frame on TailBehind
      state: vulp_BEHIND
    - sprite: _WF/Mobs/Customization/TailSplit/Mobs/Customization/Vulpkanin/tail_markings.rsi # WOLFGATE - south frame on TailBehind
      state: vulp-tip_BEHIND

