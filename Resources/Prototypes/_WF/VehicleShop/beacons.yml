# Vehicle delivery beacons: use one in hand to set it down, and ten seconds later it opens into its vehicle where it
# lies, if nothing solid is in the way, with the key handed to whoever set it off. Each sells at its catalogue's listing
# (WFVehicleBeaconSystem) and resells for what the vehicle would fetch at a terminal's pad.

- type: entity
  parent: BaseItem
  id: WFVehicleBeaconBase
  abstract: true
  name: vehicle delivery beacon
  description: A vehicle packed down into a crate-sized beacon. Set it down somewhere open and stand back.
  components:
  - type: Item
    size: Normal
  - type: Sprite
    sprite: Objects/Tools/thief_beacon.rsi
    noRot: true
    layers:
    - state: folded_extraction
      map: [ "beacon" ]
    - state: extraction_point_light
      map: [ "light" ]
      shader: unshaded
      visible: false
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.WFVehicleBeaconVisuals.Armed:
        beacon:
          True: { state: extraction_point }
          False: { state: folded_extraction }
        light:
          True: { visible: true }
          False: { visible: false }

- type: entity
  parent: WFVehicleBeaconBase
  id: WFVehicleBeaconATV
  name: vehicle delivery beacon (ATV)
  components:
  - type: WFVehicleBeacon
    vehicle: VehicleATVNF
    catalog: WFVehicleCatalogMechanic
    key: VehicleKeyATV

