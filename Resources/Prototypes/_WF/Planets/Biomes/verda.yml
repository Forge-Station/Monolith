# A conifer stand inside the woodland: pines and ferns, over the same dark grass.
- type: biomeTemplate
  id: WFVerdaPineGrove
  layers:
  - !type:BiomeEntityLayer
    allowedTiles: [FloorPlanetGrass, WFFloorVerdaForestGrass]
    entities: [AuroraAssunzioneBushFerny, CoyoteFloraTallgrass4]
    threshold: 0.75
    noise: { seed: 217, noiseType: OpenSimplex2, frequency: 4 }
  - !type:BiomeEntityLayer
    allowedTiles: [FloorPlanetGrass, WFFloorVerdaForestGrass]
    entities: [CoyoteFloraTreeMedPine, DarkPackTreeVampPine]
    threshold: 0.58
    noise: { seed: 218, noiseType: OpenSimplex2, frequency: 2 }
  - !type:BiomeEntityLayer
    allowedTiles: [FloorPlanetGrass, WFFloorVerdaForestGrass]
    entities: [CoyoteFloraTreeCypressTree, DarkPackTreeVampPine]
    threshold: 0.8
    noise: { seed: 219, noiseType: OpenSimplex2, frequency: 2 }

# Lake shores, laid over the plains where the lake's own noise (biomes.yml) runs just under the water's threshold.
# The tile layers repeat that noise, so each ring follows the water: marsh, mud, wet sand.
- type: biomeTemplate
  id: WFVerdaShore
  layers:
  - !type:BiomeTileLayer
    tile: WFFloorVerdaMarshGrass
    threshold: -1
  - !type:BiomeTileLayer
    tile: WFFloorVerdaMarshMud
    threshold: 0.68
    noise: { seed: 71, noiseType: OpenSimplex2, frequency: 0.012, fractalType: FBm, octaves: 2, lacunarity: 2 }
  - !type:BiomeTileLayer
    tile: WFFloorVerdaShoreSand
    threshold: 0.73
    noise: { seed: 71, noiseType: OpenSimplex2, frequency: 0.012, fractalType: FBm, octaves: 2, lacunarity: 2 }
  # Frogs and crabs (Planets/Life/verda_mobs.yml).
  - !type:BiomeEntityLayer
    allowedTiles: [WFFloorVerdaMarshGrass, WFFloorVerdaMarshMud, WFFloorVerdaShoreSand]
    entities: [WFFaunaVerdaShore]
    threshold: 0.95
    noise: { seed: 37, noiseType: OpenSimplex2, frequency: 3 }
  # Marsh: tall grass and the odd bush and drowned tree.
  - !type:BiomeEntityLayer
    allowedTiles: [WFFloorVerdaMarshGrass]
    entities: [CoyoteFloraTallgrass3, CoyoteFloraTallgrass9]
    threshold: 0.62
    noise: { seed: 220, noiseType: OpenSimplex2, frequency: 4 }
  - !type:BiomeEntityLayer
    allowedTiles: [WFFloorVerdaMarshGrass]
    entities: [CoyoteFloraTallgrass4, CoyoteFloraTallgrass5]
    threshold: 0.62
    noise: { seed: 221, noiseType: OpenSimplex2, frequency: 4 }
  - !type:BiomeEntityLayer
    allowedTiles: [WFFloorVerdaMarshGrass]
    entities: [GoonShrub, AuroraFloraBushGrove]
    threshold: 0.85
    noise: { seed: 222, noiseType: OpenSimplex2, frequency: 3 }
  - !type:BiomeEntityLayer
    allowedTiles: [WFFloorVerdaMarshGrass]
    entities: [CoyoteFloraTreeCypressTree, NebulaTreeDeadYew]
    threshold: 0.9
    noise: { seed: 223, noiseType: OpenSimplex2, frequency: 2 }
  # Reeds and lilies at the waterline.
  - !type:BiomeEntityLayer
    allowedTiles: [WFFloorVerdaMarshMud, WFFloorVerdaShoreSand]
    entities: [AuroraFloraBushKonyangReeds, CoyoteFloraTallgrass9]
    threshold: 0.5
    noise: { seed: 224, noiseType: OpenSimplex2, frequency: 3 }
  - !type:BiomeEntityLayer
    allowedTiles: [WFFloorVerdaMarshMud, WFFloorVerdaShoreSand]
    entities: [AuroraAssunzioneGrassAlt, AuroraFloraBushKonyangReeds]
    threshold: 0.68
    noise: { seed: 225, noiseType: OpenSimplex2, frequency: 3 }
  - !type:BiomeEntityLayer
    allowedTiles: [WFFloorVerdaMarshMud]
    entities: [VoreFloraLily1, VoreFloraLily2]
    threshold: 0.7
    noise: { seed: 226, noiseType: OpenSimplex2, frequency: 4 }
  - !type:BiomeEntityLayer
    allowedTiles: [WFFloorVerdaMarshMud]
    entities: [VoreFloraLily3, GoonFakeobjectLotus]
    threshold: 0.8
    noise: { seed: 227, noiseType: OpenSimplex2, frequency: 4 }
  # Reeds to cut, a lotus to eat, shore sage to heal with (Planets/Life/verda.yml).
  - !type:BiomeEntityLayer
    allowedTiles: [WFFloorVerdaMarshMud, WFFloorVerdaShoreSand]
    entities: [WFVerdaPlantReeds]
    threshold: 0.9
    noise: { seed: 301, noiseType: OpenSimplex2, frequency: 3 }
  - !type:BiomeEntityLayer
    allowedTiles: [WFFloorVerdaMarshMud]
    entities: [WFVerdaPlantLotus]
    threshold: 0.91
    noise: { seed: 302, noiseType: OpenSimplex2, frequency: 4 }
  - !type:BiomeEntityLayer
    allowedTiles: [WFFloorVerdaMarshMud, WFFloorVerdaShoreSand]
    entities: [WFVerdaPlantShoreSage]
    threshold: 0.91
    noise: { seed: 303, noiseType: OpenSimplex2, frequency: 4 }

