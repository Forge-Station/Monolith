    state: not_enough_oxy
  name: alerts-wolfmed-cant-breathe-lungs-name
  description: alerts-wolfmed-cant-breathe-lungs-desc

# Playtest 4, VISUALS: the pain HUD. Severity is effective body pain against the soft cap, 0 to 7, and 8 (paindd)
# while a pain faint holds the body; WolfmedPainAlertSystem drives it and hides it at or under wolfmed.pain_hud_from.
# A category of its own, so it never replaces the health doll. A machine gets the same icons with sensor wording.

- type: alertCategory
  id: WFWolfmedPain

