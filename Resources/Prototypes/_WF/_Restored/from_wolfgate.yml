# Avali stabilizer. The injector names this reagent directly.
- type: reagent
  id: Amoxla
  name: reagent-name-amoxla
  group: Medicine
  desc: reagent-desc-amoxla
  physicalDesc: reagent-physical-desc-opaque
  flavor: medicine
  color: "#51c38c"
  metabolisms:
    Medicine:
      effects:
      - !type:HealthChange
        conditions:
        - !type:OrganType
          type: Avali
          shouldHave: true
        damage:
          types:
            Asphyxiation: -3.5
            Bloodloss: -3
      - !type:ModifyBloodLevel
        conditions:
        - !type:OrganType
          type: Avali
          shouldHave: true
        amount: 3
      - !type:AdjustReagent
        conditions:
        - !type:ReagentThreshold
          reagent: HeartbreakerToxin
          min: 1
        reagent: HeartbreakerToxin
        amount: -3
      - !type:HealthChange
        conditions:
        - !type:ReagentThreshold
          min: 25
        damage:
          types:
            Asphyxiation: 5
            Cold: 3
      - !type:HealthChange
        conditions:
        - !type:OrganType
          type: Avali
          shouldHave: false
        damage:
          types:
            Poison: 1.5
            Asphyxiation: 1
            Bloodloss: 0.5

- type: reaction
  id: Amoxla
  impact: Medium
  minTemp: 540
  reactants:
    Ammonia:
      amount: 1
    Carbon:
      amount: 1
    Iron:
      amount: 1
  products:
    Amoxla: 2

# Signal flares carried in the extended vapor survival box.
- type: Tag
  id: SignalFlareLaunchable

- type: entity
  name: signal flare
  categories: [ HideSpawnMenu ]
  parent: BaseItem
  id: BaseSignalFlare
  description: A flare that produces a very bright light and an IFF signal for a short while, used for communications in high-intensity situations.
  components:
  - type: Sprite
    sprite: Objects/Misc/flare.rsi
    layers:
    - map: [ enum.ExpendableLightVisualLayers.Base ]
      state: flare_base
    - map: [ enum.ExpendableLightVisualLayers.Glow ]
      state: flare_burn
      color: "#FFFFFF"
      visible: false
      shader: unshaded
    - map: [ enum.ExpendableLightVisualLayers.Overlay ]
      state: flare_unlit
      color: "#FF0000"
  - type: Icon
    sprite: Objects/Misc/flare.rsi
    state: icon
  - type: Item
    sprite: Objects/Misc/flare.rsi
    heldPrefix: unlit
    size: Tiny
  - type: Tag
    tags:
    - SignalFlareLaunchable
  - type: CartridgeAmmo
    proto: SignalFlareGreenActivated
    deleteOnSpawn: true
  - type: ExtendDescription
    descriptionList:
    - description: Usage requires a dedicated flare launcher.
      color: "#4f94ad"
      requireDetailRange: true

- type: entity
  name: signal flare
  categories: [ HideSpawnMenu ]
  parent: Flare
  id: BaseSignalFlareActivated
  description: A flare that produces a very bright light and an IFF signal for a short while, used for communications in high-intensity situations.
  components:
  - type: ExpendableLight
    activateOnSpawn: true
    spentName: expendable-light-spent-flare-name
    spentDesc: expendable-light-spent-flare-desc
    glowDuration: 225
    fadeOutDuration: 15
    iconStateOn: flare_unlit
    iconStateSpent: flare_spent
    turnOnBehaviourID: turn_on
    fadeOutBehaviourID: fade_out
    litSound:
      path: /Audio/Items/Flare/flare_on.ogg
    loopedSound:
      path: /Audio/Items/Flare/flare_burn.ogg
      params:
        loop: true
        volume: -10
        maxDistance: 5
  - type: Sprite
    sprite: Objects/Misc/flare.rsi
    layers:
    - map: [ enum.ExpendableLightVisualLayers.Base ]
      state: flare_base
    - map: [ enum.ExpendableLightVisualLayers.Glow ]
      state: flare_burn
      color: "#FFFFFF"
      visible: false
      shader: unshaded
    - map: [ enum.ExpendableLightVisualLayers.Overlay ]
      state: flare_unlit
      color: "#FF0000"
  - type: Icon
    sprite: Objects/Misc/flare.rsi
    state: icon
  - type: Item
    sprite: Objects/Misc/flare.rsi
    heldPrefix: unlit
    size: Tiny
  - type: PointLight
    enabled: false
    color: "#FF8080"
