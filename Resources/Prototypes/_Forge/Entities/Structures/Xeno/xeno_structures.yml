    mode: NoSprite
  - type: SpeedModifierContacts
    walkSpeedModifier: 1.35
    sprintSpeedModifier: 1.35

- type: entity
  parent: XenoWeeds
  id: XenoResinSpikes
  name: resin spikes
  description: Jagged resin thorns. Walking onto them is a mistake.
  suffix: Forge, Xeno, CM
  components:
  - type: Sprite
    drawdepth: FloorObjects
    sprite: _CM/Structures/Xenos/xeno_resin_spikes.rsi
    state: resin_spike
  - type: Icon
