# Carcinoma: flesh
- type: dungeonConfig
  id: WFPoiCarcinomaRuin
  data:
    colors:
      Decals: "#6b1a2aff"
    entities:
      Walls: WallRock
    spawnGroups:
      Entrance: NFBaseAirlock
    tiles:
      FallbackTile: FloorFlesh
    whitelists:
      Rooms:
        tags:
        - NFMineshaft
  layers:
  # NFHaunted's cave recipe, with entrances generated before the surrounding rock seals it.
  - !type:PrefabDunGen
    presets:
    - Bucket
    - Wow
    - SpaceShip
    - Tall
  - !type:WormCorridorDunGen
    width: 3
  - !type:CorridorClutterDunGen
    contents:
    - id: FloraStalagmite
  - !type:DungeonEntranceDunGen
    count: 2
  - !type:BoundaryWallDunGen
  - !type:EntityTableDunGen
    minCount: 3
    maxCount: 6
    table: !type:NestedSelector
      tableId: SalvageTreasureSpawnerValuable
  - !type:MobsDunGen
    minCount: 3
    maxCount: 6
    groups:
    - id: MobArgocyteSwiper
      amount: 1
    - id: MobArgocyteBarrier
      amount: 1
