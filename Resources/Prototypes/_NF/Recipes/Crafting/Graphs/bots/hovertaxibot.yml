- type: constructionGraph
  id: HoverTaxiBot
  start: start
  graph:
  - node: start
    edges:
    - to: bot
      steps:
      - tag: ProximitySensor
        icon:
          sprite: Objects/Misc/proximity_sensor.rsi
          state: icon
        name: construction-required-proximity-sensor # Forge-change
      - tag: BorgHead
        icon:
          sprite: Objects/Specific/Robotics/cyborg_parts.rsi
          state: borg_head
        name: construction-required-borg-head # Forge-change
        doAfter: 1
      - tag: BorgArm
        icon:
          sprite: Mobs/Silicon/drone.rsi
          state: l_hand
        name: construction-required-borg-arm # Forge-change
        doAfter: 2
      - tag: SmallThrusterMachineCircuitboard
        icon:
          sprite: Objects/Misc/module.rsi
          state: generic
        name: construction-required-small-thruster-machine-board # Forge-change
        doAfter: 2
      - material: Steel
        amount: 10
  - node: bot
    entity: MobHoverTaxiBot
