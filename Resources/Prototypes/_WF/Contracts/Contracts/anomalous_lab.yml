      count: 5, 10

- type: wfContract
  id: WFContractLabExoticOre
  contractor: WFContractorAnomalousLab
  category: Mining
  tier: 3
  title: wf-contract-lab-exotic-ore
  briefing: wf-contract-lab-exotic-ore-brief
  reward: 30000, 40000
  deposit: 3000
  minutes: 60
  crewBonus: 0.5
  weight: 0.8
  harms:
    WFContractorMMC: 1
  objective: !type:WFContractSupply
    premium: 2
    goods:
    - stack: BluespaceOre
      count: 4, 8
    - stack: DiamondOre
      count: 3, 6

- type: wfContract
  id: WFContractLabAnomalySample
  contractor: WFContractorAnomalousLab
  category: Salvage
  tier: 2
  title: wf-contract-lab-anomaly-sample
  briefing: wf-contract-lab-anomaly-sample-brief
  reward: 20000, 25000
  deposit: 1000
  minutes: 55
  crewBonus: 0.25
  weight: 1.2
  objective: !type:WFContractRecovery
    item: WFContractAnomalySample
    minDistance: 3500
    maxDistance: 5500
    infestation:
    - entity: MobFleshClampSalvage
      count: 1, 3
    wrecks:
    - /Maps/Salvage/small-a-1.yml
    - /Maps/Salvage/engineering-chunk.yml
    - /Maps/Salvage/small-ai-survey-drone.yml
    - /Maps/Salvage/medium-ruined-emergency-shuttle.yml

# Science: anomaly surveys aboard derelicts, scanned with an anomaly scanner before they collapse.

- type: wfContract
  id: WFContractLabSurvey
  contractor: WFContractorAnomalousLab
  category: Science
  tier: 1
  title: wf-contract-lab-survey
  briefing: wf-contract-lab-survey-brief
  reward: 8000, 11000
  minutes: 45
  crewBonus: 0.25
  weight: 2
  objective: !type:WFContractSurvey
    count: 1, 2
    perAnomaly: 2500
    minDistance: 2500
    maxDistance: 4000
    stationClearance: 2000
    anomalies: [ AnomalyGravity, AnomalyElectricity, AnomalyIce, AnomalyFlora, AnomalyBluespace ]
    wrecks:
    - /Maps/Salvage/small-1.yml
    - /Maps/Salvage/small-2.yml
    - /Maps/Salvage/small-3.yml
    - /Maps/Salvage/small-ai-survey-drone.yml
    - /Maps/Salvage/medium-crashed-shuttle.yml

- type: wfContract
  id: WFContractLabInfestedHulk
  contractor: WFContractorAnomalousLab
  category: Science
  tier: 2
  title: wf-contract-lab-infested-hulk
  briefing: wf-contract-lab-infested-hulk-brief
  reward: 22000, 28000
  deposit: 1500
  minutes: 60
  minCrew: 2
  crewBonus: 0.35
  weight: 1.5
  objective: !type:WFContractSurvey
    count: 2, 3
    perAnomaly: 4000
    minDistance: 3500
    maxDistance: 5500
    anomalies: [ AnomalyFlesh, AnomalyFlesh, AnomalyLiquid, AnomalyShadow, AnomalyPyroclastic ]
