# Felinid Tails
# Goobstation - Tajaran since they're fully compatible

- type: marking
  id: FelinidTailBasic
  bodyPart: Tail
  markingCategory: Tail
  speciesRestriction: [Felinid, Tajaran, Human, ProtoFeline] # Goobstation - Tajaran
  layering: # WOLFGATE - the south frame draws behind the body, so the tail never covers anatomy
    basic_tail_tip_BEHIND: TailBehind
  colorLinks: # WOLFGATE - both halves of a tail share one colour
    basic_tail_tip_BEHIND: basic_tail_tip_FRONT
  sprites:
  - sprite: _WF/Mobs/Customization/TailSplit/Nyanotrasen/Mobs/Customization/felinid_tails.rsi # WOLFGATE - split art
    state: basic_tail_tip_FRONT
  - sprite: Nyanotrasen/Mobs/Customization/felinid_tails.rsi
    state: basic_tail_stripes_even
  - sprite: Nyanotrasen/Mobs/Customization/felinid_tails.rsi
    state: basic_tail_stripes_odd
  - sprite: _WF/Mobs/Customization/TailSplit/Nyanotrasen/Mobs/Customization/felinid_tails.rsi # WOLFGATE - south frame on TailBehind
    state: basic_tail_tip_BEHIND

