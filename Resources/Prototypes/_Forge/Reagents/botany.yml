- type: reagent
  id: PhytoAether
  name: reagent-name-phyto-aether
  group: Botanical
  desc: reagent-desc-phyto-aether
  flavor: bitter
  color: "#7b4dff"
  physicalDesc: reagent-physical-desc-glowing
  metabolisms:
    Medicine:
      metabolismRate: 0.2
      effects:
      - !type:GenericStatusEffect
        key: Stun
        time: 0.4
        type: Remove
      - !type:MovespeedModifier
        walkSpeedModifier: 1.1
        sprintSpeedModifier: 1.15
        statusLifetime: 2
    Poison:
      effects:
      - !type:HealthChange
        damage:
          types:
            Asphyxiation: 0.4
        conditions:
        - !type:ReagentThreshold
          min: 20
  plantMetabolism:
  - !type:PlantAdjustMutationLevel
    amount: 2
  - !type:PlantAdjustNutrition
    amount: 0.2

