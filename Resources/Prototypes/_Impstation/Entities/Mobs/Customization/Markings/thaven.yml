- type: marking
  id: ThavenTailEel
  bodyPart: Tail
  markingCategory: Tail
  speciesRestriction: [ Thaven, ProtoThaven ]
  forcedColoring: false
  followSkinColor: true
  layering: # WOLFGATE - the south frame draws behind the body, so the tail never covers anatomy
    taileel1_BEHIND: TailBehind
    taileel2_BEHIND: TailBehind
  colorLinks: # WOLFGATE - both halves of a tail share one colour
    taileel1_BEHIND: taileel1_FRONT
    taileel2_BEHIND: taileel2_FRONT
  sprites:
  - sprite: _WF/Mobs/Customization/TailSplit/_Impstation/Mobs/Customization/thaven/thaven.rsi # WOLFGATE - split art
    state: taileel1_FRONT
  - sprite: _WF/Mobs/Customization/TailSplit/_Impstation/Mobs/Customization/thaven/thaven.rsi # WOLFGATE - split art
    state: taileel2_FRONT
  - sprite: _WF/Mobs/Customization/TailSplit/_Impstation/Mobs/Customization/thaven/thaven.rsi # WOLFGATE - south frame on TailBehind
    state: taileel1_BEHIND
  - sprite: _WF/Mobs/Customization/TailSplit/_Impstation/Mobs/Customization/thaven/thaven.rsi # WOLFGATE - south frame on TailBehind
    state: taileel2_BEHIND

- type: marking
