# The contract board and everything its contracts put in the world.

- type: entity
  parent: BaseStructure
  id: WFContractBoard
  name: contract board
  description: The sector's open contract exchange. Deliveries, hauling, supply, mining, bounties, salvage, science and escorts, posted by every station that pays.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: Structures/Machines/computers.rsi
    layers:
    - state: computer
    - state: generic_keyboard
    - state: bounty
      shader: unshaded
    - state: tech_key
      shader: unshaded
  - type: Icon
    sprite: Structures/Machines/computers.rsi
    state: computer
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.35,-0.35,0.35,0.35"
        density: 200
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: ActivatableUI
    key: enum.WFContractBoardUiKey.Key
    requireActiveHand: false
  - type: UserInterface
    interfaces:
      enum.WFContractBoardUiKey.Key:
        type: WFContractBoardBoundUserInterface
  - type: WFContractBoard
  - type: GuideHelp
    guides:
    - WFContracts
  - type: PointLight
    radius: 1.5
    energy: 1.6
    color: "#b89f25"
    lightMask: ConeSingle
    autoRot: true
    offset: "0, 0.4"
    castShadows: false
  - type: EmitSoundOnUIOpen
    sound:
      collection: Keyboard
      params:
        volume: -1
        variation: 0.10
        pitch: 1.10

- type: entity
  parent: WFContractBoard
  id: WFContractBoardTSF
  name: TSF requisitions board
  description: "Naval requisitions for Federation personnel and civilians: patrols, war materiel and convoys, paid in thalers and Federation credits."
  components:
  - type: Sprite
    sprite: Structures/Machines/computers.rsi
    layers:
    - state: computer
    - state: generic_keyboard
    - state: security
      shader: unshaded
    - state: security_key
      shader: unshaded
  - type: WFContractBoard
    board: TSF
  - type: PointLight
    color: "#6fb6ff"

