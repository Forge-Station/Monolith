- type: entity
  id: BaseMagazineUllman135x110mm
  name: "magazine (13.5x110mm)"
  parent: [ BaseItem ]
  abstract: true
  components:
  - type: Tag
    tags:
    - ForgeMagazineUllman135x110mm
  - type: Item
    size: Small
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
      - Cartridge135x110mm
    proto: Cartridge135x110mm
    capacity: 5
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: _Forge/Objects/Weapons/Guns/Ammunition/Magazine/sniper_rifle_mag.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false
  - type: Appearance

- type: entity
  id: ForgeMagazineUllman135x110mmEmpty
  name: "magazine (13.5x110mm empty)"
  parent: BaseMagazineUllman135x110mm
  components:
  - type: BallisticAmmoProvider
    proto: null

- type: entity
  id: ForgeMagazineUllman135x110mm
  name: "magazine (13.5x110mm)"
  parent: BaseMagazineUllman135x110mm
  components:
  - type: BallisticAmmoProvider
    proto: Cartridge135x110mm

- type: entity
  id: ForgeMagazineUllman135x110mmHE
  name: "magazine (13.5x110mm HE)"
  parent: BaseMagazineUllman135x110mm
  components:
  - type: BallisticAmmoProvider
    proto: Cartridge135x110mmHE
