# Merak: the Sandstone Galleries. Sand tunnels between wide pillared sandstone halls lit amber by lamp agaves, with
# buried prospectors' camps, fossil beds and the richest gold.
# Layers run last to first and the first match wins. Rock walls only stand on sand; the hall pillars are placed on
# purpose.

- type: biomeTemplate
  id: WFCavernBiomeMerak
  layers:
  # Substrate and tunnel floor.
  - !type:BiomeTileLayer
    tile: WFCavernFloorSand
    threshold: -1
  # Tunnel litter, lowest priority.
  - !type:BiomeEntityLayer
    allowedTiles: [WFCavernFloorSand]
    entities: [FloraRockSolid]
    threshold: 0.985
    noise: { seed: 31, noiseType: OpenSimplex2, frequency: 1 }
  # Lamp agaves along the tunnels.
  - !type:BiomeEntityLayer
    allowedTiles: [WFCavernFloorSand]
    entities: [WFCavernLampAgave]
    threshold: 0.94
    noise: { seed: 32, noiseType: OpenSimplex2, frequency: 1 }
  # Rock wherever ridged noise is at most the tunnel threshold; the tunnels are the ridges.
  - !type:BiomeMetaLayer
    template: WFCavernRockMerak
    invert: true
    threshold: -0.5
    noise: { seed: 7, noiseType: OpenSimplex2, fractalType: Ridged, octaves: 1, frequency: 0.03 }
  # Pillared halls on the web.
  - !type:BiomeMetaLayer
    template: WFCavernChamberMerak
    threshold: 0.2
    noise: { seed: 101, noiseType: OpenSimplex2, fractalType: FBm, octaves: 2, frequency: 0.02 }

- type: biomeTemplate
  id: WFCavernRockMerak
  layers:
  - !type:BiomeEntityLayer
    allowedTiles: [WFCavernFloorSand]
    entities: [WallRockSand]
    threshold: -1
  # Common.
  - !type:BiomeEntityLayer
    allowedTiles: [WFCavernFloorSand]
    entities: [WallRockSandTin, WallRockSandQuartz]
    threshold: 0.7
    noise: { seed: 201, noiseType: OpenSimplex2, frequency: 0.09 }
  # Uncommon.
  - !type:BiomeEntityLayer
    allowedTiles: [WFCavernFloorSand]
    entities: [WallRockSandCopper, WallRockSandSalt]
    threshold: 0.8
    noise: { seed: 202, noiseType: OpenSimplex2, frequency: 0.09 }
  # Gold, richer than anywhere else.
  - !type:BiomeEntityLayer
    allowedTiles: [WFCavernFloorSand]
    entities: [WallRockSandGold]
    threshold: 0.86
    noise: { seed: 206, noiseType: OpenSimplex2, frequency: 0.09 }
  # Rare.
  - !type:BiomeEntityLayer
    allowedTiles: [WFCavernFloorSand]
    entities: [WallRockSandSilver]
    threshold: 0.88
    noise: { seed: 203, noiseType: OpenSimplex2, frequency: 0.09 }
  # Very rare.
  - !type:BiomeEntityLayer
    allowedTiles: [WFCavernFloorSand]
    entities: [WallRockSandDiamond]
    threshold: 0.95
    noise: { seed: 204, noiseType: OpenSimplex2, frequency: 0.2 }
  # Fossil beds.
  - !type:BiomeEntityLayer
    allowedTiles: [WFCavernFloorSand]
    entities: [WallRockSandArtifactFragment]
    threshold: 0.88
    noise: { seed: 207, noiseType: OpenSimplex2, frequency: 0.05 }
  # Gold crabs wait in the rock.
  - !type:BiomeEntityLayer
    allowedTiles: [WFCavernFloorSand]
    entities: [WallRockSandGoldCrabNF]
    threshold: 0.96
    noise: { seed: 205, noiseType: OpenSimplex2, frequency: 0.2 }

- type: biomeTemplate
  id: WFCavernChamberMerak
  layers:
  - !type:BiomeTileLayer
    tile: WFCavernFloorSandstone
    threshold: -1
  - !type:BiomeEntityLayer
    allowedTiles: [WFCavernFloorSandstone]
    entities: [CrystalOrange, CrystalPink]
    threshold: 0.992
    noise: { seed: 304, noiseType: OpenSimplex2, frequency: 1 }
  - !type:BiomeEntityLayer
    allowedTiles: [WFCavernFloorSandstone]
    entities: [WFCavernFaunaMerak]
    threshold: 0.95
    noise: { seed: 37, noiseType: OpenSimplex2, frequency: 3 }
  - !type:BiomeEntityLayer
    allowedTiles: [WFCavernFloorSandstone]
    entities: [WFCavernLampAgave]
    threshold: 0.955
    noise: { seed: 317, noiseType: OpenSimplex2, frequency: 1 }
  # Single-tile pillars hold up the halls.
  - !type:BiomeEntityLayer
    allowedTiles: [WFCavernFloorSandstone]
    entities: [WallRockSand]
    threshold: 0.84
    noise: { seed: 306, noiseType: OpenSimplex2, frequency: 0.35 }
  # Buried camps, a few tiles across.
  - !type:BiomeMetaLayer
    template: WFCavernSignatureMerak
    threshold: 0.9
    noise: { seed: 57, noiseType: OpenSimplex2, frequency: 0.05 }

# What is left of lost prospectors.
- type: biomeTemplate
  id: WFCavernSignatureMerak
  layers:
  - !type:BiomeEntityLayer
    allowedTiles: [WFCavernFloorSandstone]
    entities: [SalvageSpawnerScrapValuable]
    threshold: 0.6
    noise: { seed: 307, noiseType: OpenSimplex2, frequency: 1 }
  - !type:BiomeEntityLayer
    allowedTiles: [WFCavernFloorSandstone]
    entities: [SalvageHumanCorpseSpawner]
    threshold: 0.75
    noise: { seed: 308, noiseType: OpenSimplex2, frequency: 1 }
