# region Company
- type: entity
  parent: ClothingHandsGlovesCaptain
  id: ClothingHandsGlovesCombatNexus
  name: nexus security combat gloves
  description: High-quality combat gloves made for Nexus security forces.
  suffix: Нексус
  components:
  - type: Sprite
    sprite: Forge/Clothing/Hands/Gloves/nexus_gloves.rsi
  - type: Clothing
    sprite: Forge/Clothing/Hands/Gloves/nexus_gloves.rsi
  - type: Insulated

- type: entity
  parent: [ClothingHandsGlovesSyntheticBase, BaseFactionGearOtherFactionT0]
  id: ClothingHandsGlovesCombatTL
  suffix: TechnicLogistic
  name: TechnicLogistic Combat Gloves
  description: A pair of gloves made from the finest reinforced materials.
  components:
  - type: Sprite
    sprite: Forge/Clothing/Hands/Gloves/hand_techniclogistic.rsi
  - type: Clothing
    sprite: Forge/Clothing/Hands/Gloves/hand_techniclogistic.rsi
  - type: Insulated
  - type: Fiber
    fiberColor: fibers-red
    fiberMaterial: fibers-insulative
  - type: MeleeWeapon
    attackRate: 1.5
    damage:
      types:
        Blunt: 7
    soundHit:
      collection: Punch
    animation: WeaponArcFist
    mustBeEquippedToUse: true

