- type: entity
  id: CargoTechFab
  parent: BaseLatheLube
  name: cargo techfab
  description: Prints equipment and circuitboards for use by cargo department.
  components:
  - type: Sprite
    sprite: Structures/Machines/techfab.rsi
    layers:
    - state: icon
      map: ["enum.LatheVisualLayers.IsRunning"]
    - state: cargo
    - state: unlit
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
    - state: inserting
      map: ["enum.MaterialStorageVisualLayers.Inserting"]
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: Machine
    board: CargoTechFabCircuitboard
  - type: Lathe
    idleState: icon
    runningState: icon
    staticPacks:
    - ToolsStatic
    - SharedBoardsStatic
    - CargoBoardsStatic
    - CablesStatic
    - PowerCellsStatic
    - MiningToolsStatic
    - MiscSignallersStatic
    - CargoStatic
    dynamicPacks:
    - AdvancedTools
    - Mining
    - PowerCells
    - Equipment
    - MiningWeapons
    - MiningBoards
    - MiningUpgrades
    - MechBoardsCargo
    - MechWeaponsSalvage
    - SpecOpsGoogles
    - CargoBoards
    - SharedBoards
    - BluespaceTheory
    - ScienceClothing
    - ConstructionBagOfHolding
  - type: EmagLatheRecipes
    emagStaticPacks:
    - SalvageExplosivesStatic
    emagDynamicPacks:
    - SecurityExplosives
  - type: MaterialStorage
    whitelist:
      tags:
        - Sheet
        - RawMaterial
        - Ingot

