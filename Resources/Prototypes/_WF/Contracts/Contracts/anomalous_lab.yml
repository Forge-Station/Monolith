    wrecks:
    - /Maps/Salvage/medium-1.yml
    - /Maps/Salvage/medium-library.yml
    - /Maps/Salvage/medium-silent-orchestra.yml
    - /Maps/Salvage/medium-ruined-emergency-shuttle.yml
    - /Maps/Salvage/engineering-chunk.yml

