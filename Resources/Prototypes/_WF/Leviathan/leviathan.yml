# Aerumna's chromite leviathan, ported from Goob Station's space whale (sprite and ambience, CC-BY-SA-3.0) and made a
# local hazard rather than a round-ender: it roams the surface hunting whatever moves, bites hard but not deadly, and
# neither chews nor rams through anything built.

- type: entity
  id: WFAerumnaLeviathan
  parent: [ SimpleSpaceMobBase, MobCombat ]
  name: chromite leviathan
  description: A great segmented worm of Aerumna's plains. It hunts anything that moves, but it can't chew through a wall.
  components:
  - type: WFTailedEntity
    amount: 10
    spacing: 0.75
    prototype: WFAerumnaLeviathanSegment
  - type: Sprite
    sprite: _WF/Leviathan/leviathan.rsi
    noRot: false
    scale: 0.7, 0.7
    layers:
    - state: head
    - state: overlay
      shader: unshaded
  - type: PointLight
    radius: 2
    energy: 1
    color: "#9b8cff"
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.8
        density: 2000
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: MovementSpeedModifier
    baseWalkSpeed: 3.5
    baseSprintSpeed: 4.5
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
    blackboard:
      IdleRange: !type:Single
        40
      VisionRadius: !type:Single
        12
      AggroVisionRadius: !type:Single
        16
  - type: NpcFactionMember
    factions:
    - SimpleHostile
  - type: MeleeWeapon
    altDisarm: false
    attackRate: 0.6
    range: 1.8
    angle: 0
    animation: WeaponArcBite
    soundHit:
      path: /Audio/Effects/bite.ogg
    damage:
      types:
        Slash: 9
        Blunt: 7
  - type: MobThresholds
    thresholds:
      0: Alive
      500: Dead
  - type: Speech
    speechVerb: LargeMob
  - type: AmbientSound
    enabled: true
    volume: -2
    range: 16
    sound:
      path: /Audio/_WF/Leviathan/leviathan-ambient.ogg
  - type: Butcherable
    spawned:
    - id: FoodMeatXeno
      amount: 6

- type: entity
  id: WFAerumnaLeviathanSegment
  categories: [ HideSpawnMenu ]
  name: chromite leviathan
  description: The armoured body of a great worm.
  save: false
  components:
  - type: Sprite
    sprite: _WF/Leviathan/leviathan.rsi
    state: segment
    noRot: false
    scale: 0.7, 0.7
    drawdepth: Mobs
  - type: Tag
    tags:
    - HideContextMenu

# Goob Station's space leviathan at full strength, for admins to let loose in space. Nothing spawns it on its own.
# Its hull-ramming DamageOnCollide is Goob-only and left out; its bite still tears through plating.
- type: entity
  id: SpaceLeviathan
  parent: [ SimpleSpaceMobBase, FlyingMobBase, MobCombat ]
  name: space whale
  description: When space becomes too quiet, there is no hope, there is no escape, but there is this.
  suffix: keeps tiles, no despawn
  components:
  - type: WFTailedEntity
    amount: 65
    spacing: 1
    prototype: SpaceWhaleSegment
  - type: MovementSpeedModifier
    baseSprintSpeed: 11
    baseWalkSpeed: 11
  - type: RadarBlip
    scale: 3
    shape: hexagon
    visibleFromOtherGrids: true
  - type: MovementIgnoreGravity
    weightless: true
  - type: WarpPoint
    follow: true
    location: space leviathan
  - type: HTN
    rootTask:
      task: DragonCarpCompound
  - type: NpcFactionMember
    factions:
    - Dragon
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 2
        density: 137992
        mask:
        - FlyingMobMask
        layer:
        - FlyingMobLayer
  - type: MeleeWeapon
    altDisarm: false
    attackRate: 0.3
    angle: 0
    animation: WeaponArcBite
    soundHit:
      path: /Audio/Effects/bite.ogg
    damage:
      types:
        Blunt: 50
        Slash: 45
        Structural: 800
  - type: Speech
    speechVerb: LargeMob
  - type: InteractionPopup
    interactSuccessString: petting-success-leviathan
    interactFailureString: petting-failure-leviathan
    interactFailureSound:
      path: /Audio/Effects/bite.ogg
  - type: Sprite
    sprite: _WF/Leviathan/leviathan.rsi
    noRot: false
    layers:
    - state: head
    - state: overlay
      shader: unshaded
  - type: AmbientSound
    enabled: true
    volume: 1
    range: 50
    sound:
      path: /Audio/_WF/Leviathan/leviathan-ambient.ogg
  - type: MobThresholds
    thresholds:
      0: Alive
      4000: Dead
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 4000
      behaviors:
      - !type:GibBehavior

- type: entity
  id: SpaceWhaleSegment
  parent: FlyingMobBase
  suffix: do not spawn
  categories: [ HideSpawnMenu ]
  save: false
  components:
  - type: RadarBlip
    scale: 2
    shape: diamond
    visibleFromOtherGrids: true
  - type: Sprite
    sprite: _WF/Leviathan/leviathan.rsi
    state: segment
    noRot: false
  - type: Tag
    tags:
    - HideContextMenu
  - type: Physics
    canCollide: false

- type: entity
  id: SpaceLeviathanDespawn
  parent: SpaceLeviathan
  suffix: despawns
  components:
  - type: TimedDespawn
    lifetime: 190
