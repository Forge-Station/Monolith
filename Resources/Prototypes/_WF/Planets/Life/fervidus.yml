# Fervidus's living world: wildlife for each region and plants that do something (LivingWorld components).
# Basalt flats keep the argocytes (fauna.yml); the ashfields and the lava crust (Biomes/fervidus.yml) have their own.
# Names and descriptions are in Resources/Locale/en-US/_WF/Planets/life_fervidus.ftl.

# Wildlife. Fervidus's air is hot and has no oxygen, so none of these breathes and each takes the heat, as the argocytes do.
# They share the Xeno faction with the argocytes so the planet's natives don't fight each other.

# Ashfields: a laser raptor, or a slow ash golem.
# Built on the space-mob base, not MobLaserRaptor: that one breathes, and Fervidus's air has no oxygen.
- type: entity
  id: WFMobLaserRaptorFervidus
  parent: SimpleSpaceMobBase
  suffix: Fervidus
  components:
  - type: Body
    prototype: LaserRaptor
  - type: NpcFactionMember
    factions:
    - Xeno
  - type: HTN
    rootTask:
      task: SimpleRangedHostileCompound
  - type: Temperature
    heatDamageThreshold: 500
    coldDamageThreshold: 0
    currentTemperature: 373.15
  - type: Sprite
    drawdepth: Mobs
    sprite: Mobs/Aliens/laser_raptor.rsi
    color: "#d8b9a4"
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: laser_raptor
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.30
        density: 80
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: DamageStateVisuals
    states:
      Alive:
        Base: laser_raptor
      Dead:
        Base: laser_raptor_dead
  - type: MobThresholds
    thresholds:
      0: Alive
      100: Dead
  - type: Butcherable
    spawned:
    - id: FoodMeatChicken
      amount: 2
  - type: MovementSpeedModifier
    baseWalkSpeed: 2
    baseSprintSpeed: 5
  - type: Tag
    tags:
    - FootstepSound
    - DoorBumpOpener
  - type: HitscanBatteryAmmoProvider
    proto: RedLightLaser
    fireCost: 50
  - type: BatterySelfRecharger
    autoRecharge: true
    autoRechargeRate: 50
  - type: Battery
    maxCharge: 1000
    startingCharge: 1000
  - type: Gun
    fireRate: 1
    useKey: false
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot: /Audio/Weapons/Guns/Gunshots/laser_cannon.ogg
  - type: CombatMode
  - type: InteractionPopup
    successChance: 0.3
    interactSuccessString: petting-success-reptile
    interactFailureString: petting-failure-generic
    interactSuccessSound:
      path: /Audio/Animals/lizard_happy.ogg

- type: entity
  id: WFMobAshGolem
  parent: MobCoalGolem
  suffix: Fervidus
  components:
  - type: NpcFactionMember
    factions:
    - Xeno
  - type: Temperature
    heatDamageThreshold: 800
    coldDamageThreshold: 0
    currentTemperature: 373.15
  - type: MovementSpeedModifier
    baseWalkSpeed: 1.2
    baseSprintSpeed: 1.5
  - type: Sprite
    color: "#b3a9a3"

# Lava crust: a slime that burns what it touches, and rarely the hellspawn.
# A basic slime rebuilt on the space-mob base: the stock one breathes. Burns what it hits.
- type: entity
  id: WFMobCinderSlime
  parent: SimpleSpaceMobBase
  suffix: Fervidus
  components:
  - type: NpcFactionMember
    factions:
    - Xeno
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
  - type: Temperature
    heatDamageThreshold: 800
    coldDamageThreshold: 0
    currentTemperature: 373.15
  - type: Sprite
    drawdepth: Mobs
    sprite: Mobs/Aliens/slimes.rsi
    color: "#ff6a2e"
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: yellow_adult_slime
  - type: DamageStateVisuals
    states:
      Alive:
        Base: yellow_adult_slime
      Dead:
        Base: yellow_adult_slime_dead
  - type: PointLight
    radius: 1.8
    energy: 1.2
    color: "#ff6a2e"
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.30
        density: 80
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: MobThresholds
    thresholds:
      0: Alive
      120: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 2
    baseSprintSpeed: 4
  - type: FootstepModifier
    footstepSoundCollection:
      path: /Audio/Effects/Footsteps/slime1.ogg
      params:
        volume: 3
  - type: Tag
    tags:
    - FootstepSound
    - DoorBumpOpener
  - type: Butcherable
    butcheringType: Knife
    spawned:
    - id: FoodMeatSlime
      amount: 2
  - type: Damageable
    damageContainer: Biological
    damageModifierSet: Slime
  - type: Bloodstream
    bloodReagent: Slime
  - type: Body
    prototype: Slimes
    requiredLegs: 1
  - type: MeleeWeapon
    altDisarm: false
    soundHit:
      path: /Audio/Weapons/punch3.ogg
    angle: 0
    animation: WeaponArcPunch
    damage:
      types:
        Blunt: 3
        Structural: 2
        Heat: 7
  - type: IgniteOnMeleeHit
    fireStacks: 0.5
  - type: InteractionPopup
    successChance: 0.5
    interactSuccessString: petting-success-slimes
    interactFailureString: petting-failure-generic
  - type: Speech
    speechVerb: Slime
    speechSounds: Slime
  - type: TypingIndicator
    proto: slime

- type: entity
  id: WFMobHellspawnFervidus
  parent: MobHellspawn
  suffix: Fervidus
  components:
  - type: NpcFactionMember
    factions:
