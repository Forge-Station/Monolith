- type: entity
  parent: [ClothingHeadHelmetHardsuitSyndie, ShowSecurityIcons]
  id: ClothingHeadHelmetHardsuitAshen
  name: PDV CV-32 combat hardsuit helmet
  description: A combat hardsuit helmet designed by the Phaethon Dynasty. A basic monotube night vision system is installed.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Mono/Clothing/Head/Hardsuits/syndicate.rsi
  - type: Clothing
    sprite: _Mono/Clothing/Head/Hardsuits/syndicate.rsi
  - type: NightVision # Amber monotube
    relayOverlay: true
    goggleEffect: true
    action: ActionToggleNightVision
    viewCircleRadius: 450
    viewCircleCount: 1
    viewCircleSpacing: 280
    phosphorColor: "#FF3300"
    lightingColor: "#FFFFFF32"

- type: entity
  parent: [ClothingHeadHardsuitBase, ClothingHeadSuitWithLightBase, ShowMedicalIcons, ShowSecurityIcons]
  id: ClothingHeadHelmetHardsuitPDVMedic
  name: PDV CV-82 combat tacsuit helmet
  description: A hardsuit helmet by the Phaethon Dynasty. Has a built-in medical HUD complemented by thermal pulse systems.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Mono/Clothing/Head/Hardsuits/pdv_medic.rsi
  - type: Clothing
    sprite: _Mono/Clothing/Head/Hardsuits/pdv_medic.rsi
  - type: PointLight
    color: "#eb772a"
  - type: ThermalVision
    flashDurationMultiplier: 2
    pulseTime: 4
    isEquipment: true
    toggleAction: PulseThermalVision
  - type: ShowHealthBars
  - type: PressureProtection
    highPressureMultiplier: 0.08
    lowPressureMultiplier: 1000
  - type: Armor
    coverage: [Head] # WOLFGATE(Wolfmed): P6, P3-D6: locational armour coverage
    modifiers:
      coefficients:
        # WOLFGATE(ArmorBalance): helmet tier rule, T2 0.9 and T3 0.85.
        Blunt: 0.85
        Slash: 0.85
        Piercing: 0.85
        Heat: 0.85
  - type: HideLayerClothing
    slots:
    - Hair
    - Snout
    - HeadTop
    - HeadSide

- type: entity
  parent: [ClothingHeadHelmetHardsuitSyndieElite, ShowSecurityIcons]
  id: ClothingHeadHelmetHardsuitAshenElite
  name: PDV CV-53 combat tacsuit helmet
  description: Based on the CV-32 hardsuit, this tacsuit helmet trades heavy armor plates for environmental protection and an advanced NVD suite. # WOLFGATE(ArmorBalance): grammar pass.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Mono/Clothing/Head/Hardsuits/syndieelite.rsi
  - type: Clothing
    sprite: _Mono/Clothing/Head/Hardsuits/syndieelite.rsi
  - type: NightVision # Gen 4 quadtube
    relayOverlay: true
    goggleEffect: true
    action: ActionToggleNightVision
    viewCircleRadius: 400
    viewCircleCount: 4
    viewCircleSpacing: 260
    phosphorColor: "#41D7D9"
    lightingColor: "#FFFFFF32"

- type: entity
  parent: [ClothingHeadHelmetHardsuitSyndieElite, ShowSecurityIcons]
  id: ClothingHeadHelmetHardsuitVizier
  name: PDV CV-67 combat hardsuit helmet
  description: An adorned tacsuit helmet with an imperfect nanolaminate composition. High maneuverability, sturdy armor. # WOLFGATE(ArmorBalance): grammar pass.
