  - sprite: _Impstation/Mobs/Customization/animatedmarkings.rsi
    state: mothglowantenna
  shader: unshaded

# Moth wings
- type: marking
  id: ShadekinMothWingsDefault
  bodyPart: Tail
  markingCategory: Overlay
  speciesRestriction: [Shadekin]
  layering: # WOLFGATE - the anatomy zone of the south frame draws behind the body, so the tail never covers anatomy
    default_BEHIND: TailBehind
  colorLinks: # WOLFGATE - both halves of a tail share one colour
    default_BEHIND: default_FRONT
  sprites:
  - sprite: _WF/Mobs/Customization/TailSplit/Mobs/Customization/Moth/moth_wings.rsi # WOLFGATE - split art, anatomy zone only
    state: default_FRONT
  - sprite: _WF/Mobs/Customization/TailSplit/Mobs/Customization/Moth/moth_wings.rsi # WOLFGATE - anatomy zone of the south frame on TailBehind
    state: default_BEHIND

