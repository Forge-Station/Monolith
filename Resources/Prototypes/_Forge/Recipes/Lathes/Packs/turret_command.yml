# One shared research unlocks every recipe. Each fabricator only lists the turrets that crew should print.

- type: latheRecipePack
  id: ForgeTurretKits
  recipes:
  - MagazineTurretBallistic
  - MagazineTurretShotgun
  - MagazineTurretSniper
  - MagazineTurretMachinegun
  - MagazineTurretBallisticEmpty
  - MagazineTurretShotgunEmpty
  - MagazineTurretSniperEmpty
  - MagazineTurretMachinegunEmpty

- type: latheRecipePack
  id: ForgeTurretAdventurer
  recipes:
  - TurretCommandShipCircuitboard
  - WeaponTurretAdventurerPacked
  - WeaponTurretAdventurerShotgunPacked
  - WeaponTurretAdventurerSniperPacked
  - WeaponTurretAdventurerMachinegunPacked

