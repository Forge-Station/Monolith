# Planet birds (Content.Server/_WF/Birds). Each world's fauna tables roll a flock leader, which spawns the rest of its
# flock; WFBirdSystem flies them, so they carry no HTN. Names and descriptions are in Locale/en-US/_WF/Birds/birds.ftl.
# Sprites: Resources/Textures/_WF/Birds, built by Tools/_WF/Birds/build_bird_sprites.py.

- type: entity
  abstract: true
  parent: [BaseSimpleMob, MobCombat, MobBloodstream, MobFlammable]
  id: WFBirdBase
  components:
  - type: WFBird
    takeoffSound:
      collection: WFBirdTakeoff
      params:
        volume: -4
  # Birds never fall down a cavern mouth they fly over.
  - type: CEZPhysics
    fallable: false
  - type: NpcFactionMember
    factions:
    - Passive
  - type: Body
    prototype: Animal
  - type: Sprite
    drawdepth: SmallMobs
    layers:
    - map: [ "enum.WFBirdLayers.Shadow" ]
      state: shadow
      visible: false
    - map: [ "enum.WFBirdLayers.Body" ]
      state: sit
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.2
        density: 5
        mask:
        - SmallMobMask
        layer:
        - SmallMobLayer
      # Where a flying bird is drawn, above its shadow: shots take it there. No layer until it takes off.
      flight:
        shape:
          !type:PhysShapeCircle
          position: 0, 0.5
          radius: 0.35
        density: 1
        hard: true # rays only see hard fixtures; with no mask it pushes nothing
  - type: MobThresholds
    thresholds:
      0: Alive
      15: Dead
  - type: MeleeWeapon
    hidden: true
    angle: 0
    animation: WeaponArcBite
    soundHit:
      path: /Audio/Effects/bite.ogg
    damage:
      types:
        Piercing: 2
  - type: Butcherable
    spawned:
    - id: FoodMeatChicken
      amount: 1
  - type: Bloodstream
    bloodMaxVolume: 30
  - type: Temperature
    heatDamageThreshold: 360
    coldDamageThreshold: 200
    currentTemperature: 300
  - type: Perishable
  - type: Tag
    tags: []

# ---- Asclepiu ----

# Verda's meadows and woods: small, quick flocks that sing on the ground.
- type: entity
  parent: WFBirdBase
  id: WFMobBirdVerdaSongbird
  components:
  - type: Sprite
    sprite: _WF/Birds/songbird.rsi
    scale: 0.6, 0.6
  - type: WFBird
    minFlock: 3
    maxFlock: 6
    flySpeed: 6
    flightLift: 0.4
    takeoffSound:
      collection: WFBirdTakeoff
      params:
        volume: -6
        pitch: 1.3
    callSound:
      collection: WFBirdSongbirdCall
      params:
        volume: -6
  - type: AmbientSound
    volume: -10
    range: 7
    sound:
      collection: WFBirdSongbirdChatter
  - type: MobThresholds
    thresholds:
      0: Alive
      8: Dead

# The lake shores: white gulls that wheel over the water before they settle.
- type: entity
  parent: WFBirdBase
  id: WFMobBirdAsclepiuGull
  components:
  - type: Sprite
    sprite: _WF/Birds/lake_gull.rsi
    scale: 0.75, 0.75
  - type: WFBird
    minFlock: 2
    maxFlock: 5
    circleTime: 3, 10
    circleRadius: 4
    roamRange: 18
    flightLift: 0.6
    takeoffSound:
      collection: WFBirdTakeoff
      params:
        volume: -4
    callSound:
      collection: WFBirdGullCall
      params:
        volume: -4
        pitch: 1.25
    callChance: 0.008

