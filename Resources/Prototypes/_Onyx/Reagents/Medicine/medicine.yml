# WOLFGATE(Wolfmed): vendored from ONYX Resources/Prototypes/_Onyx/Reagents/Medicine/medicine.yml (pin 2f5bab9),
# Tier A only (PLAN4 P4-D2): the painkiller ladder plus the dedicated fracture medicine.
# WOLFGATE(Wolfmed): every `Bloodstream:` metabolism group header is translated to `Medicine:` — Wolfgate has no
# Bloodstream group, and all five reagents are `group: Medicine` so their effects belong in the liver pass.
# WOLFGATE(Wolfmed): `ReagentCondition` -> `ReagentThreshold`, `ModifyBleed` -> `ModifyBleedAmount`,
# `TemperatureCondition` -> `Temperature` (PLAN4 WP12-2 translation table).

- type: reagent
  id: Osteogen
  name: reagent-name-osteogen
  group: Medicine
  desc: reagent-desc-osteogen
  physicalDesc: reagent-physical-desc-opaque
  flavor: medicine
  color: "#d9e6c3"
  metabolisms:
    Medicine: # WOLFGATE(Wolfmed): Onyx `Bloodstream`
      effects:
      - !type:MendFractures
        amount: 1
        wounds: [BoneFractureWound]
        maximumGrade: Simple

- type: reagent
  id: Ibuprofen
  name: reagent-name-ibuprofen
  group: Medicine
  desc: reagent-desc-ibuprofen
  physicalDesc: reagent-physical-desc-thick
  flavor: medicine
  color: "#be5c5c"
  plantMetabolism:
  - !type:PlantAdjustWeeds
    amount: -5
  - !type:PlantAdjustHealth
    amount: -10
  metabolisms:
    Medicine: # WOLFGATE(Wolfmed): Onyx `Bloodstream`
      metabolismRate: 0.15
      effects:
      - !type:SuppressPain
        amount: 0.5
        decayDuration: 27
        identifier: Ibuprofen
        recoveryMultiplier: 2.5
      # WOLFGATE(Wolfmed): CONSC: painkiller tier. Weak, so it can pick a patient up off the floor but never
      # keeps one awake.
      - !type:WolfmedPainRelief
        tier: Weak
        strength: 14
      - !type:HealthChange
        damage:
          groups:
            Brute: -1
      - !type:AdjustTemperature
        conditions:
        - !type:Temperature # WOLFGATE(Wolfmed): Onyx `TemperatureCondition`
          max: 293.15
        amount: 10000
      - !type:AdjustTemperature
        conditions:
        - !type:Temperature # WOLFGATE(Wolfmed): Onyx `TemperatureCondition`
          min: 293.15
        amount: -1000
      - !type:HealthChange
        damage:
          types:
            Poison: 0.2
        conditions:
        - !type:ReagentThreshold # WOLFGATE(Wolfmed): Onyx `ReagentCondition`
          reagent: Ibuprofen
          min: 20
      - !type:TakeStaminaDamage
        conditions:
        - !type:ReagentThreshold # WOLFGATE(Wolfmed): Onyx `ReagentCondition`
          reagent: Ibuprofen
          min: 10
        amount: 2.4
        immediate: false

- type: reagent
  id: Ketorolac
  name: reagent-name-ketorolac
  group: Medicine
  desc: reagent-desc-ketorolac
  physicalDesc: reagent-physical-desc-pungent
  flavor: medicine
  color: "#d6b75a"
  metabolisms:
    Medicine: # WOLFGATE(Wolfmed): Onyx `Bloodstream`
      metabolismRate: 0.12
      effects:
      - !type:SuppressPain
        amount: 0.9
        decayDuration: 50
        identifier: Ketorolac
        recoveryMultiplier: 3
      # WOLFGATE(Wolfmed): CONSC: painkiller tier. The strongest of the weak rung.
      - !type:WolfmedPainRelief
        tier: Weak
        strength: 26
      - !type:HealthChange
        damage:
          groups:
            Brute: -0.5
      - !type:ModifyBleedAmount # WOLFGATE(Wolfmed): Onyx `ModifyBleed`
        conditions:
        - !type:ReagentThreshold # WOLFGATE(Wolfmed): Onyx `ReagentCondition`
          reagent: Ketorolac
          min: 12
        amount: 0.15
      - !type:HealthChange
        conditions:
        - !type:ReagentThreshold # WOLFGATE(Wolfmed): Onyx `ReagentCondition`
          reagent: Ketorolac
          min: 18
        damage:
          types:
            Poison: 0.5

- type: reagent
  id: Tramadol
  name: reagent-name-tramadol
  group: Medicine
  desc: reagent-desc-tramadol
  physicalDesc: reagent-physical-desc-thick
  flavor: medicine
  color: "#ad2cfa"
  metabolisms:
    Medicine: # WOLFGATE(Wolfmed): Onyx `Bloodstream`
      metabolismRate: 0.1
      effects:
      - !type:SuppressPain
        amount: 1.25
        decayDuration: 45
        identifier: Tramadol
        recoveryMultiplier: 3.5
      # WOLFGATE(Wolfmed): CONSC: painkiller tier. Strong: lifts unconsciousness when pain was the only cause,
      # masks the wound slowdowns, and sedates.
      - !type:WolfmedPainRelief
        tier: Strong
        strength: 45
        sedationPerUnit: 0.11 # WOLFGATE(Wolfmed): M2: sedation aims for this per unit in the blood (plan §3.4); a 5 u dose stays under 0.6
      - !type:GenericStatusEffect
        key: Adrenaline
        component: IgnoreSlowOnDamage
        time: 2
      - !type:HealthChange
        conditions:
        - !type:ReagentThreshold # WOLFGATE(Wolfmed): Onyx `ReagentCondition`
          reagent: Tramadol
          min: 15.5
        damage:
          types:
            Poison: 0.8

