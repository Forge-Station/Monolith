# Empty kits. Same slot as the loaded kit, so the player fills them with any round of that caliber.
- type: entity
  parent: MagazineTurretBallistic
  id: MagazineTurretBallisticEmpty
  name: empty ballistic turret cartridge kit
  suffix: empty
  description: An empty kit for a ballistic command turret. Holds sixty rounds of any 7.62x39mm.
  components:
  - type: BallisticAmmoProvider
    proto: null
    capacity: 60
    mayTransfer: true
    whitelist:
      tags:
      - Cartridge762x39mmFMJ

