  parent: TgFloraAshLeafShroom
  components:
  - type: Sprite
    layers:
    - state: s_mushroom1
      map: ["shroom"]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.WFRegrowingHarvestVisuals.Harvested:
