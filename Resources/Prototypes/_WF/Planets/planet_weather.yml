# Each world alternates phased storms with 3-7 minutes of clear skies. A storm telegraphs with a light overlay, runs,
# and winds down through a light overlay again, after /tg/station's weather. The scheduler picks these stock weathers,
# which say what the weather is; wolfWeathers says how each looks, sounds and blows on this world (_WF/WolfWeather),
# and a wolfWeather with lightning drops real bolts on open ground.
# Seasons loop in order (a world with one has it for good, none has no seasons); each can weight the storms, bring its
# own, stretch clear spells and shift the temperature. The outdoor air is the ground's air plus the season, the weather
# (weatherTemperature) and the hour (dayTemperatureSwing either side, warmest at 15:00, coldest at 05:00), in kelvin.
- type: wfPlanetWeather
  id: WFPlanetWeatherAsclepiu
  planetType: PlanetAsclepiu
  storms:
  - main: WFRainLow
  - telegraph: WFRainLow
    main: WFRainMed
    end: WFRainEnd
  - telegraph: WFRainLow
    main: WFRainHigh
    end: WFRainEnd
  wolfWeathers:
    WFRainLow: WFRainLight
    WFRainEnd: WFRainLight
    WFRainMed: WFRainModerate
    WFRainHigh: WFThunderstorm
    WFSnowLight: WFSnow
    WFSnowStorm: WFBlizzard
    WFFogMist: WFFogWisps
    WFFog: WFFogBank
  initialHour: 8
  dayTemperatureSwing: 5
  weatherTemperature:
    WFRainLow: -1
    WFRainEnd: -1
    WFRainMed: -2
    WFRainHigh: -4
    WFSnowLight: -3
    WFSnowStorm: -8
    WFFogMist: -1
    WFFog: -2
  # A year is six local days: four seasons of 90 minutes.
  seasons:
  - id: Spring
    name: wf-planet-season-spring
    color: "#9ad48a"
    temperature: -1
    clearScale: 0.8
    stormWeights:
      WFRainLow: 2
      WFRainMed: 2
      WFRainHigh: 0.5
  - id: Summer
    name: wf-planet-season-summer
    color: "#f2c95c"
    temperature: 8
    clearDayTemperature: 3
    clearScale: 1.2
    stormWeights:
      WFRainLow: 0.5
      WFRainHigh: 2.5
  - id: Autumn
    name: wf-planet-season-autumn
    color: "#d8894a"
    temperature: -5
    storms:
    - main: WFRainLow
    - telegraph: WFRainLow
      main: WFRainMed
      end: WFRainEnd
    - telegraph: WFFogMist
      main: WFFog
      end: WFFogMist
      telegraphSeconds: 45
      endSeconds: 45
  - id: Winter
    name: wf-planet-season-winter
    color: "#a8d0f0"
    temperature: -18
    storms:
    - main: WFSnowLight
    - telegraph: WFSnowLight
      main: WFSnowStorm
      end: WFSnowLight
    - telegraph: WFFogMist
      main: WFFog
      end: WFFogMist
      telegraphSeconds: 45
      endSeconds: 45
    stormWeights:
      WFSnowLight: 2
      WFFog: 0.5

- type: wfPlanetWeather
  id: WFPlanetWeatherFervidus
  planetType: PlanetFervidus
  storms:
  - main: WFAshLight
  - telegraph: WFAshLight
    main: WFAshStorm
    end: WFAshLight
  wolfWeathers:
    WFAshLight: WFAshfall
    WFAshStorm: WFAshStorm
  initialHour: 12
  # Thick volcanic air holds its heat; ash smothers the ground warmer still. No seasons.
  dayTemperatureSwing: 2
  weatherTemperature:
    WFAshLight: 2
    WFAshStorm: 4

- type: wfPlanetWeather
  id: WFPlanetWeatherMerak
  planetType: PlanetMerak
  storms:
  - telegraph: WFDustLow
    main: WFDustMed
    end: WFDustLow
  - telegraph: WFDustLow
    main: WFDustHigh
    end: WFDustLow
  wolfWeathers:
    WFDustLow: WFDustLight
    WFDustMed: WFSandstorm
    WFDustHigh: WFSandstormHeavy
  initialHour: 15
  clearMinSeconds: 300
  clearMaxSeconds: 600
  # Desert: scorching afternoons, cold nights; sand on the wind is hot.
  dayTemperatureSwing: 12
  weatherTemperature:
    WFDustLow: 1
    WFDustMed: 2
    WFDustHigh: 3
  seasons:
  - id: Dry
    name: wf-planet-season-dry
    color: "#e8c890"
    clearDayTemperature: 2
    clearScale: 1.3
    stormWeights:
      WFDustHigh: 0.3
  - id: Dust
    name: wf-planet-season-dust
    color: "#c8955a"
    temperature: 3
    clearScale: 0.6
    stormWeights:
      WFDustMed: 1.5
      WFDustHigh: 2.5

- type: wfPlanetWeather
  id: WFPlanetWeatherAerumna
  planetType: PlanetAerumna
  storms:
  - main: WFRainLow
  - telegraph: WFRainLow
    main: WFRainMed
    end: WFRainEnd
  wolfWeathers:
    WFRainLow: WFRainLight
    WFRainEnd: WFRainLight
    WFRainMed: WFRainHeavy
  initialHour: 18
  # Thick humid air: little swing between day and night.
  dayTemperatureSwing: 2.5
  weatherTemperature:
    WFRainLow: -1
    WFRainEnd: -1
    WFRainMed: -2
  seasons:
  - id: Dry
    name: wf-planet-season-dry
    color: "#d8c890"
    temperature: 3
    clearScale: 1.6
    stormWeights:
      WFRainMed: 0.3
  - id: Monsoon
    name: wf-planet-season-monsoon
    color: "#6aa0c8"
    temperature: -2
    clearScale: 0.35
    weatherScale: 1.5
    stormWeights:
      WFRainLow: 0.5
      WFRainMed: 3

- type: wfPlanetWeather
