- type: entity
  id: Bullet35mmGrenadeSAPHE
  name: frag grenade
  parent: BaseBulletTrigger
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/projectiles2.rsi
    layers:
    - state: grenade
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: Default
    maxIntensity: 7 # Forge-change 75->7
    intensitySlope: 5 # Forge-change 4->5
    totalIntensity: 40 # Forge-change 75->40
    maxTileBreak: 0
  - type: Projectile
    damage:
      types:
        Structural: 200 # Forge-change 100->200
        Piercing: 30 # Forge-change 45->30
    ignoreResistances: true # Forge-change
  - type: Reflective # Forge-change
    reflective: # Forge-change
    - None # Forge-change

