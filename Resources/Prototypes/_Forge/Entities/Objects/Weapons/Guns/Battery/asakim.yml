- type: entity
  name: kunisa-pattern plasma rifle
  parent: WeaponRifleADMAutopulserForge
  id: WeaponRifleADMRifleForge
  description: An advanced handheld plasma rifle. It punches through any defense, tearing targets apart and leaving searing, white-hot burn holes.
  suffix: Forge, ADM
  components:
  - type: Sprite
    sprite: _Forge/Objects/Weapons/Guns/Battery/asakimsniper.rsi
  - type: Gun
    fireRate: 0.4
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/_Mono/Weapons/Guns/Gunshots/bigshot.ogg
  - type: ProjectileBatteryAmmoProvider
    proto: HeavyPulseProjectile
    fireCost: 300
  - type: Wieldable
    freeHandsRequired: 0
  - type: CursorOffsetRequiresWield
  - type: EyeCursorOffset
    maxOffset: 4.5
    pvsIncrease: 0.7
