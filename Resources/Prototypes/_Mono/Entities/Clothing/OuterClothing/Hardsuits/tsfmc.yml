- type: entity
  parent: [ ClothingOuterHardsuitBase, BaseFactionGearTSFT2]
  id: ClothingOuterHardsuitM82c
  name: M82c hardsuit
  description: A hardsuit issued to marines operating in low-pressure and high-risk environments. Specialized in bullet protection.
  components:
  # WOLFGATE(ArmorSpecialization): spall liner.
  - type: WFWoundWard
    examine: wf-armor-spec-spall-liner-examine
    blocks:
    - WFWolfmedLodgedRoundWound
    - WFWolfmedShrapnelWound
  - type: Sprite
    sprite: _Mono/Clothing/OuterClothing/Hardsuits/m82c.rsi
  - type: Item
    size: Huge
  - type: Clothing
    sprite: _Mono/Clothing/OuterClothing/Hardsuits/m82c.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.05
    lowPressureMultiplier: 1000
  - type: ExplosionResistance
    damageCoefficient: 0.65
  - type: Armor
    modifiers:
      coefficients:
        # WOLFGATE(ArmorBalance): sidegrade pass.
        Blunt: 0.6
        Slash: 0.6
        Piercing: 0.6
        Heat: 0.7
        Radiation: 0.65
        Caustic: 0.8
  - type: StaminaDamageResistance
    coefficient: 0.25
  - type: ClothingSpeedModifier
    walkModifier: 0.95
    sprintModifier: 0.95
  - type: HeldSpeedModifier
  - type: ToggleableClothing # Goobstation - Modsuits change - Mono - this is a solution for helmet attachment/cover to not fit on hardsuits
    requiredSlot: outerclothing
    blockUnequipWhenAttached: false
    replaceCurrentClothing: true
    clothingPrototypes:
      head: ClothingHeadHelmetHardsuitM82
      helmetcover: ClothingHeadHelmetCoverBlock
      helmetattachment: ClothingHeadHelmetAttachmentBlock
  - type: StaticPrice
    price: 5000
    vendPrice: 7500

- type: entity
  parent: [ ClothingOuterHardsuitM82c, BaseFactionGearTSFT2 ]
  id: ClothingOuterHardsuitM82b
  name: M82b hardsuit
  description: A corpsman variant of the M82c, outfitted with caustic and radiological shielding. Some of the blunt-absorbent gel layer is sacrificed for the NBC protection. # WOLFGATE(ArmorBalance): grammar pass.
  components:
  # WOLFGATE(ArmorSpecialization): sealed spall liner.
  - type: WFWoundWard
    examine: wf-armor-spec-sealed-spall-examine
    blocks:
    - WFWolfmedChemicalBurnWound
    - WFWolfmedFrostbiteWound
    - WFWolfmedLodgedRoundWound
    - WFWolfmedShrapnelWound
  - type: Sprite
    sprite: _Mono/Clothing/OuterClothing/Hardsuits/m82b.rsi
  - type: Clothing
    sprite: _Mono/Clothing/OuterClothing/Hardsuits/m82b.rsi
  - type: ExplosionResistance
    damageCoefficient: 0.65
  - type: Armor
    modifiers:
      coefficients:
        # WOLFGATE(ArmorBalance): sidegrade pass.
        Blunt: 0.7
        Slash: 0.65
        Piercing: 0.75
        Shock: 0.7
        Heat: 0.4
        Radiation: 0.2
        Caustic: 0.5
  - type: ClothingSpeedModifier
    walkModifier: 0.95
    sprintModifier: 0.95

- type: entity
  parent: [ClothingOuterHardsuitBase, BaseFactionGearTSFT3]
  id: ClothingOuterHardsuitM86
  name: M86 Mk.3(R) hardsuit
  description: An armored hardsuit, designed as an upgrade to the M82 series. The extra armor makes it heavy to move around in. # WOLFGATE(ArmorBalance): grammar pass.
  components:
  # WOLFGATE(ArmorSpecialization): bone plating.
  - type: WFWoundWard
    examine: wf-armor-spec-bone-plating-examine
    hardens:
      InternalBleedingWound: 2
      WFWolfmedCrushInjuryWound: 2
      WFWolfmedDislocationWound: 2
  - type: Sprite
    sprite: _Mono/Clothing/OuterClothing/Hardsuits/m86.rsi
  - type: Item
    size: Huge
  - type: Clothing
    sprite: _Mono/Clothing/OuterClothing/Hardsuits/m86.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.03
    lowPressureMultiplier: 1000
  - type: ExplosionResistance
    damageCoefficient: 0.4
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.5
        Slash: 0.5
        Piercing: 0.5
        Shock: 0.8
        # WOLFGATE(ArmorBalance): sidegrade pass.
        Heat: 0.6
        Radiation: 0.4
        Caustic: 0.6
  - type: StaminaDamageResistance
    coefficient: 0.2
  - type: ClothingSpeedModifier
    walkModifier: 0.9
    sprintModifier: 0.9
  - type: HeldSpeedModifier
  - type: ToggleableClothing # Goobstation - Modsuits change - Mono - this is a solution for helmet attachment/cover to not fit on hardsuits
    requiredSlot: outerclothing
    blockUnequipWhenAttached: false
    replaceCurrentClothing: true
    clothingPrototypes:
      head: ClothingHeadHelmetHardsuitM86
      helmetcover: ClothingHeadHelmetCoverBlock
      helmetattachment: ClothingHeadHelmetAttachmentBlock
  - type: StaticPrice
    price: 7500
    vendPrice: 1000

- type: entity
  parent: ClothingOuterHardsuitBaseNFNfsd
  id: ClothingOuterHardsuitNfsdSheriff
  name: TSFMC M92 colonel tacsuit
  description: A heavy, gilded tacsuit, stripped of its shield but now capable of taking a lot of physical damage. Usually assigned to commanding officers of TSF flagships.
  components:
  # WOLFGATE(ArmorSpecialization): concussion ward.
  - type: WFWoundWard
    examine: wf-armor-spec-concussion-ward-examine
    blocks:
    - WFWolfmedConcussionWound
  - type: Sprite
    sprite: _Mono/Clothing/OuterClothing/Hardsuits/tsfmc_colonel.rsi # Mono
  - type: Clothing
    sprite: _Mono/Clothing/OuterClothing/Hardsuits/tsfmc_colonel.rsi # Mono
  - type: ToggleableClothing # Goobstation - Modsuits change - Mono - this is a solution for helmet attachment/cover to not fit on hardsuits
    requiredSlot: outerclothing
    blockUnequipWhenAttached: false
    replaceCurrentClothing: true
    clothingPrototypes:
      head:  ClothingHeadHelmetHardsuitNfsdSheriff
      helmetcover: ClothingHeadHelmetCoverBlock
      helmetattachment: ClothingHeadHelmetAttachmentBlock
  - type: FireProtection # Mono
    reduction: 0.5
  - type: ExplosionResistance
    damageCoefficient: 0.3
  - type: Armor # Mono - Armor Value Changes
    modifiers:
      coefficients:
        # WOLFGATE(ArmorBalance): sidegrade pass.
        Blunt: 0.35
        Slash: 0.35
        Piercing: 0.35
        Heat: 0.45
        Radiation: 0.4
        Caustic: 0.5
  - type: ClothingSpeedModifier # Mono - Armor Value Changes
    walkModifier: 0.95
    sprintModifier: 1
  - type: StaminaDamageResistance # Mono - Stamres
    coefficient: 0.35
  - type: PirateBountyItem # Mono
    id: ClothingOuterHardsuitTacsuitHighValue

- type: entity
  parent: [ClothingOuterHardsuitBaseNoPlateholder, MonoEnergyShieldClothing, BaseFactionGearTSFT3 ] # Jugger Suit
  id: ClothingOuterHardsuitNfsdExperimental
  name: TSFMC M92-X tacsuit
  description: An experimental modification of the M92 tacsuit for TSFMC spec-ops units. Durable, with an integrated soft shield and numerous gadgets, at the cost of insulation and solid armor. # WOLFGATE(SoftShield): soft shield
  components:
  - type: Sprite
    sprite: _Mono/Clothing/OuterClothing/Hardsuits/tsfmc_experimental.rsi # Mono
  - type: Clothing
    sprite: _Mono/Clothing/OuterClothing/Hardsuits/tsfmc_experimental.rsi # Mono
  - type: ToggleableClothing # Goobstation - Modsuits change - Mono - this is a solution for helmet attachment/cover to not fit on hardsuits
    requiredSlot: outerclothing
    blockUnequipWhenAttached: false
    replaceCurrentClothing: true
    clothingPrototypes:
      head:  ClothingHeadHelmetHardsuitNfsdExperimental
      helmetcover: ClothingHeadHelmetCoverBlock
      helmetattachment: ClothingHeadHelmetAttachmentBlock
  - type: PressureProtection
    highPressureMultiplier: 0.2
    lowPressureMultiplier: 1000
  - type: FireProtection # Mono
    reduction: 0.6
  - type: ExplosionResistance
    damageCoefficient: 0.4
  - type: TemperatureProtection
    heatingCoefficient: 0.01
    coolingCoefficient: 0.01
  - type: Armor # Mono - Armor Value Changes
    modifiers:
      coefficients:
        # WOLFGATE(ArmorBalance): sidegrade pass.
        Blunt: 0.7
        Slash: 0.7
        Piercing: 0.7
        Heat: 0.6
        Radiation: 0.5
        Caustic: 0.8
  - type: ClothingSpeedModifier # Mono - Armor Value Changes
    walkModifier: 1.15
    sprintModifier: 1.15
  - type: HeldSpeedModifier
  - type: FactionClothing
    faction: NanoTrasen
  - type: StaminaDamageResistance # Mono - Stamres
    coefficient: 0.25
  - type: PirateBountyItem # Mono
    id: ClothingOuterHardsuitTacsuitHighValue
  - type: WFSoftShield # WOLFGATE(SoftShield): brute damage bleeds through the field dampened.
  # Mono - Shielding comps
  - type: PersonalShield
    visuals:
      fillLevel: 0.2
      hexDensity: 6
      pixelGrid: 192
      color: "#E0FFFF"
      scale: 2.3
    shield:
      maxCharge: 200
      regenRate: 5
      spinupTime: 2.5
      breakCooldown: 20
      powerDraw: 0.5
      blockModifier:
        coefficients:
          Piercing: 0.5
          Heat: 1.5
          Radiation: 2.5
          Shock: 2.5
  - type: Battery
    maxCharge: 100
    startingCharge: 100
  - type: BatterySelfRecharger
    autoRecharge: true
    autoRechargeRate: 5
    autoRechargePauseTime: 5
  - type: UseDelay
    delay: 10
  - type: FootstepModifier # Mono
    footstepSoundCollection:
      path: /Audio/Mecha/sound_mecha_powerloader_step.ogg
  - type: ExtendDescription
    descriptionList:
    - description: Alt-click or otherwise interact to toggle additional shielding.
      color: "#4f94ad"
      requireDetailRange: true
    - description: The M92-x soft-shield lets blows and rounds through but bleeds off much of their force, and keeps its wearer from bleeding while it holds. It does nothing against lasers or fire. # WOLFGATE(SoftShield): soft shield
      color: "#94768c"
      requireDetailRange: true

