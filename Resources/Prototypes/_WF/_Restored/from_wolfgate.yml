      state: dead
      visible: false
  - type: GenericVisualizer
    visuals:
      enum.WFRemadeShellVisuals.Open:
        shell:
          True: { visible: false }
          False: { visible: true }
  - type: HTN
    rootTask:
      task: WFRemadeSkirmishHuntCompound
    blackboard:
      NavClimb: !type:Bool
        true
