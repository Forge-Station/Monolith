    allowedTiles: [WFFloorMerakRedDesertRock, WFFloorMerakRedDesertRockCracked]
    entities: [CMRockOrange]
  - !type:BiomeTileLayer
    threshold: -1
    tile: WFFloorMerakRedDesertSand
  - !type:BiomeTileLayer
    threshold: 0.15
    tile: WFFloorMerakRedDesertRock
    noise: { seed: 15, noiseType: OpenSimplex2, frequency: 0.012 }
  - !type:BiomeTileLayer
    threshold: 0.5
    tile: WFFloorMerakRedDesertRockCracked
    noise: { seed: 16, noiseType: OpenSimplex2, frequency: 0.015 }
  - !type:BiomeTileLayer
    threshold: 0.62
    tile: WFFloorMerakDarkSand
    noise: { seed: 17, noiseType: OpenSimplex2, frequency: 0.012 }

