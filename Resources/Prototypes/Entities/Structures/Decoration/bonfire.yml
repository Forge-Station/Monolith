- type: entity
  id: Bonfire
  parent: BaseStructure
  name: bonfire
  description: What can be better than a late evening under the sky with guitar and friends?
  components:
  - type: Sprite
    noRot: true
    sprite: Structures/Decoration/bonfire.rsi
    layers:
      - state: bonfire
        # WOLFGATE(Bonfires): named so the sprite can show a burnt-out fire
        map: ["base"]
      - state: burning
        # WOLFGATE(Bonfires): named so the sprite can show a burnt-out fire
        map: ["fire"]
  # WOLFGATE(Bonfires) START: a fire burns its fuel down, goes out, and is fed and lit again
  - type: WFBonfireFuel
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.WFBonfireVisuals.Lit:
        base:
          True: { state: bonfire }
          False: { state: bonfire_extinguished }
        fire:
          True: { visible: true }
          False: { visible: false }
  # WOLFGATE END
  - type: PointLight
    radius: 5
    energy: 3
    color: "#FFC90C"
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Wood
  - type: Destructible
    thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 50
        behaviors:
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
  - type: AmbientSound
    volume: -5
    range: 5
    sound:
      path: /Audio/Ambience/Objects/fireplace.ogg
  - type: AlwaysHot
  - type: Construction # Frontier
    graph: FiresGraph # Frontier
    node: BonfireNode # Frontier
  # WOLFGATE(Warmth): radiant warmth that holds off a blizzard, toward body temperature rather than past it
  - type: EntityRadiusHeater # Mono
    radius: 3.5
    thermalEnergy: 30000
    limit: 311

- type: entity
  id: LegionnaireBonfire
  parent: Bonfire
  name: legionnaire bonfire
  description: There, in the land of lava and ash, place to to cook marshmallow and potato.
  components:
  - type: Sprite
    layers:
      - state: legionnaire_bonfire
  - type: PointLight
    color: "#FF5601"
  # WOLFGATE(Bonfires): lava-world decor with no logs to burn: it keeps burning
  - type: WFBonfireFuel
    infinite: true
