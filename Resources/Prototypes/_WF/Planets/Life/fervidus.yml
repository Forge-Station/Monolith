    currentTemperature: 373.15

- type: entityTable
  id: WFFaunaFervidusAshfields
  table: !type:GroupSelector
    children:
    # A bird flock (_WF/Birds); the leader spawns the rest.
    - id: WFMobBirdAshHawk
      weight: 2
    - id: WFMobLaserRaptorFervidus
      weight: 3
    - id: WFMobAshGolem
      weight: 2

- type: entity
  id: WFFaunaFervidusAshfields
  parent: MarkerBase
  name: fervidus ashfield wildlife spawner
  categories: [HideSpawnMenu]
  components:
  - type: WFPlanetFaunaSpawner
    table: WFFaunaFervidusAshfields

- type: entityTable
  id: WFFaunaFervidusCrust
  table: !type:GroupSelector
    children:
    - id: WFMobCinderSlime
      weight: 32
    - id: WFMobHellspawnFervidus
      weight: 1

- type: entity
  id: WFFaunaFervidusCrust
  parent: MarkerBase
  name: fervidus lava crust wildlife spawner
  categories: [HideSpawnMenu]
  components:
  - type: WFPlanetFaunaSpawner
    table: WFFaunaFervidusCrust

# Produce.

# Raw it burns the mouth; two of them with water and sugar make a can of blossom fizz (below).
- type: entity
  id: WFFireBlossomBloom
  parent: WFWildProduceBase
  components:
  - type: Sprite
    sprite: Objects/Specific/Hydroponics/chili.rsi
    color: "#ffb24a"
  - type: FlavorProfile
    flavors:
    - spicy
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 10
        reagents:
        - ReagentId: Nutriment
          Quantity: 2
        - ReagentId: CapsaicinOil
          Quantity: 2

# Mildly toxic raw; cooking throws the poison away (the oven makes a new dish from the solids).
- type: entity
  id: WFAshShroom
  parent: WFWildMushroomBase
  components:
  - type: Sprite
    color: "#8c8c96"
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 10
        reagents:
        - ReagentId: Nutriment
          Quantity: 3
        - ReagentId: Toxin
          Quantity: 2

- type: entity
  id: WFCactusWaterPod
  parent: WFWildProduceBase
  components:
  - type: Sprite
    sprite: Objects/Specific/Hydroponics/aloe.rsi
    color: "#7fd1c0"
  - type: FlavorProfile
    flavors:
    - sweet
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 20
        reagents:
        - ReagentId: Water
          Quantity: 15
        - ReagentId: Nutriment
          Quantity: 1
  - type: Tag
    tags:
    - Fruit

- type: entity
  id: WFFoodSoupAshcap
  parent: FoodSoupMushroom

- type: entity
  id: WFDrinkBlossomFizz
  parent: DrinkEnergyDrinkCan
  components:
  - type: Sprite
    color: "#ffb070"

- type: microwaveMealRecipe
  id: RecipeWFAshShroomSoup
  name: wf-recipe-ash-shroom-soup
  result: WFFoodSoupAshcap
  time: 10
  group: Soup
  reagents:
    Water: 10
  solids:
    FoodBowlBig: 1
    WFAshShroom: 2
  recipeType:
  - Oven
  - Microwave

- type: microwaveMealRecipe
  id: RecipeWFBlossomFizz
  name: wf-recipe-blossom-fizz
  result: WFDrinkBlossomFizz
  time: 10
  group: Other
  reagents:
    Water: 10
    Sugar: 5
  solids:
    WFFireBlossomBloom: 2
  recipeType:
  - Oven
  - Microwave

# Plants. All are walk-through (BaseFlora); only the ones that react hurt.

# Stepping onto one burns. The bloom can be picked from a step away, which is safe.
- type: entity
  id: WFFloraFireBlossom
  parent: TgFloraAshFireblossom
  components:
  - type: Sprite
    layers:
    - state: fireblossom1
      map: ["bloom"]
  - type: PointLight
    radius: 1.2
    energy: 1.0
    color: "#ff8a3a"
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.WFRegrowingHarvestVisuals.Harvested:
        bloom:
          True: { scale: "0.75,0.75", color: "#7a6a60" }
          False: { scale: "1,1", color: "#ffffff" }
  - type: WFReactiveFlora
    behaviour: Lash
    range: 0.6
    cooldown: 4
    checkInterval: 0.5
    maxTargets: 0
    ignoreFactions: [Xeno]
    sound:
      collection: WFFloraSporePuff
    popup: wf-flora-fireblossom-singe
    damage:
      types:
        Heat: 4
  - type: WFRegrowingHarvest
    regrowTime: 480
    harvestTime: 2
    harvestSound:
      collection: WFFloraVineSnap
    table: !type:AllSelector
      children:
      - id: WFFireBlossomBloom
        amount: !type:RangeNumberSelector
          range: 1, 2

- type: entity
  id: WFFloraAshCapShroom
  parent: TgFloraAshCapShroom
  components:
  - type: Sprite
    layers:
    - state: r_mushroom1
      map: ["shroom"]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.WFRegrowingHarvestVisuals.Harvested:
        shroom:
          True: { scale: "0.7,0.7", color: "#6a625c" }
          False: { scale: "1,1", color: "#ffffff" }
  - type: WFRegrowingHarvest
