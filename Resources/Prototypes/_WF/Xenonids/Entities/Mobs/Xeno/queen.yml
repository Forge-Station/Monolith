  - type: XenoStrain
    name: rmc-xeno-magicalgirl-name
    description: rmc-xeno-magicalgirl-description
    popup: rmc-xeno-magicalgirl-popup

- type: entity
  parent: StationAiHolo
  id: RMCQueenEye
  name: queen eye
  description: It seems to be a visual projection of someone.
  categories: [ HideSpawnMenu, DoNotMap ]
  components:
  - type: Sprite
    color: "#a800a8"
    sprite: _WF/Xenonids/Effects/xeno_eye.rsi
    layers:
    - state: hudeye1
  - type: Eye
    drawFov: false
  - type: QueenEye
  # WOLFGATE: cut MotionDetectorTracked (motion detector)
  - type: Visibility
    layer: 32770
