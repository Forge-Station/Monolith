# TSFMC Halcyon: munitions, reactor parts, dispatches, stock, pirate hunting.

- type: wfContract
  id: WFContractTSFMunitions
  contractor: WFContractorHalcyon
  category: Hauling
  tier: 3
  title: wf-contract-tsf-munitions
  briefing: wf-contract-tsf-munitions-brief
  reward: 25000, 32500
  deposit: 5000
  minutes: 60
  weight: 1.2
  harms:
    WFContractorCamelot: 1
  objective: !type:WFContractCourier
    package: WFContractFreightMunitions
    count: 3, 6
    from: Board
    to: Contractor
    perPackage: 2750
    perKilometre: 2125

- type: wfContract
