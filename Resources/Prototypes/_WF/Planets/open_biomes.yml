# Planet-specific open terrain. Existing art, ore tables and biome layers; no upstream recipe changes.
# Entity layers resolve from bottom to top: hazards/scenery win over wildlife, so animals spawn in clearings.
# Low-frequency rock masks form occasional outcrops instead of a continuous wall field.

# Fervidus: black basalt flats, ashfields (WFFervidusAshFields, Biomes/fervidus.yml) and lava channels with a crust of cooled rock.
- type: biomeTemplate
  id: WFOpenBasalt
  layers:
  - !type:BiomeTileLayer
    tile: FloorBasalt
    threshold: -1
  - !type:BiomeEntityLayer
    allowedTiles: [FloorBasalt]
    entities: [WFFaunaFervidus]
    threshold: 0.95
    noise: { seed: 37, noiseType: OpenSimplex2, frequency: 3 }
  # Ashfields cover about a third of the surface: ash tiles, flora and small tar and sulfur pools.
  - !type:BiomeMetaLayer
    template: WFFervidusAshFields
    threshold: 0.12
    noise: { seed: 51, noiseType: OpenSimplex2, frequency: 0.007, fractalType: FBm, octaves: 2 }
  # A crust of cooled rock round every lava channel: the lava noise at a lower threshold.
  - !type:BiomeTileLayer
    tile: WFFloorFervidusAshRock
    threshold: 0.84
    noise: { seed: 3, noiseType: OpenSimplex2, frequency: 0.008, fractalType: Ridged, octaves: 1 }
  # Wildlife and spitting flowers of that crust: the same noise, so they stay in the band round the lava.
  - !type:BiomeMetaLayer
    template: WFFervidusLavaCrust
    threshold: 0.84
    noise: { seed: 3, noiseType: OpenSimplex2, frequency: 0.008, fractalType: Ridged, octaves: 1 }
  # Scattered volcanic rock, a layer for each kind; lit vents and siderite growths are the rarer sort.
  - !type:BiomeEntityLayer
    allowedTiles: [FloorBasalt, WFFloorFervidusAshDust, WFFloorFervidusAshRock, WFFloorFervidusAshDirt]
    entities: [GoonFakeobjectRockpile]
    threshold: 0.985
    noise: { seed: 71, noiseType: OpenSimplex2, frequency: 3 }
  - !type:BiomeEntityLayer
    allowedTiles: [FloorBasalt, WFFloorFervidusAshDust, WFFloorFervidusAshRock, WFFloorFervidusAshDirt]
    entities: [GoonFakeobjectRockpileBig]
    threshold: 0.985
    noise: { seed: 72, noiseType: OpenSimplex2, frequency: 3 }
  - !type:BiomeEntityLayer
    allowedTiles: [FloorBasalt, WFFloorFervidusAshDust, WFFloorFervidusAshRock, WFFloorFervidusAshDirt]
    entities: [CMRockBlackGroundDense]
    threshold: 0.985
    noise: { seed: 73, noiseType: OpenSimplex2, frequency: 3 }
  - !type:BiomeEntityLayer
    allowedTiles: [FloorBasalt, WFFloorFervidusAshDust, WFFloorFervidusAshRock, WFFloorFervidusAshDirt]
    entities: [CMRockBlackGroundDense3]
    threshold: 0.985
    noise: { seed: 74, noiseType: OpenSimplex2, frequency: 3 }
  - !type:BiomeEntityLayer
    allowedTiles: [FloorBasalt, WFFloorFervidusAshDust, WFFloorFervidusAshRock, WFFloorFervidusAshDirt]
    entities: [TgFloraRockVolcano]
    threshold: 0.99
    noise: { seed: 75, noiseType: OpenSimplex2, frequency: 3 }
  - !type:BiomeEntityLayer
    allowedTiles: [FloorBasalt, WFFloorFervidusAshDust, WFFloorFervidusAshRock, WFFloorFervidusAshDirt]
    entities: [TgFloraRockSideriteGrowth]
    threshold: 0.99
    noise: { seed: 76, noiseType: OpenSimplex2, frequency: 3 }
  - !type:BiomeEntityLayer
    allowedTiles: [FloorBasalt, WFFloorFervidusAshDust, WFFloorFervidusAshRock, WFFloorFervidusAshDirt]
    entities: [BasaltOne, BasaltTwo, BasaltThree]
    threshold: 0.97
    noise: { seed: 2, noiseType: OpenSimplex2, frequency: 1 }
  - !type:BiomeEntityLayer
    allowedTiles: [FloorBasalt, WFFloorFervidusAshDust, WFFloorFervidusAshRock, WFFloorFervidusAshDirt]
    entities: [MonoPlanetmapOreBasalt]
    threshold: 0.65
    noise: { seed: 11, noiseType: OpenSimplex2, frequency: 0.022 }
  - !type:BiomeEntityLayer
    allowedTiles: [FloorBasalt, WFFloorFervidusAshDust, WFFloorFervidusAshRock, WFFloorFervidusAshDirt]
    entities: [FloorLavaEntity]
    threshold: 0.94
    noise: { seed: 3, noiseType: OpenSimplex2, frequency: 0.008, fractalType: Ridged, octaves: 1 }

- type: biomeTemplate
  id: WFShadowClearings
  layers:
  - !type:BiomeTileLayer
    tile: FloorChromite
    threshold: -1
  - !type:BiomeEntityLayer
    allowedTiles: [FloorChromite, WFFloorAerumnaClay, WFFloorAerumnaClayRock, WFFloorAerumnaDusk]
    entities: [WFFaunaAerumna]
    threshold: 0.95
    noise: { seed: 37, noiseType: OpenSimplex2, frequency: 3 }
  # Shrouded clay flats between the groves, with patches of bare rock; chromite shows through elsewhere.
  - !type:BiomeTileLayer
    tile: WFFloorAerumnaDusk
    threshold: -0.08
    noise: { seed: 61, noiseType: OpenSimplex2, frequency: 0.011, fractalType: FBm, octaves: 2 }
  - !type:BiomeTileLayer
    tile: WFFloorAerumnaClay
    threshold: 0.1
    noise: { seed: 61, noiseType: OpenSimplex2, frequency: 0.011, fractalType: FBm, octaves: 2 }
  - !type:BiomeTileLayer
    tile: WFFloorAerumnaClayRock
    threshold: 0.5
    noise: { seed: 61, noiseType: OpenSimplex2, frequency: 0.011, fractalType: FBm, octaves: 2 }
  - !type:BiomeMetaLayer
    template: WFShadowGrove
    threshold: 0.35
    noise: { seed: 16, noiseType: OpenSimplex2, frequency: 0.018 }
  # The fungal forest and its shrouded ground.
  - !type:BiomeMetaLayer
    template: WFAerumnaFungalForest
    threshold: 0.4
    noise: { seed: 71, noiseType: OpenSimplex2, frequency: 0.009, fractalType: FBm, octaves: 2 }
  - !type:BiomeMetaLayer
    template: WFAerumnaBoulderField
    threshold: 0.55
    noise: { seed: 89, noiseType: OpenSimplex2, frequency: 0.014 }
  - !type:BiomeMetaLayer
    template: WFAerumnaRuinPocket
    threshold: 0.88
    noise: { seed: 97, noiseType: OpenSimplex2, frequency: 0.045 }
  - !type:BiomeTileLayer
    tile: WFFloorAerumnaDusk
    threshold: 0.7
    noise: { seed: 83, noiseType: OpenSimplex2, frequency: 0.010 }
  - !type:BiomeMetaLayer
    template: WFAerumnaCrystalSpires
    threshold: 0.82
    noise: { seed: 83, noiseType: OpenSimplex2, frequency: 0.010 }
  # The xenonid hive, last so its ground wins where regions overlap; a dusk band rings it, on the hive's own noise.
  - !type:BiomeTileLayer
    tile: WFFloorAerumnaDusk
    threshold: 0.48
    noise: { seed: 131, noiseType: OpenSimplex2, frequency: 0.012, fractalType: FBm, octaves: 2 }
  - !type:BiomeMetaLayer
    template: WFAerumnaHive
    threshold: 0.6
    noise: { seed: 131, noiseType: OpenSimplex2, frequency: 0.012, fractalType: FBm, octaves: 2 }
  # Lone stones scattered over the flats.
  - !type:BiomeEntityLayer
    allowedTiles: [FloorChromite, WFFloorAerumnaClay, WFFloorAerumnaClayRock, WFFloorAerumnaDusk]
    entities: [GoonStone2, GoonStone3, GoonStone4, GoonStone5, DarkPackFloraRockDarkpack]
    threshold: 0.965
    noise: { seed: 91, noiseType: OpenSimplex2, frequency: 4 }
  - !type:BiomeEntityLayer
    allowedTiles: [FloorChromite, WFFloorAerumnaClay, WFFloorAerumnaClayRock, WFFloorAerumnaDusk, WFFloorAerumnaCrystalBed]
    entities: [CrystalPink]
    threshold: 0.985
    noise: { seed: 2, noiseType: OpenSimplex2, frequency: 1 }
  - !type:BiomeEntityLayer
    allowedTiles: [FloorChromite, WFFloorAerumnaClay, WFFloorAerumnaClayRock, WFFloorAerumnaDusk]
    entities: [MonoPlanetmapOreChromite]
    threshold: 0.72
    noise: { seed: 19, noiseType: OpenSimplex2, frequency: 0.025 }
  # Pools in the clearings, a dozen tiles or so across.
  - !type:BiomeEntityLayer
    allowedTiles: [FloorChromite, WFFloorAerumnaClay, WFFloorAerumnaClayRock, WFFloorAerumnaDusk, WFFloorAerumnaShroud, WFFloorAerumnaCrystalBed, WFFloorAerumnaHive]
    entities: [MonoFloorWaterEntity]
    threshold: 0.75
    noise: { seed: 41, noiseType: OpenSimplex2, frequency: 0.016, fractalType: FBm, octaves: 2 }

- type: biomeTemplate
