  - type: Temperature
    heatDamage:
      types:
        Heat: 5
    coldDamage: {}
    coldDamageThreshold: 0
  - type: Flammable
    damage:
      types:
        Heat: 3
  - type: Reactive
    groups:
      Flammable: [ Touch ]
      Extinguish: [ Touch ]

# Nodes. Each feeds corruption within its reach up to its capacity (WFCorruptionNode).

# Prototypes/_WF/Remade/roster.yml entity WFRemadeHopper
- type: entity
  parent: WFRemadeBase
  id: WFRemadeHopper
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: _WF/Remade/Mobs/hopper.rsi
    noRot: true
    layers:
    - map: [ "l_leg" ]
      state: hopper_l_leg
    - map: [ "r_leg" ]
      state: hopper_r_leg
    - map: [ "chest" ]
      state: hopper_chest
    - map: [ "tail" ]
      state: hopper_r_arm
    - map: [ "head" ]
      state: hopper_head
    - map: [ "dead" ]
      state: dead
      visible: false
  - type: HTN
    rootTask:
      task: WFRemadeHopperCompound
    blackboard:
      NavClimb: !type:Bool
        true
      NavInteract: !type:Bool
        true
      NavPry: !type:Bool
        true
      NavSmash: !type:Bool
        true
      VisionRadius: !type:Single
        14
      AggroVisionRadius: !type:Single
        20
  # Sneaking flags it for the client to draw under a table, as for Rodentia; a hider sets it itself.
  - type: CrawlUnderObjects
    sneakSpeedModifier: 1
  - type: WFHider
  - type: Damageable
    damageContainer: Biological
    damageModifierSet: WFRemadeHopper
  - type: MobThresholds
    thresholds:
      0: Alive
      65: Dead
  # DS13: speedmod 0.5, almost as fast as a person.
  - type: MovementSpeedModifier
    baseWalkSpeed: 4.2
    baseSprintSpeed: 4.2
  - type: MeleeWeapon
    altDisarm: false
    angle: 0
    attackRate: 1
    animation: WeaponArcClaw
    soundSwing:
      collection: WFRemadeLeaperAttack
    soundHit:
      path: /Audio/Weapons/slash.ogg
    damage:
      types:
        Slash: 12
  - type: FootstepModifier
    footstepSoundCollection:
      collection: WFRemadeLeaperFootstep
  - type: WFRemadeVoice
    speech:
      collection: WFRemadeLeaperSpeech
    pain:
      collection: WFRemadeLeaperPain
    death:
      collection: WFRemadeLeaperDeath
    shout:
      collection: WFRemadeLeaperShoutLong
  - type: WFRemadeLimbs
    rsi: _WF/Remade/Mobs/hopper.rsi
    floors: { Melee: 0.2, Speed: 0.15, Sight: 0.4 }
    limbs:
    - id: l_leg
      name: wf-remade-limb-leg-left
      health: 15
      weight: 1.5
      loss: 8
      zones: [ LeftLeg, LeftFoot ]
      provides: { Speed: 0.5, Leap: 0.5 }
      lying: l_arm_lying
    - id: r_leg
      name: wf-remade-limb-leg-right
      health: 15
      weight: 1.5
      loss: 8
      zones: [ RightLeg, RightFoot ]
      provides: { Speed: 0.5, Leap: 0.5 }
      lying: r_arm_lying
    - id: chest
      health: 100
      weight: 3
      scale: 0.4
      severable: false
      zones: [ Torso, Groin ]
      lying: hopper_chest_lying
    - id: tail
      name: wf-remade-limb-tail
      health: 12
      weight: 1
      loss: 6
      zones: [ LeftArm, LeftHand, RightArm, RightHand ]
      lying: tail_lying
    - id: head
      name: wf-remade-limb-head
      health: 20
      weight: 1
      loss: 20
      zones: [ Head ]
      provides: { Voice: 1, Sight: 1 }
      lying: head_lying
  - type: WFRemadeAbilities
    abilities:
    - !type:WFShoutAbility
      cooldown: 10
      range: 16
      radius: 5
      shakeTime: 1.5
      sound:
        collection: WFRemadeLeaperShout
    - !type:WFLeapAbility
      cooldown: 15
      minRange: 2.5
      range: 7
      windUp: 0.5
      speed: 12
      overshoot: 0.8
      knockdownTime: 1
      damage:
        types:
          Slash: 12
      sound:
        collection: WFRemadeLeaperShout
      hitSound:
        collection: WFRemadeLeaperClaw

