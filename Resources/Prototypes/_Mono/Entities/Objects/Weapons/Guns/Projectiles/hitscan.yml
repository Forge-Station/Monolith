- type: entity
  id: PulsedPlasma
  parent: BasicHitscan
  categories: [ HideSpawnMenu ]
  components:
  - type: HitscanBasicDamage
    damage:
      types:
        Heat: 40 # Forge-change 95->40
        # Blunt: 5 # Forge-change
        # Shock: 10 # Forge-change
        Radiation: 20 # Forge-change 65->20
        Structural: 400 # Forge-change 700->400
    ignoreResistances: true # Forge-change
  - type: HitscanBasicRaycast
    maxDistance: 120.0
  - type: HitscanBasicVisuals
    muzzleFlash:
      sprite: _Goobstation/Objects/Weapons/Guns/Projectiles/small_laser.rsi
      state: muzzle_beam_light_pulse
    travelFlash:
      sprite: _Goobstation/Objects/Weapons/Guns/Projectiles/small_laser.rsi
      state: beam_light_pulse
    impactFlash:
      sprite: _Goobstation/Objects/Weapons/Guns/Projectiles/small_laser.rsi
      state: impact_beam_light_pulse
  - type: HitscanReflect # Forge-change
    reflectiveType: None # Forge-change

