- type: npcFaction
  id: WFRemade
  defaultHostile: true
  friendly:
  - WFChoir

# Armour numbers from DS13-2.0's slasher.
- type: damageModifierSet
  id: WFRemadeFlesh
  coefficients:
    Blunt: 0.6
    Piercing: 0.55
    Slash: 0.8
    Heat: 1.2
    Cold: 0
    Poison: 0
    Radiation: 0
    Asphyxiation: 0
    Bloodloss: 0

- type: entity
  abstract: true
  parent: SimpleSpaceMobBase
  id: WFRemadeBase
  components:
  - type: Insulated
  - type: CombatMode
  - type: InputMover
  - type: MobMover
  - type: HTN
    rootTask:
      task: WFRemadeHuntCompound
    blackboard:
      NavClimb: !type:Bool
        true
      NavInteract: !type:Bool
        true
      NavPry: !type:Bool
        true
      NavSmash: !type:Bool
        true
      VisionRadius: !type:Single
        14
      AggroVisionRadius: !type:Single
        20
  - type: NPCRetaliation
    attackMemoryLength: 20
  - type: Prying
    pryPowered: true
    force: true
    speedModifier: 3
    useSound:
      path: /Audio/Items/crowbar.ogg
  - type: UseDelay
    delay: 1
  - type: NpcFactionMember
    factions:
    - WFRemade
  # Breaks what is in its way when it has made no headway; the Monolith and its growths are its own.
  - type: WFStuckBreaker
    spare:
      components:
      - WFMonolith
      - WFMonolithTap
      - WFGrowth
  - type: Hands
  - type: ComplexInteraction
  # No hands to pull with: a Remade drags a corpse to a vent by its grip all the same.
  - type: Puller
    needsHands: false
  - type: Damageable
    damageContainer: Biological
    damageModifierSet: WFRemadeFlesh
  - type: WolfmedDamageCause
    cause: Unarmed
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 150
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: MobState
    allowedStates:
    - Alive
    - Dead
  - type: SlowOnDamage
    speedModifierThresholds: {}
  - type: DamageStateVisuals
    states:
      Alive:
        Base: full
      Dead:
        Base: dead
  - type: Temperature
    heatDamageThreshold: 400
    coldDamageThreshold: -150
    currentTemperature: 310.15
  - type: Tag
    tags:
    - CannotSuicide
    - DoorBumpOpener
    - FootstepSound
    - WFRemade
  - type: NoSlip
  - type: MovementIgnoreGravity
  - type: ProtectedFromStepTriggers
  - type: ZombieImmune
  - type: Speech
    enabled: false

- type: entity
  parent: BaseItem
  id: WFRemadeSeveredLimb
  components:
  - type: Sprite
    sprite: _WF/Remade/Mobs/slasher.rsi
    layers:
    - state: l_arm_lying
  - type: Item
    size: Large
  - type: TimedDespawn
    lifetime: 600
  # Burn a severed limb to ash, or blow it apart: a mender can't take back what is gone.
  - type: Damageable
    damageContainer: Biological
  - type: Flammable
    fireSpread: true
    alwaysCombustible: true
    canExtinguish: true
    damage:
      types:
        Heat: 4
  - type: Appearance
  - type: FireVisuals
    sprite: Effects/fire.rsi
    normalState: fire
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTypeTrigger
        damageType: Heat
        damage: 20
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          Ash:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 80
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  parent: WFRemadeBase
  id: WFRemadeSlasher
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: _WF/Remade/Mobs/slasher.rsi
    noRot: true
    offset: 0,0.25
    layers:
    - map: [ "l_leg" ]
      state: slasher_l_leg
    - map: [ "r_leg" ]
      state: slasher_r_leg
    - map: [ "chest" ]
      state: slasher_chest
    - map: [ "l_arm" ]
      state: slasher_l_arm
    - map: [ "r_arm" ]
      state: slasher_r_arm
    - map: [ "head" ]
      state: slasher_head
    - map: [ "dead" ]
      state: dead
      visible: false
  - type: MobThresholds
    thresholds:
      0: Alive
      100: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 3.2
    baseSprintSpeed: 3.2
  - type: MeleeWeapon
    altDisarm: false
    angle: 0
    attackRate: 0.8
    animation: WeaponArcClaw
    soundSwing:
      collection: WFRemadeSlasherAttack
    soundHit:
      path: /Audio/Weapons/slash.ogg
    damage:
      types:
        Slash: 13
  - type: WFRemadeVoice
    speech:
      collection: WFRemadeSlasherSpeech
    pain:
      collection: WFRemadeSlasherPain
    death:
      collection: WFRemadeSlasherDeath
    shout:
      collection: WFRemadeSlasherShoutLong
  - type: WFRemadeLimbs
    rsi: _WF/Remade/Mobs/slasher.rsi
    floors: { Melee: 0.2, Speed: 0.12, Sight: 0.4 }
    limbs:
    - id: l_leg
      name: wf-remade-limb-leg-left
      health: 30
      weight: 1.5
      loss: 18
      zones: [ LeftLeg, LeftFoot ]
      provides: { Speed: 0.5 }
      lying: l_leg_lying
    - id: r_leg
      name: wf-remade-limb-leg-right
      health: 30
      weight: 1.5
      loss: 18
      zones: [ RightLeg, RightFoot ]
      provides: { Speed: 0.5 }
      lying: r_leg_lying
    - id: chest
      health: 200
      weight: 3
      scale: 0.3
      severable: false
      zones: [ Torso, Groin ]
      lying: torso_lying
    - id: l_arm
      name: wf-remade-limb-blade-left
      health: 25
      weight: 1.5
      loss: 12
      zones: [ LeftArm, LeftHand ]
      provides: { Melee: 0.5 }
      lying: l_arm_lying
    - id: r_arm
      name: wf-remade-limb-blade-right
      health: 25
      weight: 1.5
      loss: 12
      zones: [ RightArm, RightHand ]
      provides: { Melee: 0.5 }
      lying: r_arm_lying
    - id: head
      name: wf-remade-limb-head
      health: 30
      weight: 1
      loss: 30
      zones: [ Head ]
      provides: { Voice: 1, Sight: 1 }
      lying: head_lying
  - type: WFRemadeAbilities
    abilities:
    - !type:WFShoutAbility
      cooldown: 8
      range: 20
      sound:
        collection: WFRemadeSlasherShout
    - !type:WFChargeAbility
      cooldown: 12
      minRange: 3.5
      range: 12
      windUp: 1
      duration: 4
      speed: 2.2
      sound:
        collection: WFRemadeSlasherShoutLong
      hitSound:
        path: /Audio/Effects/hit_kick.ogg
    - !type:WFDodgeAbility
      cooldown: 20
      sound:
        collection: WFRemadeSlasherSpeech

