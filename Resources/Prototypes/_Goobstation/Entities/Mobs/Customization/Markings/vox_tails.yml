- type: marking
  id: VoxTailAnimated
  bodyPart: Tail
  markingCategory: Tail
  speciesRestriction: [] # Intentional to keep it from showing in the customization menu
  forcedColoring: true
  layering: # WOLFGATE - the south frame draws behind the body, so the tail never covers anatomy
    tail_animated_BEHIND: TailBehind
  colorLinks: # WOLFGATE - both halves of a tail share one colour
    tail_animated_BEHIND: tail_animated_FRONT
  sprites:
  - sprite: _WF/Mobs/Customization/TailSplit/Mobs/Customization/vox_parts.rsi # WOLFGATE - split art
    state: tail_animated_FRONT
  - sprite: _WF/Mobs/Customization/TailSplit/Mobs/Customization/vox_parts.rsi # WOLFGATE - south frame on TailBehind
    state: tail_animated_BEHIND

