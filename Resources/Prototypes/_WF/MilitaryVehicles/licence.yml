# The heavy vehicle licence: made out to whoever buys it at the station counter, or to the faction crew who start
# with one. Carrying one lets the holder buy military chassis and weapon hardpoints. Names are in
# military_vehicles.ftl.

- type: entity
  parent: BaseItem
  id: WFHeavyVehicleLicence
  components:
  - type: Item
    size: Tiny
  - type: Sprite
    sprite: Objects/Misc/id_cards.rsi
    layers:
    - state: gold
  - type: WFHeavyVehicleLicence
  - type: StaticPrice
    price: 0

# Faction crew who start the shift licensed: the NFSD, the TSF and the PDV's fighting and command jobs.
- type: wfLicenceIssue
  id: WFLicenceIssueFactions
  licence: WFHeavyVehicleLicence
  jobs:
  # NFSD
  - Sheriff
  - SeniorOfficer
  - Deputy
  - Cadet
  - Bailiff
  - Brigmedic
  - NFDetective
  - PublicAffairsLiaison
  # TSF
  - TsfMarsoc
  - TsfEngineer
  - TsfInfantry
  # PDV
  - PDVPrince
  - PDVAmbassador
  - PDVTarkhan
  - PdvInfantry
  - PDVDenasvar
