# A killable trader's brain. It has no weapon and never fights: it stands about, and runs for the tile that
# TraderFleeSystem writes to WFTraderFleeTarget while somebody who hurt it is near.
- type: htnCompound
  id: WFTraderCompound
  branches:
  - preconditions:
    - !type:KeyExistsPrecondition
      key: WFTraderFleeTarget
    tasks:
    - !type:HTNPrimitiveTask
      operator: !type:MoveToOperator
        targetKey: WFTraderFleeTarget
        rangeKey: MovementRange
  - tasks:
    - !type:HTNPrimitiveTask
      operator: !type:RandomOperator
        targetKey: IdleTime
        minKey: MinimumIdleTime
        maxKey: MaximumIdleTime
    - !type:HTNPrimitiveTask
      operator: !type:WaitOperator
        key: IdleTime

# The same, with a hunger: he walks to the body TraderDevourSystem writes to WFTraderMealTarget, unless he is running.
- type: htnCompound
  id: WFTraderDevourCompound
  branches:
  - preconditions:
    - !type:KeyExistsPrecondition
      key: WFTraderFleeTarget
    tasks:
    - !type:HTNPrimitiveTask
      operator: !type:MoveToOperator
        targetKey: WFTraderFleeTarget
        rangeKey: MovementRange
  - preconditions:
    - !type:KeyExistsPrecondition
      key: WFTraderMealTarget
    tasks:
    - !type:HTNPrimitiveTask
      operator: !type:MoveToOperator
        targetKey: WFTraderMealTarget
        rangeKey: MovementRange
  - tasks:
    - !type:HTNPrimitiveTask
      operator: !type:RandomOperator
        targetKey: IdleTime
        minKey: MinimumIdleTime
        maxKey: MaximumIdleTime
    - !type:HTNPrimitiveTask
      operator: !type:WaitOperator
        key: IdleTime
