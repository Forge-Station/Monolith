    follow: true
    location: Box Van
  - type: Fixtures
    fixtures:
      world:
        shape:
          !type:PhysShapeAabb
          bounds: -0.55,-0.35,0.55,1.4
        density: 1000
        mask:
        - Impassable
        - HighImpassable
        - LowImpassable
        - LargeMobLayer
        - Vehicle
        layer:
        - LargeMobLayer
        - Vehicle
      mob:
        shape:
          !type:PhysShapeAabb
          bounds: -0.55,-0.35,0.55,1.4
        density: 1000
        mask:
        - MidImpassable
        - LargeMobLayer
        layer:
        - LargeMobLayer
  - type: Sprite
    offset: "0,0.5"
    drawdepth: Mobs
    sprite: _WF/Vehicles/box_van.rsi
    layers:
    - map: [ base ]
      state: van_base
    - map: [ damaged_frame ]
      state: damaged_frame
      visible: false
    - map: [ rmc-wheels ]
      state: wheels_1
  - type: VehicleEnter
    interiorPath: /Maps/_WF/Vehicles/Interiors/box_van_interior.yml
    enterDoAfter: 1.0
    exitDoAfter: 1.0
    maxPassengers: 8
    entryPoints:
    - offset: 1,-0.25
      radius: 0.6
      interiorCoords: -0.42,1.6
    - offset: -1,-0.25
      radius: 0.6
      interiorCoords: -0.53,0.84
    - offset: 0,2
      radius: 0.75
      interiorCoords: -1.74,1.22

- type: entity
  parent: VehicleBoxVanBase
