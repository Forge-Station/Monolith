# The orbit-layer marker over a point of interest; renamed at spawn and again once identified. Radars draw sites from
# the world's signal list (_WF/PlanetSignals), on every layer, not from this marker.

- type: entity
  id: WFPoiSignal
  name: Unknown signal
  categories: [ HideSpawnMenu ]
  components:
    - type: WarpPoint
      adminOnly: true
    - type: FTLSmashImmune
