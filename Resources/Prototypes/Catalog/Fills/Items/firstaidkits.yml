#Entities found at entities/objects/specific/medical
- type: entity
  id: MedkitFilled
  suffix: Filled
  parent: Medkit
  components:
  - type: StorageFill
    contents:
      - id: Brutepack
      - id: Ointment
      - id: Gauze
      # WOLFGATE(Wolfmed) START: ITEMS: the standard kit's tourniquet, splint and painkillers in a bottle; playtest 5, a suture.
      # Fourteen of Medkit's fourteen cells with the tricordrazine; WolfmedAvailabilityTest spawns the kit.
      - id: Tourniquet
      - id: WFWolfmedSplint
      - id: WFWolfmedSuture
      - id: WFWolfmedAnalgesicPillCanister
      # WOLFGATE END
      - id: PillCanisterTricordrazine
      # see https://github.com/tgstation/blob/master/code/game/objects/items/storage/firstaid.dm for example contents

- type: entity
  id: MedkitBurnFilled
  suffix: Filled
  parent: MedkitBurn
  components:
  - type: StorageFill
    contents:
      - id: Ointment
        amount: 2
      - id: PillCanisterKelotane
      - id: PillCanisterDermaline
      # WOLFGATE(Wolfmed): W7: charring is a burn and nothing else in this kit reaches it.
      # Eight of fourteen cells - WolfmedAvailabilityTest spawns the kit so an overflow fails a test, not a round.
      - id: WFWolfmedSkinGraft

- type: entity
  id: MedkitBruteFilled
  suffix: Filled
  parent: MedkitBrute
  components:
  - type: StorageFill
    contents:
      - id: Brutepack
      - id: Gauze
      - id: PillCanisterIron
      - id: PillCanisterCopper
      # WOLFGATE(Wolfmed): V5: bones break from blunt force, which is what this kit is for.
      # Thirteen of fourteen cells - WolfmedAvailabilityTest spawns the kit so an overflow fails a test, not a round.
      - id: WFWolfmedSplint
      - id: WFWolfmedOsteogenPillCanister # WOLFGATE(Wolfmed): ITEMS: knits the simple break the splint holds.
      # WOLFGATE(Wolfmed) START: playtest 5: the trauma kit stops a bleed too.
      - id: Tourniquet
      - id: WFWolfmedSuture
      # WOLFGATE END

