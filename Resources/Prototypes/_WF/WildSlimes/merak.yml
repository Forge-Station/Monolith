# Merak's wild slimes: the sandglass slime and the amber slime bred from it. Patches of fused desert glass at the edge of
# the oases, each over a fossil-bed grotto in the Sandstone Galleries. The zone is the oasis noise itself, lower than the
# oasis, and the glass stops where the oasis begins. The cavern's seed is the surface's plus 7927, so each cavern noise
# seed is the surface one less 7927, and lower thresholds make each grotto a little wider than its patch.

- type: wfWildSlimeHabitat
  id: WFWildSlimesMerak
  surface: WFSurfaceMerak
  breed: WFSandglassMutation
  babyPrototype: WFMobSlimeTranslucentBaby
  adultPrototype: WFMobSlimeTranslucentAdult
  adultChance: 0.3
  patchTemplate: WFMerakSlimeZone
  patchTile: WFFloorMerakGlassSand
  grottoTile: WFCavernFloorMerakGlassSand
  minPatchTiles: 24
  surfaceSlimes: 3
  grottoSlimes: 2
  respawnDelay: 600

# Glassy and slow: it stores water, so water heals it and it spills some when it dies, and it digs in when hurt. It
# shrugs off the desert's heat and grows and splits only in hot air.
- type: breed
  breedName: sandglass slime
  id: WFSandglassMutation
  producedExtract: WFSandglassSlimeExtract
  components:
  - type: Slime
    breed: WFSandglassMutation
    slimeColor: "#d6b07a"
    defaultSlimeProto: WFMobSlimeTranslucentBaby
    maxOffspring: 4
    mutationChance: 0.1
    potentialMutations:
    - WFAmberMutation
  - type: WFSlimeClimate
    minTemperature: 305
    maxTemperature: 340
  - type: MovementSpeedModifier
    baseWalkSpeed: 1.2
    baseSprintSpeed: 2.4
  - type: Temperature
    heatDamageThreshold: 360
    coldDamageThreshold: 260
    currentTemperature: 318.15
    specificHeat: 42
    coldDamage:
      types:
        Cold: 1
    heatDamage:
      types:
        Heat: 1.5
  - type: Reactive
    groups:
      Flammable:
      - Touch
      Extinguish:
      - Touch
    reactions:
    - reagents:
      - Water
      - SpaceCleaner
      methods:
      - Touch
      effects:
      - !type:WashCreamPieReaction {}
    - reagents:
      - Water
      methods:
      - Touch
      effects:
      - !type:HealthChange
        damage:
          groups:
            Brute: -2
  - type: WFReagentBathHeal
    reagents:
    - Water
    heal:
      groups:
        Brute: -1
  - type: WFSpillOnDeath
    solution:
      reagents:
      - ReagentId: Water
        Quantity: 15
  - type: WFDigIn

# Bred only from sandglass slimes, gold with a fossil speck; it breeds back to them.
- type: breed
  breedName: amber slime
  id: WFAmberMutation
  producedExtract: WFAmberSlimeExtract
  components:
  - type: Slime
    breed: WFAmberMutation
    slimeColor: "#e8a530"
    defaultSlimeProto: WFMobSlimeTranslucentBaby
    maxOffspring: 3
    mutationChance: 0.3
    potentialMutations:
    - WFSandglassMutation
  - type: WFSlimeClimate
    minTemperature: 305
    maxTemperature: 340
  - type: MovementSpeedModifier
    baseWalkSpeed: 1.2
    baseSprintSpeed: 2.4
  - type: Temperature
    heatDamageThreshold: 360
    coldDamageThreshold: 260
    currentTemperature: 318.15
    specificHeat: 42
    coldDamage:
      types:
        Cold: 1
    heatDamage:
      types:
        Heat: 1.5
  - type: Reactive
    groups:
      Flammable:
      - Touch
      Extinguish:
      - Touch
    reactions:
    - reagents:
      - Water
      - SpaceCleaner
      methods:
      - Touch
      effects:
      - !type:WashCreamPieReaction {}
    - reagents:
      - Water
      methods:
      - Touch
      effects:
      - !type:HealthChange
        damage:
          groups:
            Brute: -2
  - type: WFReagentBathHeal
    reagents:
    - Water
    heal:
      groups:
        Brute: -1
  - type: WFSpillOnDeath
    solution:
      reagents:
      - ReagentId: Water
