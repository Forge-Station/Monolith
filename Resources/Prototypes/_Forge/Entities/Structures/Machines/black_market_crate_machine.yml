- type: entity
  id: BlackMarketCrateMachine
  name: black market cargo lift
  description: Delivers contraband crates for the black market console.
  placement:
    mode: SnapgridCenter
  components:
  - type: ItemPlacer
    whitelist:
      requireAll: true
      components:
      - EntityStorage
      - PaperLabel
      - ContainerContainer
  - type: CrateMachine
    kind: BlackMarket
    cratePrototype: CrateGenericSteel
  - type: BlackMarketCrateSpawner
  - type: Sprite
    sprite: _NF/Structures/Machines/crate_machine.rsi
    snapCardinals: true
    drawdepth: HighFloorObjects
    layers:
    - state: background
      map: [ "enum.CrateMachineVisualLayers.Base" ]
    - state: opening
      map: ["enum.CrateMachineVisualLayers.Opening"]
    - state: open
      map: [ "enum.CrateMachineVisualLayers.Open" ]
    - state: crate
      map: [ "enum.CrateMachineVisualLayers.Crate" ]
    - state: closing
      map: ["enum.CrateMachineVisualLayers.Closing" ]
    - state: closed
      map: ["enum.CrateMachineVisualLayers.Closed"]
  - type: AnimationPlayer
  - type: Transform
    anchored: true
  - type: Physics
    canCollide: false
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 300
        mask:
        - MachineMask
        layer:
        - Impassable
        - MidImpassable
        - LowImpassable
        hard: False
  - type: InteractionOutline
  - type: Appearance
  - type: ApcPowerReceiver
    powerLoad: 0
  - type: Tag
    tags:
    - Structure
