# Merak: dune seas, red-rock badlands, cactus fields, quake-cracked gravel flats and rare oases.
# Every outdoor tile is a weather child so dust storms draw; soft ground digs through to the cavern like the old sand.

# Dune seas
- type: tile
  id: WFFloorMerakDuneSand
  parent: RMCPlanetSandWet
  weather: true
  baseTurf: Space
  deconstructTools: [ Digging ]
  deconstructTimeMultiplier: 1
  itemDrop: DesertSand1
  footstepSounds:
    collection: FootstepAsteroid
  barestepSounds:
    collection: FootstepAsteroid

