## SPP Vans
- type: entity
  parent: VehicleVanBase
  id: VehicleSPPVan
  name: SPP van
  description: A rugged transport van painted in SPP colors.
  suffix: Drivable, Van, SPP, Transport
  components:
  - type: Sprite
    sprite: _WF/Vehicles/sppvan.rsi
    layers:
    - map: [ base ]
      state: sppvan_base
    - map: [ damaged_frame ]
      state: damaged_frame
      visible: false
    - map: [ rmc-wheels ]
      state: wheels_1
  - type: VehicleEnter
    interiorPath: /Maps/_WF/Vehicles/Interiors/spp_van_interior.yml
    enterDoAfter: 1.0
    exitDoAfter: 1.0
    maxPassengers: 8
    entryPoints:
    - offset: 0,1.5
      radius: 0.8
      interiorCoords: 0.35,0.25
    - offset: 1.2,-0.3
      radius: 0.7
      interiorCoords: 2.5,0.9
    - offset: -1.2,-0.3
      radius: 0.7
      interiorCoords: 2.5,-0.2
  - type: HardpointSlots
    vehicleFamily: HardpointVehicleFamilyVan
    slots:
    - id: wheel-1
      hardpointType: HardpointTypeWheel
      slotType: HardpointSlotTypeWheel
      compatibilityId: HardpointCompatibilitySPPVan
      insertDelay: 1.5
  - type: ItemSlots
    slots:
      wheel-1:
        startingItem: VehicleSPPVanWheel
        whitelist:
          components:
          - VehicleWheelItem

- type: entity
  parent: VehicleSPPVan
  id: VehicleSPPVanArmed
  name: SPP van (armed)
  description: An SPP van fitted with a roof-mounted weapon.
  suffix: Drivable, Van, SPP, Armed
  components:
  - type: WFMilitaryVehicle
  - type: Sprite
    layers:
    - map: [ base ]
      state: sppvant_base
    - map: [ damaged_frame ]
      state: damaged_frame
      visible: false
    - map: [ secondary ]
      state: SECONDARY
      visible: false
    - map: [ rmc-wheels ]
      state: wheels_1
  - type: VehicleHardpointVisuals
  - type: HardpointSlots
    vehicleFamily: HardpointVehicleFamilyVan
    slots:
    - id: secondary
      hardpointType: HardpointTypeSecondary
      slotType: HardpointSlotTypeLauncher
      compatibilityId: HardpointCompatibilitySPPVan
      visualLayer: secondary
      insertDelay: 2.0
      required: false
    - id: wheel-1
      hardpointType: HardpointTypeWheel
      slotType: HardpointSlotTypeWheel
      compatibilityId: HardpointCompatibilitySPPVan
      insertDelay: 1.5
  - type: VehicleEnter
    interiorPath: /Maps/_WF/Vehicles/Interiors/spp_van_armed_interior.yml
    enterDoAfter: 1.0
    exitDoAfter: 1.0
    maxPassengers: 8
    entryPoints:
    - offset: 0,1.5
      radius: 0.8
      interiorCoords: 0.35,0.25
    - offset: 1.2,-0.3
      radius: 0.7
      interiorCoords: 2.5,0.9
    - offset: -1.2,-0.3
      radius: 0.7
      interiorCoords: 2.5,-0.2
  - type: ItemSlots
    slots:
      secondary:
        startingItem: VehicleSPPVanTurret
        whitelist:
          components:
          - HardpointItem
      wheel-1:
        startingItem: VehicleSPPVanWheel
        whitelist:
          components:
          - VehicleWheelItem

