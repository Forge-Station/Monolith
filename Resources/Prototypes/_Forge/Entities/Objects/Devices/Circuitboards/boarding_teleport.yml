- type: entity
  parent: BaseComputerCircuitboard
  id: BoardingTeleportConsoleCircuitboard
  name: bluespace boarding console board
  description: A computer circuit board for a bluespace boarding console.
  components:
  - type: Sprite
    state: cpu_science
  - type: ComputerBoard
    prototype: ComputerBoardingTeleport
  - type: Tag
    tags:
    - DroneUsable
    - HighRiskItem

- type: entity
  parent: BaseMachineCircuitboard
  id: BoardingBluespaceScramblerMachineCircuitboard
  name: bluespace scrambler board
  description: A machine printed circuit board for a bluespace scrambler.
  components:
  - type: Sprite
    state: science
  - type: MachineBoard
    prototype: BoardingBluespaceScrambler
    requirements:
      Manipulator: 2
      Capacitor: 4
    stackRequirements:
      Steel: 5
      Glass: 5
      Plasma: 3

- type: entity
  parent: BaseMachineCircuitboard
  id: BoardingTeleportEngineMachineCircuitboard
  name: bluespace boarding engine board
  description: A machine circuit board for a bluespace boarding engine.
  components:
  - type: Sprite
    state: science
  - type: MachineBoard
    prototype: BoardingTeleportEngine
    requirements:
      Manipulator: 3
      Capacitor: 3
    stackRequirements:
      Steel: 6
      Glass: 6
      Plasma: 2

- type: entity
  parent: BaseMachineCircuitboard
  id: BoardingTeleportPlatformMachineCircuitboard
  name: bluespace boarding platform board
  description: A machine circuit board for a boarding platform.
  components:
  - type: Sprite
    state: science
  - type: MachineBoard
    prototype: BoardingTeleportPlatform
    requirements:
      Manipulator: 2
      Capacitor: 2
    stackRequirements:
      Steel: 5
      Glass: 5
