- type: entity
  id: ShuttleWindowUran
  name: shuttle uranium window
  parent: Window # Frontier: WindowRCDResistant<Window
  components:
  - type: Sprite
    drawdepth: WallTops
    sprite: _Forge/Structures/Windows/window-shuttle-uran.rsi
  - type: Icon
    sprite: _Forge/Structures/Windows/window-shuttle-uran.rsi
  - type: Repairable
    fuelCost: 15
    doAfterDelay: 3
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: RGlass
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1300
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 650
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WindowShatter
      - !type:SpawnEntitiesBehavior
        spawn:
          ShardGlassUranium:
            min: 1
            max: 2
          PartRodMetal:
            min: 1
            max: 2
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: IconSmooth
    key: walls
    states:
    - !type:CornerSpriteSmoothing
      mask: [ walls, windows, grilles, marble, doors ]
      base: window
  - type: Appearance
  - type: DamageVisuals
    thresholds: [5, 10, 20]
    damageDivisor: 20
    trackAllDamage: true
    damageOverlay:
      sprite: Structures/Windows/cracks.rsi
  - type: StaticPrice
    price: 115 # Frontier: 150<70 # Forge-Change
  - type: RadiationBlocker
    resistance: 4
  - type: Construction
    graph: Window
    node: shuttleWindowUran

- type: entity
  parent: ShuttleWindowUran
  id: ShuttleWindowUranDiagonal
  suffix: diagonal
  placement:
    mode: SnapgridCenter
    snap:
    - Window
  components:
  - type: Sprite
    drawdepth: WallTops
    sprite: _Forge/Structures/Windows/window-diagonal-shuttle-uran.rsi
    state: state0
  - type: Tag
    tags:
    - Diagonal
  - type: IconSmooth
    key: walls # Frontier: windows<walls
    states:
    - !type:DiagonalSpriteSmoothing
      mask: [ walls, windows, grilles, marble, doors ]
      base: state
  - type: Icon
    sprite: _Forge/Structures/Windows/window-diagonal-shuttle-uran.rsi
    state: state0
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PolygonShape
            vertices:
            - "-0.5,-0.5"
            - "0.5,0.5"
            - "0.5,-0.5"
        mask:
        - FullTileMask
        layer:
        - GlassLayer
  - type: Airtight
    noAirWhenFullyAirBlocked: false
    airBlockedDirection:
    - South
    - East
  - type: DamageVisuals
    damageOverlay:
      sprite: Structures/Windows/cracks-diagonal.rsi
  - type: RadiationBlocker
    resistance: 4
  - type: Construction
    graph: Window
    node: shuttleWindowUranDiagonal

