      state: goliath
  - type: DamageStateVisuals
    states:
      Alive:
        Base: goliath
      Dead:
        Base: goliath_dead
  - type: MobThresholds
    thresholds:
      0: Alive
      180: Dead
  - type: Stamina
    critThreshold: 180
  - type: MovementSpeedModifier
    baseWalkSpeed: 2
    baseSprintSpeed: 2.4
  - type: MeleeWeapon
    soundHit:
      path: "/Audio/Weapons/smash.ogg"
