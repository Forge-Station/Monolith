# Markers that spawn a crewed ground vehicle when the map loads, for mappers and planet sites. Each names its wfVehicleCrew.

- type: entity
  parent: MarkerBase
  id: WFVehicleCrewSpawnerPirateHumvee
  name: pirate humvee crew spawner
  description: A pirate humvee with its crew aboard.
  categories: [ WFVehicles ]
  components:
  - type: Sprite
    layers:
    - state: green
    - sprite: _WF/Vehicles/humvee.rsi
      state: humvee_base
      scale: 0.25, 0.25
  - type: WFVehicleCrewSpawner
    crew: WFVehicleCrewPirateHumvee

