- type: wound
  id: BurnWound
  name: wound-name-burn
  damageTypes:
    Heat:
      reopenMinimumDamage: 15
    Cold:
      reopenMinimumDamage: 18
      severityMultiplier: 1
    Caustic: # WOLFGATE(Wolfmed): D20 reversed - Caustic stays routed and creates burn wounds
      reopenMinimumDamage: 12
      severityMultiplier: 1
  maximumSeverity: 200
  healingMultiplier: 0.15 # WOLFGATE(Wolfmed): W0: Onyx's intended value. Damage removal barely closes a wound.
  behaviors:
  # WOLFGATE(Wolfmed): W5: burned skin is no longer a barrier.
  - !type:WolfmedInfectionRiskBehavior
    riskMultiplier: 1.2
  - !type:WoundScarBehavior
    threshold: 20
    chance: 1
  # WOLFGATE(Wolfmed): M1b: burns weep into blood volume (OD11), set against the measured fire. WolfmedFluidLossSystem.
  - !type:WolfmedFluidLossBehavior
    from: 20
    perSeverity: 0.0008
  stages:
    Minor:
      name: wound-stage-minor
      severity: 0
      behaviors:
      - !type:WoundPainBehavior
        painPerSeverity: 0.8
        minSeverity: 10
    Moderate:
      name: wound-stage-moderate
      severity: 25
      behaviors:
      - !type:WoundPainBehavior
        painPerSeverity: 0.8
        minSeverity: 10
    Severe:
      name: wound-stage-severe
      severity: 50
      behaviors:
      - !type:WoundPainBehavior
        painPerSeverity: 0.8
        minSeverity: 10
      # WOLFGATE(Wolfmed): playtest 2: burned hands are slow, never switched off (WolfmedLimbIntegrity).
      - !type:WolfmedLimbPenaltyBehavior
        manipulationModifier: 1.25
    Critical:
      name: wound-stage-critical
      severity: 80
      behaviors:
      - !type:WoundPainBehavior
        painPerSeverity: 0.8
        minSeverity: 10
      # WOLFGATE(Wolfmed): playtest 2: burned hands are slow, never switched off (WolfmedLimbIntegrity).
      - !type:WolfmedLimbPenaltyBehavior
        manipulationModifier: 1.5
      # WOLFGATE(Wolfmed): W4: tissue burned this far is dead. Crossing into this stage leaves charring, which no
      # topical reaches - a skin graft is the only exit. See WolfmedCharringSystem.
      - !type:WolfmedCharringBehavior
        wound: WFWolfmedCharringWound
        severity: 20

