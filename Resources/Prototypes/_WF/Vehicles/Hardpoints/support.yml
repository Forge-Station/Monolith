- type: entity
  parent: VehicleTankHardpointBase
  id: VehicleTankWarningArray
  name: integrated weapons sensor array
  description: An integrated sensor array that improves the fire rate of onboard weapons.
  components:
  - type: StaticPrice
    price: 4200
  - type: Sprite
    state: warray
  - type: HardpointItem
    hardpointType: HardpointTypeSupport
    vehicleFamily: HardpointVehicleFamilyTank
    slotType: HardpointSlotTypeSupportAttachment
    damageMultiplier: 0.075
    repairRate: 0.0125
  - type: HardpointIntegrity
    maxIntegrity: 250
  - type: VehicleWeaponSupportAttachment
    fireRateMultiplier: 1.15
  - type: HardpointVisual
    vehicleState: warray_0
    damagedVehicleState: warray_1

