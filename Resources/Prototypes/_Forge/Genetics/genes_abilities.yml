  branch: Metabolism
  sequenceLength: 3
  conflicts:
  - GeneStabilizedDna
  components:
  - type: GeneticStrongStomach

- type: gene
  id: GeneUnstableDna
  name: gene-unstable-dna-name
  description: gene-unstable-dna-desc
  quality: Neutral
  instability: 32
