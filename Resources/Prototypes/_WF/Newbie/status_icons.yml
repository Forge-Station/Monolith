# The learner plate over a new player's head. As a Mod icon sorted first it sits just above the right-hand icon
# column, so it never takes or pushes a job, security or health HUD slot.
- type: ssdIcon
  id: WFNewbieIcon
  icon:
    sprite: /Textures/_WF/Newbie/newbie_mark.rsi
    state: mark
  locationPreference: Right
  priority: -1
  layer: Mod
  isShaded: true
