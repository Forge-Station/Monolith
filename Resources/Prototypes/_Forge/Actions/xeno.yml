      sprite: _CM/Interface/Actions/xeno_actions.rsi
      state: corrosive_acid
    event: !type:ForgeXenoAcidActionEvent
      plasmaCost: 75
      projectile: BulletXenoAcid
      speed: 18
    useDelay: 8
    range: 8
    checkCanAccess: false

- type: entity
  id: ActionForgeXenoAcidWeak
