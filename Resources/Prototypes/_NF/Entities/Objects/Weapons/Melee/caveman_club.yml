- type: entity
  name: caveman club
  parent: BaseItem
  id: CavemanClub
  description: Big stick make big hurt. # Frontier: changed description
  components:
  # WOLFGATE(Wolfmed) START: a blunt weapon can execute, with bludgeoning lines in place of the throat-slitting ones
  - type: Execution
    internalMeleeExecutionMessage: wolfmed-execution-bludgeon-initial-internal
    externalMeleeExecutionMessage: wolfmed-execution-bludgeon-initial-external
    completeInternalMeleeExecutionMessage: wolfmed-execution-bludgeon-complete-internal
    completeExternalMeleeExecutionMessage: wolfmed-execution-bludgeon-complete-external
    internalSelfExecutionMessage: wolfmed-execution-bludgeon-self-initial-internal
    externalSelfExecutionMessage: wolfmed-execution-bludgeon-self-initial-external
    completeInternalSelfExecutionMessage: wolfmed-execution-bludgeon-self-complete-internal
    completeExternalSelfExecutionMessage: wolfmed-execution-bludgeon-self-complete-external
  # WOLFGATE END
  - type: Sprite
    sprite: _NF/Objects/Weapons/Melee/caveman_club.rsi
    state: icon
  - type: MeleeWeapon
    wideAnimationRotation: -135
    damage:
      types:
        Blunt: 10
    soundHit:
      collection: MetalThud
  - type: Item
    size: Normal
  - type: Clothing
    quickEquip: false
    slots:
    - back
  - type: Construction
    graph: CavemanClub
    node: club
  - type: PhysicalComposition
    materialComposition:
      Wood: 200
  - type: AddAccentPickup # Frontier
    accent: CavemanAccent # Frontier

- type: entity
  name: caveman club
  parent: [CavemanClub]
  id: CavemanClubCursed
  suffix: Unremoveable, Foam
  description: Big stick make big... this no wood? # Frontier: changed description
  components:
  - type: Unremoveable
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 0
    soundHit:
      collection: RubberHammer
