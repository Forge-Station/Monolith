# Forge leviathans: unique megafauna, not the carp space dragon.

- type: entity
  parent: [ SimpleSpaceMobBase, FlyingMobBase ]
  id: BaseMobForgeLeviathan
  abstract: true
  suffix: Forge
  components:
  - type: InputMover
  - type: MobMover
  - type: CombatMode
  - type: Physics
    bodyType: KinematicController
  - type: NpcFactionMember
    factions:
    - Leviathan
  - type: HTN
    sleepPlayerCheckRangeOverride: 4000
    sleepMaxGridSpeed: 10
    rootTask:
      task: XenoCompound
    blackboard:
      NavInteract: !type:Bool
        false
      NavPry: !type:Bool
        false
      NavSmash: !type:Bool
        true
      VisionRadius: !type:Single
        80
      AggroVisionRadius: !type:Single
        80
  - type: Speech
    speechVerb: LargeMob
  - type: ReplacementAccent
    accent: genericAggressive
  - type: LanguageKnowledge
    speaks:
    - Xeno
    understands:
    - Xeno
  - type: Body
    prototype: Animal
  - type: Bloodstream
    bloodMaxVolume: 1200
  - type: StatusEffects
    allowed:
    - SlowedDown
    - Stutter
    - Electrocution
    - ForcedSleep
    - TemporaryBlindness
    - Pacified
    - RadiationProtection
    - Drowsiness
    - Adrenaline
  - type: Flammable
    damage:
      types: {}
  - type: Temperature
    heatDamageThreshold: 2000
    coldDamageThreshold: -250
  - type: Insulated
  - type: FlashImmunity
  - type: NoSlip
  - type: Puller
    needsHands: false
  - type: NightVision
    relayOverlay: false
    goggleEffect: true
    viewCircleRadius: 450
    viewCircleCount: 4
    viewCircleSpacing: 280
    action: ActionToggleNightVision
    phosphorColor: "#66F5FF"
    lightingColor: "#FFFFFF32"
  - type: RadarBlip
    visibleFromOtherGrids: true
    radarColor: "#9B4DFF"
    scale: 4
  - type: UserInterface
    interfaces:
      enum.RadarConsoleUiKey.Key:
        type: RadarConsoleBoundUserInterface
  - type: IntrinsicUI
    uis:
      enum.RadarConsoleUiKey.Key:
        toggleAction: ActionObserverShowRadar
  - type: RadarConsole
    followEntity: true
    noRotate: true
    maxIffRange: 0
    hideCoords: false
  - type: Tag
    tags:
    - CannotSuicide
    - DoorBumpOpener
    - FootstepSound
  - type: Appearance
  - type: Damageable
    damageContainer: Leviathan
  - type: ExplosionResistance
    damageCoefficient: 0.35
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTypeTrigger
        damageType: Blunt
        damage: 2000000
      behaviors:
      - !type:GibBehavior { }
  - type: MovementSpeedModifier
    baseWalkSpeed: 110
    baseSprintSpeed: 120
    baseWeightlessModifier: 1.0
  - type: MobThresholds
    thresholds:
      0: Alive
      92000: Critical
      100000: Dead
  - type: MobState
  - type: MobStateActions
    actions:
      Critical:
      - ActionCritSuccumb
      - ActionCritLastWords

- type: entity
  parent: BaseMobForgeLeviathan
  id: MobForgeVoidDrake
  name: void drake
  description: An astral leviathan of horned wings and starfire. Not a carp dragon — a hunger that learned to fly between stars.
  components:
  - type: GhostRole
    allowMovement: true
    allowSpeech: true
    makeSentient: true
    name: ghost-role-information-forge-void-drake-name
    description: ghost-role-information-forge-void-drake-description
    rules: ghost-role-information-antagonist-rules
    mindRoles:
    - MindRoleGhostRoleSoloAntagonist
    raffle:
      settings: default
  - type: GhostTakeoverAvailable
  - type: Sprite
    sprite: _Forge/Mobs/Leviathans/void_drake.rsi
    noRot: true
    drawdepth: OverMobs
    scale: 1, 1
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: alive
    - map: [ "enum.DamageStateVisualLayers.BaseUnshaded" ]
      state: alive-unshaded
      shader: unshaded
  - type: DamageStateVisuals
    states:
      Alive:
        Base: alive
        BaseUnshaded: alive-unshaded
      Critical:
        Base: crit
      Dead:
        Base: dead
        BaseUnshaded: dead-unshaded
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 14
        density: 280
        mask:
        - FlyingMobMask
        - MapGrid
        layer:
        - FlyingMobLayer
  - type: Damageable
    damageContainer: Leviathan
  - type: ExplosionResistance
    damageCoefficient: 0.35
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTypeTrigger
        damageType: Blunt
        damage: 2000000
      behaviors:
      - !type:GibBehavior { }
  - type: MovementSpeedModifier
    baseWalkSpeed: 110
    baseSprintSpeed: 120
    baseWeightlessModifier: 1.0
  - type: MobThresholds
    thresholds:
      0: Alive
      92000: Critical
      100000: Dead
  - type: MeleeWeapon
    altDisarm: false
    attackRate: 0.7
    range: 10
    animation: WeaponArcClaw
    soundHit:
      path: /Audio/Weapons/Xeno/alien_claw_flesh3.ogg
    damage:
      types:
        Slash: 28
        Heat: 12
        Structural: 220
  - type: PointLight
    radius: 22
    energy: 3.8
    color: "#3ad0c8"
    castShadows: false
  - type: Devourer
    foodPreference: Humanoid
    shouldStoreDevoured: true
    chemical: Ichor
    healRate: 18.0
    whitelist:
      components:
      - MobState
      - Door
      tags:
      - Wall
  - type: VoidDrake
    huntSpeed: 110
    minHealth: 100000
    maxHealth: 1000000
  - type: ActionGrant
    actions:
    - ActionForgeVoidDrakeGravityWell
    - ActionForgeVoidDrakeWingTempest
    - ActionForgeVoidDrakeSolarFlare
  - type: ActionGun
    action: ActionForgeVoidDrakeStarfire
    gunProto: ForgeVoidDrakeStarfireGun
  - type: RadarBlip
    visibleFromOtherGrids: true
    radarColor: "#3ad0c8"
    scale: 8
  - type: InteractionPopup
    successChance: 0.08
    interactSuccessString: petting-success-forge-void-drake
    interactFailureString: petting-failure-forge-void-drake
    interactFailureSound:
      path: /Audio/Animals/space_dragon_roar.ogg
    soundPerceivedByOthers: false
  - type: Butcherable
    spawned:
    - id: FoodMeatForgeLeviathan
      amount: 6
  - type: MobPrice
    price: 12000

- type: entity
  parent: MobForgeVoidDrake
  id: MobForgeVoidDrakeAI
  suffix: AI, Forge
  components:
  - type: GhostRole
    prob: 0
  - type: GhostTakeoverAvailable

- type: entity
