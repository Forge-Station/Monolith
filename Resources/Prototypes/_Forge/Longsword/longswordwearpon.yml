- type: entity
  id: WeaponRifleLIR12
  name: LIR-12 Alglorian (5.56x45 mm)
  parent: BaseWeaponRifle
  description: Modern rifle for Longsword International.
  suffix: Longsword
  components:
  - type: Sprite
    sprite: _Forge/Objects/Longsword/longswordautomatrifle.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Item # Mono
    size: Huge
    sprite: _Forge/Objects/Longsword/longswordautomatrifle.rsi
  - type: Clothing
    sprite: _Forge/Objects/Longsword/longswordautomatrifle.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: GunWieldBonus
    minAngle: -33
    maxAngle: -35
  - type: Gun
    minAngle: 35
    maxAngle: 45
    angleIncrease: 0.5
    angleDecay: 9
    cameraRecoilScalar: 0.5
    fireRate: 4
    projectileSpeed: 30 
    availableModes:
    - FullAuto
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/rifle2.ogg
  - type: ChamberMagazineAmmoProvider
    soundRack:
      path: /Audio/Weapons/Guns/Cock/ltrifle_cock.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: Magazine556x45mmFMJ
        insertSound: /Audio/Weapons/Guns/MagIn/smg_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/smg_magout.ogg
        priority: 2
        whitelist:
          tags:
            - Magazine556x45mmFMJ
      gun_chamber:
        name: Chamber
        startingItem: Cartridge556x45mmFMJ
        priority: 1
        whitelist:
          tags:
            - Cartridge556x45mmFMJ
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
  - type: SpeedModifiedOnWield # Mono
    walkModifier: 1
    sprintModifier: 1
  - type: StaticPrice
    price: 800
    vendPrice: 12500


