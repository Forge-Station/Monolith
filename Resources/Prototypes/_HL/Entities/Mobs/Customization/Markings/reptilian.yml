- type: marking
  id: ReptilianTailNaga
  bodyPart: Tail
  markingCategory: Tail
  speciesRestriction: [Skrell, Reptilian, Human, ProtoReptile, IPC, Oni]
  layering: # WOLFGATE - the anatomy zone of the south frame draws behind the body, so the tail never covers anatomy
    naga_primary_BEHIND: TailBehind
    naga_secondary_BEHIND: TailBehind
  colorLinks: # WOLFGATE - both halves of a tail share one colour
    naga_primary_BEHIND: naga_primary_FRONT
    naga_secondary_BEHIND: naga_secondary_FRONT
  sprites:
    - sprite: _WF/Mobs/Customization/TailSplit/_HL/Mobs/Customization/Reptilian/naga.rsi # WOLFGATE - split art, anatomy zone only
      state: naga_primary_FRONT
    - sprite: _WF/Mobs/Customization/TailSplit/_HL/Mobs/Customization/Reptilian/naga.rsi # WOLFGATE - split art, anatomy zone only
      state: naga_secondary_FRONT
    - sprite: _WF/Mobs/Customization/TailSplit/_HL/Mobs/Customization/Reptilian/naga.rsi # WOLFGATE - anatomy zone of the south frame on TailBehind
      state: naga_primary_BEHIND
    - sprite: _WF/Mobs/Customization/TailSplit/_HL/Mobs/Customization/Reptilian/naga.rsi # WOLFGATE - anatomy zone of the south frame on TailBehind
      state: naga_secondary_BEHIND

