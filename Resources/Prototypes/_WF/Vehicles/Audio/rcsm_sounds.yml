# The LTB shell with RCSM blast sounds: same damage numbers as RMCLTBCannon.
- type: explosion
  id: WFRcsmTankShell
  damagePerIntensity:
    types:
      Blunt: 20
      Heat: 20
      Structural: 400
  tileBreakChance: [0, 0.5, 1]
  tileBreakIntensity: [0, 8, 20]
  tileBreakRerollReduction: 20
  sound:
    collection: WFRcsmShellBlast
    params:
      volume: 4
  smallSound:
    collection: WFRcsmShellBlast
    params:
      volume: 2
  soundFar:
    collection: WFRcsmShellBlastFar
    params:
      volume: 4
  smallSoundFar:
    collection: WFRcsmShellBlastFar
    params:
      volume: 2

- type: entity
  parent: RMCProjectileLTBCannon
  id: WFRcsmProjectileLTBCannon
  categories: [ HideSpawnMenu, WFVehicles ]
  components:
  - type: Explosive
    explosionType: WFRcsmTankShell
  # Forced, so the hit is a shell strike rather than the target's own small-arms clink. Plays even where a safe zone
  # stops the blast.
  - type: Projectile
    soundHit:
      collection: WFRcsmShellImpact
      params:
        volume: 4
        maxDistance: 24
    forceSound: true

- type: entity
  parent: VehicleCartridgeLTBCannon
  id: WFRcsmCartridgeLTBCannon
  categories: [ HideSpawnMenu ]
  components:
  - type: CartridgeAmmo
    proto: WFRcsmProjectileLTBCannon

# The PMC armed loadout's guns with RCSM sounds.
- type: entity
  parent: VehicleTankLTBCannon
  id: WFVehicleTankLTBCannonRcsm
  categories: [ HideSpawnMenu, WFVehicles ]
  components:
  - type: Gun
    soundGunshot:
      path: /Audio/_WF/Vehicles/RCSM/weapons/tank_fire_122mm.ogg
      params:
        volume: 2
        maxDistance: 28
  - type: BallisticAmmoProvider
    proto: WFRcsmCartridgeLTBCannon
  - type: WFGunExtraSounds
    distantSound:
      collection: WFRcsmHeavyCannonFar
    # A manual loader's cycle, fitted to the cannon's 20 s between shots: breech opens and drops the case stub, the
    # ammo door opens, the round comes out of the rack, gets rammed, and the breech closes as the gun comes ready.
    loadingSequence:
    # Recoil and breech clatter right behind the bang.
    - delay: 0.05
      sound:
        collection: WFRcsmCannonMech
        params:
          maxDistance: 12
    - delay: 0.8
      sound:
        collection: WFRcsmBreechOpen
        params:
          maxDistance: 10
    - delay: 1.4
      sound:
        collection: WFRcsmStubDrop
        params:
          volume: -3
          maxDistance: 8
    - delay: 4.5
      sound:
        collection: WFRcsmAmmoDoor
        params:
          maxDistance: 10
    - delay: 7
      sound:
        collection: WFRcsmRoundHandle
        params:
          maxDistance: 8
    - delay: 11
      sound:
        collection: WFRcsmAmmoDoor
        params:
          volume: -2
          maxDistance: 10
    - delay: 14.5
      sound:
        collection: WFRcsmRam
        params:
          maxDistance: 10
    - delay: 17.5
      sound:
        collection: WFRcsmCannonReload
        params:
          maxDistance: 10

- type: entity
  parent: VehicleTankRERE700
  id: WFVehicleTankRERE700Rcsm
  categories: [ HideSpawnMenu, WFVehicles ]
  components:
  - type: Gun
    soundGunshot:
