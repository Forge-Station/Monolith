    where: Kerb
    axis: EastWest
    align: true
    per100: 0.3
  - prototypes: [ WFRoadPropArmyTruckBroken, WFRoadPropHumveeDestroyed ]
    where: Kerb
    align: true
    per100: 0.15
  # Roadworks.
  - prototypes: [ RMCBarricadeHybrisaPlasticRoadBarrier, RMCBarricadeHybrisaPlasticRoadBarrierBlue,
      RMCBarricadeHybrisaPlasticRoadBarrierBlack ]
    align: true
    per100: 0.4
  - prototypes: [ AU14PropTrafficDirector1, AU14PropTrafficDirector2, AU14PropTrafficDirector3,
      AU14PropTrafficDirector4, AU14PropTrafficDirector5, AU14PropTrafficDirector6 ]
    align: true
    per100: 0.2
  # Street furniture.
  - prototypes: [ RMCPropFireHydrantRed, RMCPropFireHydrantBlue, RMCPropFireHydrantwhite, RMCPropFireHydrantGrey ]
