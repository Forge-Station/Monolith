# A hauler in open space with a pirate ship lying off it. The hauler makes its own distress call on the common channel at
# once; the attack only begins when a player comes within a kilometre and a half, so somebody is there to see it.
- type: wfEncounter
  id: WFEncounterPirateAmbush
  leash: 2500
  name: wf-encounter-name-ambush
  announcement: wf-encounter-announce-ambush
  announcementSender: wf-encounter-sender-traffic
  announceOnRadio: true
  announcer: hauler
  start: Scheduled
  category: Distress
  icon: Skull
  cost: 2
  startRadius: 1500
  rewards:
  - side: freight
    spesos: 24000
    thanks: wf-encounter-reward-thanks-hauler
  minPlayers: 4
  cooldown: 2700
  duration: 2400
  manifests: [ WFManifestGeneral, WFManifestFood ]
  ships:
  - key: hauler
    navigation: WFCrewNavigationFreight
    vessel: Piva
    side: freight
    profile: WFCrewProfileHauler
    company: TSFCivilian
    cargo: 4
    docking: Warn
    disengage: Deter
    objectives:
    - kind: Hold
  - key: raider
    navigation: WFCrewNavigationRaider
    vessels: [ Kalisto, Metis, Mudskipper, Scallywag ]
    # Retrofitted civilian hulls at the low tiers, gunships from tier 3, the full black-market line from tier 4.
    tiers:
    - minTier: 0
      vessels: [ Spessbite, Victoria, Sakuratsu, Pillbox, Noble, Caracara, Takeaway ]
      skills: [ Green ]
      retrofit: WFPirateRetrofitLight
    - minTier: 2
      vessels: [ Peregrine, Shuilian, Arribane, Autumn, Zeros, WFDredger ]
      skills: [ Green, Regular ]
      retrofit: WFPirateRetrofitMedium
    - minTier: 3
      vessels: [ Windreign, Zhuangzi, Rosetta, WFDredger, Kalisto, Metis, Bastion, Garm ]
      skills: [ Regular ]
      retrofit: WFPirateRetrofitHeavy
    - minTier: 4
      vessels: [ Kalisto, Metis, Mudskipper, Scallywag ]
      skills: [ Regular, Veteran ]
      retrofit: WFPirateRetrofitGrime
    - minTier: 5
      vessels: [ Kalisto, Metis, Mudskipper, Scallywag ]
      skills: [ Veteran ]
      retrofit: WFPirateRetrofitGrime
    offset: 0, 450
    side: pirates
    faction: PirateNF
    distress: false
    company: WFAshfallReavers
    profile: WFCrewProfilePirate
    skill: Regular
    objectives:
    - kind: Attack
      target: hauler

