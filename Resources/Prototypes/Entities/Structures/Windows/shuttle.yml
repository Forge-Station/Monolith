- type: entity
  id: ShuttleWindow
  name: shuttle window
  parent: Window # Frontier: WindowRCDResistant<Window
  components:
  - type: Sprite
    sprite: Structures/Windows/window-shuttle.rsi
  - type: PaintableWall # Forge-Change
    protectTransparent: true
  - type: Icon
    sprite: Structures/Windows/window-shuttle.rsi
    state: full
  - type: Repairable
    fuelCost: 15
    doAfterDelay: 3
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: RGlass
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 4000 # Mono
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 2000 # Mono
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WindowShatter
      - !type:SpawnEntitiesBehavior
        spawn:
          ShardGlassReinforced:
            min: 1
            max: 2
          PartRodMetal:
            min: 1
            max: 2
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: IconSmooth
    key: windows-shuttle
    states:
    - !type:CardinalCornerSpriteSmoothing
      mask: [ windows-shuttle ]
      altMask:
      - windows
      - windows-reinf
      - windows-tinted
      - windows-plasma
      - windows-plasma-reinf
      - windows-uranium
      - windows-uranium-reinf
      - windows-exo
      - windows-plastitanium
      - windows-regal
      - walls-exo
      - walls-shuttle
      - walls-plastitanium
      - walls-material
      - walls-marble
      - walls
      - grilles
      - doors
      base: window
  - type: Construction
    graph: Window
    node: shuttleWindow
  - type: Appearance
  - type: DamageVisuals
    thresholds: [5, 10, 20]
    damageDivisor: 20
    trackAllDamage: true
    damageOverlay:
      sprite: Structures/Windows/cracks.rsi
  - type: DeltaPressure
    minPressure: 15000
    minPressureDelta: 10000
    scalingType: Linear
    scalingPower: 0.0005
  - type: StaticPrice
    price: 70 # Frontier: 150<70
  - type: ShipRepairable
    repairTime: 6
    repairCost: 6

- type: entity
  parent: ShuttleWindow
  id: ShuttleWindowDiagonal
  suffix: diagonal
  placement:
    mode: SnapgridCenter
    snap:
    - Window
  components:
  - type: Sprite
    drawdepth: WallTops
    sprite: Structures/Windows/window-diagonal-shuttle.rsi
  - type: Tag
    tags:
    - Diagonal
    - Window
  - type: IconSmooth
    states:
    - !type:DiagonalSpriteSmoothing
      mask:
      - walls
      - windows
      - grilles
      - marble
      - doors
      base: state
  - type: Icon
    sprite: Structures/Windows/window-diagonal-shuttle.rsi
    state: state0
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PolygonShape
            vertices:
            - "-0.5,-0.5"
            - "0.5,0.5"
            - "0.5,-0.5"
        mask:
        - FullTileMask
        layer:
        - DiagonalGlassLayer # Mono GlassLayer->DiagonalGlassLayer
  - type: Airtight
    noAirWhenFullyAirBlocked: false
    airBlockedDirection:
    - South
    - East
  - type: DamageVisuals
    damageOverlay:
      sprite: Structures/Windows/cracks-diagonal.rsi
  - type: Construction
    graph: Window
    node: shuttleWindowDiagonal
