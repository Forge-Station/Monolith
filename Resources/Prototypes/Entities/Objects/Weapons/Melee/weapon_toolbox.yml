- type: entity
  parent: BaseItem
  id: WeaponMeleeToolboxRobust
  name: robust toolbox
  description: A tider's weapon.
  categories: [ DoNotMap ]
  components:
  # WOLFGATE(Wolfmed) START: a blunt weapon can execute, with bludgeoning lines in place of the throat-slitting ones
  - type: Execution
    internalMeleeExecutionMessage: wolfmed-execution-bludgeon-initial-internal
    externalMeleeExecutionMessage: wolfmed-execution-bludgeon-initial-external
    completeInternalMeleeExecutionMessage: wolfmed-execution-bludgeon-complete-internal
    completeExternalMeleeExecutionMessage: wolfmed-execution-bludgeon-complete-external
    internalSelfExecutionMessage: wolfmed-execution-bludgeon-self-initial-internal
    externalSelfExecutionMessage: wolfmed-execution-bludgeon-self-initial-external
    completeInternalSelfExecutionMessage: wolfmed-execution-bludgeon-self-complete-internal
    completeExternalSelfExecutionMessage: wolfmed-execution-bludgeon-self-complete-external
  # WOLFGATE END
  - type: Sprite
    sprite: _Impstation/Objects/Tools/Toolboxes/toolbox_red.rsi #imp edit
    state: icon
  - type: Item
    size: Ginormous
    sprite: _Impstation/Objects/Tools/Toolboxes/toolbox_red.rsi #imp edit
  - type: MeleeWeapon
    wideAnimationRotation: -135
    attackRate: 1.5
    damage:
      types:
        Blunt: 20
    soundHit:
      path: "/Audio/Weapons/smash.ogg"
