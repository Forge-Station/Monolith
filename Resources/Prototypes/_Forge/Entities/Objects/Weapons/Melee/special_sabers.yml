- type: entity
  parent: BaseItem
  id: MeleeSeniorOfficer
  name: Сабля Старшего офицера
  description: Высокотехнологическая сабля, используемая Старшими офицерами Транс-Солнечной Федерации. Обладает встроенной функцией двойного прыжка. Одобрена и призведена в центральных мирах Транс-Солнечной Федерации, под чётким взором Зимнего Солнцестояния.
  components:
  - type: Sprite
    sprite: _Forge/Objects/Weapons/Melee/sword_tsf.rsi
    layers:
    - state: icon
    - state: icon-unshaded
      visible: true
      shader: unshaded
      map: [ "blade" ]
  - type: Tag
    tags:
    - SeniorOfficerSabre
  - type: Item
    size: Normal
    sprite: _Forge/Objects/Weapons/Melee/sword_tsf.rsi
  - type: PointLight
    radius: 2
    energy: 2
    color: white
  - type: MeleeWeapon
    heavyStaminaCost: 2.5
    attackRate: 1.5
    damage:
      types:
          Heat: 10
          Slash: 50
          Structural: 100
    soundHit:
        path: /Audio/Weapons/bladeslice.ogg
    wideAnimationRotation: -135
  - type: Reflect
    reflectProb: .1
    spread: 90
  - type: StaminaDamageOnHit
    damage: 0
  - type: Appearance
  - type: JumpAbility
    jumpDistance: 2.5
    jumpSound: /Audio/Effects/Footsteps/suitstep2.ogg
    requireItemActivation: true
  - type: ActionGrant
    actions:
    - ActionDoubleGravityJump
  - type: ItemActionGrant
    actions:
    - ActionDoubleGravityJump

- type: entity
  id: ActionDoubleGravityJump
  name: Double Jump
  description: Jump twice before the ability goes on cooldown.
  components:
  - type: InstantAction
    useDelay: 16
    charges: 2
    renewCharges: true
    icon:
      sprite: Interface/Actions/jump.rsi
      state: icon
    event: !type:GravityJumpEvent {}

- type: entity
  parent: BaseItem
  id: MeleeAstraCardinal
  name: Сабля Астра-Кардинала
  description: Высокотехнологическая сабля, используемая Астра-Карндиналом. Имеет две стойки боя - стандартную и огненную. Одобрена Инквизицией Его величества, и по слухам, одобрена членами Императорской Династии.
  components:
  - type: Sprite
    sprite: _Forge/Objects/Weapons/Melee/sword_siv.rsi
    layers:
    - state: icon
    - state: icon-unshaded
      visible: false
      shader: unshaded
      map: [ "blade" ]
  - type: Tag
    tags:
    - AstraCardinalSabre
  - type: Item
    size: Normal
    sprite: _Forge/Objects/Weapons/Melee/sword_siv.rsi
  - type: PointLight
    radius: 2
    energy: 2
    color: white
    enabled: false
  - type: MeleeWeapon
    heavyStaminaCost: 2.5
    attackRate: 1.5
    damage:
      types:
        Heat: 10
        Slash: 50
        Structural: 100
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
    wideAnimationRotation: -135
  - type: Reflect
    reflectProb: .1
    spread: 90
  - type: StaminaDamageOnHit
    damage: 0
  - type: Appearance
  - type: MeleeStance
    currentMode: 1
    attackDelayOnSwitch: 0.5
    switchSound:
      path: /Audio/Weapons/ebladeon.ogg
    modes:
    - name: melee-stance-siv-fire
      fireStacks: 1.2
      damage:
        types:
          Heat: 50
          Slash: 10
          Structural: 100
      attackRate: 0.8
      canWideSwing: true
      reflectProb: .1
      size: Normal
      state: icon
      layers:
        blade:
          state: icon-unshaded
          visible: true
          shader: unshaded
          color: "#FFB300"
      lightColor: "#FFB300"
      lightRadius: 3
      lightEnabled: true
      components:
      - type: DisarmMalus
        malus: 0.6
    - name: melee-stance-base-siv
      state: icon
      layers:
        blade:
          visible: false
      fireStacks: 0
      damage:
        types:
          Heat: 10
          Slash: 50
          Structural: 100
      attackRate: 1.5
      canWideSwing: true
      reflectProb: .1
      lightEnabled: false

