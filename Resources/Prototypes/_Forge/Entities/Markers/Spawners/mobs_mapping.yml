# Mapping spawners for containment cells, hives, and remnant ruins.
# Place these — they spawn on map init.

- type: entity
  abstract: true
  parent: MarkerBase
  id: ForgeMappingSpawnerBase
  suffix: Forge, Mapping, AI
  components:
  - type: Sprite
    layers:
    - state: red
    - state: ai

# region Forerunner borgs

- type: entity
  parent: ForgeMappingSpawnerBase
  id: SpawnMobForerunnerBorg
  name: remnant cyborg spawner
  suffix: Forge, Mapping, AI
  components:
  - type: Sprite
    layers:
    - state: red
    - state: ai
    - sprite: Mobs/Silicon/chassis.rsi
      state: robot
  - type: ConditionalSpawner
    prototypes:
    - MobForerunnerBorg

- type: entity
  parent: ForgeMappingSpawnerBase
  id: SpawnMobForerunnerBorgEngineer
  name: remnant engineer cyborg spawner
