        Руды и листы рядом на полу сами сливаются. Крупный стак занимает больше
        места в сумке, а от 301 штук замедляет и требует обе руки.
    - type: Fix
      message: >-
        Поправлены ловушка яиц и сорняки ксеносов, омоложение, сканер ДНК и
        маркеры шаттлов.
