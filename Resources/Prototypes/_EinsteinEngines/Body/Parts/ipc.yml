- type: entity
  abstract: true
  parent: [ WFWolfmedPartIpc, BasePartInorganic ] # WOLFGATE(Wolfmed): P5-1: IPC chassis wound profile; WFWolfmedPartIpc must stay FIRST (RT first-parent-wins)
  id: PartIPCBase
  name: "ipc body part"
  components:
  - type: Sprite
    sprite: _EinsteinEngines/Mobs/Species/IPC/parts.rsi
  - type: Icon
    sprite: _EinsteinEngines/Mobs/Species/IPC/parts.rsi
  # WOLFGATE(Wolfmed): P5-2/P5-D20, U13'b: Onyx's SiliconIpc container takes the whole Burn group
  # (Heat, Shock, Cold, Caustic); the stock Inorganic container inherited from BasePartInorganic
  # (Brute + Heat/Shock) drops Cold and Caustic, killing 2 of the 7 acceptedDamageTypes on
  # IpcBodyPartProfile and 2 of the 6 damageTypes on IpcMechanicalDamageWound. WFInorganicWolfmed is a
  # superset of Inorganic, so no type is lost. Only this abstract and CyberneticPartBase use it (D2).
  - type: Damageable
    damageContainer: WFInorganicWolfmed
  # WOLFGATE(Wolfmed): P5-D8, U3'b: dormant until P5-1 routes damage to IPC parts. Raised to parity with Mono's
  # MajorLimb, the trigger every organic arm and leg actually carries (Body/Parts/base.yml:276-307:
  # Blunt 190 / Slash 210). No Heat rung is added - EE's own "# no ashing trigger" stands, so an IPC
  # limb never burns to Ash. This block is FIRST in every IPC part's parent list and thresholds is a
  # non-Always DataField, so it replaces MajorLimb's/MinorLimb's list wholesale for every IPC slot.
  - type: Destructible # no ashing trigger
    thresholds:
    - trigger:
        !type:DamageTypeTrigger
        damageType: Blunt
        damage: 190 # WOLFGATE(Wolfmed): P5-D8: 110 -> 190, MajorLimb parity
      behaviors:
      - !type:GibPartBehavior { }
    - trigger:
        !type:DamageTypeTrigger
        damageType: Slash
        damage: 210 # WOLFGATE(Wolfmed): P5-D8: 150 -> 210, MajorLimb parity
      behaviors:
      - !type:GibPartBehavior { }

- type: entity
  parent: [ WFWolfmedBaseTorsoIpc, PartIPCBase, BaseTorsoInorganic ] # WOLFGATE(Wolfmed): EVISC: torso damage cap, see _WF/Wolfmed/Body/species_parts.yml
  id: TorsoIPC
  name: "ipc torso"
  components:
  - type: BodyPart
    organs:
      posbrain:
        id: "posbrain"
      pump:
        id: "pump"
      # WOLFGATE(Synthetics): the radiation collector's slot
      radcollector:
        id: "radcollector"
  - type: Destructible # no ashing trigger
    thresholds:
    - trigger:
        !type:DamageTypeTrigger
        damageType: Blunt
        damage: 400
      behaviors:
      - !type:GibPartBehavior { }
    - trigger:
        !type:DamageTypeTrigger
        damageType: Slash
        damage: 400
      behaviors:
      - !type:GibPartBehavior { }

- type: entity
  parent: [ PartIPCBase, BaseHead ]
  id: HeadIPC
  name: "ipc head"
  components:
  - type: BodyPart
    organs: # posibrain is stored in the torso
      eyes:
        id: "eyes"

