# Wings
- type: marking
  id: MothWingsClassicAspen
  bodyPart: Tail
  markingCategory: Tail
  forcedColoring: true
  speciesRestriction: [Moth, ProtoMoth]
  coloring:
    default:
      type:
        !type:SimpleColoring
          color: "#FFFFFF"
  layering: # WOLFGATE - the anatomy zone of the south frame draws behind the body, so the tail never covers anatomy
    aspen_BEHIND: TailBehind
  colorLinks: # WOLFGATE - both halves of a tail share one colour
    aspen_BEHIND: aspen_FRONT
  sprites:
  - sprite: _WF/Mobs/Customization/TailSplit/Nyanotrasen/Mobs/Customization/Moth/moth_wings.rsi # WOLFGATE - split art, anatomy zone only
