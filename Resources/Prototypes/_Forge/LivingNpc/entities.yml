- type: entity
  id: MobLivingNpcBase
  parent: BaseMobHuman
  name: living person
  description: They look like they actually have somewhere to be.
  abstract: true
  suffix: Living NPC
  components:
  - type: RandomHumanoidAppearance
  - type: NpcFactionMember
    factions:
    - NanoTrasen
  - type: ActiveListener
    range: 8
  - type: LivingNpc
    personalityId: LivingNpcPersonalityCivilian
    dialogueId: LivingNpcDialogueCivilian
    jobTitle: living-npc-job-civilian
    visionRange: 8
    homeRadius: 14
  - type: LivingNpcMemory
  - type: LivingNpcSocial
  - type: LivingNpcRoutine

- type: entity
  id: MobLivingNpcCivilian
  parent: MobLivingNpcBase
  name: civilian
  description: Just trying to get through the shift.
  components:
  - type: Loadout
    prototypes:
    - LivingNpcCivilianGear

