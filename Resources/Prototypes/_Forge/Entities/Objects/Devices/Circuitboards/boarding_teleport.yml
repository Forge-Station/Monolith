- type: entity
  parent: BaseComputerCircuitboard
  id: BoardingTeleportConsoleCircuitboard
  name: bluespace teleport console board
  description: A computer printed circuit board for a bluespace boarding teleport console.
  components:
  - type: Sprite
    state: cpu_science
  - type: ComputerBoard
    prototype: ComputerBoardingTeleport
  - type: Tag
    tags:
    - DroneUsable
    - HighRiskItem

- type: entity
  parent: BaseMachineCircuitboard
  id: BoardingTeleportEngineMachineCircuitboard
  name: bluespace teleport engine board
  description: A machine printed circuit board for a bluespace boarding teleport engine.
  components:
  - type: Sprite
    state: science
  - type: MachineBoard
    prototype: BoardingTeleportEngine
    requirements:
      Manipulator: 3
      Capacitor: 3
    stackRequirements:
      Steel: 6
      Glass: 6
      Plasma: 2

- type: entity
  parent: BaseMachineCircuitboard
  id: BoardingTeleportPlatformMachineCircuitboard
  name: bluespace teleport platform board
  description: A machine printed circuit board for a bluespace boarding teleport platform.
  components:
  - type: Sprite
    state: science
  - type: MachineBoard
    prototype: BoardingTeleportPlatform
    requirements:
      Manipulator: 2
      Capacitor: 2
    stackRequirements:
      Steel: 5
      Glass: 5
