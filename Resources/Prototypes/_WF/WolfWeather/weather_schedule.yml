# Schedules are for maps that aren't planets, such as an event map; a planet's weather follows its wfPlanetWeather.
#
# - type: weatherSchedule
#   id: WFMySchedule
#   gap:
#     min: 6m
#     max: 15m
#   weathers:
#   - weather: WFRainLight
#     weight: 2
#     duration:
#       min: 4m
#       max: 10m
#   - weather: WFRainHeavy
#     weight: 1
#     duration:
#       min: 2m
#       max: 5m
#     windAngle: # Overrides the weather's wind direction. Degrees, 0 is east.
#       min: 150
#       max: 210

- type: weatherSchedule
  id: WFTemperate
  gap:
    min: 6m
    max: 15m
  weathers:
  - weather: WFRainLight
    weight: 3
    duration:
      min: 4m
      max: 10m
  - weather: WFRainModerate
    weight: 2
    duration:
      min: 3m
      max: 8m
  - weather: WFFogWisps
    weight: 2
    duration:
      min: 3m
      max: 8m
  - weather: WFRainHeavy
    weight: 1
    duration:
      min: 2m
      max: 5m
    windAngle:
      min: 150
      max: 210
  - weather: WFStorm
    weight: 1
    duration:
      min: 2m
      max: 4m
