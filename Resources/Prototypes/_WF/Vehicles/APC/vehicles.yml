# The APC family. Wheels are fitted at spawn, and the two port guns (the port-gun-north and port-gun-south slots) are fitted
# in the base. The primary (turret), secondary (cannon) and support slots are empty, as in RMC: APC/armed.yml fits the dual
# cannon, the frontal cannon and the flare launcher. The tracked variant is the plain APC. The medical and command variants
# differ by sprite and interior, and have the two side doorways only: their interior maps have no exit for a third.

- type: entity
  parent: RMCVehicleBase
  id: VehicleAPCBase
  abstract: true
  name: armored personnel carrier
  description: A rugged armored personnel carrier outfitted for battlefield support.
  components:
  - type: WFMilitaryVehicle
  - type: VehicleSound
    runningSound: null
    collisionSound:
      collection: WFRcsmCollide
    mobCollisionSound:
      collection: WFRcsmCrush
    crashSound:
      collection: WFRcsmCrash
    hornSound: /Audio/_WF/Vehicles/RCSM/horn/horn.ogg
    hornCooldown: 2
  - type: WFVehicleEngineAudio
    startSound: /Audio/_WF/Vehicles/RCSM/engines/patria/start.ogg
    stopSound: /Audio/_WF/Vehicles/RCSM/engines/patria/stop.ogg
    idleLoop: /Audio/_WF/Vehicles/RCSM/engines/patria/idle.ogg
    driveLoop: /Audio/_WF/Vehicles/RCSM/engines/patria/drive.ogg
    highLoop: /Audio/_WF/Vehicles/RCSM/engines/patria/high.ogg
    revSound:
      collection: WFRcsmEngineRev
    gears: 5
    idlePitch: 1, 1.3
    drivePitch: 0.75, 1.4
    highPitch: 0.95, 1.25
    shiftSound:
      collection: WFRcsmEngineShift
    throttleResponse: 5
    tracksLoop: /Audio/_WF/Vehicles/RCSM/wheels/road.ogg
    startDelay: 3
    tracksPitch: 0.9, 1.25
  - type: WFVehicleHitSound
    lightHitSound:
      collection: WFRcsmHitBullet
    lightRicochetSound:
      collection: WFRcsmRicochet
    heavyHitSound:
      collection: WFRcsmHitShell
    heavyRicochetSound:
      collection: WFRcsmShellRicochet
  - type: WFVehicleDestroyedSound
    sequence:
    - sound:
        collection: WFRcsmVehicleBlastAmmo
        params:
          volume: 6
          maxDistance: 40
    - sound:
        collection: WFRcsmVehicleBlastLayer
        params:
          volume: 4
          maxDistance: 30
    - delay: 0.5
      sound:
        collection: WFRcsmVehicleDebris
    - delay: 1.6
      sound:
        collection: WFRcsmVehicleCookoff
        params:
          maxDistance: 24
    - delay: 3
      sound:
        collection: WFRcsmVehicleCrackers
    - delay: 4.2
      sound:
        collection: WFRcsmVehicleBurn
        params:
          maxDistance: 16
    - delay: 6
      sound:
        collection: WFRcsmVehicleCookoff
        params:
          volume: -3
          maxDistance: 24
    - delay: 8
      sound:
        collection: WFRcsmVehicleFire
        params:
          maxDistance: 14
    - delay: 11
      sound:
        collection: WFRcsmVehicleFireStress
        params:
          maxDistance: 12
  - type: WarpPoint
    follow: true
    location: APC
  - type: GridVehicleMover
    plowRamMinSpeed: 6
    maxRotationSpeedDegrees: 90
    rotationAccelerationDegrees: 150
    rotationDecelerationDegrees: 210
    alignmentAssistDegrees: 8
    maxSpeed: 11
    acceleration: 6
    deceleration: 12
    turnDelay: 0.4
    weightClass: Light
  - type: VehicleOvercharge
    speedMultiplier: 1.4
    duration: 3
    cooldown: 15
    overchargeSound: /Audio/_WF/Vehicles/overdrive_activate.ogg
  - type: VehicleSpotlight
    radius: 7
    energy: 3
    softness: 2
  - type: Fixtures
    fixtures:
      world:
        shape:
          !type:PhysShapeAabb
          bounds: -1,-1.7,1,1.7
        density: 1200
        mask:
        - Impassable
        - HighImpassable
        - LowImpassable
        - LargeMobLayer
        - Vehicle
        layer:
        - LargeMobLayer
        - Vehicle
      mob:
        shape:
          !type:PhysShapeAabb
          bounds: -1,-1.7,1,1.7
        density: 1200
        mask:
        - MidImpassable
        - LargeMobLayer
        layer:
        - LargeMobLayer
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: VehicleFrameAPC # APC damage modifier
  - type: Sprite
    drawdepth: Mobs
    sprite: _WF/Vehicles/apc.rsi
    layers:
    - map: [ base ]
      state: apc_base
    - map: [ damaged_frame ]
      state: damaged_frame
      visible: false
    - map: [ primary ]
      state: PRIMARY
      visible: false
    - map: [ secondary ]
      state: SECONDARY
      visible: false
    - map: [ support ]
      state: SUPPORT
      visible: false
    - map: [ rmc-wheels ]
      state: wheels_1
  - type: PointLight
    enabled: false
    radius: 12
    energy: 2.5
    softness: 2
    autoRot: true
    offset: "0,0.9"
  - type: VehicleHardpointVisuals
  - type: ItemSlots
    slots:
      port-gun-north:
        startingItem: VehicleAPCM56FPWPortGunRight
        insertOnInteract: false
        ejectOnInteract: false
        ejectOnUse: false
        locked: true
        disableEject: true
        whitelist:
          components:
          - VehiclePortGun
      port-gun-south:
        startingItem: VehicleAPCM56FPWPortGunLeft
        insertOnInteract: false
        ejectOnInteract: false
        ejectOnUse: false
        locked: true
        disableEject: true
        whitelist:
          components:
          - VehiclePortGun
      wheel-1:
        startingItem: RMCAPCWheel
        whitelist:
          components:
          - VehicleWheelItem
  - type: HardpointSlots
    vehicleFamily: HardpointVehicleFamilyAPC
    slots:
    - id: primary
      hardpointType: HardpointTypeTurret
      slotType: HardpointSlotTypeTurret
      visualLayer: primary
      insertDelay: 2.5
      required: false
    - id: secondary
      hardpointType: HardpointTypeCannon
      slotType: HardpointSlotTypeCannon
      visualLayer: secondary
      insertDelay: 2.5
      required: false
    - id: support
      hardpointType: HardpointTypeSupportAttachment
      slotType: HardpointSlotTypeSupportAttachment
      visualLayer: support
      insertDelay: 2.0
      required: false
    - id: wheel-1
      hardpointType: HardpointTypeWheel
      slotType: HardpointSlotTypeWheel
      insertDelay: 1.5
  - type: VehicleEnter
    interiorPath: /Maps/_WF/Vehicles/Interiors/apc_transport_interior.yml
    enterDoAfter: 1.0
    exitDoAfter: 1.0
    maxPassengers: 10
    entryPoints:
    - offset: 1.5,0
      radius: 0.7
      interiorCoords: 1.55,2.65
    - offset: -1.5,0
      radius: 0.7
      interiorCoords: 1.55,-1.2
  - type: StaticPrice
    price: 40000 # placeholder

- type: entity
  parent: VehicleAPCBase
  id: VehicleAPC
  suffix: Drivable, APC, Base
  components:
  - type: VehicleEnter
    interiorPath: /Maps/_WF/Vehicles/Interiors/apc_transport_interior.yml
    enterDoAfter: 1.0
    exitDoAfter: 1.0
    maxPassengers: 18
    entryPoints:
    - offset: 1.5,0
      radius: 0.7
      interiorCoords: 1.55,2.65
    - offset: -1.5,0
      radius: 0.7
      interiorCoords: 1.55,-1.2

- type: entity
  parent: VehicleAPC
  id: VehicleAPCTracked
  suffix: Drivable, APC, Base, Tracked

- type: entity
  parent: VehicleAPCTracked
  id: VehicleAPCMed
  name: armored personnel carrier (medical)
  description: A medical-configured APC outfitted with triage markings.
  suffix: Drivable, APC, Base, Medical, Tracked
  components:
  - type: Sprite
    layers:
    - map: [ base ]
      state: apc_base_med
    - map: [ damaged_frame ]
      state: damaged_frame
      visible: false
    - map: [ primary ]
      state: PRIMARY
      visible: false
    - map: [ secondary ]
      state: SECONDARY
      visible: false
    - map: [ support ]
      state: SUPPORT
      visible: false
    - map: [ rmc-wheels ]
      state: wheels_1
  - type: VehicleEnter
    interiorPath: /Maps/_WF/Vehicles/Interiors/apc_medical_interior.yml
    enterDoAfter: 1.0
    exitDoAfter: 1.0
    maxPassengers: 11
    entryPoints:
    - offset: 1.5,0
      radius: 0.7
      interiorCoords: 1.6,2.6
    - offset: -1.5,0
      radius: 0.7
      interiorCoords: 1.6,-1.5

- type: entity
  parent: VehicleAPCTracked
  id: VehicleAPCCommand
  name: armored personnel carrier (command)
  description: A command-configured APC bristling with sensors and comms gear.
  suffix: Drivable, APC, Base, Command, Tracked
  components:
  - type: Sprite
    layers:
    - map: [ base ]
      state: apc_base_com
    - map: [ damaged_frame ]
      state: damaged_frame
      visible: false
    - map: [ primary ]
      state: PRIMARY
      visible: false
    - map: [ secondary ]
      state: SECONDARY
      visible: false
    - map: [ support ]
      state: SUPPORT
      visible: false
    - map: [ rmc-wheels ]
      state: wheels_1
  - type: VehicleEnter
    interiorPath: /Maps/_WF/Vehicles/Interiors/apc_command_interior.yml
    enterDoAfter: 1.0
    exitDoAfter: 1.0
    maxPassengers: 12
    entryPoints:
    - offset: 1.5,0
      radius: 0.7
      interiorCoords: 1.6,2.6
    - offset: -1.5,0
      radius: 0.7
      interiorCoords: 1.6,-1.5

## SPP

# The turret (VehicleSPPAPCTurret) is fitted at spawn with its minigun. The SPP APC has no port guns: its slots list leaves them out.
- type: entity
  parent: VehicleAPCBase
  id: VehicleSPPAPC
  name: SPP armored personnel carrier
  description: An armored personnel carrier configured for SPP forces.
  suffix: Drivable, APC, Base, SPP
  components:
  - type: GridVehicleMover
    maxSpeed: 11
    acceleration: 4.5
    deceleration: 10
    maxReverseSpeed: 4
    reverseAcceleration: 3
    turnDelay: 0.25
    turnInPlace: false
  - type: Sprite
    sprite: _WF/Vehicles/sppapc.rsi
    layers:
    - map: [ base ]
      state: sppapc_base
    - map: [ damaged_frame ]
      state: damaged_frame
      visible: false
    - map: [ primary ]
      state: PRIMARY
      visible: false
    - map: [ secondary ]
      state: SECONDARIES
      visible: false
    - map: [ support ]
      state: SUPPORT
      visible: false
    - map: [ rmc-wheels ]
      state: wheels_1
  - type: ItemSlots
    slots:
      primary:
        startingItem: VehicleSPPAPCTurret
        whitelist:
          components:
          - HardpointItem
      wheel-1:
        startingItem: VehicleSPPAPCWheel
        whitelist:
          components:
          - VehicleWheelItem
  - type: HardpointSlots
    vehicleFamily: HardpointVehicleFamilyAPC
    slots:
    - id: primary
      hardpointType: HardpointTypeTurret
      slotType: HardpointSlotTypeTurret
      compatibilityId: HardpointCompatibilitySPPAPC
      visualLayer: primary
      insertDelay: 2.5
      required: false
    - id: secondary
      hardpointType: HardpointTypeCannon
      slotType: HardpointSlotTypeCannon
      compatibilityId: HardpointCompatibilitySPPAPC
      visualLayer: secondary
      insertDelay: 2.5
      required: false
    - id: support
      hardpointType: HardpointTypeSupportAttachment
      slotType: HardpointSlotTypeSupportAttachment
      compatibilityId: HardpointCompatibilitySPPAPC
      visualLayer: support
      insertDelay: 2.0
      required: false
    - id: wheel-1
      hardpointType: HardpointTypeWheel
      slotType: HardpointSlotTypeWheel
      compatibilityId: HardpointCompatibilitySPPAPC
      insertDelay: 1.5
  - type: VehicleEnter
    interiorPath: /Maps/_WF/Vehicles/Interiors/spp_apc_interior.yml
    enterDoAfter: 1.0
    exitDoAfter: 1.0
    maxPassengers: 14
    entryPoints:
    - offset: -1.5,0
      radius: 0.7
      interiorCoords: 4.45,-1.2
    - offset: 1.5,0
      radius: 0.7
      interiorCoords: 4.45,1.7
