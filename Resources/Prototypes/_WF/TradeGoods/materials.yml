# What trade crates break down into in a lathe. A crate is 10000 of its material, so recipes spend a share of one. They are
# priced at zero because the crate carries the value, and a price would add to what a crate sells for. They have no stack
# entity, so what goes into a lathe stays in it.
- type: material
  id: WFMunitions
  name: materials-wf-munitions
  unit: materials-unit-wf-crate-share
  icon: { sprite: _Mono/Objects/TradeGoods/trade.rsi, state: ammo }
  color: "#a8552f"
  price: 0

