# The planet-wide mix wrecks use; the biome places the per-region spawners in Life/thrascias.yml.
- type: entityTable
  id: WFFaunaThrascias
  table: !type:GroupSelector
    children:
    - id: MobArgocyteSlurva
      weight: 4
    - id: WFMobThrasciasPenguin
      weight: 3
    - id: WFMobThrasciasSnowFox
      weight: 2
    - id: MobArgocyteBarrier
      weight: 2
    - id: WFMobThrasciasFrostBear
      weight: 1

- type: entity
  id: WFFaunaThrascias
  parent: MarkerBase
  name: thrascias wildlife spawner
  categories: [HideSpawnMenu]
  components:
  - type: WFPlanetFaunaSpawner
    table: WFFaunaThrascias



# Heat-adapted native; retains normal combat damage and AI.
- type: entity
  id: WFMobArgocyteSlurvaBasalt
  parent: MobArgocyteSlurva
  suffix: Fervidus
  components:
  - type: Temperature
    heatDamageThreshold: 500
    coldDamageThreshold: 0
    currentTemperature: 373.15

