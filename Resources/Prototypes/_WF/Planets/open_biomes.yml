# WFOpenSnow (Thrascias) moved to Biomes/thrascias.yml as WFThrasciasTerrain.

- type: biomeTemplate
  id: WFTemperatePlains
  layers:
  - !type:BiomeTileLayer
    tile: FloorPlanetGrass
    threshold: -1
  # Meadow patches in a livelier green, a darker floor under the woodland, dirt, and a mud ring round each pond.
  - !type:BiomeTileLayer
    tile: WFFloorVerdaMeadowGrass
    threshold: 0.35
    noise: { seed: 61, noiseType: OpenSimplex2, frequency: 0.005 }
  - !type:BiomeTileLayer
    tile: WFFloorVerdaForestGrass
    threshold: 0.25
    noise: { seed: 17, noiseType: OpenSimplex2, frequency: 0.005 }
  - !type:BiomeTileLayer
    tile: FloorPlanetDirt
    threshold: 0.72
    noise: { seed: 6, noiseType: OpenSimplex2, frequency: 0.01 }
  - !type:BiomeTileLayer
    tile: WFFloorVerdaPondMud
    threshold: 0.76
    noise: { seed: 41, noiseType: OpenSimplex2, frequency: 0.03, fractalType: FBm, octaves: 2 }
  # Decals go first: a decal layer that passes blocks every entity layer listed before it.
  - !type:BiomeDecalLayer
    allowedTiles: [WFFloorVerdaMeadowGrass]
    decals: [AuroraDecalFloorDecalKonyangFlowers]
    threshold: 0.75
    noise: { seed: 64, noiseType: OpenSimplex2, frequency: 4 }
  # Wildlife by region (Planets/Life/verda_mobs.yml): meadow, woods and the pond shores.
  - !type:BiomeEntityLayer
    allowedTiles: [FloorPlanetGrass, FloorPlanetDirt, WFFloorVerdaMeadowGrass]
    entities: [WFFaunaVerdaMeadow]
    threshold: 0.95
    noise: { seed: 37, noiseType: OpenSimplex2, frequency: 3 }
  - !type:BiomeEntityLayer
    allowedTiles: [WFFloorVerdaForestGrass]
    entities: [WFFaunaVerdaWoods]
    threshold: 0.95
    noise: { seed: 37, noiseType: OpenSimplex2, frequency: 3 }
  - !type:BiomeEntityLayer
    allowedTiles: [WFFloorVerdaPondMud]
    entities: [WFFaunaVerdaShore]
    threshold: 0.95
    noise: { seed: 37, noiseType: OpenSimplex2, frequency: 3 }
  # Wildflower meadows.
  - !type:BiomeEntityLayer
    allowedTiles: [WFFloorVerdaMeadowGrass]
    entities: [CoyoteWildPlantFlowerBlue, CoyoteWildPlantFlowerOrange]
    threshold: 0.84
    noise: { seed: 201, noiseType: OpenSimplex2, frequency: 5 }
  - !type:BiomeEntityLayer
    allowedTiles: [WFFloorVerdaMeadowGrass]
    entities: [CoyoteWildPlantFlowerPink, CoyoteWildPlantFlowerPurple]
    threshold: 0.84
    noise: { seed: 202, noiseType: OpenSimplex2, frequency: 5 }
  - !type:BiomeEntityLayer
    allowedTiles: [WFFloorVerdaMeadowGrass]
    entities: [CoyoteWildPlantFlowerRed, CoyoteWildPlantFlowerWhite]
    threshold: 0.84
    noise: { seed: 203, noiseType: OpenSimplex2, frequency: 5 }
  - !type:BiomeEntityLayer
    allowedTiles: [WFFloorVerdaMeadowGrass]
    entities: [CoyoteWildPlantFlowerYellowhite, CoyoteWildPlantPetuniaBlue]
    threshold: 0.84
    noise: { seed: 204, noiseType: OpenSimplex2, frequency: 5 }
  - !type:BiomeEntityLayer
    allowedTiles: [WFFloorVerdaMeadowGrass]
    entities: [DarkPackFloraDarkpackFlowerMarigold, CoyoteFloraWildPlantThistle]
    threshold: 0.84
    noise: { seed: 205, noiseType: OpenSimplex2, frequency: 5 }
  - !type:BiomeEntityLayer
    allowedTiles: [WFFloorVerdaMeadowGrass]
    entities: [CoyoteFloraTallgrass3, CoyoteFloraTallgrass5]
    threshold: 0.84
    noise: { seed: 206, noiseType: OpenSimplex2, frequency: 5 }
  # Bees and snakes stand where a wildflower or a clump of tall grass would (same noise, a higher threshold, listed after).
  - !type:BiomeEntityLayer
    allowedTiles: [WFFloorVerdaMeadowGrass]
    entities: [WFFaunaVerdaBees]
    threshold: 0.97
    noise: { seed: 201, noiseType: OpenSimplex2, frequency: 5 }
  - !type:BiomeEntityLayer
    allowedTiles: [WFFloorVerdaMeadowGrass]
    entities: [WFFaunaVerdaGrass]
    threshold: 0.97
    noise: { seed: 206, noiseType: OpenSimplex2, frequency: 5 }
  - !type:BiomeMetaLayer
    template: WFTemperateWoodland
    threshold: 0.2
    noise: { seed: 17, noiseType: OpenSimplex2, frequency: 0.005 }
  - !type:BiomeEntityLayer
    allowedTiles: [FloorPlanetGrass, FloorPlanetDirt, WFFloorVerdaMeadowGrass, WFFloorVerdaForestGrass]
    entities: [MonoPlanetmapOreBase]
