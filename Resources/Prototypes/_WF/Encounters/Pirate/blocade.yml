# Raiders sit on a station's approaches. While they hold them the station is blockaded: its supply lines are cut,
# freighters stay away and it pays relief prices. Driving them off lifts it and pays whoever did.
- type: wfEncounter
  id: WFEncounterStationBlockade
  avoidStations: [ Helios, PDV, Caelestinus ]
  leash: 2500
  name: wf-encounter-name-station-blockade
  announcement: wf-encounter-announce-station-blockade
  announcementSender: wf-encounter-sender-traffic
  start: Scheduled
  category: Threat
  icon: Skull
  cost: 2
  weight: 1.5
  minPlayers: 4
  placement: Station
  standoff: 1500
  blockades: true
  cooldown: 3600
