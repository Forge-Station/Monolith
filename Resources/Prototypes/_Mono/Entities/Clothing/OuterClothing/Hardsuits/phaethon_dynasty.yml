- type: entity
  parent: [ ClothingOuterHardsuitBaseNoPlateholder, MonoEnergyShieldClothing ]
  id: ClothingOuterHardsuitAshenElite
  name: PDV CV-53 combat tacsuit
  description: Originally based on the CV-32 hardsuit, the CV-53 tacsuit sacrifices conventional armor plating for environmental protection and a rechargeable soft shield. # WOLFGATE(SoftShield): soft shield
  components:
  - type: Sprite
    sprite: _Mono/Clothing/OuterClothing/Hardsuits/syndieelite.rsi
  - type: Clothing
    sprite: _Mono/Clothing/OuterClothing/Hardsuits/syndieelite.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.02
    lowPressureMultiplier: 1000
  - type: TemperatureProtection
    heatingCoefficient: 0.001
    coolingCoefficient: 0.001
  - type: HeldSpeedModifier
  - type: StaminaDamageResistance # Mono - Stamres
    coefficient: 0.45
  - type: ToggleableClothing
    requiredSlot: outerclothing
    blockUnequipWhenAttached: false
    replaceCurrentClothing: true
    clothingPrototypes:
      head: ClothingHeadHelmetHardsuitAshenElite
      helmetcover: ClothingHeadHelmetCoverBlock
      helmetattachment: ClothingHeadHelmetAttachmentBlock
  - type: ExplosionResistance
    damageCoefficient: 0.2
  - type: FireProtection
    reduction: 0.8
  - type: Armor # Mono - Armor Value Changes
    modifiers:
      coefficients:
        # WOLFGATE(ArmorBalance): sidegrade pass.
        Blunt: 0.75
        Slash: 0.75
        Piercing: 0.7
        Heat: 0.7
        Radiation: 0.1
        Caustic: 0.5
  - type: Item
    size: Huge
  - type: ClothingSpeedModifier
    walkModifier: 0.95
    sprintModifier: 0.95
  - type: Tag
    tags:
    - RogueHardsuit
  - type: WFSoftShield # WOLFGATE(SoftShield): brute damage bleeds through the field dampened.
  # Shielding
  - type: PersonalShield
    visuals:
      color: "#FF5F1F"
      scale: 2
      fillLevel: 0.1
      coreFade: 0.85
    shield:
      maxCharge: 100
      regenRate: 5
      spinupTime: 0.5
      breakCooldown: 17
      powerDraw: 1
      blockModifier:
        coefficients:
          Piercing: 0.5
          Heat: 1.5
          Radiation: 2.5
          Shock: 2.5
  - type: Battery
    maxCharge: 100
    startingCharge: 100
  - type: BatterySelfRecharger
    autoRecharge: true
    autoRechargeRate: 5
  - type: UseDelay
    delay: 10
  - type: PointLight
    enabled: false
    radius: 1.4
    energy: 2
    color: "#5dd439"
  - type: ExtendDescription
    descriptionList:
    - description: Alt-click or otherwise interact to toggle additional shielding.
      color: "#4f94ad"
      requireDetailRange: true
    - description: The CV-53 soft-shield lets blows and rounds through but bleeds off much of their force, and keeps its wearer from bleeding while it holds. It does nothing against lasers or fire. # WOLFGATE(SoftShield): soft shield
      color: "#94768c"
      requireDetailRange: true

