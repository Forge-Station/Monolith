    state: sticky
  - type: IconSmooth
    key: xeno_sticky
    mode: NoSprite
  - type: SpeedModifierContacts
    walkSpeedModifier: 0.35
    sprintSpeedModifier: 0.35
    ignoreWhitelist:
      components:
      - ForgeXeno

- type: entity
  parent: XenoWeeds
  id: XenoFastResin
  name: fast resin
  description: Slick hive resin. Xenomorphs would love this. You will not.
  suffix: Forge, Xeno, CM
  components:
  - type: Sprite
    drawdepth: FloorObjects
    sprite: _CM/Structures/Xenos/xeno_floor_resins.rsi
    state: fast
  - type: Icon
    sprite: _CM/Structures/Xenos/xeno_floor_resins.rsi
    state: fast
  - type: IconSmooth
