    deleteOnSpawn: true

# Three shells a shot, as in RMC; they all fly to the aimed point, at most 9 tiles out as in RMC and CMU, and burst there or
# where they meet a wall.
- type: entity
  parent: BaseBullet
  id: WFVehicleSmokeShell
  name: 40mm smoke grenade
  categories: [ HideSpawnMenu, WFVehicles ]
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/projectiles2.rsi
    layers:
    - state: grenade
  - type: Projectile
    deleteOnCollide: false
    impactEffect: BulletImpactEffect
    damage:
      types:
        Piercing: 30
    soundHit:
      path: /Audio/Effects/gen_hit.ogg
  - type: IgnorePredictionHide
  - type: ProjectileMaxFixedRange
    maxFixedRange: 9
  - type: ProjectileSpread
    proto: WFVehicleSmokeShell
    count: 3
    spread: 45
  - type: TimedDespawn
    lifetime: 2
  - type: TriggerOnFixedDistanceStop
    delay: 0
  - type: SmokeOnTrigger
    duration: 20
    spreadAmount: 25
  - type: SoundOnTrigger
    sound: /Audio/_Mono/Weapons/Grenades/smoke_bomb.ogg
  - type: DeleteOnTrigger

