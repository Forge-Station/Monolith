#region Forge-change

- type: entity
  parent: ClothingScarfBase
  id: ClothingNeckScarfStripedRed
  name: striped red scarf
  description: A stylish striped red scarf. The perfect winter accessory for those with a keen fashion sense, and those who just can't handle a cold breeze on their necks.
  components:
  - type: Sprite
    sprite: _Forge/Clothing/Neck/Scarfs/forgescarfs.rsi #Forge-change-start
    color: "#ff2c2c"
  - type: Clothing
    sprite: _Forge/Clothing/Neck/Scarfs/forgescarfs.rsi
    clothingVisuals:
      neck:
      - state: equipped-NECK
        color: "#ff2c2c"
        map: ["scarf-style"]
  - type: Item #Forge-change-add-start new changable states with action
    inhandVisuals:
      left:
      - state: inhand-left
        color: "#ff2c2c"
      right:
      - state: inhand-right
        color: "#ff2c2c"
  - type: ScarfStyleCycler
    action: ActionCycleScarfStyle
    states:
    - state: equipped-NECK
      color: "#ff2c2c"
    - state: 1-equipped-NECK
      color: "#ff2c2c"
    - state: 2-equipped-NECK
      color: "#ff2c2c" #Forge-change-end

