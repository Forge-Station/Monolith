- type: entity
  id: WeaponTurretForgeHeavyTorpedoBase
  parent: BallisticArtilleryTier4HP
  abstract: true
  name: FHT-300 Gungnir heavy torpedo launcher
  description: A heavy torpedo launcher for heavy guided torpedoes. It can fire without direct line of sight, but needs a clear muzzle lane.
  components:
  - type: StaticPrice
    price: 18000
  - type: Sprite
    sprite: _Forge/Objects/ShuttleWeapons/gungnir.rsi
    layers:
    - state: space_artillery
  - type: Appearance
  - type: ForgeTorpedoLauncher
    tileProbeDistance: 1.5
    clearanceRayDistance: 1.75
  - type: AmmoCounter
  - type: Battery
    maxCharge: 90000
    startingCharge: 90000
  - type: ExaminableBattery
  - type: WirelessNetworkConnection
    range: 500
  - type: Gun
    fireRate: 0.08
    recoil: 20
    minAngle: 0
    maxAngle: 0
    shootThermalSignature: 48000000
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/rocket_launcher.ogg
    soundEmpty:
      path: /Audio/Weapons/Guns/EmptyAlarm/smg_empty_alarm.ogg
  - type: SpaceArtillery
    powerChargeRate: 600
    powerUsePassive: 1800
    powerUseActive: 0
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.5,-1.5,0.5,1.5"
        density: 800
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: BatterySelfRecharger
    autoRecharge: true
    autoRechargeRate: 250
  - type: Actions
  - type: ProjectileBatteryAmmoProvider
    proto: ShipTorpedoForgeHeavy
    fireCost: 30000
  - type: RadarBlip
    radarColor: "#ff9d00"
    scale: 2.5
    visibleFromOtherGrids: true
    gridConfig:
      color: "#ff9d00"
      shape: Square
      respectZoom: true
      rotate: true
      bounds: "-0.5,-1.5,0.5,1.5"
  - type: ShipGunType
    shipType: Missile
  - type: ShipGunClass
    shipClass: Superheavy
  - type: ShipRepairable
    repairTime: 45
    repairCost: 160

- type: entity
  id: WeaponTurretForgeHeavyTorpedo
  parent: [WeaponTurretForgeHeavyTorpedoBase, BallisticArtilleryMapped]
  suffix: For mapping

- type: entity
  id: WeaponTurretForgeHeavyTorpedoPortable
  parent: [WeaponTurretForgeHeavyTorpedoBase, BallisticArtillery]
  suffix: DO NOT MAP

- type: entity
  id: ShipTorpedoForgeHeavy
  name: FHT-300 heavy torpedo
  parent: BaseTorpedo
  categories: [ HideSpawnMenu ]
  components:
  - type: Fixtures
    fixtures:
      projectile:
        shape: !type:PhysShapeCircle
          radius: 0.3
        density: 1500
        layer:
        - WallLayer
        mask:
        - MachineMask
        - BulletImpassable
  - type: Projectile
    damage:
      types:
        Structural: 4500
        Blunt: 900
        Heat: 450
  - type: Sprite
    sprite: _Mono/Objects/SpaceArtillery/mini_rocket.rsi
    layers:
    - state: mini-rocket
      scale: 1, 2
  - type: Ammo
    muzzleFlash: null
  - type: ShipWeaponProjectile
  - type: RadarBlip
    radarColor: "#ff9d00"
    scale: 4
    shape: triangle
  - type: TimedDespawn
    lifetime: 22
  - type: PointLight
    radius: 5
    color: orange
    energy: 2
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: Default
    totalIntensity: 2500
    intensitySlope: 35
    maxIntensity: 220
  - type: GatheringProjectile
  - type: MiningGatheringSoft
  - type: MiningGatheringHard
  - type: TargetSeeking
    acceleration: 45
    detectionRange: 850
    scanArc: 55
    launchSpeed: 35
    maxSpeed: 90
    trackDelay: 2
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: Meteor
    damageTypes:
      types:
        Blunt: 1
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 1200
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:ExplodeBehavior ""
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
