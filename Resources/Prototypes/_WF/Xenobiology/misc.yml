- type: entity
  id: ActionSlimeLatch
  name: Latch
  description: Latch onto a target and start digesting it, or get off the one you're on.
  components:
  - type: EntityTargetAction
    icon:
      sprite: _WF/Xenobiology/Actions/actions_slime.rsi
      state: slimeeat
    itemIconStyle: NoItem
    useDelay: 3
    range: 1
    whitelist:
      components:
      - MobState
      - Body
    blacklist:
      components:
      - Slime
    canTargetSelf: false
    event: !type:SlimeLatchEvent
