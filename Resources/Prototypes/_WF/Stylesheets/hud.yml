# Wolfgate HUD theme, paired with the Wolfgate (Futurist) UI skin.
- type: hudTheme
  id: WFTheme
  name: ui-options-hud-theme-wolfgate
  path: /Textures/_WF/Stylesheets/Interface/Wolfgate/
  order: -1

- type: uiTheme
  id: WFTheme
  path: /Textures/_WF/Stylesheets/Interface/Wolfgate/
  colors:
    whiteText: "#E6EDF3"
    slotSelectedGold: "#46D7FF"
    slotColor: "#0E141B"
    slotOutline: "#2A3B4D"
    slotText: "#8A9BAB"
    nanoGold: "#46D7FF"
    goodGreenFore: "#3CE39B"
    concerningOrangeFore: "#FFB547"
    dangerousRedFore: "#FF4D5E"

# Aphelion cassette-futurism theme, paired with the WolfgateRetro UI skin. Listed first and used as the client default.
- type: hudTheme
