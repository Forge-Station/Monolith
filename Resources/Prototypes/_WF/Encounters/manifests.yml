# What a freight run may be carrying. One is picked per run; the captain names it and the hold is filled from it. A
# crate listed twice is twice as likely. Most of a hold is Monolith's trade goods, the crates the Trade Mall sells and
# every station's turn-in chute pays for, two to ten thousand each depending on where they are taken, with the dear and
# dangerous ones (reactor fuel, ammunition, luxuries) rare. The rest is the cargo catalogue's crates, which sell at a
# pallet for what is in them, and the lots in crates.yml that no catalogue has.
# A stop restocks only the trade goods aboard and the manifest's materials. Every good a station vendor sells has to be
# on a manifest that runs at any player count. Plasma, uranium, lithium and precious metals stay with the miners.

- type: wfEncounterManifest
  id: WFManifestGeneral
  name: wf-encounter-cargo-general
  materials: [ SheetSteel1, SheetGlass1, SheetPlastic1 ]
  crates:
  - TradeGoodSupplies
  - TradeGoodSupplies
  - TradeGoodSupplies
  - TradeGoodMetals
  - TradeGoodMetals
  - TradeGoodFabric
  - TradeGoodFabric
  - TradeGoodComponents
  - TradeGoodComponents
  - TradeGoodEquipment
  - TradeGoodEquipment
  - TradeGoodScrap
  - TradeGoodFertilizer
  - CrateMaterialSteel
  - CrateMaterialPlastic
  - CrateFoodMRE
  - CrateEmergencyInternalsLarge
  - CrateServiceSmokeables
  - CrateFunInstrumentsVariety
  - WFCrateLotTools
  - WFCrateLotSurvival

