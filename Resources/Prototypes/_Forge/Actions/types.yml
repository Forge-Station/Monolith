
- type: entity
  id: ActionActivateTranexamic
  name: Activate Tranexamic Acid
  description: Deliver a Tranexamic acid and Ephinefrine from your implant.
  categories: [ HideSpawnMenu ]
  components:
  - type: InstantAction
    checkCanInteract: false
    checkConsciousness: false
    icon:
      sprite: Objects/Specific/Medical/medipen.rsi
      state: morphen
    event: !type:ActivateImplantEvent

- type: entity
  id: ActionActivateTranexamicDose
  name: Activate Tranexamic Acid (Dose)
  description: Deliver 5u dose of Tranexamic acid from your implant.
  categories: [ HideSpawnMenu ]
  components:
  - type: InstantAction
    checkCanInteract: false
    checkConsciousness: false
    icon:
      sprite: Objects/Specific/Medical/medipen.rsi
      state: morphen
    event: !type:ActivateImplantEvent {}

- type: entity
  id: ActionCycleClothingStyle
  name: Change clothing style
  description: Cycle through available styles.
  components:
  - type: InstantAction
    useDelay: 2
    itemIconStyle: BigItem
    event: !type:CycleClothingStyleEvent
