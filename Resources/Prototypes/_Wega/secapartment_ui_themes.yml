# Forge-Change-start

# Косметика UI планшета SecApartment. Одна тема = одна фракция.

# Принцип: насыщенный фракционный цвет + тёмные фоны, без кислотных #ff**** на всём UI.



# Служба безопасности / отладочный планшет (тёмно-красный + акценты, без кричащей плашки)

- type: secApUiTheme

  id: SecApUiThemeSecurity

  showLogo: true

  showFooter: true

  showOsStripe: true

  logoTexture: /Textures/Interface/Nano/ntlogo.svg.png

  windowBackground: "#101010"

  windowBorder: "#3a2020"

  contentBackground: "#662020"

  contentBorder: "#441414"

  closeButton: "#dd4848"

  divider: "#993333"

  listPanelBackground: "#1a0808"

  listPanelBorder: "#882828"

  createSquadPanelBackground: "#2a1010"

  createSquadPanelBorder: "#882828"

  cardBackground: "#3a1414"

  cardBorder: "#aa3333"

  entryBackground: "#120606"

  entryBorder: "#882828"

  memberAliveBackground: "#3a1010"

  memberAliveBorder: "#cc5555"

  memberDeadBackground: "#0a0404"

  memberDeadBorder: "#662222"

  memberDeadText: "#886666"

  tabActive: "#ee5555"

  tabInactive: "#aa6060"

  heading: "#ee5555"

  text: "#dd9999"

  subText: "#bb7070"

  placeholder: "#994444"

  buttonBackground: "#551818"

  buttonBorder: "#aa3333"

  lineEditBackground: "#120606"

  optionBackground: "#2a1010"

  tabActiveBackground: "#441818"

  tabInactiveBackground: "#1a0808"

  panelBackground: "#0a0404"

  timerOverdue: "#cc3333"

  timerCritical: "#cc5533"

  timerWarning: "#cc7733"

  timerNormal: "#dd9999"



