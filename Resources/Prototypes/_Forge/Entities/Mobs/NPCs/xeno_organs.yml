  components:
  - type: Sprite
    state: lung-l
  - type: ForgeXenoOrgan
    actions:
    - ActionForgeXenoHide

- type: entity
  parent: OrganXenoBase
  id: OrganXenoLeap
  name: xenomorph leap gland
