# Each asteroid is a grid of invisible tiles, which gives it ship collisions, radar, FTL clearance and tractor beam
# support, with one rock entity anchored at its centre that holds the sprite, the ore and the heat.
# Rock mass is in ore veins, inert rock included; it matches the rock count of the tile asteroids it replaces, and
# each vein drops oreYield times a vein rock's ore.
# Weapons shatter a rock for a tenth of its ore after about 530 damage per vein of mass: an Apollo or M25 can break
# one in a pinch, but slowly and for far less ore than a mining laser.

# region Rocks
- type: entity
  id: WFAsteroidRockBase
  abstract: true
  name: asteroid
  description: A drifting rock, pocked with old impacts. Who knows what is locked away inside.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
    noRot: false
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: RangedDamageSound
    soundGroups:
      Brute:
        collection: WFBulletImpactConcrete
  - type: PointLight
    enabled: false
    energy: 0
    color: "#ff8a30"
    castShadows: false
  - type: Sprite
    drawdepth: Walls
    layers:
    - state: rock0
      map: [ "enum.WFAsteroidVisualLayers.Rock" ]
    - state: veins0
      map: [ "enum.WFAsteroidVisualLayers.Veins" ]
    # Hidden while cold: a layer with its own shader breaks the sprite batch even when it is clear.
    - state: heat0
      map: [ "enum.WFAsteroidVisualLayers.Heat" ]
      shader: WFAdditiveUnshaded
      color: "#00000000"
      visible: false
  # Each vein drops more than a vein rock, and few go to boulders, since cracking rocks one at a time is slower than
  # chewing through tile asteroids was.
  - type: WFAsteroid
    oreYield: 1.35
    boulderShare: 0.15

