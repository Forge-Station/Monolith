# The Ashfall Reaver campaign's encounters. Everything here is started by the campaign or an admin, never the
# storyteller. The first ship listed is the lead: a stronghold breaks when its lead is out of the fight, and a patrol,
# raid or reinforcement flies the lead's orders.

# A stronghold hub: a shielded frigate with docking ports holding a cell centre, with no guards. The campaign docks
# reinforcements to it as it ages (WFReaverReinforcement*). Saintie carries its own Aegis shield generator, so it comes
# up shielded; the campaign anchors one on any hub hull that has none. The lead does not evade: a hub that ran from an
# alert would undock everything on it.
- type: wfEncounter
  id: WFReaverStronghold
  name: wf-reaver-name-stronghold
  start: Manual
  lifetime: Persistent
  category: Threat
  icon: Flag
  leash: 2000
  manifests: [ WFManifestContraband ]
  ships:
  - key: lead
    navigation: WFCrewNavigationRaider
    side: reavers
    faction: PirateNF
    distress: false
    company: WFAshfallReavers
    profile: WFCrewProfilePirate
    vessels: [ Saintie ]
    # Hulls of several makes with docking ports for reinforcements. A fixed gun count keeps them alike; the campaign
    # anchors a shield on any without one. From tier 3 only hulls with six hardpoints or more.
    tiers:
    - minTier: 0
      vessels: [ Balor, MClass, Intermission, Hammerhead, Arkansaw, Claymore, Pelican, Saintie ]
      skills: [ Green ]
      retrofit: WFPirateRetrofitHubLight
    - minTier: 2
      vessels: [ Balor, MClass, Intermission, Hammerhead, Arkansaw, Claymore, Pelican, Saintie ]
      skills: [ Green, Regular ]
      retrofit: WFPirateRetrofitHubMedium
    - minTier: 3
      vessels: [ MClass, Intermission, Hammerhead, Arkansaw, Claymore, Saintie ]
      skills: [ Regular ]
      retrofit: WFPirateRetrofitHubHeavy
    - minTier: 4
      vessels: [ MClass, Intermission, Hammerhead, Arkansaw, Claymore, Saintie ]
      skills: [ Regular, Veteran ]
      retrofit: WFPirateRetrofitHubSiege
    - minTier: 5
      vessels: [ MClass, Intermission, Hammerhead, Arkansaw, Claymore, Saintie ]
      skills: [ Veteran ]
      retrofit: WFPirateRetrofitHubSiege
    deckhands: 4
    guards: 3
    cargo: 4
    skill: Regular
    evades: false
    platform: true
    warnRange: 1500
    attackRange: 900
    zoneLines: wf-encounter-pirate-zone
    disengage: Deter
    disengageRange: 1200
    objectives:
    - kind: Hold

# The citadel: the tier 5 set piece, flown out as a convoy from the highest-level stronghold. Vulture carries 9 docking
# ports and its own Sentinel shield generator, so the campaign places none. It holds and does not evade, as a hub.
- type: wfEncounter
  id: WFReaverCitadel
  name: wf-reaver-name-citadel
  start: Manual
  lifetime: Persistent
  category: Threat
  icon: Flag
  leash: 2000
  manifests: [ WFManifestContraband ]
  ships:
  - key: lead
    navigation: WFCrewNavigationRaider
    side: reavers
    faction: PirateNF
    distress: false
    company: WFAshfallReavers
    profile: WFCrewProfilePirate
    vessels: [ Vulture ]
    # The citadel keeps its own guns; only its decks are worn.
    retrofit: WFPirateRetrofitGrime
    deckhands: 6
    guards: 4
    cargo: 8
    fuelStores: 16
    skill: Veteran
    evades: false
    platform: true
    warnRange: 2000
    attackRange: 1200
    zoneLines: wf-encounter-pirate-zone
    disengage: Deter
    disengageRange: 1500
    objectives:
    - kind: Hold

