- type: entity
  parent: WFWreckZombieBase
  id: WFWreckZombieCarcinoma
  components:
  - type: WFZombifyOnSpawn
    factions: [ SimpleHostile, AberrantFleshExpeditionNF, Chimera ]
  - type: Loadout
