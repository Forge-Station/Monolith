# The guns and launchers of the tank, from RMC's tank hardpoint files. The cannons and the cupola sit in the turret's
# nested slots (turret-cannon and turret-launcher); the smoke launcher and flare module are support attachments. The two
# flamers are at the end of the file. The grenade, smoke and flare rounds are Wolfgate's own (Weapons/projectiles.yml).
#
# projectileSpeed is the source's: RMC sets one on the ACE autocannon (50), the grenade and TOW launchers and the smoke
# launcher (18) and the flare module (20), and leaves every other gun at the engine default of RMC, 53, which is what the guns
# without a value here and in the other hardpoint files carry.

- type: entity
  parent: VehicleTankHardpointBase
  id: VehicleTankLTBCannon
  name: LTB cannon
  description: A light tank cannon hardpoint.
  components:
  - type: StaticPrice
    price: 28000
  - type: WFGunExtraSounds
    distantSound:
      collection: WFRcsmCannonFar
    loadingSequence:
    - delay: 0.8
      sound:
        collection: WFRcsmBreechOpen
        params:
          maxDistance: 10
    - delay: 4.5
      sound:
        collection: WFRcsmAmmoDoor
        params:
          maxDistance: 10
    - delay: 7
      sound:
        collection: WFRcsmRoundHandle
        params:
          maxDistance: 8
    - delay: 14.5
      sound:
        collection: WFRcsmRam
        params:
          maxDistance: 10
    - delay: 17.5
      sound:
        collection: WFRcsmCannonReload
        params:
          maxDistance: 10
  - type: Sprite
    state: ltb_cannon
  - type: HardpointItem
    hardpointType: HardpointTypeCannon
    vehicleFamily: HardpointVehicleFamilyTank
    slotType: HardpointSlotTypeCannon
    damageMultiplier: 0.15
    repairRate: 0.01
  - type: HardpointIntegrity
    maxIntegrity: 500
  - type: VehicleTurretAttachment
  - type: VehicleTurret
    fireWhileRotatingGraceDegrees: 180
    useBarrelDirectionForShots: true
    offsetRotatesWithTurret: true
    useDirectionalOffsets: true
    pixelOffsetNorth: "0,30"
    pixelOffsetEast: "30,0"
    pixelOffsetSouth: "0,-50"
    pixelOffsetWest: "-30,0"
    showOverlay: true
    overlayRsi: _WF/Vehicles/tank.rsi
    overlayState: ltb_cannon_0
    overlayDamagedState: ltb_cannon_1
  - type: GunUseGunOrigin
  - type: GunIgnoreContainerOwnerCollision
  - type: ShootAtFixedPoint
  - type: Gun
    projectileSpeed: 53
    recoil: 0
    fireRate: 0.05
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      collection: WFRcsmCannon
      params:
        volume: 2
        maxDistance: 26
    cameraRecoilScalar: 0
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: BallisticAmmoProvider
    cycleable: false
    proto: VehicleCartridgeLTBCannon
    capacity: 4
  - type: VehicleHardpointAmmo
    magazineSize: 4
    maxStoredMagazines: 3
  - type: GunFireArc
    arc: 120
  - type: RefillableByBulletBox
    bulletType: VehicleAmmoBoxLTBCannon
  - type: GunMuzzleOffset
    useDirectionalOffsets: true
    rotateDirectionalOffsets: true
    offsetNorth: "0,-1.5"
    offsetEast: "0.4,-1.9"
    offsetSouth: "0,-1"
    offsetWest: "-0.4,-1.9"
    useAimDirection: true
    useContainerOwner: false
  - type: HardpointVisual
    vehicleState: ltb_cannon_0
    damagedVehicleState: ltb_cannon_1

