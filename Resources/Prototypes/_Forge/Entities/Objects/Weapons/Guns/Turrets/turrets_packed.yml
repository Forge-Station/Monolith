  id: WeaponTurretVGShotgunPacked
  name: packed Viper Group shotgun turret
  description: A disassembled command turret. Deploy it, then load a cartridge kit. It has no ammunition inside.
  suffix: Packed
  components:
  - type: MultiHandedItem
  - type: SpawnAfterInteract
    prototype: WeaponTurretVGShotgun
    doAfter: 5
    removeOnInteract: true
  - type: Sprite
    sprite: Objects/Weapons/Guns/Turrets/turrets.rsi
    state: syndie_shotgun
  - type: Item
    size: Ginormous
    shape:
    - 0,0,3,3

- type: constructionGraph
  id: WeaponTurretVGShotgunPackingGraph
  start: WeaponTurretVGShotgunPacked
  graph:
  - node: WeaponTurretVGShotgunPacked
    entity: WeaponTurretVGShotgun
    edges:
    - to: WeaponTurretVGShotgunPacked
      completed:
      - !type:SpawnPrototype
        prototype: WeaponTurretVGShotgunPacked
        amount: 1
      - !type:EmptyAllContainers
      - !type:DeleteEntity {}
      steps:
      - tool: Screwing
        doAfter: 14

