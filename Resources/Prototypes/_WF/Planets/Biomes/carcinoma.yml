# Dead growth gets flesh names so the planet map doesn't paint the grove edges as vegetation.
- type: entity
  id: WFFleshSnagMahogany
  parent: NebulaTreeDeadMahogany
  name: withered limb
  description: A dead trunk, stripped and stiff. Whatever grew it has moved on.

- type: entity
  id: WFFleshSnagYew
  parent: NebulaTreeDeadYew
  name: withered limb
  description: A dead trunk, stripped and stiff. Whatever grew it has moved on.

- type: entity
