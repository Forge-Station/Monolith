# The ground layer of the Asclepiu planet network.
# No addedComponents: an FTLDestination on a mapgrid map makes arriving hulls disable themselves.

- type: planet
  id: WFAsclepiuSurface
  biome: WFBiomeAsclepiu
  mapName: wf-planet-asclepiu-surface
  mapLight: "#c8fdff"
  atmosphere:
    volume: 2500
    immutable: True
    temperature: 288.15 # 15 celsius
    moles:
    - 21.824879
    - 82.10312
  # No biome marker layers. Ore comes from the Mono ore spawners the biome lays; the upstream ore markers only turn
  # plain rock walls into veins, and these biomes lay none, so each marker chunk placed nothing, scanned 16k tiles
  # per layer and logged a warning per vein.
