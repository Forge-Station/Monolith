# Aerumna: the Umbral Deeps. Tight chromite crawls open into bedrock galleries, lit only by faint shadow blooms. Three big
# halls lie in the dark: shadow groves of blue-black floor under dark wood, geode chambers of grey rock studded with pink
# crystal, and, deepest of all, the xenonids' nest of brown hive floor, wild weeds, resin walls and eggs.
# Layers run last to first and the first match wins. Walls only stand on chromite, so any other floor is open ground.

- type: biomeTemplate
  id: WFCavernBiomeAerumna
  layers:
  # Substrate and crawl floor.
  - !type:BiomeTileLayer
    tile: WFCavernFloorChromite
    threshold: -1
  # Shadow blooms along the crawls, lowest priority: dim, but close enough to find your way from one to the next.
  - !type:BiomeEntityLayer
    allowedTiles: [WFCavernFloorChromite]
    entities: [WFCavernShadowBloom]
    threshold: 0.91
    noise: { seed: 32, noiseType: OpenSimplex2, frequency: 1 }
  # The crawls' own wildlife, sparse.
  - !type:BiomeEntityLayer
    allowedTiles: [WFCavernFloorChromite]
    entities: [WFCavernFaunaAerumna]
    threshold: 0.985
    noise: { seed: 38, noiseType: OpenSimplex2, frequency: 3 }
  # Caps and lichen in the stretches where the rock is damp.
  - !type:BiomeMetaLayer
    template: WFCavernCrawlsAerumna
    threshold: 0
    noise: { seed: 511, noiseType: OpenSimplex2, fractalType: FBm, octaves: 2, frequency: 0.007 }
  # Rock wherever ridged noise is at most the crawl threshold; the crawls are the ridges.
  - !type:BiomeMetaLayer
    template: WFCavernRockAerumna
    invert: true
    threshold: -0.58
    noise: { seed: 7, noiseType: OpenSimplex2, fractalType: Ridged, octaves: 1, frequency: 0.05 }
  # Bedrock galleries on the web.
  - !type:BiomeMetaLayer
    template: WFCavernChamberAerumna
    threshold: 0.56
    noise: { seed: 101, noiseType: OpenSimplex2, fractalType: FBm, octaves: 2, frequency: 0.012 }
  # Shadow groves, then geode chambers, then the nest, each priority over the last.
  - !type:BiomeMetaLayer
    template: WFCavernGroveAerumna
    threshold: 0.58
    noise: { seed: 521, noiseType: OpenSimplex2, fractalType: FBm, octaves: 2, frequency: 0.008 }
  - !type:BiomeMetaLayer
    template: WFCavernGeodeAerumna
    threshold: 0.62
    noise: { seed: 531, noiseType: OpenSimplex2, fractalType: FBm, octaves: 2, frequency: 0.008 }
  - !type:BiomeMetaLayer
    template: WFCavernNestAerumna
    threshold: 0.70
    noise: { seed: 541, noiseType: OpenSimplex2, fractalType: FBm, octaves: 2, frequency: 0.007 }
  # Slime geode chambers (_WF/WildSlimes) under the surface's pink crystal patches, over everything: the fungal forest
  # and patch noises, their seeds less the cavern's seed offset of 7933, at lower thresholds so each chamber is a little
  # wider than its patch.
  - !type:BiomeMetaLayer
    template: WFCavernSlimeZoneAerumna
    threshold: 0.42
    noise: { seed: -7862, noiseType: OpenSimplex2, frequency: 0.009, fractalType: FBm, octaves: 2 }

- type: biomeTemplate
  id: WFCavernCrawlsAerumna
  layers:
  - !type:BiomeEntityLayer
    allowedTiles: [WFCavernFloorChromite]
    entities: [WFCavernUmbralCapPlant]
    threshold: 0.94
    noise: { seed: 551, noiseType: OpenSimplex2, frequency: 1 }
  - !type:BiomeEntityLayer
    allowedTiles: [WFCavernFloorChromite]
    entities: [WFCavernPaleLichenPlant]
    threshold: 0.94
    noise: { seed: 552, noiseType: OpenSimplex2, frequency: 1 }
  # Rare.
  - !type:BiomeEntityLayer
    allowedTiles: [WFCavernFloorChromite]
    entities: [WFCavernAcidSpitter]
    threshold: 0.99
    noise: { seed: 553, noiseType: OpenSimplex2, frequency: 1 }

- type: biomeTemplate
  id: WFCavernRockAerumna
  layers:
  - !type:BiomeEntityLayer
    allowedTiles: [WFCavernFloorChromite]
    entities: [WallRockChromite]
    threshold: -1
  # Common.
  - !type:BiomeEntityLayer
    allowedTiles: [WFCavernFloorChromite]
    entities: [WallRockChromiteTin, WallRockChromitePlasma]
    threshold: 0.7
    noise: { seed: 201, noiseType: OpenSimplex2, frequency: 0.09 }
  # Uncommon.
  - !type:BiomeEntityLayer
    allowedTiles: [WFCavernFloorChromite]
    entities: [WallRockChromiteQuartz, WallRockChromiteUranium]
    threshold: 0.8
    noise: { seed: 202, noiseType: OpenSimplex2, frequency: 0.09 }
  # Rare.
  - !type:BiomeEntityLayer
    allowedTiles: [WFCavernFloorChromite]
    entities: [WallRockChromiteSilver, WallRockChromiteGold]
    threshold: 0.88
    noise: { seed: 203, noiseType: OpenSimplex2, frequency: 0.09 }
  # Very rare: diamonds, bluespace and the only anomaly rock.
  - !type:BiomeEntityLayer
    allowedTiles: [WFCavernFloorChromite]
    entities: [WallRockChromiteDiamond, WallRockChromiteBluespace, WallRockChromiteArtifactAnomaly]
    threshold: 0.95
    noise: { seed: 204, noiseType: OpenSimplex2, frequency: 0.2 }

# Bedrock galleries: bare dark floor, pale lichen on it and the odd umbral cap.
- type: biomeTemplate
  id: WFCavernChamberAerumna
  layers:
  - !type:BiomeTileLayer
    tile: WFCavernFloorBedrock
    threshold: -1
  - !type:BiomeEntityLayer
    allowedTiles: [WFCavernFloorBedrock]
    entities: [WFCavernFaunaAerumna]
    threshold: 0.95
    noise: { seed: 37, noiseType: OpenSimplex2, frequency: 3 }
  - !type:BiomeEntityLayer
    allowedTiles: [WFCavernFloorBedrock]
    entities: [WFCavernShadowBloom]
    threshold: 0.97
    noise: { seed: 317, noiseType: OpenSimplex2, frequency: 1 }
  - !type:BiomeEntityLayer
    allowedTiles: [WFCavernFloorBedrock]
    entities: [WFCavernPaleLichenPlant]
    threshold: 0.92
    noise: { seed: 561, noiseType: OpenSimplex2, frequency: 1 }
  - !type:BiomeEntityLayer
    allowedTiles: [WFCavernFloorBedrock]
    entities: [WFCavernUmbralCapPlant]
    threshold: 0.95
    noise: { seed: 562, noiseType: OpenSimplex2, frequency: 1 }

# Shadow groves: blue-black floor under dark wood, with blooms gathering beneath the trees.
- type: biomeTemplate
  id: WFCavernGroveAerumna
  layers:
  - !type:BiomeTileLayer
    tile: WFCavernFloorUmbralShroud
    threshold: -1
  - !type:BiomeEntityLayer
    allowedTiles: [WFCavernFloorUmbralShroud]
    entities: [ShadowTree, ShadowBasaltOne, ShadowBasaltTwo]
    threshold: 0.5
    noise: { seed: 309, noiseType: OpenSimplex2, frequency: 2 }
  - !type:BiomeEntityLayer
    allowedTiles: [WFCavernFloorUmbralShroud]
    entities: [WFCavernShadowBloom]
    threshold: 0.93
    noise: { seed: 321, noiseType: OpenSimplex2, frequency: 1 }
  - !type:BiomeEntityLayer
    allowedTiles: [WFCavernFloorUmbralShroud]
    entities: [WFCavernFaunaAerumnaGrove]
    threshold: 0.95
    noise: { seed: 571, noiseType: OpenSimplex2, frequency: 3 }
  - !type:BiomeEntityLayer
    allowedTiles: [WFCavernFloorUmbralShroud]
    entities: [WFCavernUmbralCapPlant]
    threshold: 0.9
    noise: { seed: 572, noiseType: OpenSimplex2, frequency: 1 }
  # Rare.
  - !type:BiomeEntityLayer
    allowedTiles: [WFCavernFloorUmbralShroud]
    entities: [WFCavernAcidSpitter]
    threshold: 0.99
    noise: { seed: 573, noiseType: OpenSimplex2, frequency: 1 }

