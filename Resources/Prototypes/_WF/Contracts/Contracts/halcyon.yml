- type: wfContract
  id: WFContractHalcyonPirateCull
  contractor: WFContractorHalcyon
  category: Bounty
  tier: 3
  title: wf-contract-halcyon-pirate-cull
  briefing: wf-contract-halcyon-pirate-cull-brief
  reward: 50000, 62500
  deposit: 3000
  minutes: 70
  crewBonus: 0.25
  weight: 1
  # Contested Sector rounds have their own pirate invasion.
  excludePresets: [ WFContestedSector ]
