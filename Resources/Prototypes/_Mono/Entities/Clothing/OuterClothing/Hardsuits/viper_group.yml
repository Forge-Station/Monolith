- type: entity
  parent: [ClothingOuterHardsuitBase, ClothingFlightProfileMedium] # Forge-change add ClothingFlightProfile
  id: ClothingOuterHardsuitViperGroupStandard
  name: JACKAL mk.II viper hardsuit
  description: A combat hardsuit adorned with signature markings of the Viper Group. The armor is remarkably flexible for the protection it offers.
  components:
  - type: Sprite
    sprite: _Mono/Clothing/OuterClothing/Hardsuits/viper_group_standard.rsi
  - type: Item
    size: Huge
  - type: Clothing
    sprite: _Mono/Clothing/OuterClothing/Hardsuits/viper_group_standard.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.05
    lowPressureMultiplier: 1000
  - type: ExplosionResistance
    damageCoefficient: 0.45 # Forge-change 0.5 -> 0.45
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.55 # Forge-change 0.67 -> 0.55
        Slash: 0.55 # Forge-change 0.5 -> 0.55
        Piercing: 0.475 # Forge-change 0.5 -> 0.475
        Heat: 0.525 # Forge-change 0.67 -> 0.525
        Radiation: 0.45 # Forge-change 0.5 -> 0.45
        Caustic: 0.5
  - type: StaminaDamageResistance # Mono - Stamres
    coefficient: 0.3 # Forge-change 0.5 -> 0.3
  - type: ClothingSpeedModifier
    walkModifier: 0.875 # Forge-change 0.9 -> 0.875
    sprintModifier: 0.875 # Forge-change 0.9 -> 0.875
  - type: HeldSpeedModifier
  - type: ToggleableClothing # Goobstation - Modsuits change - Mono - this is a solution for helmet attachment/cover to not fit on hardsuits
    requiredSlot: outerclothing
    blockUnequipWhenAttached: false
    replaceCurrentClothing: true
    clothingPrototypes:
      head: ClothingHeadHelmetHardsuitViperGroupStandard
      helmetcover: ClothingHeadHelmetCoverBlock
      helmetattachment: ClothingHeadHelmetAttachmentBlock
  - type: StaticPrice
    price: 1500
    vendPrice: 4000
  - type: Tag  # Mono
    tags:
    - RogueHardsuit

