- type: entity
  parent: BaseWeaponBallisticTurret
  id: WeaponTurretSyndicate
  suffix: Syndicate
  components:
  - type: NpcFactionMember
    factions:
    - Syndicate

- type: entity
  parent: BaseWeaponBallisticTurret
  id: WeaponTurretSyndicateDisposable
  name: disposable ballistic turret
  suffix: Syndicate, Disposable
  components:
  - type: NpcFactionMember
    factions:
    - Syndicate
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 600
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:TriggerBehavior
  - type: Gun
    fireRate: 2
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot: /Audio/Weapons/Guns/Gunshots/gun_sentry.ogg
  - type: BallisticAmmoProvider
    proto: Cartridge9x19mmFMJ
    capacity: 50
  - type: Construction
    deconstructionTarget: null
    graph: WeaponTurretSyndicateDisposable
    node: disposableTurret
  - type: Repairable
    qualities:
    - Anchoring
    doAfterDelay: 3
  - type: TriggerWhenEmpty
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: Default
    maxIntensity: 10
    intensitySlope: 1.5
    totalIntensity: 30
    canCreateVacuum: false

- type: entity
  parent: BaseWeaponCommandBallisticTurret # Forge-Change
  id: WeaponTurretNanoTrasen
  suffix: NanoTrasen
  components:
  - type: NpcFactionMember
    factions:
    - NanoTrasen
  # Forge-Change-start
  - type: TurretCommandLink
    faction: NT
  - type: Construction
    deconstructionTarget: null
    graph: WeaponTurretNanoTrasenPackingGraph
    node: WeaponTurretNanoTrasenPacked
  # Forge-Change-end

- type: entity
  parent: BaseWeaponBallisticTurret
  id: WeaponTurretHostile
  suffix: Hostile
  components:
  - type: NpcFactionMember
    factions:
    - SimpleHostile

- type: entity
  parent: BaseWeaponBallisticTurret
  id: WeaponTurretAllHostile
  suffix: All hostile
  components:
  - type: NpcFactionMember
    factions:
    - HostileUniversally # Mono

- type: entity
  # WOLFGATE START: parented to BaseWeaponTurret instead of BaseWeaponBallisticTurret so it has one ammo provider.
  # That base carries a ProjectileBatteryAmmoProvider, which stacked with the BallisticAmmoProvider below and fed
  # two rounds per shot (SharedGunSystem.AttemptShoot asserts Ammo.Count <= shots and fails every debug test the
  # turret fires in). The container and the gun tuning it used to inherit are copied in below.
  # parent: BaseWeaponBallisticTurret
  parent: BaseWeaponTurret
  # WOLFGATE END
  id: WeaponTurretXeno
  name: xeno turret
  suffix: Xeno
  description: Shoots 9mm acid projectiles.
  components:
  # WOLFGATE START: ammo container copied from BaseWeaponBallisticTurret.
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  # WOLFGATE END
  - type: NpcFactionMember
    factions:
    - Xeno
  - type: Sprite
    sprite: Objects/Weapons/Guns/Turrets/xenoturret.rsi
    noRot: true
    layers:
    - state: acid_turret
  - type: BallisticAmmoProvider
    proto: BulletAcid
    capacity: 500
  - type: Gun
    fireRate: 1
    # WOLFGATE START: gun tuning copied from BaseWeaponBallisticTurret (the angles are Mono's).
    projectileSpeed: 55
    maxAngle: 15
    minAngle: 4
    angleIncrease: -1.2
    angleDecay: -4
    # WOLFGATE END
    selectedMode: FullAuto
    # WOLFGATE START: fire modes copied from BaseWeaponBallisticTurret.
    availableModes:
    - FullAuto
    # WOLFGATE END
    soundGunshot: /Audio/Weapons/Xeno/alien_spitacid.ogg
  - type: HTN
    rootTask:
      task: TurretCompound
    blackboard:
      SoundTargetInLOS: !type:SoundPathSpecifier
        path: /Audio/Animals/snake_hiss.ogg
  - type: Damageable
    damageContainer: Biological
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/gib1.ogg
      - !type:SpawnEntitiesBehavior
        spawn:
          FoodMeatXeno:
            min: 3
            max: 5
  - type: InteractionPopup
    interactDelay: 1.0
    successChance: 0.8
    interactSuccessString: petting-success-generic
    interactFailureString: petting-failure-generic
    interactSuccessSound:
      path: /Audio/Animals/snake_hiss.ogg
