# Copy of ClothingHeadHardsuitBase with removed base nightvision for correct inheritance.
- type: entity
  abstract: true
  id: ClothingHeadHardsuitBaseMilitary
  name: base hardsuit helmet
  categories: [ HideSpawnMenu ]
  components:
  - type: BreathMask
  - type: Sprite
    state: icon
  - type: Clickable
  - type: InteractionOutline
  - type: Clothing
    equipSound: /Audio/Mecha/mechmove03.ogg
    unequipSound: /Audio/Mecha/mechmove03.ogg
    quickEquip: false
    slots: [ HEAD ]
  - type: PressureProtection
    highPressureMultiplier: 0.3
    lowPressureMultiplier: 1000
  - type: TemperatureProtection
    heatingCoefficient: 0.1
    coolingCoefficient: 0.1
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.9
        Slash: 0.9
        Piercing: 0.9
        Heat: 0.9
  - type: GroupExamine
  - type: IngestionBlocker
  - type: Tag
    tags:
    - WhitelistChameleon
  - type: IdentityBlocker
  - type: HideLayerClothing
    slots:
    - Hair
    - Snout
    - HeadTop
    - HeadSide

# Classes of nightvision for different hardsuits, the number means the number of lenses, the suffix is the color of the visor.
- type: entity
  id: ClothingNightVision1Normal
  abstract: true
  categories: [ HideSpawnMenu ]
  components:
  - type: NightVision
    relayOverlay: true
    goggleEffect: true
    action: ActionToggleNightVision
    viewCircleRadius: 500
    viewCircleCount: 1
    viewCircleSpacing: 0
    phosphorColor: "#a6ffa6"
    lightingColor: "#FFFFFFFF"
    amplification: 1.2

