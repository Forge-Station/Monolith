## Rounds

# CMU's 10x50mm sentry round, which the hull machine gun and the RE700 fire: Piercing 20 where RMC's round of the same id does
# 30, and no range limit, where RMC's cuts its damage off at 12 tiles. The M56 cupola keeps RMC's round.
- type: entity
  parent: VehicleCartridgeCannonBase
  id: WFVehicleCartridgeSentry10x50mmTWE
  categories: [ HideSpawnMenu ]
  components:
  - type: CartridgeAmmo
    proto: WFVehicleBulletSentry10x50mmTWE

- type: entity
  parent: VehicleBulletCannonBase
  id: WFVehicleBulletSentry10x50mmTWE
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Piercing: 20

# CMU's ACE flak hits for 75 where RMC's does 60 (RMCProjectileAceAutocannonFlak); the FV150 fires this one and the RMC guns keep
# RMC's. The range limit, 32 tiles at 50 a second, is the parent's.
- type: entity
  parent: VehicleCartridgeCannonBase
  id: WFVehicleCartridgeAceAutocannonTWE
  name: cartridge (ACE autocannon)
  categories: [ HideSpawnMenu ]
  components:
  - type: CartridgeAmmo
    proto: WFVehicleProjectileAceFlakTWE

- type: entity
  parent: RMCProjectileAceAutocannonFlak
  id: WFVehicleProjectileAceFlakTWE
  name: ACE flak round
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Piercing: 75

- type: entity
  parent: VehicleCartridgeCannonBase
  id: VehicleCartridgeElectrolaser
  name: Power Bank (Electrolaser)
  categories: [ HideSpawnMenu ]
  components:
  - type: CartridgeAmmo
    proto: RMCProjectileElectrolaser

# The electrolaser bolt on Wolfgate's laser bolt, with CMU's tesla ball sprite, damage and shock. CMU cut its damage off at 32
# tiles; at the gun's 60 a second that is 0.5333 seconds. The area damage, armour piercing and accuracy are not ported.
- type: entity
  parent: BulletLaser
  id: RMCProjectileElectrolaser
  name: Electrolaser Projectile
  categories: [ HideSpawnMenu, WFVehicles ]
  components:
  - type: Sprite
    sprite: Structures/Power/Generation/Tesla/energy_miniball.rsi
    layers:
    - state: tesla_projectile
      shader: unshaded
  - type: Electrified
    requirePower: false
  - type: StaminaDamageOnCollide
    damage: 15
  - type: Projectile
    impactEffect: BulletImpactEffect
    damage:
      types:
        Piercing: 10
        Heat: 160
        Asphyxiation: 15
    soundHit:
      path: /Audio/Weapons/Guns/Hits/bullet_hit.ogg
  - type: TimedDespawn
    lifetime: 0.5333

## Ammunition crate

# CMU's electrolaser has no crate and cannot be refilled; this one holds the gun's one magazine.
- type: entity
  parent: VehicleAmmoBoxBase
  id: WFVehicleAmmoBoxElectrolaser
  components:
  - type: Sprite
    layers:
    - state: ltaa
      map: [ "enum.BulletBoxLayers.Fill" ]
  - type: GenericVisualizer
    visuals:
      enum.BulletBoxLayers.Fill:
        enum.BulletBoxLayers.Fill:
          Empty: { state: ltaa_e, visible: true }
          Low: { state: ltaa_e, visible: true }
          Medium: { state: ltaa, visible: true }
          High: { state: ltaa, visible: true }
          Full: { state: ltaa, visible: true }
  - type: BulletBox
    amount: 520
    max: 520
    bulletType: WFVehicleAmmoBoxElectrolaser
    cartridgeType: VehicleCartridgeElectrolaser
    usedIn: FV150 heavy electrolaser
