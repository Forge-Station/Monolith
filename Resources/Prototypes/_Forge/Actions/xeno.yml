- type: entity
  id: ActionForgeXenoLeap
  name: Leap
  description: Throw yourself at a target.
  components:
  - type: WorldTargetAction
    itemIconStyle: NoItem
    icon:
      sprite: _CM/Interface/Actions/xeno_actions.rsi
      state: pounce
    event: !type:ForgeXenoLeapActionEvent
      speed: 16
      stunSeconds: 2
    useDelay: 6
    range: 8
    checkCanAccess: false

- type: entity
  id: ActionForgeXenoPounce
  parent: ActionForgeXenoLeap
  name: Pounce
  description: A longer leap that knocks the target down and grabs them.
  components:
  - type: WorldTargetAction
    event: !type:ForgeXenoLeapActionEvent
      plasmaCost: 20
      speed: 18
      stunSeconds: 4
      pullOnHit: true
      hitDamage:
        groups:
          Brute: 15
    useDelay: 10
    range: 7

- type: entity
  id: ActionForgeXenoCharge
  parent: ActionForgeXenoLeap
  name: Charge
  description: A crushing rush. Anything you hit gets flattened.
  components:
  - type: WorldTargetAction
    icon:
      sprite: _CM/Interface/Actions/xeno_actions.rsi
      state: charge
    event: !type:ForgeXenoLeapActionEvent
      smash: true
      plasmaCost: 40
      speed: 20
      stunSeconds: 2.5
      hitDamage:
        types:
          Blunt: 60
          Structural: 80
    useDelay: 12
    range: 8

- type: entity
  id: ActionForgeXenoHide
