# Visible, harvestable gas clouds. Parent regular gas deposits so the existing mining drill can extract from them.
# region Base
- type: entity
  parent: BaseGasDeposit
  id: BaseGasCloud
  name: gas cloud
  description: A dense cloud of gas seeping from a subsurface deposit. Siphon it with a gas cloud siphon. Standing in it without protection is dangerous.
  abstract: true
  components:
  - type: GasCloud
    radius: 8
    currentRadius: 8
    walkSpeedModifier: 0.7
    sprintSpeedModifier: 0.65
    hungerMultiplier: 2
    pressure: 800
  - type: PointLight
    enabled: true
    radius: 8
    energy: 1.4
    color: "#88AACC"
    netsync: false
  - type: AmbientSound
    range: 8
    volume: -10
    sound:
      path: /Audio/Ambience/Objects/gas_hiss.ogg
  - type: RadarBlip
    visibleFromOtherGrids: true
    config:
      color: "#88AACC73"
      shape: Circle
      respectZoom: true
      bounds: "-8,-8,8,8"
  - type: Sprite
    drawdepth: Effects
    sprite: _NF/Objects/Specific/Atmospherics/deposit.rsi
    layers:
    - state: deposit
    - sprite: Effects/chemsmoke.rsi
      state: chemsmoke
      shader: unshaded
      scale: 4, 4
      map: [ "gascloud-smoke" ]

- type: entity
  parent: BaseGasCloud
  id: BaseGasCloudSmall
  abstract: true
  components:
  - type: GasCloud
    radius: 5
    currentRadius: 5
    walkSpeedModifier: 0.8
    sprintSpeedModifier: 0.75
    hungerMultiplier: 1.6
    pressure: 620
  - type: RandomGasDeposit
    scale: 0.6
  - type: PointLight
    radius: 5
  - type: AmbientSound
    range: 5
  - type: RadarBlip
    config:
      respectZoom: true
      shape: Circle
      bounds: "-5,-5,5,5"

- type: entity
  parent: BaseGasCloud
  id: BaseGasCloudLarge
  abstract: true
  components:
  - type: GasCloud
    radius: 12
    currentRadius: 12
    walkSpeedModifier: 0.55
    sprintSpeedModifier: 0.5
    hungerMultiplier: 2.8
    pressure: 1100
  - type: RandomGasDeposit
    scale: 1.4
  - type: PointLight
    radius: 12
    energy: 1.8
  - type: AmbientSound
    range: 12
  - type: RadarBlip
    config:
      respectZoom: true
      shape: Circle
      bounds: "-12,-12,12,12"
# endregion Base

