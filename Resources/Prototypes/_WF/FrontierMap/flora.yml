- type: entity
  parent: BaseFlora
  id: OnyxBayFloraGlowFlowersYellow
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: _WF/DecorImport/Objects/Decoration/Flora/glowflowers_onyxbay.rsi
    drawdepth: FloorObjects
    layers:
    - state: ywflowers_1
      map: [ "base" ]
    - state: ywflowers_1-overlay
      map: [ "glow" ]
      shader: unshaded
  - type: RandomSprite
    available:
    - base:
        ywflowers_1: ""
      glow:
        ywflowers_1-overlay: ""
    - base:
        ywflowers_2: ""
      glow:
        ywflowers_2-overlay: ""
    - base:
        ywflowers_3: ""
      glow:
        ywflowers_3-overlay: ""
    - base:
        ywflowers_4: ""
      glow:
        ywflowers_4-overlay: ""
  - type: PointLight
    radius: 1.5
    energy: 0.5
    color: "#E8D85A"
  - type: MeleeSound
    soundGroups:
      Brute:
        path: /Audio/_WF/DecorImport/onyxbay/vegetation_hit.ogg

