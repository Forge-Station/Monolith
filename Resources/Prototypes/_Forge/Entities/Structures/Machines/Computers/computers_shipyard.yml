#region Shipyard Service
- type: entity
  parent: [BaseStructureDisableToolUse, BaseStructureIndestructible, BaseComputer]
  id: ComputerShipyardService
  name: drydock service console
  description: Repairs, restocks super parts, and reinforces a shuttle currently docked at a drydock lock.
  components:
  - type: Sprite
    sprite: _NF/Structures/Machines/computers.rsi
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: shipyard
    - map: ["computerLayerKeys"]
      state: telesci_key
  - type: ShipyardServiceConsole
  - type: ActivatableUI
    key: enum.ShipyardServiceUiKey.Key
  - type: UserInterface
    interfaces:
      enum.ShipyardServiceUiKey.Key:
        type: ShipyardServiceBoundUserInterface
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
  - type: Computer
    board: Null

#region Shipyard
- type: entity
  id: ComputerShipyardRenegate
  parent: [BaseStructureDisableToolUse, BaseStructureIndestructible, ComputerShipyardBase]
  name: renegate shipyard console
  description: Shipyard console with renegates shuttles.
  suffix: Ренегаты
  components:
  - type: Sprite
    sprite: _Forge/Structures/Machines/computers.rsi
    layers:
    - map: ["computerLayerBody"]
      state: computer_renegate
    - map: ["computerLayerKeyboard"]
      state: generic_renegate_keyboard
    - map: ["computerLayerScreen"]
      state: shipyard_renegate
    - map: ["computerLayerKeys"]
      state: renegate_key
  - type: ActivatableUI
    key: enum.ShipyardConsoleUiKey.Renegate
  - type: UserInterface
    interfaces:
      enum.ShipyardConsoleUiKey.Renegate:
       type: ShipyardConsoleBoundUserInterface

- type: entity
  id: ComputerShipyardEmpire
  parent: [BaseStructureDisableToolUse, BaseStructureIndestructible, ComputerShipyardBase]
  name: empire shipyard console
  description: Console for commissioning Imperial Navy vessels.
  suffix: Empire
  components:
  - type: Sprite
    sprite: _Forge/Structures/Machines/computers.rsi
    layers:
    - map: ["computerLayerBody"]
      state: computer_emp
    - map: ["computerLayerScreen"]
      state: emp_shuttle
    - map: ["computerLayerKeys"]
      state: emp_key
  - type: ActivatableUI
    key: enum.ShipyardConsoleUiKey.Empire
  - type: UserInterface
    interfaces:
      enum.ShipyardConsoleUiKey.Empire:
        type: ShipyardConsoleBoundUserInterface
  - type: ShipyardConsole
    shipyardChannel: Empire

# region Carrier
- type: entity
  id: HEVMotleyAnneCarrierComputer
  parent: BaseCarrierComputer
  name: motley anne shipyard console
  components:
  - type: ShipyardListing
    shuttles:
    # - Snakelet
    - HEVInertia
    - HEVMock
  - type: Sprite
    sprite: _Forge/Structures/Machines/computers.rsi
    layers:
    - map: ["computerLayerBody"]
      state: computer_emp
    - map: ["computerLayerScreen"]
      state: emp_shuttle
    - map: ["computerLayerKeys"]
      state: emp_key
