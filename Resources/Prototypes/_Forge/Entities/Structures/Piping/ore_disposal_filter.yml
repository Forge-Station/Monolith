# Ore filter / sorter for disposal-based ship-drill logistics.
# Selected ores divert to the side; everything else continues straight (empty = all straight).

- type: entity
  id: OreDisposalFilter
  parent: DisposalPipeBase
  name: ore filter
  description: Splits an ore stream. Selected types go sideways; the rest continue straight.
  components:
  # Forge-Change: allow configure/build under closed floor tiles (like atmos gas filter).
  - type: SubFloorHide
    blockInteractions: false
    blockAmbience: false
    visibleLayers:
    - enum.SubfloorLayers.FirstLayer
  - type: Sprite
    layers:
    - map: [ "pipe" ]
      state: conpipe-j1s
    - map: [ "enum.SubfloorLayers.FirstLayer" ]
      state: pipe-j1s
  - type: DisposalTube
    containerId: OreDisposalFilter
  - type: OreDisposalFilter
    degrees:
    - 0
    - -90
    - 180
  - type: ContainerContainer
    containers:
      OreDisposalFilter: !type:Container
  - type: GenericVisualizer
    visuals:
      enum.DisposalTubeVisuals.VisualState:
        pipe:
          Free: { state: conpipe-j1s }
          Anchored: { state: pipe-j1s }
  - type: Flippable
    mirrorEntity: OreDisposalFilterFlipped
  - type: ActivatableUI
    key: enum.OreDisposalFilterUiKey.Key
    requiresComplex: false
  - type: UserInterface
    interfaces:
      enum.OreDisposalFilterUiKey.Key:
        type: OreDisposalFilterBoundUserInterface
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.25,0.5"
        mask:
        - SubfloorMask
  - type: Construction
    graph: DisposalPipe
    node: oreFilter
    containers:
    - OreDisposalFilter

- type: entity
  id: OreDisposalFilterFlipped
  parent: OreDisposalFilter
  suffix: flipped
  description: Splits an ore stream. Selected types go sideways; the rest continue straight.
  components:
  - type: Sprite
    layers:
    - map: [ "pipe" ]
      state: conpipe-j2s
    - map: [ "enum.SubfloorLayers.FirstLayer" ]
      state: pipe-j2s
  - type: DisposalTube
    containerId: OreDisposalFilter
  - type: OreDisposalFilter
    degrees:
    - 0
    - 90
    - 180
  - type: ContainerContainer
    containers:
      OreDisposalFilter: !type:Container
  - type: GenericVisualizer
    visuals:
      enum.DisposalTubeVisuals.VisualState:
        pipe:
          Free: { state: conpipe-j2s }
          Anchored: { state: pipe-j2s }
  - type: Flippable
    mirrorEntity: OreDisposalFilter
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.5,0.5,0.5"
        mask:
        - SubfloorMask
  - type: Construction
    node: oreFilterFlipped
    containers:
    - OreDisposalFilter
