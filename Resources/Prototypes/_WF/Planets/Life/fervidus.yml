# A cactus that stores cold water in its pads.
- type: entity
  id: WFFloraCoolCactus
  parent: ShiptestFloraAshCacti
  components:
  - type: Sprite
    layers:
    - state: cactus
      map: ["cactus"]
  - type: Appearance
  - type: GenericVisualizer
