- type: pointOfInterest
  id: USSPCamelot
  parent: [BasePOI, BaseRepairablePOI]
  name: 'Станция «Камелот»'
  minimumDistance: 10650
  maximumDistance: 12400
  # WOLFGATE(ReaverCampaign): the Contested Sector game mode spawns the same sector as Standard
  spawnGamePreset: [ NFAdventure, NFPirate, MonoStandard, WFContestedSector, MonoRogueUSSP, MonoTSFUSSP, MonoADS, MonoChimera, MonoMixed, MonoAllAtOnce, MonoChimeraTsf, MonoChimeraPdv ]
  spawnGroup: Required
  # Forge map: spawns removed and the bluespace reactor replaced with an AME. Mono presets stay.
  gridPath: /Maps/_Forge/POI/camelotForge.yml
  addComponents:
  - type: IFF
    color: "#ccaa55"
  - type: ProtectedGrid
    preventTeleportation: true
  - type: WorldGenDistanceCarver
    distanceThresholds:
    # Dead zone
    - maxDistance: 800
      prob: 0.0
    - maxDistance: 1500
      prob: 0.3

- type: gameMap
  id: USSPCamelot
  mapName: 'Станция «Камелот»'
  mapPath: /Maps/_Forge/POI/camelotForge.yml
  minPlayers: 0
  stations:
    USSPCamelot:
      stationProto: RecordsFrontierOutpostCargo
      gridComponents:
        - type: VesselMusic
          ambientMusicPrototype: CamelotMusic
        - type: VesselInfo
          description: "Хлипкая старая станция, когда-то принадлежавшая межзвёздной державе. Холодно и темно."
        - type: DeleteNearbyDrones
      components:
        - type: StationNameSetup
          mapNameTemplate: 'Станция «Камелот»'
        - type: ExtraStationInformation
          icon:
            sprite: _NF/Structures/Storage/Crates/secure_ammo.rsi
            state: icon
          stationSubtext: 'frontier-lobby-camelot-subtext'
          stationDescription: 'frontier-lobby-camelot-description'
          lobbySortOrder: 4
        - type: StationJobs
          availableJobs:
            USSPCommissar: [1, 1]
            USSPSergeant: [4, 4]
            USSPRifleman: [-1, -1]
            VGCommander: [1, 1]
            VGLieutenant: [2, 2]
            VGInfanteer: [-1, -1]
            Contractor: [-1, -1]
            #Pilot: [0, -1]
            #Mercenary: [0, -1]
          tags:
          - USSPCommand
        - type: StationCargoBountyDatabase
          availableBounties:
          - USSPBountyArtifact
          - USSPBountyBread
          - USSPBountySoup
          - USSPBountyPizza
          - USSPBountyVodka
          - USSPBountyCivilianMech
          - USSPBountyPotato
          - USSPBountyBiomass
          - USSPBountyMilitaryMech
          - USSPKevlarVest
          - USSPVT7
          - USSPBountyLaserGun
        - type: StationDeadDrop
          maxDeadDrops: 2 # Fewer here, players start here.
