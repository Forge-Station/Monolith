
- type: entity
  abstract: true
  parent: BaseCartridge
  id: BaseCartridgeHEV
  name: cartridge (AE energy)
  description: A disposable energy capsule for Alliance Empire energy weapons.
  components:
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Guns/Ammunition/Casings/700Thz.rsi
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Item
    size: Tiny
  - type: StaticPrice
    price: 1

#region Union (rifle)
- type: entity
  abstract: true
  parent: BaseCartridgeHEV
  id: BaseCartridgeHEVRifle
  components:
  - type: Tag
    tags:
    - Cartridge
    - CartridgeHEVRifle

- type: entity
  parent: BaseCartridgeHEVRifle
  id: CartridgeHEVRifle
  name: cartridge (AE-AR energy)
  components:
  - type: CartridgeAmmo
    proto: HEVBulletEnergyRifle
    deleteOnSpawn: true
  - type: Sprite
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
      color: "#ffd988"

- type: entity
  parent: BaseCartridgeHEVRifle
  id: CartridgeHEVRifleXRay
  name: cartridge (AE-AR energy, x-ray)
  components:
  - type: CartridgeAmmo
    proto: HEVBulletEnergyRifleXRay
    deleteOnSpawn: true
  - type: Sprite
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
      color: "#4b692f"

- type: entity
  parent: BaseCartridgeHEVRifle
  id: CartridgeHEVRifleDisabler
  name: cartridge (AE-AR energy, disabler)
  components:
  - type: CartridgeAmmo
    proto: HEVBulletEnergyRifleDisabler
    deleteOnSpawn: true
  - type: Sprite
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
      color: "#1b78cf"

# Overpressure
- type: entity
  parent: [BaseCartridgeHEVRifle, HEVHitscanEnergyRifle]
  id: CartridgeHEVRifleOverpressure
  name: cartridge (AE-AR energy, overpressure)
  components:
  - type: HitscanAmmo
  - type: Sprite
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
      color: "#ff8f3a"

- type: entity
  parent: [BaseCartridgeHEVRifle, HEVHitscanEnergyRifleXRay]
  id: CartridgeHEVRifleOverpressureXRay
  name: cartridge (AE-AR energy, overpressure x-ray)
  components:
  - type: HitscanAmmo
  - type: Sprite
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
      color: "#7fd04b"


- type: entity
  parent: [BaseCartridgeHEVRifle, BasicHitscan]
  id: CartridgeHEVRifleOverpressureDisabler
  name: cartridge (AE-AR energy, overpressure disabler)
  components:
  - type: HitscanAmmo
  - type: HitscanBasicVisuals
    muzzleFlash:
      sprite: Objects/Weapons/Guns/Projectiles/projectiles.rsi
      state: muzzle_blue
    travelFlash:
      sprite: Objects/Weapons/Guns/Projectiles/projectiles.rsi
      state: beam_blue
    impactFlash:
      sprite: Objects/Weapons/Guns/Projectiles/projectiles.rsi
      state: impact_blue
  - type: HitscanBasicDamage
    damage:
      types:
        Heat: 8
  - type: Sprite
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
      color: "#5fb8ff"
#endregion

#region Heavion (LMG)
- type: entity
  parent: BaseCartridgeHEV
  id: CartridgeHEVLMG
  name: cartridge (AE-LMG energy)
  components:
  - type: Tag
    tags:
    - Cartridge
    - CartridgeHEVLMG
  - type: CartridgeAmmo
    proto: HEVBulletEnergyLMG
    deleteOnSpawn: true
  - type: Sprite
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
      color: "#f0a32f"
#endregion

#region Killer
- type: entity
  parent: BaseCartridgeHEV
  id: CartridgeHEVShotgun
  name: cartridge (AE-SG energy)
  components:
  - type: Tag
    tags:
    - Cartridge
    - CartridgeHEVShotgun
  - type: CartridgeAmmo
    proto: HEVBulletEnergyShotgunSpread 
    deleteOnSpawn: true
  - type: Sprite
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
      color: "#ffd988"
#endregion
