- type: entity
  name: РАВ-12 "Дзынь"
  id: WeaponRifleMacRav12
  parent: WeaponRifleLecter
  description: Тяжёлая автоматическая винтовка МАС в калибре 6,8×52 мм безгильзовый; также принимает магазины 5,56×45 мм. Основным её преимуществом и продающей точкой является высокая модульность, качество и надёжность. Самая яркая и узнаваемая модель производства МАС.
  components:
