# Each world alternates phased storms with 3-7 minutes of clear skies. A storm telegraphs with a light overlay, runs,
# and winds down through a light overlay again, after /tg/station's weather; thunder drops real bolts on open ground.
- type: wfPlanetWeather
  id: WFPlanetWeatherAsclepiu
  planetType: PlanetAsclepiu
  storms:
  - main: WFRainLow
  - telegraph: WFRainLow
    main: WFRainMed
    end: WFRainEnd
  - telegraph: WFRainLow
    main: WFRainHigh
    end: WFRainEnd
    thunder: true
  initialHour: 8

- type: wfPlanetWeather
  id: WFPlanetWeatherFervidus
  planetType: PlanetFervidus
  storms:
  - main: WFAshLight
  - telegraph: WFAshLight
    main: WFAshStorm
    end: WFAshLight
  initialHour: 12

- type: wfPlanetWeather
  id: WFPlanetWeatherMerak
  planetType: PlanetMerak
  storms:
  - telegraph: WFDustLow
    main: WFDustMed
    end: WFDustLow
  - telegraph: WFDustLow
    main: WFDustHigh
    end: WFDustLow
  initialHour: 15
  clearMinSeconds: 300
  clearMaxSeconds: 600

- type: wfPlanetWeather
  id: WFPlanetWeatherAerumna
  planetType: PlanetAerumna
  storms:
  - main: WFRainLow
  - telegraph: WFRainLow
    main: WFRainMed
    end: WFRainEnd
  initialHour: 18

- type: wfPlanetWeather
  id: WFPlanetWeatherThrascias
  planetType: PlanetThrascias
  storms:
  - main: WFSnowLight
  - telegraph: WFSnowLight
    main: WFSnowStorm
    end: WFSnowLight
  initialHour: 6

- type: wfPlanetWeather
  id: WFPlanetWeatherCarcinoma
  planetType: WFPlanetCarcinoma
  storms:
  - main: WFBloodRain
  - telegraph: WFBloodRain
    main: WFBloodStorm
    end: WFBloodRain
    thunder: true
  initialHour: 21

# Overlays and rain loops from /tg/station (weather_effects.dmi, sound/ambience/weather/rain).
- type: weather
  id: WFRainLow
  sprite:
    sprite: /Textures/_WF/Planets/Effects/weather_tg.rsi
    state: rain_low
  sound:
    path: /Audio/_WF/Planets/Weather/rain_start.ogg
