# Crew profiles for vehicle crews. NpcCrew profiles cannot be extended from another file, so each copies the matching
# one (bodies, names, components, skills) and keys its loadouts by the vehicle roles, reusing the NpcCrew gear.

- type: wfCrewProfile
  id: WFVehicleCrewProfilePirate
  firstNames: WFNamesPirateFirst
  lastNames: WFNamesPirateLast
  # Pirates never fly adamantite, as with NpcCrew's own pirate profile.
  hullSwaps:
    WFWallAdamantite: WallPlastitanium
    WFWallAdamantiteDiagonal: WallPlastitaniumDiagonal
    WFWallAdamantiteCapital: WallPlastitanium
    WFWallAdamantiteDiagonalCapital: WallPlastitaniumDiagonal
  components:
  - type: PirateAccent
  - type: WFCrewSuitUp
  - type: PressureImmunity
  - type: BreathingImmunity
  bodies:
  - WFMobCrewBodyHuman
  - WFMobCrewBodyHuman
  - WFMobCrewBodyReptilian
  - WFMobCrewBodyReptilian
  - WFMobCrewBodyDwarf
  - WFMobCrewBodyVulpkanin
  - WFMobCrewBodyTajaran
  - WFMobCrewBodyRodentia
  - WFMobCrewBodyArachnid
  - WFMobCrewBodyMoth
  skills: [ Green, Regular, Regular, Veteran ]
  loadouts:
    # Every profile must kit a deckhand: NpcCrew's own posts may draw on it.
    WFCrewDeckhand: [ WFCrewPirateHand ]
    WFVehicleDriver: [ WFCrewPirateOfficer, WFCrewPirateHand ]
    WFVehicleGunner: [ WFCrewPirateOfficer, WFCrewPirateHand ]
    WFVehicleTrooper: [ WFCrewPirateRifle, WFCrewPirateBruiser, WFCrewPirateHand ]

