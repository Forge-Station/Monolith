# Prototypes/_Mono/Entities/Objects/Weapons/Guns/Pistols/pistol.yml entity WeaponPistolDamocles
- type: entity
  name: UGR Damocles (9x19mm)
  parent: BaseWeaponPistol
  id: WeaponPistolDamocles
  description: The Damocles holds a fearsome level of firepower, giving its holder an unwritten position as the ringleader of the underworld of the Perseus Arm. However, its reliance on the officially discontinued machine pistol magazine makes it unsustainable in prolonged firefights. Looking at it now, you can't tell if the blood is real or simply painted on in order to look more intimidating. 
  components:
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Guns/Pistols/damocles.rsi
    layers: # Mono
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: Magazine9x19mmPistolHighCapacityFMJ
        insertSound: /Audio/Weapons/Guns/MagIn/pistol_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/pistol_magout.ogg
        priority: 2
        whitelist:
          tags:
            - Magazine9x19mmPistolHighCapacityFMJ
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        startingItem: Cartridge9x19mmFMJ
        priority: 1
        whitelist:
          tags:
            - Cartridge9x19mmFMJ
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: Gun # Mono change - Sound for viper
    soundGunshot:
      path: /Audio/_Mono/Weapons/Guns/SmallArms/Gunshots/viper_fire.ogg
    fireRate: 7
    damageModifier: 1.4
  # WOLFGATE(SafetyDepositBox) START: the Godfather's exclusive sidearm can't be banked
  # Sidearm is BaseWeaponPistol's tag: a child's tag list replaces its parent's.
  - type: Tag
    tags:
    - Sidearm
    - SafetyDepositBlacklist
  # WOLFGATE END

