- type: entity
  parent: SimpleMobBase 
  id: MobXenoPraetorEvent
  name: Praetorian
  description: Huge xeno. It fades into the shadows when stationary.
  components:
  - type: MobState
  - type: MobThresholds
    thresholds:
      0: Alive
      650: Critical 
      750: Dead
  - type: Damageable
    damageModifierSet: PraetorArmor
  - type: GhostRole
    name: Praetorian 
    description: You’ve escaped from the test tube. Fade into the dark and hunt the colonists!
    rules: Fear? 
  - type: GhostTakeoverAvailable
    roleName: Praetorian
    roleDescription: You’ve escaped from the test tube. Fade into the dark and hunt the colonists!
    rules: Fear?
  - type: Puller
    needsHands: false
  - type: MeleeWeapon
    angle: 60
    animation: WeaponArcSlash
    soundHit:
      path: /Audio/Weapons/Xeno/alien_claw_flesh3.ogg
    damage:
      types:
        Blunt: 15
        Slash: 55         
        Structural: 35   
        Stamina: 50     
  - type: Barotrauma
    damage:
      types: {}
  - type: PressureImmunity
  - type: Sprite
    sprite: _Forge/Mobs/Player/IventXenos/praetorianum.rsi 
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: alive
  - type: DamageStateVisuals
    states:
      Alive:
        Base: alive
      Critical:
        Base: crit 
      Dead:
        Base: dead    
  - type: MovementSpeedModifier
    baseWalkSpeed : 3.0
    baseSprintSpeed : 5.0
  - type: Stealth        
    maxVisibility: 1.0
    minVisibility: 0.0   
  - type: StealthOnMove  
    passiveVisibilityRate: -0.1 
    movementVisibilityRate: 1.5 
  - type: Bloodstream
    bloodReagent: Xenoblood
    bloodMaxVolume: 300
    bleedReductionAmount: 3
    bloodlossThreshold: 0
    bloodRefreshAmount: 10
  - type: Flammable
    fireSpread: true
    canResistFire: true
    damage:
      types:
        Heat: 15
  - type: LanguageKnowledge 
    speaks:
    - Xeno
    understands:
    - Xeno
  - type: ThermalVision
    lightRadius: 15
    activateSound: null
    deactivateSound: null
  - type: MobStateActions
    actions:
      Critical:
      - ActionCritSuccumb
      - ActionCritLastWords
  - type: SlowOnDamage
    speedModifierThresholds:
      250: 0.7
      400: 0.5
  - type: NPCUseActionOnTarget
    actionId: ActionXenoTint
  - type: CollectiveMind
    channels:
    - XenoIvent
    defaultChannel: XenoIvent
  - type: Prying
  - type: Tag 
    tags: 
    - XenoEmotions
    - XenoIvent
  - type: Vocal
    sounds:
      Unsexed: SoundsXeno



- type: reagent
  id: Xenoblood
  name: Xeno's blood
  desc: Highly corrosive and toxic acidic blood of an extraterrestrial organism.
  group: Toxins
  physicalDesc: reagent-physical-desc-strong-smelling
  flavor: acid
  color: "#189e0e"
  boilingPoint: 165
  meltingPoint: -87
  tileReactions:
  - !type:CreateEntityTileReaction
    entity: Xenoresin
    maxOnTileWhitelist:
      tags: [ XenoIventResin ]
  reactiveEffects:
    Acidic:
      methods: [ Touch ]
      effects:
      - !type:HealthChange
        scaleByQuantity: true
        ignoreResistances: false
        damage:
          types:
            Caustic: 8 
      - !type:Emote
        emote: Scream
        probability: 0.2
  metabolisms:
    Poison:
      metabolismRate: 3.00
      effects:
      - !type:HealthChange
        damage:
          types:
            Caustic: 8
      - !type:PopupMessage
        type: Local
        visualType: Large
        messages: [ "generic-reagent-effect-burning-insides" ]
        probability: 0.33
      - !type:Emote
        emote: Scream
        probability: 0.25


- type: entity
  id: ActionXenoTint
  name: "[color=green]Tentacle Slam[/color]"
  description: Use your tentacles to grab and stun a target player!
  components:
  - type: EntityWorldTargetAction
    raiseOnUser: true
    icon:
      sprite: Mobs/Aliens/Asteroid/goliath.rsi
      state: goliath_tentacle_spawn
    iconOn:
      sprite: Mobs/Aliens/Asteroid/goliath.rsi
      state: goliath_tentacle_wiggle
    sound:
      path: "/Audio/Weapons/slash.ogg"
    event: !type:GoliathSummonTentacleAction
    useDelay: 30
    range: 10

