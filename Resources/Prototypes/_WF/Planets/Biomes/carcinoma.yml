# Outside every grove: a band of dried crust with dead trees and shrubs. Shares the grove's noise, lower threshold.
- type: biomeTemplate
  id: WFCarcinomaScabEdge
  layers:
  - !type:BiomeTileLayer
    tile: WFFloorFleshCrust
    threshold: -1
  - !type:BiomeEntityLayer
    allowedTiles: [WFFloorFleshCrust]
    entities: [GoonShrubDead, GoonShrubDead2, GoonShrubDead3, GoonShrubDead4, CoyoteFloraBurnedbush3, CoyoteFloraBurnedbush5]
    threshold: 0.84
    noise: { seed: 91, noiseType: OpenSimplex2, frequency: 1.5 }
  - !type:BiomeEntityLayer
    allowedTiles: [WFFloorFleshCrust]
    entities: [WFFleshSnagMahogany, WFFleshSnagYew, WFFleshSnagWalnut, WFFleshSnagBarren, WFFleshSnagBurnedOne, WFFleshSnagBurnedThree]
    threshold: 0.86
    noise: { seed: 92, noiseType: OpenSimplex2, frequency: 1 }

# Rib arches, skulls and bone rock on bone-flecked flesh.
- type: biomeTemplate
  id: WFCarcinomaBoneField
  layers:
  - !type:BiomeTileLayer
    tile: WFFloorFleshBoneMeaty
    threshold: -1
  - !type:BiomeTileLayer
    tile: WFFloorFleshBoneSpine
    threshold: 0.45
    noise: { seed: 94, noiseType: OpenSimplex2, frequency: 0.05 }
  - !type:BiomeTileLayer
    tile: WFFloorFleshBoneStraight
    threshold: 0.55
    noise: { seed: 95, noiseType: OpenSimplex2, frequency: 0.05 }
  # Pullable bone piles and the field's burrowers (_WF/Planets/Life); the scenery layers below win where they overlap.
  - !type:BiomeEntityLayer
    allowedTiles: [WFFloorFleshBoneMeaty, WFFloorFleshBoneSpine, WFFloorFleshBoneStraight]
    entities: [WFFaunaCarcinomaBone]
    threshold: 0.97
    noise: { seed: 37, noiseType: OpenSimplex2, frequency: 3 }
  - !type:BiomeEntityLayer
    allowedTiles: [WFFloorFleshBoneMeaty, WFFloorFleshBoneSpine, WFFloorFleshBoneStraight]
    entities: [WFCarcinomaBonePile]
    threshold: 0.93
    noise: { seed: 110, noiseType: OpenSimplex2, frequency: 1 }
  - !type:BiomeEntityLayer
    allowedTiles: [WFFloorFleshBoneMeaty, WFFloorFleshBoneSpine, WFFloorFleshBoneStraight]
    entities: [WFCarcinomaBoneLong, WFCarcinomaBoneRibs, WFCarcinomaBoneRibsTall, WFCarcinomaBoneSkullGreat]
    threshold: 0.9
    noise: { seed: 96, noiseType: OpenSimplex2, frequency: 1 }
  - !type:BiomeEntityLayer
    allowedTiles: [WFFloorFleshBoneMeaty, WFFloorFleshBoneSpine, WFFloorFleshBoneStraight]
    entities: [WFCarcinomaBoneLumpOne, WFCarcinomaBoneLumpTwo, WFCarcinomaBoneLumpThree]
    threshold: 0.94
    noise: { seed: 97, noiseType: OpenSimplex2, frequency: 1 }
  - !type:BiomeEntityLayer
    allowedTiles: [WFFloorFleshBoneMeaty, WFFloorFleshBoneSpine, WFFloorFleshBoneStraight]
    entities: [WFCarcinomaBoneHorn, WFCarcinomaBoneHornTurned, WFCarcinomaBoneSkull, WFCarcinomaBoneSkullHalf, WFCarcinomaBoneSkullHalfTurned]
    threshold: 0.92
    noise: { seed: 98, noiseType: OpenSimplex2, frequency: 1 }

# A few tiles of resin and hive wall inside the tendon forest.
- type: biomeTemplate
  id: WFCarcinomaHivePocket
  layers:
  - !type:BiomeTileLayer
    tile: WFFloorFlesh
    threshold: -1
  - !type:BiomeEntityLayer
    allowedTiles: [WFFloorFlesh, FloorFlesh]
    entities: [WFFaunaCarcinomaHive]
    threshold: 0.8
    noise: { seed: 120, noiseType: OpenSimplex2, frequency: 1 }
  - !type:BiomeEntityLayer
    allowedTiles: [WFFloorFlesh, FloorFlesh]
    entities: [GoonSetpiecesHive, ChompResin, PolarisResin]
    threshold: -0.2
    noise: { seed: 99, noiseType: OpenSimplex2, frequency: 0.5 }

# Wet dark ground, dense with blood pools that have polyps and pustules round them.
- type: biomeTemplate
  id: WFCarcinomaMarsh
  layers:
  - !type:BiomeTileLayer
    tile: WFFloorFleshMarshMud
    threshold: -1
  - !type:BiomeTileLayer
    tile: WFFloorFleshMarshDirt
    threshold: 0.4
    noise: { seed: 101, noiseType: OpenSimplex2, frequency: 0.04 }
  - !type:BiomeEntityLayer
    allowedTiles: [WFFloorFleshMarshMud, WFFloorFleshMarshDirt]
    entities: [WFCarcinomaVitaeBlister]
    threshold: 0.97
    noise: { seed: 111, noiseType: OpenSimplex2, frequency: 1 }
  - !type:BiomeMetaLayer
    template: WFCarcinomaMarshRim
    threshold: 0.3
    noise: { seed: 103, noiseType: OpenSimplex2, frequency: 0.06, fractalType: FBm, octaves: 2 }
  - !type:BiomeEntityLayer
    allowedTiles: [WFFloorFleshMarshMud, WFFloorFleshMarshDirt]
    entities: [WFBloodOcean]
    threshold: 0.4
    noise: { seed: 103, noiseType: OpenSimplex2, frequency: 0.06, fractalType: FBm, octaves: 2 }

# The ring just outside a marsh pool. Same noise as the pool, lower threshold.
- type: biomeTemplate
  id: WFCarcinomaMarshRim
  layers:
  - !type:BiomeEntityLayer
    allowedTiles: [WFFloorFleshMarshMud, WFFloorFleshMarshDirt]
    entities: [WFFaunaCarcinomaMarsh]
    threshold: 0.93
    noise: { seed: 37, noiseType: OpenSimplex2, frequency: 3 }
  - !type:BiomeEntityLayer
    allowedTiles: [WFFloorFleshMarshMud, WFFloorFleshMarshDirt]
    entities: [WFFleshPolyp]
    threshold: 0.7
    noise: { seed: 104, noiseType: OpenSimplex2, frequency: 0.8 }
  - !type:BiomeEntityLayer
    allowedTiles: [WFFloorFleshMarshMud, WFFloorFleshMarshDirt]
    entities: [WFFleshPustule]
    threshold: 0.93
    noise: { seed: 105, noiseType: OpenSimplex2, frequency: 0.8 }

# Scabbed shore between the lake and the ground, with a few clots of blood wall.
- type: biomeTemplate
  id: WFCarcinomaScabShore
  layers:
  # Plain flesh at the outer edge, scab flecked in over it, then solid by the water (the lake's own noise), so the
  # band frays into the ground instead of ending on a straight line of tiles.
  - !type:BiomeTileLayer
    tile: WFFloorFlesh
    threshold: -1
  - !type:BiomeTileLayer
    tile: WFFloorFleshScab
    threshold: 0.3
    noise: { seed: 107, noiseType: OpenSimplex2, frequency: 0.45 }
  - !type:BiomeTileLayer
    tile: WFFloorFleshScab
    threshold: 0.66
    noise: { seed: 61, frequency: 0.012, noiseType: OpenSimplex2, fractalType: FBm, octaves: 2, lacunarity: 2 }
  - !type:BiomeTileLayer
    tile: WFFloorFleshBoneMeaty
    threshold: 0.6
    noise: { seed: 107, noiseType: OpenSimplex2, frequency: 0.08 }
  - !type:BiomeEntityLayer
    allowedTiles: [WFFloorFleshScab, WFFloorFleshBoneMeaty]
    entities: [WFFaunaCarcinomaShore]
    threshold: 0.96
    noise: { seed: 37, noiseType: OpenSimplex2, frequency: 3 }
  - !type:BiomeEntityLayer
    allowedTiles: [WFFloorFleshScab, WFFloorFleshBoneMeaty]
    entities: [WFCarcinomaWeepingPolyp]
    threshold: 0.96
    noise: { seed: 112, noiseType: OpenSimplex2, frequency: 1 }
  - !type:BiomeEntityLayer
    allowedTiles: [WFFloorFleshScab, WFFloorFleshBoneMeaty]
    entities: [TauCetiMeatlandWall]
    threshold: 0.93
    noise: { seed: 108, noiseType: OpenSimplex2, frequency: 0.5 }

