- type: entity
  parent: TorsoHuman
  id: ForgeBioSynthTorso
  name: bio-synthetic torso
  description: A printed human torso for cases where very little of the patient is left.

- type: entity
  parent: LeftHandCybernetic
  id: ForgeMilLeftHand
  name: M.I.L left hand
  description: A cybernetic left hand with wrist micro-actuators that add force to unarmed strikes.
  components:
  - type: BodyPart
    onAdd:
    - type: ForgeUnarmedDamage
      damageType: Blunt
      amount: 2

- type: entity
  parent: LeftHandCybernetic
  id: ForgeRiplyLeftHand
  name: R.I.P.L.Y left hand
  description: A cybernetic left hand with reinforced fingertip anchors that help drag and carry heavy bodies when paired with its matching hand.
  components:
  - type: SubdermalImplant
    carryAssistMassMultiplier: 5
    carryAssistPickupDelayModifier: 0.35
    carryAssistSlowdownPenaltyModifier: 0.2
    pullingAssistSlowdownPenaltyModifier: 0.1
    pullingAssistMassPenaltyModifier: 0.1

- type: entity
  parent: RightHandCybernetic
  id: ForgeMilRightHand
  name: M.I.L right hand
  description: A cybernetic right hand with wrist micro-actuators that add force to unarmed strikes.
  components:
  - type: BodyPart
    onAdd:
    - type: ForgeUnarmedDamage
      damageType: Blunt
      amount: 2

- type: entity
  parent: RightHandCybernetic
  id: ForgeRiplyRightHand
  name: R.I.P.L.Y right hand
  description: A cybernetic right hand with reinforced fingertip anchors that help drag and carry heavy bodies when paired with its matching hand.
  components:
  - type: SubdermalImplant
    carryAssistMassMultiplier: 5
    carryAssistPickupDelayModifier: 0.35
    carryAssistSlowdownPenaltyModifier: 0.2
    pullingAssistSlowdownPenaltyModifier: 0.1
    pullingAssistMassPenaltyModifier: 0.1

#region IPC trait bodyparts
- type: entity
  parent: LeftArmCyberneticBase
  id: IPCBadServoLeftArm
  name: bad servo left arm
  description: Very low-quality left arm.
  categories: [ HideSpawnMenu ]
  components:
    - type: GenerateChildPart
      id: IPCBadServoLeftHand

- type: entity
  parent: LeftHandCybernetic
  id: IPCBadServoLeftHand
  name: bad servo left arm
  description: Very low-quality left hand.
  categories: [ HideSpawnMenu ]
  components:
  - type: DoAfterDelayMultiplier
    multiplier: 1.15

- type: entity
  parent: RightArmCyberneticBase
  id: IPCBadServoRightArm
  name: bad servo right arm
  description: Very low-quality right arm.
  categories: [ HideSpawnMenu ]
  components:
    - type: GenerateChildPart
      id: IPCBadServoRightHand

- type: entity
  parent: RightHandCybernetic
  id: IPCBadServoRightHand
  name: bad servo right arm
  description: Very low-quality right hand.
  categories: [ HideSpawnMenu ]
  components:
  - type: DoAfterDelayMultiplier
    multiplier: 1.15

- type: entity
  parent: LeftLegCyberneticBase
  id: IPCBadServoLeftLeg
  name: bad servo left leg
  description: Very low-quaity left leg.
  categories: [ HideSpawnMenu ]
  components:
  - type: MovementBodyPart
    walkSpeed: 2 #-20%
    sprintSpeed: 3.6 #-20%

- type: entity
  parent: RightLegCyberneticBase
  id: IPCBadServoRightLeg
  name: bad servo right leg
  description: Very low-quaity right leg.
  categories: [ HideSpawnMenu ]
  components:
  - type: MovementBodyPart
    walkSpeed: 2 #-20%
    sprintSpeed: 3.6 #-20%

- type: entity
  parent: RightArmCyberneticBase
  id: IPCLaserGunRightArm
  name: right ipc arm with laser
  description: Just common ipc right arm with a built-in laser gun.
  categories: [ HideSpawnMenu ]
  components:
  - type: BodyPart
    onAdd:
    - type: ActionGun
      action: ActionIPCLaserGun
      gunProto: IPCLaserGun

