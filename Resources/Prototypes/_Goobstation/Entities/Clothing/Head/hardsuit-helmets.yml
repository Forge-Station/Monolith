#chrono/future soldier hardsuit

- type: entity
  parent: [ ClothingHeadHardsuitBase, ClothingHeadSuitWithLightBase ]
  id: ClothingHeadHelmetHardsuitChronolegioneer
  name: futuristic helmet
  description: The helmet of the fighters of the future, designed for special timeflow operations
  components:
  - type: BreathMask
  - type: Sprite
    sprite: _Goobstation/Clothing/Head/Hardsuits/chronolegioneer.rsi
  - type: Clothing
    sprite: _Goobstation/Clothing/Head/Hardsuits/chronolegioneer.rsi
  - type: PointLight
    color: "#6BA9E6"
    rotation: 30
    energy: 10
    radius: 5
  - type: PressureProtection
    highPressureMultiplier: 0.08
    lowPressureMultiplier: 1000
  - type: SpeechSoundsReplacer
    speechSounds: Chrono
  - type: Armor
    coverage: [Head] # WOLFGATE(Wolfmed): P6, P3-D6: locational armour coverage
    modifiers:
      coefficients:
        Blunt: 0.10
        Slash: 0.10
        Piercing: 0.10
        Heat: 0.10
        Cold: 0.10
        Radiation: 0.10
        Caustic: 0.10

# cybersun stealth

- type: entity
  parent: NFClothingHeadHardsuitWithLightBase # mono - stupid NF clothing parent.
  id: ClothingHeadHelmetHardsuitCybersunStealth
  suffix: stealth
  name: stealth hardsuit helmet
  description: A helmet with plating for stealth operations.
  components:
  - type: Sprite
    sprite: _Goobstation/Clothing/Head/Hardsuits/cybersunstealth.rsi
  - type: Clothing
    sprite: _Goobstation/Clothing/Head/Hardsuits/cybersunstealth.rsi
  - type: PointLight
    color: green
  - type: PressureProtection
    highPressureMultiplier: 0.08
    lowPressureMultiplier: 1000
  - type: Armor
    coverage: [Head] # WOLFGATE(Wolfmed): P6, P3-D6: locational armour coverage
    modifiers:
      coefficients:
        Blunt: 0.95
        Slash: 0.95
        Piercing: 0.95
        Heat: 0.95
  - type: ClothingGrantComponent
    component:
    - type: Stealth
      enabledOnDeath: false
      enabledOnCrit: false
      # WOLFGATE(Stealth) START: full invisibility, as Monolith#4845 had it.
      # minVisibility: 0.15 # Mono: Changed to be not fully invisible
      # maxVisibility: 0.6 # Mono: Changed to be partially invisible
      # WOLFGATE END
    - type: StealthOnMove
      passiveVisibilityRate: -0.4
      movementVisibilityRate: 0.4
  # WOLFGATE(Stealth): stealth toggle, the CV-53 helmet's night vision and a thermal pulse.
  - type: WFStealthToggle
  - type: NightVision # Gen 4 quadtube
    relayOverlay: true
    goggleEffect: true
    action: ActionToggleNightVision
    viewCircleRadius: 400
    viewCircleCount: 4
    viewCircleSpacing: 260
    phosphorColor: "#41D7D9"
    lightingColor: "#FFFFFF32"
  - type: ThermalVision
    pulseTime: 1
    isEquipment: true
    toggleAction: PulseThermalVision

