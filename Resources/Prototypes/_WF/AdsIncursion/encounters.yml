# The Automated Defense System's encounters. Everything here is started by the ADS campaign or an admin, never the
# storyteller. The first ship listed is the lead: a node breaks when its lead is out of the fight, and a sentinel,
# sweep or interdictor flies the lead's orders. Every ADS ship disables what it fights: its guns stop once the target is
# combat-ineffective, so nobody is hunted or boarded. Nobody gets a deed to a machine. Every zone interrogates: a ship
# is hailed and asked whether it is a threat, and only one that says YES or fires on the ADS is fired on.

# A node: a Nebula holding a cell centre as a gun platform. The lead does not evade: a hub that ran from an alert
# would undock everything on it. The campaign adds sentinels to it as it ages.
- type: wfEncounter
  id: WFAdsNode
  name: wf-ads-name-node
  start: Manual
  lifetime: Persistent
  category: Threat
  icon: Flag
  leash: 2000
  manifests: [ WFManifestAdsTech ]
  ships:
  - key: lead
    navigation: WFCrewNavigationRaider
    side: ads
    faction: WFAds
    distress: false
    company: WFAds
    profile: WFCrewProfileAds
    vessels: [ WFAdsNebula ]
    deckhands: 2
    guards: 2
    cargo: 2
    # Jars stowed for the plant: the restock tops the stores up past this whenever they run low.
    fuelStores: 12
    skill: Regular
    evades: false
    platform: true
    warnRange: 1800
    attackRange: 1000
    zoneLines: wf-ads-zone
    zoneTargets: Interrogate
    disengage: Disable
    disengageRange: 1500
    iffColor: "#9B4DFF"
    deed: null
    objectives:
    - kind: Hold

