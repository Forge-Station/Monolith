- type: polymorph
  id: GeneForcedMonkey
  configuration:
    entity: MobMonkey
    forced: true
    inventory: Drop
    transferName: true
    transferDamage: true
    revertOnCrit: false
    revertOnDeath: false
    allowRepeatedMorphs: false
    copiedComponents:
    - LanguageKnowledge
    - LanguageSpeaker
    - Grammar
    - Genome

