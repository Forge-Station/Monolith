- type: entity
  name: simple biscuit
  parent: FoodBakedBase
  id: FoodBakedBiscuitSimple
  description: A simple dry biscuit, perfect pair for some tea or coffee.
  components:
  - type: Sprite
    sprite: _Mono/Objects/Consumable/Food/Baked/misc.rsi
    state: biscuit-simple
  - type: Tag
    tags:
    - SimpleBiscuit
  # Forge-Change-Start
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 6
        reagents:
        - ReagentId: Nutriment
          Quantity: 5
        - ReagentId: Lactozit
          Quantity: 0.25
  # Forge-Change-End

- type: entity
  name: sugar biscuit
  parent: FoodBakedBiscuitSimple # Forge-Change
  id: FoodBakedBiscuitSugar
  description: A biscuit with a sugar coating, perfect pair for some tea or coffee.
  components:
  - type: Sprite
    sprite: _Mono/Objects/Consumable/Food/Baked/misc.rsi
    state: biscuit-sugar
  - type: Tag
    tags:
    - SugarBiscuit

- type: entity
  name: oatmeal biscuit
  parent: FoodBakedBiscuitSimple # Forge-Change
  id: FoodBakedBiscuitOatmeal
  description: A biscuit made with oatmeal, perfect pair for some tea or coffee.
  components:
  - type: Sprite
    sprite: _Mono/Objects/Consumable/Food/Baked/misc.rsi
    state: biscuit-oatmeal
  - type: Tag
    tags:
    - OatmealBiscuit
