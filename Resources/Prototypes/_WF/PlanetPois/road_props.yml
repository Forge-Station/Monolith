# Army vehicles for the roads. RMC's Tyrargo props are the only vehicle scenery drawn from above as well as from the side,
# so they are the only ones that can point along a road running north to south; but they are pictures with no fixture,
# walked straight through. These twins have a hull, sized as the vehicle faces south, so the road dressing can park them.

- type: entity
  parent: RMCPropTyrargoVehicleTruck
  id: WFRoadPropArmyTruck
  categories: [ WFStreets ]
  suffix: Solid
  components:
  - type: Physics
    bodyType: Static
    canCollide: true
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.6,-1.2,0.6,1.2"
        density: 190
        layer:
        - MobMask

- type: entity
  parent: WFRoadPropArmyTruck
  id: WFRoadPropArmyTruckBroken
  suffix: Solid, Broken
  components:
  - type: Sprite
    state: truck_broken

- type: entity
  parent: RMCPropTyrargoVehicleTruckAlt
