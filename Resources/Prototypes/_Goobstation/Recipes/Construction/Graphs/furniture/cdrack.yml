#Forge-Change изначальнный вариант с губов не работал, я его весь переписал.
- type: constructionGraph
  id: CdRackGraph
  start: start
  graph:
    - node: start
      actions:
        - !type:DeleteEntity {}
      edges:
        - to: CdRackNode
          completed:
            - !type:SnapToGrid { }
          steps:
            - material: Steel
              amount: 5
              doAfter: 4
    - node: CdRackNode
      entity: CdRack
      edges:
        - to: start
          completed:
            - !type:SpawnPrototype
              prototype: SheetSteel1
              amount: 5
          steps:
            - tool: Screwing
              doAfter: 4