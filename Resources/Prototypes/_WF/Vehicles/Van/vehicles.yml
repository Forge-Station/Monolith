# The van family: the van itself, the CLF van, the box and pizza vans and the SPP vans. The wheels are fitted at spawn
# (RMC leaves the van's wheel loose); the SPP armed van starts with its roof turret and the turret with its cannon.

- type: entity
  parent: RMCVehicleBase
  id: VehicleVanBase
  abstract: true
  name: van
  description: A rugged transport van.
  components:
  - type: VehicleSound
    runningSound: null
    collisionSound:
      collection: WFRcsmCarCrash
    mobCollisionSound:
      collection: WFRcsmCrush
    crashSound:
      collection: WFRcsmCrash
  - type: WFVehicleEngineAudio
    startSound: /Audio/_WF/Vehicles/RCSM/engines/ural/start.ogg
    stopSound: /Audio/_WF/Vehicles/RCSM/engines/ural/stop.ogg
    idleLoop: /Audio/_WF/Vehicles/RCSM/engines/ural/idle.ogg
    driveLoop: /Audio/_WF/Vehicles/RCSM/engines/ural/drive.ogg
    highLoop: /Audio/_WF/Vehicles/RCSM/engines/ural/high.ogg
    revSound:
      collection: WFRcsmEngineRev
    gears: 4
    idlePitch: 1, 1.3
    drivePitch: 0.75, 1.4
    highPitch: 0.95, 1.25
    shiftSound:
      collection: WFRcsmEngineShift
    throttleResponse: 5
    tracksLoop: /Audio/_WF/Vehicles/RCSM/wheels/road.ogg
    startDelay: 1.5
    tracksPitch: 0.9, 1.25
  - type: WFVehicleHitSound
    lightHitSound:
      collection: WFRcsmHitBullet
    lightRicochetSound:
      collection: WFRcsmRicochet
    lightRicochetChance: 0.2
  - type: WFVehicleDestroyedSound
    sequence:
    - sound:
        collection: WFRcsmVehicleBlast
        params:
          volume: 4
          maxDistance: 32
    - delay: 0.4
      sound:
        collection: WFRcsmVehicleDebris
    - delay: 2.5
      sound:
        collection: WFRcsmVehicleFire
        params:
          maxDistance: 14
    - delay: 6
      sound:
        collection: WFRcsmVehicleFireStress
        params:
          maxDistance: 12
  - type: WarpPoint
    follow: true
    location: Van
  - type: GridVehicleMover
    plowRamMinSpeed: 10
    maxSpeed: 13
    acceleration: 7
    deceleration: 14
    turnDelay: 0.25
  - type: VehicleOvercharge
    speedMultiplier: 1.6
    duration: 3
    cooldown: 15
    overchargeSound: /Audio/_WF/Vehicles/overdrive_activate.ogg
  - type: VehicleSpotlight
    radius: 6
    energy: 2.5
    softness: 2
  - type: Fixtures
    fixtures:
      world:
        shape:
          !type:PhysShapeAabb
          bounds: -0.6,-1.2,0.6,1.5
        density: 1000
        mask:
        - Impassable
        - HighImpassable
        - LowImpassable
        - LargeMobLayer
        - Vehicle
        layer:
        - LargeMobLayer
        - Vehicle
      mob:
        shape:
          !type:PhysShapeAabb
          bounds: -0.6,-1.2,0.6,1.5
        density: 1000
        mask:
        - MidImpassable
        - LargeMobLayer
        layer:
        - LargeMobLayer
  - type: Sprite
    drawdepth: Mobs
    sprite: _WF/Vehicles/van.rsi
    layers:
    - map: [ base ]
      state: van_base
    - map: [ damaged_frame ]
      state: damaged_frame
      visible: false
    - map: [ rmc-wheels ]
      state: wheels_1
  - type: PointLight
    enabled: false
    radius: 6
    energy: 2.5
    softness: 2
    autoRot: true
    offset: "0,0.9"
  - type: ContainerContainer
    containers:
      wheel-1: !type:ContainerSlot
        showEnts: false
        occludes: true
        ent: null
  - type: HardpointSlots
    vehicleFamily: HardpointVehicleFamilyVan
    slots:
    - id: wheel-1
      hardpointType: HardpointTypeWheel
      slotType: HardpointSlotTypeWheel
      insertDelay: 1.5
      whitelist:
        components:
        - VehicleWheelItem
  - type: HardpointState
  - type: VehicleEnter
    interiorPath: /Maps/_WF/Vehicles/Interiors/van_interior.yml
    enterDoAfter: 1.0
    exitDoAfter: 1.0
    maxPassengers: 8
    entryPoints:
    - offset: 1,-1
      radius: 0.6
      interiorCoords: 3.5,-0.34
    - offset: -1,-1
      radius: 0.6
      interiorCoords: 3.25,-1
    - offset: 0,2
      radius: 0.75
      interiorCoords: 0.25,-1
  - type: ItemSlots
    slots:
      wheel-1:
        startingItem: RMCVanWheel
        whitelist:
          components:
          - VehicleWheelItem
  - type: StaticPrice
    price: 15000

- type: entity
  parent: VehicleVanBase
  id: VehicleVan
  suffix: Drivable, Van, Base

## CLF
- type: entity
  parent: VehicleVanBase # the CLF van keeps the van interior
  id: VehicleCLFVan
  name: CLF van
  suffix: Drivable, Van, CLF
  description: A rugged transport van painted in CLF colors.
  components:
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: VehicleFrameCLFVan # CLF van modifiers
  - type: Sprite
    sprite: _WF/Vehicles/CLF_van.rsi
    layers:
    - map: [ base ]
      state: van_base
    - map: [ damaged_frame ]
      state: damaged_frame
      visible: false
    - map: [ rmc-wheels ]
      state: wheels_1
  - type: VehicleEnter
    maxPassengers: 10

## Box Vans
- type: entity
  parent: VehicleVanBase
  id: VehicleBoxVanBase
  abstract: true
  name: box van
  description: A rugged transport van fitted with a box body.
  components:
