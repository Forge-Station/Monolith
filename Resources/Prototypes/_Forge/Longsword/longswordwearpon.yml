- type: entity
  name: LIR-31 Reqonqista (10x99mm)
  parent: [BaseWeaponRifle, BaseGunWieldable, BaseC2ContrabandUnredeemable]
  id: WeaponLIR31
  description: Longsword International Relsotrone, it use ammo and energy.
  suffix: Longsword
  components:
  - type: Sprite
    sprite: _Forge/Objects/Longsword/longswordrailgun.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: GunWieldBonus
    minAngle: -2
    maxAngle: -1
  - type: Gun
    minAngle: 1
    maxAngle: 1.5
    angleIncrease: 20
    angleDecay: 9
    fireRate: 0.8
    selectedMode: SemiAuto
    availableModes: SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/ship_perforator.ogg
  - type: ChamberMagazineAmmoProvider
    soundRack:
      path: /Audio/Weapons/Guns/Cock/batrifle_cock.ogg
  
  - type: GunBatteryAmmo
    fireCost: 50
  - type: PowerCellSlot
    cellSlotId: gun_battery
    fitsInCharger: true
  
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazineLIR31
        insertSound: /Audio/Weapons/Guns/MagIn/sfrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/hpistol_magout.ogg
        priority: 2
        whitelist:
          tags:
          - Magazine10x99mmCaseless
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        startingItem: Cartridge10x99mmCaseless
        priority: 1
        whitelist:
          tags:
          - Cartridge10x99mmCaseless
      
      gun_battery:
        name: Battery
        startingItem: PowerCellLIR31
        insertSound: /Audio/Weapons/Guns/MagIn/sfrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/hpistol_magout.ogg
        priority: 3
        whitelist:
          tags:
          - PowerCellLIR31
        whitelistFailPopup: gun-magazine-whitelist-fail
      
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
      gun_battery: !type:ContainerSlot   
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
  - type: Clothing
    sprite: _Forge/Objects/Longsword/longswordrailgunequipped.rsi
  - type: Item
    size: Ginormous
    shape:
    - 0,0,7,2
    sprite: _Forge/Objects/Longsword/longswordrailgunequipped.rsi
  - type: StaticPrice
    price: 2400
  - type: SpeedModifiedOnWield
    walkModifier: 0.6
    sprintModifier: 0.45
  - type: WieldDelay
    baseDelay: 1.2
    modifiedDelay: 1.2
    preventFiring: true
  - type: ClothingSpeedModifier
    walkModifier: 0.9
    sprintModifier: 0.9
  - type: CursorOffsetRequiresWield
  - type: EyeCursorOffset
    maxOffset: 7
    pvsIncrease: 0.7
  - type: GunRequiresWield
  - type: LaserPointer
    targetedColor: "#463C5EFF"
    defaultColor: "#463C5EFF"

