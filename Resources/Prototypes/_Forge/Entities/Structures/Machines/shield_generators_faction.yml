# Faction-branded heavy shield line (stats match FSG-420 / 470P / 600C).

# --- TSFMC ---

- type: entity
  id: ShieldGeneratorForgeTSFHeavy
  parent: ShieldGeneratorFSG420
  name: TSFMC SGS-440 "Citadel" shield generator
  description: A TSFMC-issue heavy universal screen for hulls that must hold the line under sustained fire.
  components:
  - type: Machine
    board: MachineShieldForgeTSFHeavyCircuitboard
  - type: ShipShieldEmitter
    shieldColor: "#48E8A8"
  - type: Sprite
    sprite: _Mono/Structures/ShuttleComponents/shield.rsi
    snapCardinals: true
    layers:
    - state: control
    - state: control_on
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
      visible: false
      color: "#48E8A8"
  - type: PointLight
    enabled: false
    castShadows: true
    radius: 2
    energy: 1.5
    color: "#48E8A8"

