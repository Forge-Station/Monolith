      color: "#ffffff"
      sprite: Objects/Misc/handcuffs.rsi
      state: body-overlay-2
      visible: false
    - map: [ "clownedon" ] # Dynamically generated
      sprite: "Effects/creampie.rsi"
      state: "creampie_human"
      visible: false
  - type: DamageVisuals
    thresholds: [ 10, 20, 30, 50, 70, 100 ]
    targetLayers:
    - "enum.HumanoidVisualLayers.Chest"
    - "enum.HumanoidVisualLayers.Head"
    - "enum.HumanoidVisualLayers.LArm"
    - "enum.HumanoidVisualLayers.LLeg"
    - "enum.HumanoidVisualLayers.RArm"
    - "enum.HumanoidVisualLayers.RLeg"
    damageOverlayGroups:
      Brute:
        # WOLFGATE(Wolfmed) START: WP11-4, P3-4 Option B: the damage overlays use Onyx's wound art, severed parts included.
        # Onyx's rsis have the same 6 states and attribution as the stock ones.
        # sprite: Mobs/Effects/brute_damage.rsi
        sprite: _Onyx/Wounds/brute_damage.rsi
        color: "#FF0000"
      Burn:
        # sprite: Mobs/Effects/burn_damage.rsi
        sprite: _Onyx/Wounds/burn_damage.rsi
        # WOLFGATE END
  - type: GenericVisualizer
    visuals:
      enum.CreamPiedVisuals.Creamed:
        clownedon: # Not 'creampied' bc I can already see Skyrat complaining about conflicts.
          True: {visible: true}
          False: {visible: false}
  - type: StatusIcon
    bounds: -0.5,-0.5,0.5,0.5
  - type: RotationVisuals
    defaultRotation: 90
    horizontalRotation: 90
  # WOLFGATE(Xenonids): species can host facehuggers, be devoured by xenos and are slowed by their weeds
  - type: Infectable
  - type: Devourable
  # WOLFGATE(Xenonids): xeno slows (slowing spit, neurotoxin) need RMC's species modifier; RMC's marine values
  - type: RMCSpeciesSlowdownModifier
    slowModifier: 2
    superSlowModifier: 4
  - type: AffectableByWeeds
  - type: HumanoidAppearance
    species: Human
  - type: SlowOnDamage
    speedModifierThresholds:
      60: 0.7
      80: 0.5
  - type: Fixtures
    fixtures: # TODO: This needs a second fixture just for mob collisions.
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 185
        restitution: 0.0
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: FloorOcclusion
  - type: RangedDamageSound
    soundGroups:
      Brute:
        collection:
          MeatBulletImpact
    soundTypes:
      Heat:
        collection:
          MeatLaserImpact
  - type: Reactive
    groups:
      Flammable: [ Touch ]
      Extinguish: [ Touch ]
      Acidic: [Touch, Ingestion]
    reactions:
    - reagents: [Water, SpaceCleaner]
      methods: [Touch]
      effects:
      - !type:WashCreamPieReaction
      - !type:WashChemicalBurns # WOLFGATE(Wolfmed): W4: rinses caustic residue off a wound host.
      - !type:WolfmedCoolOverheating # WOLFGATE(Wolfmed): W6: cools a cybernetic limb running hot.
    # WOLFGATE(Wolfmed) START: W5: antiseptics clean open wounds on touch.
    # Swabbing an open wound before it festers is most of the prevention in the infection model; water alone
    # does not sterilise anything, so it is a separate reaction.
    - reagents: [Ethanol, Bleach, Spaceacillin]
      methods: [Touch]
      effects:
      - !type:WolfmedCleanWounds
    # WOLFGATE END
  - type: StatusEffects
    allowed:
    - Stun
    - KnockedDown
    - SlowedDown
    - Stutter
    - SeeingRainbows
    - Electrocution
    - Drunk
    - SlurredSpeech
    - RatvarianLanguage
    - PressureImmunity
    - Muted
    - ForcedSleep
    - TemporaryBlindness
    - Pacified
    - StaminaModifier
    - Flashed
    - RadiationProtection
    - Drowsiness
    - Adrenaline
    - ClawsGrowthSuppression # Mono
  - type: Body
    prototype: Human
    requiredLegs: 2
