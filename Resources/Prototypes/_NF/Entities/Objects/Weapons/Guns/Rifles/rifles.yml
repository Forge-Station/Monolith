# Frontier
- type: entity
  name: PA Gestio (7.62x39mm)
  parent: BaseWeaponRifle
  id: WeaponRifleGestio
  description: An old burst-fire rifle that never left trials. Accepts low capacity 762x39mm magazines.
  components:
  - type: Sprite
    sprite: _NF/Objects/Weapons/Guns/Rifles/gestio.rsi
    layers:
      - state: mag-0
        map: ["enum.GunVisualLayers.Mag"]
      - state: base
        map: ["enum.GunVisualLayers.Base"]
  - type: Clothing
    sprite: _NF/Objects/Weapons/Guns/Rifles/gestio.rsi
  - type: Item # Forge-change
    size: Large # Forge-change
    shape: # Forge-change
    - 0,0,3,3 # Forge-change
  - type: GunRequiresWield # Forge-change
  - type: GunWieldBonus # Forge-change
    minAngle: 0 # Forge-change
    maxAngle: 0 # Forge-change
  - type: Gun
    minAngle: 5 # Forge-change
    maxAngle: 15 # Forge-change
    angleIncrease: 2.5 # Forge-change
    angleDecay: 5 # Forge-change
    projectileSpeed: 50 # Forge-change
    fireRate: 4
    burstFireRate: 8
    shotsPerBurst: 3
    burstCooldown: 0.4
    selectedMode: Burst
    availableModes:
      - Burst
      - SemiAuto
    soundGunshot:
      path: /Audio/_NF/Weapons/Guns/Gunshots/rifle.ogg
      params:
        volume: -5
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: Magazine762x39mmLowCapacityFMJ
        insertSound: /Audio/Weapons/Guns/MagIn/ltrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/ltrifle_magout.ogg
        priority: 2
        whitelist:
          tags:
            - Magazine762x39mmLowCapacityFMJ
            - Magazine762x39mmFMJ
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        startingItem: Cartridge762x39mmFMJ
        priority: 1
        whitelist:
          tags:
            - Cartridge762x39mmFMJ
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance

