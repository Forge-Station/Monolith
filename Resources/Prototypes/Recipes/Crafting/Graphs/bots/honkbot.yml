- type: constructionGraph
  id: HonkBot
  start: start
  graph:
  - node: start
    edges:
    - to: bot
      steps:
      - tag: HappyHonk
        icon:
          sprite: _NF/Objects/Storage/Happyhonk/clown.rsi # Frontier: add _NF prefix
          state: box
        name: construction-required-happy-honk-meal # Forge-change
      - tag: BikeHorn
        icon:
            sprite: Objects/Fun/bikehorn.rsi
            state: icon
        name: construction-required-bike-horn # Forge-change
        doAfter: 2
      - tag: ProximitySensor
        icon:
          sprite: Objects/Misc/proximity_sensor.rsi
          state: icon
        name: construction-required-proximity-sensor # Forge-change
      - tag: BorgArm
        icon:
          sprite: Mobs/Silicon/drone.rsi
          state: l_hand
        name: construction-required-borg-arm # Forge-change
        doAfter: 2
  - node: bot
    entity: MobHonkBot

