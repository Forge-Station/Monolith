# Biome: the layers below it win over the ones above it.
- type: biomeTemplate
  id: WFMerakDesert
  layers:
  # Boulders
  - !type:BiomeEntityLayer
    threshold: 0.975
    noise: { seed: 0, noiseType: OpenSimplex2, frequency: 5 }
    allowedTiles: [WFFloorMerakDuneSand, WFFloorMerakGoldSand, WFFloorMerakPaleSand, WFFloorMerakDarkSand]
    entities: [FloraRockSolidPlanet]
  # Dune fauna; each region lays its own wildlife (_WF/Planets/Life/merak.yml).
  - !type:BiomeEntityLayer
    threshold: 0.95
    noise: { seed: 0, noiseType: OpenSimplex2, frequency: 3 }
    allowedTiles: [WFFloorMerakDuneSand, WFFloorMerakGoldSand, WFFloorMerakPaleSand]
    entities: [WFFaunaMerakDunes]
  # Native plants
  - !type:BiomeEntityLayer
    threshold: 0.915
    noise: { seed: 0, noiseType: OpenSimplex2, frequency: 2 }
    allowedTiles: [WFFloorMerakDuneSand, WFFloorMerakGoldSand, WFFloorMerakPaleSand]
    entities: [FloraPilumaPlant]
  - !type:BiomeEntityLayer
    threshold: 0.925
    noise: { seed: 0, noiseType: OpenSimplex2, frequency: 2 }
    allowedTiles: [WFFloorMerakDuneSand, WFFloorMerakGoldSand]
    entities: [FloraOrakimPlant]
  # Tumbleweeds on open sand and flats
  - !type:BiomeEntityLayer
    threshold: 0.975
    noise: { seed: 31, noiseType: OpenSimplex2, frequency: 3 }
    allowedTiles:
    - WFFloorMerakDuneSand
    - WFFloorMerakGoldSand
    - WFFloorMerakPaleSand
    - WFFloorMerakRedDesertSand
    - WFFloorMerakDesertGravel
    entities: [WFMerakTumbleweed]
  # Rock decals
  - !type:BiomeDecalLayer
    allowedTiles:
    - WFFloorMerakDuneSand
    - WFFloorMerakGoldSand
    - WFFloorMerakPaleSand
    - WFFloorMerakDarkSand
    threshold: 0.9
    divisions: 1
    noise: { seed: 1, frequency: 5 }
    decals: [Basalt1, Basalt2, Basalt3, Basalt4, Basalt5, Basalt6, Basalt7, Basalt8, Basalt9]
  # Ore crab sites in a band round the outcrops; the outcrops below win where the noise is higher.
  - !type:BiomeEntityLayer
    allowedTiles: [WFFloorMerakDesertGravel, WFFloorMerakDesertSandrock, WFFloorMerakDesertCracked]
    threshold: 0.08
    noise:
      seed: 0
      noiseType: Cellular
      frequency: 0.05
      lacunarity: 5
      fractalType: FBm
      octaves: 2
      cellularDistanceFunction: Euclidean
      cellularReturnType: Distance2
    entities: [WFFaunaMerakFlats]
  # Ore outcrops
  - !type:BiomeEntityLayer
    allowedTiles:
    - WFFloorMerakDuneSand
    - WFFloorMerakGoldSand
    - WFFloorMerakPaleSand
    - WFFloorMerakDarkSand
    - WFFloorMerakRedDesertSand
    - WFFloorMerakDesertGravel
    - WFFloorMerakDesertSandrock
    - WFFloorMerakDesertCracked
    threshold: 0.15
    noise:
      seed: 0
      noiseType: Cellular
      frequency: 0.05
      lacunarity: 5
      fractalType: FBm
      octaves: 2
      cellularDistanceFunction: Euclidean
      cellularReturnType: Distance2
    entities: [MonoPlanetmapOreSandRich]
  - !type:BiomeDummyLayer
    id: Loot
  # Ground: the dune sea, then the regions on top of it.
  - !type:BiomeTileLayer
    threshold: -1
    tile: WFFloorMerakDuneSand
  - !type:BiomeTileLayer
    threshold: 0.1
    tile: WFFloorMerakGoldSand
    noise: { seed: 5, noiseType: OpenSimplex2, frequency: 0.005 }
  - !type:BiomeTileLayer
    threshold: 0.5
    tile: WFFloorMerakPaleSand
    noise: { seed: 6, noiseType: OpenSimplex2, frequency: 0.006 }
  - !type:BiomeMetaLayer
    threshold: 0.3
    template: WFMerakBadlands
    noise: { seed: 11, noiseType: OpenSimplex2, frequency: 0.006, fractalType: FBm, octaves: 3 }
  - !type:BiomeMetaLayer
    threshold: 0.3
    template: WFMerakGravelFlats
    noise: { seed: 37, noiseType: OpenSimplex2, frequency: 0.006, fractalType: FBm, octaves: 3 }
  - !type:BiomeMetaLayer
    threshold: 0.35
    template: WFMerakCactusFields
    noise: { seed: 23, noiseType: OpenSimplex2, frequency: 0.007, fractalType: FBm, octaves: 3 }
  - !type:BiomeMetaLayer
    threshold: 0.82
    template: WFMerakOasis
    noise: { seed: 41, noiseType: OpenSimplex2, frequency: 0.0075, fractalType: FBm, octaves: 2 }

- type: biomeTemplate
  id: WFMerakBadlands
  layers:
  # Wildlife: lizards and cobras
  - !type:BiomeEntityLayer
    threshold: 0.95
    noise: { seed: 0, noiseType: OpenSimplex2, frequency: 3 }
    allowedTiles: [WFFloorMerakRedDesertSand, WFFloorMerakRedDesertRock, WFFloorMerakRedDesertRockCracked, WFFloorMerakDarkSand]
    entities: [WFFaunaMerakBadlands]
  # Dry scrub, black boulders and short mesas; later layers win.
  - !type:BiomeEntityLayer
    threshold: 0.8
    noise: { seed: 12, noiseType: OpenSimplex2, frequency: 3 }
    allowedTiles: [WFFloorMerakRedDesertSand, WFFloorMerakRedDesertRock, WFFloorMerakRedDesertRockCracked, WFFloorMerakDarkSand]
    entities: [CoyoteFloraWasteplantWildFeracactus, CMFloraBushDesert, CoyoteFloraWasteplantWildPrickly]
  - !type:BiomeEntityLayer
    threshold: 0.82
    noise: { seed: 13, noiseType: OpenSimplex2, frequency: 3 }
    allowedTiles: [WFFloorMerakRedDesertSand, WFFloorMerakRedDesertRock, WFFloorMerakRedDesertRockCracked, WFFloorMerakDarkSand]
    entities: [CMRockBlackGroundDense2, CMRockBlackGroundDense3, CMRockBlackGroundDense]
  - !type:BiomeEntityLayer
    threshold: 0.9
    noise: { seed: 18, noiseType: OpenSimplex2, frequency: 3 }
