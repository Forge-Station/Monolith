- type: entity
  id: DnaModifierScannerMachineCircuitboard
  parent: BaseMachineCircuitboard
  name: DNA modifier scanner machine board
  description: A machine printed circuit board for a DNA modifier scanner.
  components:
  - type: Sprite
    state: medical
  - type: MachineBoard
    prototype: DnaModifierScanner
    requirements:
      Capacitor: 1
    stackRequirements:
      Glass: 5
      Cable: 1

- type: entity
  parent: BaseComputerCircuitboard
  id: GeneticsConsoleComputerCircuitboard
  name: genetics console computer board
  description: A computer printed circuit board for a genetics console.
  components:
  - type: Sprite
    state: cpu_medical
  - type: ComputerBoard
    prototype: ComputerGeneticsConsole

- type: entity
  parent: BaseMachineCircuitboard
  id: GeneticsServerMachineCircuitboard
  name: DNA server machine board
  description: A machine printed circuit board for a DNA server.
  components:
  - type: Sprite
    state: medical
  - type: MachineBoard
    prototype: MachineGeneticsServer
    stackRequirements:
      Glass: 2
      Cable: 2
