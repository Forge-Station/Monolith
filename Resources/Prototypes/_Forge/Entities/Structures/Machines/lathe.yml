#region Federation
- type: entity
  id: TSFIDPrinter
  parent: BaseLatheLube
  name: TSF ID printer
  description: a printer that produces ID cards and TSF encryption keys.
  suffix: TSF
  components:
  - type: Sprite
    sprite: _Forge/Structures/Machines/idprinter.rsi
    snapCardinals: true
    layers:
    - state: icon
      map: ["enum.LatheVisualLayers.IsRunning"]
    - state: unlit
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: Machine
    board: TSFIDPrinterCircuitboard
  - type: Lathe
    idleState: icon
    runningState: icon
    staticPacks:
    - TSFIDStatic
    - TSFHeadsetStatic
    - Bureaucracytatic

