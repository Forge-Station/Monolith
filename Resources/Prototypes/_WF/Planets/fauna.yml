# Sparse ambient wildlife.
# Table spawners produce mobile animals; placing mobs directly in a biome layer would anchor them.

- type: entityTable
  id: WFFaunaAsclepiu
  table: !type:GroupSelector
    children:
    - id: MobFox
      weight: 4
    - id: MobLizard
      weight: 3
    - id: MobCrab
      weight: 2
    - id: MobSnake
      weight: 1

- type: entity
  id: WFFaunaAsclepiu
  parent: MarkerBase
  name: asclepiu wildlife spawner
  categories: [HideSpawnMenu]
  components:
  - type: WFPlanetFaunaSpawner
    table: WFFaunaAsclepiu

