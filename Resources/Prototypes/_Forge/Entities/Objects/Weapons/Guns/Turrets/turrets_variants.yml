- type: entity
  parent: BaseWeaponTurret
  id: BaseWeaponCommandBallisticTurret
  name: ballistic turret
  description: A command ballistic turret. It deploys empty; load a cartridge kit before it can fire.
  abstract: true
  components:
  - type: Gun
    fireRate: 6
    projectileSpeed: 55
    maxAngle: 15
    minAngle: 4
    angleIncrease: -1.2
    angleDecay: -4
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/gun_sentry.ogg
  - type: MagazineAmmoProvider
    autoEject: false
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: null
        insertSound: /Audio/Weapons/Guns/MagIn/smg_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/smg_magout.ogg
        priority: 2
        whitelist:
          tags:
          - MagazineTurretBallistic
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot

- type: entity
