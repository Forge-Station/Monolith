# What's left of a crashed ship's crew (a wreck theme's `crew`): spacers dressed for the world they came down on, risen
# as inert zombies (WFZombifyOnSpawn: bite only, no infection, no rising dead) and hostile to anyone who comes poking
# through the hull.

- type: entity
  abstract: true
  parent: BaseMobHuman
  id: WFWreckZombieBase
  name: wrecked crewmember
  description: Whatever crashed here, they didn't walk away from it. Not properly, anyway.
  categories: [ HideSpawnMenu ]
  components:
  - type: RandomHumanoidAppearance
    randomizeName: false
  - type: WFZombifyOnSpawn
  # Zombies from any other source are friends, so the crew never goes for one.
  - type: NpcFactionMember
    addFriendlyFactions: [ Zombie ]
  - type: InputMover
  - type: MobMover
  - type: WFVehicleBoarder

- type: entity
  parent: WFWreckZombieBase
  id: WFWreckZombieVerda
  components:
  - type: Loadout
    prototypes: [ WFWreckCrewGearVerdaFarmer, WFWreckCrewGearVerdaHauler ]

- type: entity
  parent: WFWreckZombieBase
  id: WFWreckZombieMerak
