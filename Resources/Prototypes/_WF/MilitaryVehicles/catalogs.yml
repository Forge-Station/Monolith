# What the military outfitter and the station counter sell (VehicleShop catalogues). `licence: true` listings need a
# heavy vehicle licence on the buyer. Every price sits above what the thing appraises for, fitted parts included, so
# nothing bought here sells at a profit (MilitaryCatalogueTest).

# Bare chassis, delivered to the outfitter's pad.
- type: wfVehicleCatalog
  id: WFMilitaryCatalogChassis
  vehicles:
  - vehicle: WFMilitaryChassisHumvee
    price: 38000
    licence: true
  - vehicle: VehicleAPC
    price: 60000
    licence: true
  - vehicle: VehicleAPCPMC
    price: 62000
    licence: true
  - vehicle: VehicleAPCMed
    price: 65000
    licence: true
  - vehicle: VehicleAev
    price: 95000
    licence: true
  - vehicle: VehicleTankTWE
    price: 120000
    licence: true
  - vehicle: WFMilitaryChassisTank
    price: 135000
    licence: true
  - vehicle: WFMilitaryChassisTankPMC
    price: 145000
    licence: true

