# Machine organs (BRAIN). A positronic brain is a brain: destroying it kills the chassis through the same
# OrganHealthSystem path a fleshy one uses. It carries no WolfmedBrain, so it runs no oxygenation clock.
- type: entity
  id: WFWolfmedOrganPositronicBrain
  abstract: true
  components:
  - type: WolfmedOrgan
    # Playtest 3: a chassis keeps its core in the torso, where a rifle round reaches it twice as hard as a human
    # heart (two organs share the split, not five) and a heavy blade hits the 5-a-hit cap. At 15 a sabre killed in
    # three hits; at 40 the core fails on the rifle round the human heart does (13) and a sabre needs eight.
    health: 40
    maxHealth: 40
    hitCap: 2.5 # playtest 3: at the global 5 a turret's rifle rounds shut an IPC down on the fifth and killed it on the eighth
  - type: OrganDamage
    hitChance: 0.8
    selectionWeight: 0.75
    damageMultipliers:
      Blunt: 0.115
      Slash: 0.25
      Piercing: 0.42
      Heat: 0.15
      Cold: 0.05
      Shock: 0.3125

# The micro pump is the chassis's heart: destroying it shuts the machine down rather than killing it.
- type: entity
  id: WFWolfmedOrganIpcPump
  abstract: true
  components:
  - type: WolfmedOrgan
    # M4 (plan §8.5): the pump cools the positronic core; under half health it cools at half the rate.
    impairedCoolingFactor: 0.5
    # Playtest 3: sized with the core; the pump fails on the rifle round the human lungs are gone (about 8).
    health: 25
    maxHealth: 25
    hitCap: 2.5 # playtest 3: as the core
  - type: OrganDamage
    hitChance: 0.8
    selectionWeight: 0.64
    damageMultipliers:
      Blunt: 0.1
      Slash: 0.25
      Piercing: 0.4
      Heat: 0.15
      Cold: 0.05
      Shock: 0.3125
