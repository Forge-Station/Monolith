# Prototypes/_NF/Roles/Jobs/Pirates/pdv_denasvar.yml job PDVDenasvar
- type: job
  id: PDVDenasvar
  name: job-name-pdv-denasvar
  description: job-description-pdv-denasvar
  playTimeTracker: JobPDVDenasvar
  requirements:
    - !type:OverallPlaytimeRequirement
      time: 72000 # 20 hours # mono
    - !type:RoleTimeRequirement
      role: JobPirate
      time: 36000 # 10 hours
    - !type:TraitsRequirement # The trait doesn't do anything if you're PDV anyways, but this is 1 step closer to letting it actually give you points
      inverted: true
      traits:
      - Heretic
  startingGear: PDVDenasvarGear
  alwaysUseSpawner: true
  hideConsoleVisibility: true
  canBeAntag: true
  icon: "JobIconPDVDenasvar"
  supervisors: job-supervisors-pdv-denasvar
  weight: 30
  displayWeight: 30
  assignedCompany: PDV
  setPreference: true
  access:
  - Pirate
  - PDVCommand
  - Mercenary
  accessGroups:
  - GeneralAccess
  guides:
  - PDV_Entry
  special:
  - !type:AddComponentSpecial
    components:
    - type: MailDisabled
    - type: SpecialSectorStationRecord
      recordGeneration: FalseRecord
    - type: NpcFactionMember
      factions:
      - PirateNF
    - type: RadioOnCryosleep
      radioChannel: Freelance # freelance = Vanguard
  - !type:AddImplantSpecial
    implants: [ FreelanceTrackingImplant ]
  - !type:AddLanguageSpecial # Monolith - Languages
    languagesSpoken:
    - Freespeak
    languagesUnderstood:
    - Freespeak
  - !type:GiveItemOnHolidaySpecial # Even pirates get a piece of cake.
    holiday: FrontierBirthday
    prototype: FrontierBirthdayGift

