# Здесь сохранены старые стенки, в первую очередь для поддержки нынешних астероидов;
# В скором времени (относительно) они будут удалены, так что не трогать, не использовать, бла-бла-бла;
# Бу-бу, бе-бе.

- type: entity
  parent: BaseWallTierOne
  id: WallIce
  name: ice wall
  categories: [ HideSpawnMenu ]
  components:
  - type: RangedDamageSound
    soundGroups:
      Brute:
        collection: WolfgateBulletImpactIce
  - type: Tag
    tags:
    - Wall
  - type: Sprite
    sprite: Structures/Walls/ice.rsi
  - type: Icon
    sprite: Structures/Walls/ice.rsi
  - type: IconSmooth
    key: walls
    states:
    - !type:CornerSpriteSmoothing
      mask: [ walls, windows, grilles, marble, doors ]
      base: ice

- type: entity
  parent: BaseWallTierOne
  id: WallSandstone
  name: sandstone wall
  categories: [ HideSpawnMenu ]
