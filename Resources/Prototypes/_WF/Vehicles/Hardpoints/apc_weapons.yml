# The guns of the APC, from RMC's APC hardpoint file: the dual cannon is the primary turret, the frontal cannon the
# secondary and the flare launcher a support attachment.

- type: entity
  parent: RMCAPCHardpointBase
  id: RMCAPCFrontCannon
  name: APC frontal cannon
  description: A fixed forward cannon for an APC hardpoint.
  components:
  - type: StaticPrice
    price: 15400
  - type: Sprite
    state: front_cannon
  - type: HardpointItem
    hardpointType: HardpointTypeCannon
    vehicleFamily: HardpointVehicleFamilyAPC
    slotType: HardpointSlotTypeCannon
    damageMultiplier: 0.11
    repairRate: 0.01
  - type: HardpointIntegrity
    maxIntegrity: 350
  - type: VehicleTurret
  - type: GunUseGunOrigin
  - type: GunIgnoreContainerOwnerCollision
  - type: Gun
    projectileSpeed: 53
    recoil: 0
    fireRate: 3.3333333
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot: /Audio/_WF/Vehicles/guns/gun_ml66a_2.ogg
    cameraRecoilScalar: 0
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: BallisticAmmoProvider
    cycleable: false
    proto: VehicleCartridgeAPCFrontalCannon10x50mm
    capacity: 500
  - type: VehicleHardpointAmmo
    magazineSize: 500
    maxStoredMagazines: 1
  - type: GunFireArc
    arc: 180
  - type: RefillableByBulletBox
    bulletType: VehicleAmmoBoxFrontal
  - type: GunMuzzleOffset
    offset: "0.5,-1.7"
    muzzleOffset: "0,0"
    useAimDirection: true
  - type: HardpointVisual
    vehicleState: frontalcannon_0
    damagedVehicleState: frontalcannon_1

- type: entity
  parent: RMCAPCHardpointBase
  id: RMCAPCDualCannon
  name: APC dual cannon
  description: A dual cannon turret for an APC hardpoint.
  components:
  - type: StaticPrice
    price: 21000
  - type: Sprite
    state: dual_cannon
  - type: HardpointItem
    hardpointType: HardpointTypeTurret
    vehicleFamily: HardpointVehicleFamilyAPC
    slotType: HardpointSlotTypeTurret
    damageMultiplier: 0.2
    repairRate: 0.008
  - type: HardpointIntegrity
    maxIntegrity: 500
  - type: VehicleTurret
  - type: GunUseGunOrigin
  - type: GunIgnoreContainerOwnerCollision
  - type: Gun
    projectileSpeed: 53
    recoil: 0
    fireRate: 2
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot: /Audio/_WF/Vehicles/weapons/dual_autocannon_fire.ogg
    cameraRecoilScalar: 0
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: BallisticAmmoProvider
    cycleable: false
    proto: VehicleCartridgeBoyarsDualCannon10x50mm
    capacity: 40
  - type: VehicleHardpointAmmo
    magazineSize: 40
    maxStoredMagazines: 2
  - type: GunFireArc
    arc: 90
  - type: RefillableByBulletBox
    bulletType: VehicleAmmoBoxAceAutocannon
  - type: GunMuzzleOffset
    useDirectionalOffsets: true
    offsetNorth: "0,0"
    offsetEast: "0,0"
    offsetSouth: "-0.3,0.9"
    offsetWest: "0,0"
    muzzleOffset: "0,0"
    useAimDirection: true
  - type: HardpointVisual
    vehicleState: dualcannon_0
    damagedVehicleState: dualcannon_1

- type: entity
  parent: RMCAPCHardpointBase
  id: RMCAPCFlareLauncher
  name: APC flare launcher
  description: A flare launcher hardpoint for APC support slots.
  components:
  - type: StaticPrice
    price: 7000
  - type: Sprite
    state: flare_launcher
  - type: HardpointItem
    hardpointType: HardpointTypeSupportAttachment
    vehicleFamily: HardpointVehicleFamilyAPC
    slotType: HardpointSlotTypeSupportAttachment
    damageMultiplier: 0.1
    repairRate: 0.0125
  - type: HardpointIntegrity
    maxIntegrity: 500
  - type: VehicleTurret
  - type: GunUseGunOrigin
  - type: GunIgnoreContainerOwnerCollision
  - type: Gun
    recoil: 0
    fireRate: 0.5
    projectileSpeed: 20
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot: /Audio/Weapons/Guns/Gunshots/flaregun.ogg
    cameraRecoilScalar: 0
  - type: ShootAtFixedPoint
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: BallisticAmmoProvider
    cycleable: false
    capacity: 10
    whitelist:
      tags:
      - Flare
    proto: WFVehicleCartridgeFlare
  - type: VehicleHardpointAmmo
    magazineSize: 10
    maxStoredMagazines: 3
  - type: GunFireArc
    arc: 360
  - type: RefillableByBulletBox
    bulletType: VehicleAmmoBoxFlareLauncher
  - type: GunMuzzleOffset
    offset: "0,0"
    muzzleOffset: "0,0"
    useAimDirection: true
  - type: HardpointVisual
    vehicleState: flare_launcher_0
    damagedVehicleState: flare_launcher_1
