- type: entity
  id: KiasRelay
  parent: BaseKiasServer
  name: KIAS four channel relay
  components:
  - type: Machine
    board: KiasRelayBoard
  - type: KiasDevice
    role: Relay
  - type: KiasRelay
  - type: SubFloorHide
  - type: Visibility
    layer: 1
  - type: Sprite
    sprite: _Forge/KIAS/Pack/relay.rsi
    color: White
    layers:
    - state: base
      map: ["0"]
- type: entity
  id: KiasPdcRadar
  parent: BaseKiasServer
  name: KIAS point defence radar
  components:
  - type: Transform
    noRot: false
  - type: Rotatable
    rotateWhileAnchored: false
  - type: Machine
    board: KiasPdcRadarBoard
  - type: KiasDevice
    role: PdcRadar
  - type: KiasPdcRadar
  - type: KiasLocalUi
  - type: ActivatableUI
    key: enum.KiasUiKey.Sensor
  - type: UserInterface
    interfaces:
      enum.KiasUiKey.Sensor:
        type: KiasLocalBoundUserInterface
  - type: Sprite
    noRot: false
    snapCardinals: false
    sprite: _Forge/KIAS/Pack/pdc-radar.rsi
    color: White
    layers:
    - state: base
      map: ["0"]
