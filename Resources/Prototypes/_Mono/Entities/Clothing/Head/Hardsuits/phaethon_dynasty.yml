- type: entity
  parent: [ClothingHeadHardsuitBase, ShowMedicalIcons, ShowSecurityIcons]
  id: ClothingHeadHelmetHardsuitTarkhan
  name: "PDV CV-280 'Basilisk' combat hardsuit helmet"
  description: A combat hardsuit helmet designed by the Phaethon Dynasty for Tarkhans. A full gen-4 NVD suite is installed.
  categories: [ HideSpawnMenu ]
  components:
  # WOLFGATE(ArmorBalance): helmet tier rule, T2 0.9 and T3 0.85.
