# Asclepiu: the Underkarst. Wet limestone tunnels lit by glowcaps, dirt chambers with plunge pools, glow-worms and
# spider webs.
# Layers run last to first and the first match wins. Walls only stand on the limestone substrate, so any other
# floor is open ground.

- type: biomeTemplate
  id: WFCavernBiomeAsclepiu
  layers:
  # Substrate and tunnel floor.
  - !type:BiomeTileLayer
    tile: WFCavernFloorLimestone
    threshold: -1
  # Tunnel litter, lowest priority.
  - !type:BiomeEntityLayer
    allowedTiles: [WFCavernFloorLimestone]
    entities: [FloraStalagmite, FloraGreyStalagmite]
    threshold: 0.985
    noise: { seed: 31, noiseType: OpenSimplex2, frequency: 1 }
  # Glowcaps along the tunnels.
  - !type:BiomeEntityLayer
    allowedTiles: [WFCavernFloorLimestone]
    entities: [WFCavernGlowcaps]
    threshold: 0.925
    noise: { seed: 32, noiseType: OpenSimplex2, frequency: 1 }
  # Rock wherever ridged noise is at most the tunnel threshold; the tunnels are the ridges.
  - !type:BiomeMetaLayer
    template: WFCavernRockAsclepiu
    invert: true
    threshold: -0.5
    noise: { seed: 17, noiseType: OpenSimplex2, fractalType: Ridged, octaves: 1, frequency: 0.035 }
  # Chambers on the web.
  - !type:BiomeMetaLayer
    template: WFCavernChamberAsclepiu
    threshold: 0.35
    noise: { seed: 117, noiseType: OpenSimplex2, fractalType: FBm, octaves: 2, frequency: 0.025 }

- type: biomeTemplate
  id: WFCavernRockAsclepiu
  layers:
  - !type:BiomeEntityLayer
    allowedTiles: [WFCavernFloorLimestone]
    entities: [WallRockAndesite]
    threshold: -1
  # Common.
  - !type:BiomeEntityLayer
    allowedTiles: [WFCavernFloorLimestone]
    entities: [WallRockAndesiteCoal, WallRockAndesiteTin]
    threshold: 0.7
    noise: { seed: 201, noiseType: OpenSimplex2, frequency: 0.09 }
  # Uncommon.
  - !type:BiomeEntityLayer
    allowedTiles: [WFCavernFloorLimestone]
    entities: [WallRockAndesiteQuartz, WallRockAndesiteSalt, WallRockAndesiteCopper]
    threshold: 0.8
    noise: { seed: 202, noiseType: OpenSimplex2, frequency: 0.09 }
  # Rare.
  - !type:BiomeEntityLayer
    allowedTiles: [WFCavernFloorLimestone]
    entities: [WallRockAndesiteSilver, WallRockAndesiteGold]
    threshold: 0.88
    noise: { seed: 203, noiseType: OpenSimplex2, frequency: 0.09 }
  # Very rare.
  - !type:BiomeEntityLayer
    allowedTiles: [WFCavernFloorLimestone]
    entities: [WallRockAndesiteArtifactFragment]
    threshold: 0.95
    noise: { seed: 204, noiseType: OpenSimplex2, frequency: 0.2 }
  # Quartz golems wait in the rock.
  - !type:BiomeEntityLayer
    allowedTiles: [WFCavernFloorLimestone]
    entities: [WallRockAndesiteQuartzGolem]
    threshold: 0.97
    noise: { seed: 205, noiseType: OpenSimplex2, frequency: 0.2 }

- type: biomeTemplate
  id: WFCavernChamberAsclepiu
  layers:
  - !type:BiomeTileLayer
    tile: FloorPlanetDirt
    threshold: -1
  - !type:BiomeEntityLayer
    allowedTiles: [FloorPlanetDirt]
    entities: [Cobweb1, Cobweb2]
    threshold: 0.98
    noise: { seed: 301, noiseType: OpenSimplex2, frequency: 1 }
  - !type:BiomeEntityLayer
    allowedTiles: [FloorPlanetDirt]
    entities: [WFCavernGlowworms]
    threshold: 0.97
    noise: { seed: 302, noiseType: OpenSimplex2, frequency: 1 }
  - !type:BiomeEntityLayer
    allowedTiles: [FloorPlanetDirt]
    entities: [WFCavernGlowcaps]
    threshold: 0.95
    noise: { seed: 317, noiseType: OpenSimplex2, frequency: 1 }
  # Web choke points.
  - !type:BiomeEntityLayer
    allowedTiles: [FloorPlanetDirt]
    entities: [SpiderWeb]
    threshold: 0.985
    noise: { seed: 303, noiseType: OpenSimplex2, frequency: 1 }
  - !type:BiomeEntityLayer
    allowedTiles: [FloorPlanetDirt]
    entities: [CrystalGreen, CrystalCyan]
    threshold: 0.99
    noise: { seed: 304, noiseType: OpenSimplex2, frequency: 1 }
  - !type:BiomeEntityLayer
    allowedTiles: [FloorPlanetDirt]
    entities: [WFCavernFaunaAsclepiu]
    threshold: 0.95
    noise: { seed: 37, noiseType: OpenSimplex2, frequency: 3 }
  # Plunge pools.
  - !type:BiomeMetaLayer
    template: WFCavernSignatureAsclepiu
    threshold: 0.45
    noise: { seed: 55, noiseType: OpenSimplex2, frequency: 0.06 }

# The surface's water: its entity on dirt, as Asclepiu's own pools are, not the foam-edged FloorWater tile.
- type: biomeTemplate
  id: WFCavernSignatureAsclepiu
  layers:
  - !type:BiomeTileLayer
    tile: FloorPlanetDirt
    threshold: -1
  - !type:BiomeEntityLayer
    allowedTiles: [FloorPlanetDirt]
    entities: [MonoFloorWaterEntity]
    threshold: -1
