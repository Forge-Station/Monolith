- type: entity
  parent: IDCardStandard
  id: WFAsfEnvoyIDCard
  components:
  - type: Sprite
    sprite: _WF/Asf/Objects/Misc/id_cards.rsi
    layers:
    - state: asfbase
    - state: idasfenvoy
  - type: PresetIdCard
    job: WFAsfEnvoy

- type: entity
  parent: BasePDA
  id: WFAsfEnvoyPDA
  components:
  - type: Pda
    id: WFAsfEnvoyIDCard
  - type: Sprite
    sprite: _WF/Asf/Objects/Devices/pda.rsi
  - type: Icon
    sprite: _WF/Asf/Objects/Devices/pda.rsi
    state: pda-envoy
  - type: Appearance
    appearanceDataInit:
      enum.PdaVisuals.PdaType:
        !type:String
        pda-envoy
  - type: PdaBorderColor
    borderColor: "#7B52B8"
    accentVColor: "#EBC913"

- type: entity
  parent: SpawnPointJobBase
  id: WFAsfSpawnPointEnvoy
  components:
  - type: SpawnPoint
    job_id: WFAsfEnvoy
  - type: Sprite
    sprite: _WF/Asf/Structures/Banners/federation.rsi
    state: asf-federation-banner

