# Prototypes/_WF/Vehicles/Base/base_vehicle.yml entity WFVehicleUnarmedBase
- type: entity
  id: WFVehicleUnarmedBase
  categories: [ WFVehicles ]
  abstract: true
  save: false
  name: abstract vehicle
  description: An abstract vehicle. Make sure to replace this!
  components:
  - type: LagCompensation
  - type: Clickable
  - type: WarpPoint
    follow: true
  # A vehicle outlives its owner's grid: no cleanup, no smashing by an arriving ship, not part of a ship sale or save.
  - type: CleanupImmune
  - type: FTLSmashImmune
  - type: StaticPrice
    price: 20000
  # Driving off an edge with a z-level below, or losing the floor, drops the vehicle to that level (Docs/_WF/Vehicles/falling.md).
  - type: Physics
    bodyType: Dynamic
  - type: Fixtures
    fixtures:
      world:
        shape:
          !type:PhysShapeAabb
          bounds: -0.425,-1.2,0.425,1.2
        density: 1000
        mask:
        - Impassable
        - HighImpassable
        - LowImpassable
        - LargeMobLayer
        - Vehicle
        layer:
        - LargeMobLayer
        - Vehicle
      mob:
        shape:
          !type:PhysShapeAabb
          bounds: -0.425,-1.2,0.425,1.2
        density: 1000
        mask:
        - MidImpassable
        - LargeMobLayer
        layer:
        - LargeMobLayer
  - type: Damageable
    damageContainer: StructuralInorganic
  - type: InteractionOutline
  - type: Sprite
    drawdepth: Mobs
    sprite: _WF/Vehicles/van.rsi
    layers:
    - map: [ base ]
      state: van_base
    - map: [ damaged_frame ]
      state: damaged_frame
      visible: false
    - map: [ rmc-wheels ]
      state: wheels_1
  - type: SpriteMovement
    movementLayers:
      rmc-wheels:
        state: wheels_0
    noMovementLayers:
      rmc-wheels:
        state: wheels_1
  - type: PointLight
    lightMask: ConeSingle
    enabled: false
    radius: 6
    energy: 2.5
    softness: 2
    autoRot: true
    offset: "0,0.9"
  - type: DoAfter
  - type: InputMover
  - type: ItemSlots
  - type: Appearance
