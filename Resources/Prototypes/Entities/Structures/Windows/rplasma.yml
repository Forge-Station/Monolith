- type: entity
  id: ReinforcedPlasmaWindow
  name: reinforced plasma window
  parent: WindowRCDResistant
  components:
  - type: Sprite
    sprite: Structures/Windows/window-plasma-reinf.rsi
  - type: Icon
    sprite: Structures/Windows/window-plasma-reinf.rsi
    state: full
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: RGlass
  - type: RadiationBlocker
    resistance: 4
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1500 # Mono
      behaviors: #excess damage, don't spawn entities.
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: WindowShatter
    - trigger:
        !type:DamageTrigger
        damage: 750 # Mono 150->750
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WindowShatter
      - !type:SpawnEntitiesBehavior
        spawn:
          ShardGlassPlasma:
            min: 1
            max: 2
          PartRodMetal:
            min: 1
            max: 2
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: IconSmooth
    key: windows-plasma-reinf
    states:
    - !type:CardinalCornerSpriteSmoothing
      mask: [ windows-plasma-reinf ]
      altMask:
      - windows
      - windows-reinf
      - windows-tinted
      - windows-plasma
      - windows-uranium
      - windows-uranium-reinf
      - windows-exo
      - windows-shuttle
      - windows-plastitanium
      - windows-regal
      - walls-exo
      - walls-shuttle
      - walls-plastitanium
      - walls-material
      - walls-marble
      - walls
      - grilles
      - doors
      base: window
  - type: Construction
    graph: Window
    node: reinforcedPlasmaWindow
  - type: Appearance
  - type: DamageVisuals
    thresholds: [5, 10, 20]
    damageDivisor: 6
    trackAllDamage: true
    damageOverlay:
      sprite: Structures/Windows/cracks.rsi
  - type: DeltaPressure
    minPressure: 150000
    minPressureDelta: 100000
    scalingType: Linear
    scalingPower: 0.0001
  - type: StaticPrice
    price: 65
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        mask:
        - FullTileMask
        layer:
        - WallLayer
        density: 2000
  - type: HitscanDiffractTarget # Mono - Causes diffraction
  - type: ShipRepairable
    repairTime: 6
    repairCost: 6

- type: entity
  id: PlasmaReinforcedWindowDirectional
  parent: WindowDirectionalRCDResistant
  name: directional reinforced plasma window
  description: Don't smudge up the glass down there.
  placement:
    mode: SnapgridCenter
    snap:
    - Window
  components:
  - type: Sprite
    sprite: Structures/Windows/directional.rsi
    state: plasma_reinforced_window
  - type: Icon
    sprite: Structures/Windows/directional.rsi
    state: plasma_reinforced_window
  - type: Construction
    graph: WindowDirectional
    node: plasmaReinforcedWindowDirectional
  - type: Appearance
  - type: DamageVisuals
    thresholds: [5, 10, 20]
    damageDivisor: 3
    trackAllDamage: true
    damageOverlay:
      sprite: Structures/Windows/cracks_directional.rsi
  - type: RadiationBlocker
    resistance: 2
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 700 # Mono
      behaviors: #excess damage, don't spawn entities.
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 350 # Mono
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WindowShatter
      - !type:SpawnEntitiesBehavior
        spawn:
          ShardGlassPlasma:
            min: 1
            max: 1
          PartRodMetal:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: DeltaPressure
    minPressure: 37500
    minPressureDelta: 25000
    scalingType: Threshold
  - type: StaticPrice
    price: 30
  - type: HitscanDiffractTarget # Mono - Causes diffraction
  - type: ShipRepairable
    repairTime: 4
    repairCost: 4

- type: entity
  parent: ReinforcedPlasmaWindow
  id: ReinforcedPlasmaWindowDiagonal
  suffix: diagonal
  placement:
    mode: SnapgridCenter
    snap:
    - Window
  components:
  - type: Sprite
    drawdepth: WallTops
    sprite: Structures/Windows/window-diagonal-plasma-reinf.rsi
  - type: Tag
    tags:
    - Diagonal
    - Window
  - type: IconSmooth
    states:
    - !type:DiagonalSpriteSmoothing
      mask:
      - walls
      - windows
      - grilles
      - marble
      - doors
      base: state
  - type: Icon
    sprite: Structures/Windows/window-diagonal-plasma-reinf.rsi
    state: state0
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PolygonShape
          vertices:
          - "-0.5,-0.5"
          - "0.5,0.5"
          - "0.5,-0.5"
        mask:
        - FullTileMask
        layer:
        - DiagonalGlassLayer # Mono GlassLayer->DiagonalGlassLayer
        density: 2000
  - type: Airtight
    noAirWhenFullyAirBlocked: false
    airBlockedDirection:
    - South
    - East
  - type: DamageVisuals
    damageOverlay:
      sprite: Structures/Windows/cracks-diagonal.rsi
  - type: Construction
    graph: WindowDiagonal
    node: reinforcedPlasmaWindowDiagonal
  - type: HitscanDiffractTarget # Mono - Causes diffraction
