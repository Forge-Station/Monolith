# M1a: what each consciousness cause says to the patient (plan §5.1-5.2). The id is the WolfmedCause enum
# name. `help` is the Downed form, `helpOut` the Critical one; the `Blocked` forms are shown while something
# else also holds the body, so no text promises waking or standing while it cannot be true.

- type: wolfmedConsciousnessCause
  id: Pain
  alertDowned: WFWolfmedDownedPain
  alertDownedMechanical: WFWolfmedDownedFrame
  blockerName: wolfmed-cause-pain
  symptom: wolfmed-cause-pain-symptom
  help: wolfmed-cause-pain-help
  helpMechanical: wolfmed-cause-pain-help-mechanical
  down: wolfmed-cause-pain-down
  wake: wolfmed-cause-pain-wake
  stand: wolfmed-cause-pain-stand
  syntheticHudLine: wolfmed-synthetic-cause-pain

- type: wolfmedConsciousnessCause
  id: PainFaint
  alertOut: WFWolfmedFaintPain
  blockerName: wolfmed-cause-pain-faint
  titleOut: wolfmed-cause-pain-faint-title
  symptom: wolfmed-cause-pain-faint-symptom
  helpOut: wolfmed-cause-pain-faint-help
  helpOutBlocked: wolfmed-cause-pain-faint-help-blocked
  helpOutTimed: wolfmed-cause-pain-faint-help-timed # M3: was hard-coded in the condition alert system
  out: wolfmed-cause-pain-faint-out
  cardColour: "#e3a33c" # playtest 3: amber, a timed faint

