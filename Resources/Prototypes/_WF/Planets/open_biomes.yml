# Planet-specific open terrain. Existing art, ore tables and biome layers; no upstream recipe changes.
# Entity layers resolve from bottom to top: hazards/scenery win over wildlife, so animals spawn in clearings.
# Low-frequency rock masks form occasional outcrops instead of a continuous wall field.

- type: biomeTemplate
  id: WFOpenBasalt
  layers:
  - !type:BiomeTileLayer
    tile: FloorBasalt
    threshold: -1
  - !type:BiomeEntityLayer
    allowedTiles: [FloorBasalt]
    entities: [WFFaunaFervidus]
    threshold: 0.95
    noise: { seed: 37, noiseType: OpenSimplex2, frequency: 3 }
  - !type:BiomeEntityLayer
    allowedTiles: [FloorBasalt]
    entities: [BasaltOne, BasaltTwo, BasaltThree]
    threshold: 0.97
    noise: { seed: 2, noiseType: OpenSimplex2, frequency: 1 }
  - !type:BiomeEntityLayer
    allowedTiles: [FloorBasalt]
    entities: [MonoPlanetmapOreBasalt]
    threshold: 0.65
    noise: { seed: 11, noiseType: OpenSimplex2, frequency: 0.022 }
  - !type:BiomeEntityLayer
    allowedTiles: [FloorBasalt]
    entities: [FloorLavaEntity]
    threshold: 0.94
    noise: { seed: 3, noiseType: OpenSimplex2, frequency: 0.008, fractalType: Ridged, octaves: 1 }

