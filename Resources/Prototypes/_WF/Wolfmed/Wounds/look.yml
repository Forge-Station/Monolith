# LOOK: what each wound looks like to somebody standing in front of the patient. The health examine reads
# nothing else, so a wound with no entry here is invisible and WolfmedVisualInspectionTest fails.
#
# visibility: None    nothing to see; the analyzer still reports it. selfHint is what the patient notices.
#             Skin    on bare skin or bare plating; anything worn over the part hides it.
#             Clothed gross enough to show through clothing: deformity, a stump, sparks, a leak.
# distant:    carries across a room. Everything else needs the examiner within examine detail range.
#
# LOOK2: the examine draws rows, so every description also needs a `label`: the two-to-four words that go on
# the row, with the description itself as the tooltip. `hintLabel` does the same for a selfHint. `icon` and
# `colour` override the wound's analyzer category, which is what a finding draws with otherwise; only name
# them where the category glyph would mislead, or the examine stops matching the analyzer.
#
# Stage keys are the wound prototype's own stage ids. A severity below the lowest stage falls back to the
# wound-level fields, which is why every wound that is invisible while slight declares `visibility: None`
# at the top and names only the stages that show.

- type: wolfmedLookProfile
  id: WFWolfmedLookDefault
  # Slot defaults for clothing with no armour `coverage:`. An armour that declares coverage uses its own.
  coverage:
  - slots: [ INNERCLOTHING ]
    parts: [ Torso, Arm, Leg ]
  - slots: [ OUTERCLOTHING ]
    parts: [ Torso, Arm ]
  - slots: [ GLOVES ]
    parts: [ Hand ]
  - slots: [ FEET ]
    parts: [ Foot ]
  - slots: [ HEAD ]
    parts: [ Head ]
  # Rates are severity * the stage's rate * wolfmed.bleed_rate, so a fresh minor cut runs at about 0.3, a
  # deep one at 1.35 and a cut artery at 4.5. The gore system calls 0.45 a major bleed; flowing sits just
  # above. Every band was halved with wolfmed.bleed_rate 0.6 -> 0.3 (playtest 1), so the words still match
  # the wounds.
  bleedOozing: 0.025
  bleedFlowing: 0.5
  bleedSpurting: 2.5
  soakThrough: 0.5
  distantBleed: 1.5
  sepsisVisibleAt: 40
  # LOOK2: the glyph and colour of every finding the inspection builds itself rather than reading off a
  # wound. Keys are WolfmedLookClasses; icons are states in analyzer_icons.rsi.
  classes:
    bleed: { icon: bleeding, colour: bleeding }
    soak: { icon: bleeding, colour: bleeding }
    treatment: { icon: dressing, colour: clotting }
    splint: { icon: splint, colour: fracture }
    tourniquet: { icon: tourniquet, colour: bleeding }
    infection: { icon: infection, colour: infection }
    scars: { icon: scar, colour: scar }
    numb: { icon: impaired, colour: impaired }
    pain: { icon: pain, colour: pain }
  # LOOK2: worst first. A part's row marker takes the first of these that any finding on it carries, so a
  # leg that is splinted, bruised and bleeding still reads as bleeding.
  accentPriority:
  - necrosis
  - bleeding
  - fracture
  - burn
  - ballistic
  - cut
  - puncture
  - embedded
  - infection
  - mechanical
  - overheating
  - internal
  - blunt
  - impaired
  - clotting
  - pain
  - scar
  - other

