# What stands on the roads of the worlds that have them built properly. RMC's civilian vehicles are drawn from the
# side only, so the sound ones go on roads running east to west, where they sit along a lane; wrecks go on any road,
# slewed across a lane where it runs north to south. The army vehicles of road_props.yml are drawn from every side and
# point along any road. Vehicles stand in the lane against the kerb; a wreck across a road takes the outer two.
# `per100` is per hundred tiles of straight road; pieces that block are kept apart, so a road is never shut.

# Asclepiu: a lived-in colony, a little run down.
- type: wfRoadDressing
  id: WFRoadDressingAsclepiu
  kerbs:
    North: RMCPlanetHybrisaSidewalkNorth
    South: RMCPlanetHybrisaSidewalkSouth
    East: RMCPlanetHybrisaSidewalkEast
    West: RMCPlanetHybrisaSidewalkWest
    NorthEast: RMCPlanetHybrisaSidewalkNorthEast
    NorthWest: RMCPlanetHybrisaSidewalkNorthWest
    SouthEast: RMCPlanetHybrisaSidewalkSouthEast
    SouthWest: RMCPlanetHybrisaSidewalkSouthWest
    InnerNorthEast: RMCPlanetHybrisaSidewalkCornerNorthEast
    InnerNorthWest: RMCPlanetHybrisaSidewalkCornerNorthWest
    InnerSouthEast: RMCPlanetHybrisaSidewalkCornerSouthEast
    InnerSouthWest: RMCPlanetHybrisaSidewalkCornerSouthWest
  lineNorthSouth: RMCDecalHybrisaZM2
  lineEastWest: RMCDecalHybrisaZM1
  lineEvery: 2
  light: RMCStreetlight
  brokenLight: RMCStreetlightBroken
  brokenLightChance: 0.12
  lightSpacing: 12
  junctionLight: RMCTrafficLight
  scatter:
  # Parked cars.
  - prototypes: [ RMCPropVehicleMonoSupronBlack, RMCPropVehicleMonoSupronBlackFlipped,
      RMCPropVehicleMonoSupronBlue, RMCPropVehicleMonoSupronBlueFlipped, RMCPropVehicleMonoSupronBrown,
      RMCPropVehicleMonoSupronBrownFlipped, RMCPropVehicleMonoSupronDesatBlue,
      RMCPropVehicleMonoSupronDesatBlueFlipped, RMCPropVehicleMonoSupronGreen,
      RMCPropVehicleMonoSupronGreenFlipped, RMCPropVehicleMonoSupronLightBlue,
      RMCPropVehicleMonoSupronLightBlueFlipped, RMCPropVehicleMonoSupronOrange,
      RMCPropVehicleMonoSupronOrangeFlipped, RMCPropVehicleMonoSupronPink,
      RMCPropVehicleMonoSupronPinkFlipped, RMCPropVehicleMonoSupronPurple,
      RMCPropVehicleMonoSupronPurpleFlipped, RMCPropVehicleMonoSupronRed,
      RMCPropVehicleMonoSupronRedFlipped, RMCPropVehicleMonoSupronTaxi,
      RMCPropVehicleMonoSupronTaxiFlipped, RMCPropVehicleMonoSupronTurquoise,
      RMCPropVehicleMonoSupronTurquoiseFlipped ]
    where: Kerb
    axis: EastWest
    per100: 1.6
  - prototypes: [ RMCPropVehicleAmbulance, RMCPropVehicleAmbulanceF, RMCPropVehicleBoxVanBlueGrey,
      RMCPropVehicleBoxVanBlueGreyF, RMCPropVehicleBoxVanWhite, RMCPropVehicleBoxVanWhiteF,
      RMCPropVehicleBoxVanPizza, RMCPropVehicleBoxVanPizzaF, RMCPropVehicleSmallTruckBlue,
      RMCPropVehicleSmallTruckBlueF, RMCPropVehicleSmallTruckGarbage, RMCPropVehicleSmallTruckGarbageF,
      RMCPropVehicleSmallTruckGreen, RMCPropVehicleSmallTruckGreenF ]
    where: Kerb
    axis: EastWest
    per100: 0.6
  - prototypes: [ RMCPropVehicleTruck, RMCPropVehicleTruckCargo, RMCPropVehicleVan, RMCPropVehicleVanCandy,
      RMCPropVehicleTractor ]
    where: Kerb
    axis: EastWest
    align: true
    per100: 0.8
  # An army patrol, now and then.
  - prototypes: [ WFRoadPropArmyTruck, WFRoadPropArmyTruckAlt, WFRoadPropHumvee ]
    where: Kerb
    align: true
    per100: 0.5
  # Wrecks.
  - prototypes: [ RMCPropVehicleMonoSupronBlackDamaged1, RMCPropVehicleMonoSupronBlackDamaged1Flipped,
      RMCPropVehicleMonoSupronBlackDamaged3, RMCPropVehicleMonoSupronBlackDamaged3Flipped,
      RMCPropVehicleMonoSupronBlackDamaged5, RMCPropVehicleMonoSupronBlackDamaged5Flipped,
      RMCPropVehicleMonoSupronBlackDestroyed, RMCPropVehicleMonoSupronBlackDestroyedFlipped,
