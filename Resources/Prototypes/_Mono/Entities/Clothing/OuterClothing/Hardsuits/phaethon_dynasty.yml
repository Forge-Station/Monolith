- type: entity
  parent: [ ClothingOuterHardsuitBase, BaseFactionGearPDVT2 ]
  id: ClothingOuterHardsuitPirateScaf
  name: PDV SCAF hardsuit
  description: An old SCAF suit painted in a PDV tan color scheme. The armor feels degraded, but lighter. # WOLFGATE(ArmorBalance): grammar pass.
  components:
  # WOLFGATE(ArmorSpecialization): ablative coat.
  - type: WFAblativeCoat
  - type: Sprite
    sprite: _Mono/Clothing/OuterClothing/Hardsuits/scaf_pirate.rsi
  - type: Item
    size: Huge
  - type: Clothing
    sprite: _Mono/Clothing/OuterClothing/Hardsuits/scaf_pirate.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.05
    lowPressureMultiplier: 1000
  - type: ExplosionResistance
    damageCoefficient: 0.45
  - type: Armor
    modifiers:
      coefficients:
        # WOLFGATE(ArmorBalance): sidegrade pass.
        Blunt: 0.7
        Slash: 0.7
        Piercing: 0.65
        Heat: 0.45
        Radiation: 0.5
        Caustic: 0.9
  - type: StaminaDamageResistance # Mono - Stamres
    coefficient: 0.3
  - type: ClothingSpeedModifier
    walkModifier: 0.95
    sprintModifier: 0.95
  - type: HeldSpeedModifier
  - type: ToggleableClothing # Goobstation - Modsuits change - Mono - this is a solution for helmet attachment/cover to not fit on hardsuits
    requiredSlot: outerclothing
    blockUnequipWhenAttached: false
    replaceCurrentClothing: true
    clothingPrototypes:
      head: ClothingHeadHelmetHardsuitPirateScaf
      helmetcover: ClothingHeadHelmetCoverBlock
      helmetattachment: ClothingHeadHelmetAttachmentBlock
  - type: StaticPrice
    price: 750
    vendPrice: 2500
  - type: Tag  # Mono
    tags:
    - RogueHardsuit

- type: entity
