# Limb entities live in Body/Parts/skrell.yml (RMC sprites, same body the round-start skrell uses).
# This abstract parent is the Wega extract: skrell blood and fat when a part is juiced.
- type: entity
  id: PartSkrell
  parent: [BaseItem, BasePart]
  name: "skrell body part"
  abstract: true
  components:
  - type: Icon
    sprite: _Wega/Mobs/Species/Skrell/parts.rsi
  - type: BodyPart
    species: Skrell
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 3
      - ReagentId: SkrellBlood
        Quantity: 10
