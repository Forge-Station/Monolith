# A camp's fire: its glow carries down the tunnels and its crackle is heard well before the camp is in sight.
- type: entity
  parent: Bonfire
  id: WFCavernCampfire
  components:
  - type: PointLight
    radius: 8
    energy: 3
    color: "#FFC90C"
  - type: WFBonfireFuel
    infinite: true
  - type: WFCavernTelegraph
    sound:
      collection: WFCavernEncounterCampFire
    minInterval: 13
    maxInterval: 15
    volume: -2
