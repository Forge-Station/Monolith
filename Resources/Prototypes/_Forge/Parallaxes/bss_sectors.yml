# Unique per-sector skyboxes. Each uses its own BG/nebula (and belt planets),
# so jumping the gate should actually look like a different patch of space.
- type: parallax
  id: BssParallaxNt
  layers:
    - texture:
        !type:ImageParallaxTextureSource
        path: "/Textures/Forge/Parallax/BssNtBG.png"
      slowness: 0.998046875
      scale: "1, 1"
    - texture:
        !type:GeneratedParallaxTextureSource
        id: "bss_nt_stars"
        configPath: "/Prototypes/Parallaxes/parallax_config_stars.toml"
      slowness: 0.996625
    - texture:
        !type:GeneratedParallaxTextureSource
        id: "bss_nt_stars_dim"
        configPath: "/Prototypes/Parallaxes/parallax_config_stars_dim.toml"
      slowness: 0.989375
    - texture:
        !type:ImageParallaxTextureSource
        path: "/Textures/Forge/Parallax/BssNtNeb.png"
      slowness: 0.978
      scale: "1, 1"
    - texture:
        !type:GeneratedParallaxTextureSource
        id: "bss_nt_stars_fast"
        configPath: "/Prototypes/Parallaxes/parallax_config_stars-2.toml"
      slowness: 0.957265625
    - texture:
        !type:ImageParallaxTextureSource
        path: "/Textures/Forge/Parallax/BssNtDebris.png"
      slowness: 0.977
      scale: "1, 1"
      scrolling: "0.008, 0.004"
  layersLQ:
    - texture:
        !type:GeneratedParallaxTextureSource
        id: ""
        configPath: "/Prototypes/Parallaxes/parallax_config.toml"
      slowness: 0.875
  layersLQUseHQ: false

