- type: entity
  id: CrewMonitoringRenegadeServer
  parent: CrewMonitoringServer
  name: сервер мониторинга ВКР # crew renegade monitoring server
  description: Получает и отправляет статус всех датчиков имплантов состава ВКР # Receives and relays the status of all active renegade implant sensors.
  components:
    - type: Sprite
      sprite: Structures/Machines/server.rsi
      layers:
        - state: server
        - state: variant-crew
    - type: DeviceNetwork
      deviceNetId: Wireless
      transmitFrequencyId: CrewRenegadeMonitor
      receiveFrequencyId: SuitRenegadeSensor
      autoConnect: false

