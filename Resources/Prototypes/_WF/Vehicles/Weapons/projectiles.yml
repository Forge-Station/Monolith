## Cannon shells

- type: entity
  parent: VehicleCartridgeCannonBase
  id: VehicleCartridgeLTBCannon
  name: cartridge (LTB cannon)
  categories: [ HideSpawnMenu ]
  components:
  - type: CartridgeAmmo
    proto: RMCProjectileLTBCannon
    muzzleFlash: MuzzleFlashEffectVehicleOverLarge

# Goes off where it is aimed, or on the first hard thing it hits (not on another bullet's non-hard fly-by sensor). The blast has
# RMC's intensity numbers and its explosion type (Weapons/explosions.yml), with RMC's damage per intensity.
- type: entity
  parent: BaseBulletTrigger
  id: RMCProjectileLTBCannon
  name: LTB cannon shell
  categories: [ HideSpawnMenu, WFVehicles ]
  components:
  - type: WFImpactRicochet
    sound:
      collection: WFRcsmShellRicochet
      params:
        volume: 2
        maxDistance: 24
    chance: 0.45
  - type: Sprite
    sprite: _WF/Vehicles/Projectiles/projectiles.rsi
    scale: "1.2, 1.2"
    layers:
    - state: ltb
      shader: unshaded
  - type: TriggerOnCollide
    fixtureID: projectile
  - type: Projectile
    impactEffect: BulletImpactEffect
    damage:
      types:
        Blunt: 12
        Piercing: 8
  - type: IgnorePredictionHide
  - type: VehicleDamageMultiplier
    multiplier: 10
  - type: TriggerOnFixedDistanceStop
    delay: 0
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: RMCLTBCannon
    maxIntensity: 40
    intensitySlope: 18
    totalIntensity: 650
    tileBreakScale: 4
    maxTileBreak: 12
  - type: PointLight
    radius: 3.5
    color: orange
    energy: 0.5

