
- type: entity
  abstract: true
  parent: [BaseItem, RecyclableItemCardboard]
  id: BaseAmmoBoxHEV
  components:
  - type: Item
    size: Small
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Guns/Ammunition/Boxes/700Thz.rsi
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: false
  - type: Appearance
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_Goobstation/Items/handling/ammobox_pickup.ogg
  - type: EmitSoundOnDrop
    sound:
      path: /Audio/_Goobstation/Items/handling/ammobox_drop.ogg
  - type: EmitSoundOnLand
    sound:
      path: /Audio/_Goobstation/Items/handling/ammobox_drop.ogg

- type: entity
  parent: BaseAmmoBoxHEV
  id: AmmoBoxHEVRifle
  name: ammunition box (AE-AR energy)
  components:
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
      - CartridgeHEVRifle
    proto: CartridgeHEVRifle
    capacity: 50
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
      color: "#ffd988"
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]

