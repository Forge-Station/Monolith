# All the Harpy customization

# Ears Markings
- type: marking
  id: HarpyWingDefaultHuescale
  bodyPart: RArmExtension # Frontier: RArm<RArmExtension
  markingCategory: Arms
  speciesRestriction: [Harpy]
  coloring:
    default:
      type:
        !type:CategoryColoring
          category: Hair
      fallbackTypes:
        - !type:SimpleColoring
