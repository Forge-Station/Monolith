  name: remnant assault cyborg spawner
  suffix: Forge, Mapping, AI, Assault
  components:
  - type: Sprite
    layers:
    - state: red
    - state: ai
    - sprite: Mobs/Silicon/chassis.rsi
      state: synd_sec
  - type: ConditionalSpawner
    prototypes:
    - MobForerunnerBorgAssault

- type: entity
  parent: ForgeMappingSpawnerBase
