- type: entity
  abstract: true
  parent: BaseWall
  id: BaseWallTierFive
  name: hyper super ultra giga reinforced wall
  description: Keeps the air in and the chimera out.
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StructuralMetallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 7100
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalSlam
    - trigger:
        !type:DamageTrigger
        damage: 7000
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalSlam
      - !type:ChangeConstructionNodeBehavior
        node: girder
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: StaticPrice
    price: 75
  - type: ArmorThickness
    thickness: 15
  - type: ShipRepairable
    repairTime: 10
    repairCost: 12
  - type: Tag
    tags:
    - Wall
    - WallT4
  - type: RadiationBlocker
    resistance: 5

- type: entity
  parent: BaseWallTierOne
  id: WallResin
  name: resin wall
  description: Weird slime solidified into a wall.
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Xenos/xeno_resin_wall.rsi
  - type: Icon
    sprite: _RMC14/Structures/Xenos/xeno_resin_wall.rsi
    state: resin
  - type: IconSmooth
    key: walls
    base: resin

- type: entity
  parent: BaseWallTierTwo
  id: WallResinThick
  name: thick resin wall
  description: Weird slime solidified into a thick wall.
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Xenos/xeno_resin_wall.rsi
  - type: Icon
    sprite: _RMC14/Structures/Xenos/xeno_resin_wall.rsi
    state: thickresin
  - type: IconSmooth
    key: walls
    base: thickresin
