# Colonial Liason Forms
# Sources: https://discord.com/channels/1123826877245694004/1182366744266932224/1182366744266932224
#          https://docs.google.com/document/d/1jDX9numj-VHKBJ2FiiEo1GIlHESffOUIHIIXaqhEnls/edit?pli=1#heading=h.ru93r8n0fb7m
# These forms should be kept up-to-date with changes to Space Law.

# Filled Folder
- type: entity
  id: BoxFolderSr
  parent: BoxFolderBase
  name: SR folder
  description: A folder filled with paperwork templates.
  suffix: Forms
  components:
  - type: Sprite
    layers:
    - state: folder-colormap
      color: "#1f6626ff"
    - state: folder-base
  - type: StorageFill
    contents:
    - id: PaperWrittenFrontierEmployment
    - id: PaperWrittenFrontierEmployeePayHistory
    - id: PaperWrittenFrontierFundRequisition
    - id: PaperWrittenFrontierShuttleTitleChange
    - id: PaperWrittenFrontierAuthorization
    - id: PaperWrittenFrontierShuttleDerelict
    - id: PaperWrittenFrontierContrabandAmnesty
    - id: PaperWrittenFrontierContrabandTurnover
    - id: PaperWrittenFrontierContrabandPermit
    - id: Paper
      prob: 0.5
    - id: Paper
      prob: 0.5

