- type: entity
  parent: BaseComputer
  id: ComputerCompanyDoorAccess
  name: company door access console
  description: Configure airlock access for the company that owns this grid.
  components:
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: id
    - map: ["computerLayerKeys"]
      state: id_key
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: generic_panel_open
  - type: CompanyDoorAccessConsole
  - type: ActivatableUI
    key: enum.CompanyDoorAccessConsoleUiKey.Key
  - type: UserInterface
    interfaces:
      enum.CompanyDoorAccessConsoleUiKey.Key:
        type: CompanyDoorAccessConsoleBoundUserInterface
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
  - type: Computer
    board: CompanyDoorAccessComputerCircuitboard
  - type: PointLight
    radius: 1.5
    energy: 1.6
    color: "#8db9ff"

- type: entity
  parent: BaseComputerCircuitboard
  id: CompanyDoorAccessComputerCircuitboard
  name: company door access computer board
  description: A computer printed circuit board for a company door access console.
  components:
  - type: Sprite
    state: cpu_command
  - type: ComputerBoard
    prototype: ComputerCompanyDoorAccess
  - type: Tag
    tags:
    - DroneUsable
