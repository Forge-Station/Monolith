# Colonial Marines xenomorphs.
# CM stats. Hostile AI uses the combat abilities; they are not ghost roles.

- type: entity
  parent: MobXeno
  id: MobXenoCMBase
  abstract: true
  suffix: Forge, CM, AI
  components:
  - type: ForgeXeno
  - type: LayingDown

- type: entity
  parent: MobXenoCMBase
  id: MobXenoCMLarva
  name: xenomorph larva
  description: A squirming chestburster. Small, fast, and already angry.
  components:
  - type: Sprite
    sprite: _CM/Mobs/Xenonids/larva.rsi
    offset: 0,0.1
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: alive
  - type: MobThresholds
    thresholds:
      0: Alive
      80: Critical
      100: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 3.5
    baseSprintSpeed: 6
  - type: MeleeWeapon
    damage:
      groups:
        Brute: 12
    attackRate: 1.4
  - type: ForgeXenoPlasma
    plasma: 0
    maxPlasma: 0
    regen: 0
    regenOnWeeds: 0
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.2
        density: 80
        mask:
        - MobMask
        layer:
        - MobLayer

