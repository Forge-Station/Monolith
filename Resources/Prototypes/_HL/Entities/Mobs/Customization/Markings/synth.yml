# Tails

- type: marking
  id: SynthTail
  bodyPart: Tail
  markingCategory: Tail
  speciesRestriction: [ Synth ]
  layering: # WOLFGATE - the south frame draws behind the body, so the tail never covers anatomy
    factory_BEHIND: TailBehind
  colorLinks: # WOLFGATE - both halves of a tail share one colour
    factory_BEHIND: factory_FRONT
  sprites:
  - sprite: _WF/Mobs/Customization/TailSplit/_HL/Mobs/Customization/Synth/tail.rsi # WOLFGATE - split art
