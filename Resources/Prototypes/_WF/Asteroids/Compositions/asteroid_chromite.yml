# What each kind of asteroid holds. Every unit of rock mass is one vein of the picked ore, so yields follow the ore
# prototypes that vein rocks use. Ore weights and the inert share start from each kind's soft mineral table
# (Resources/Prototypes/_NF/Entities/Markers/Spawners/Random/Salvage/minerals.yml), tilted towards iron and coal, which
# steel and plasteel need, at the expense of malachite, quartz and salt; each kind keeps its signature ores. Lithium,
# the economy's main tuning knob, keeps its share and comes mostly from chromite as before. Volatility feeds the
# overcharge blast.

# Chromite (NFChromiteMineralSoft): tough, the lithium and uranium source, about 56% plain chromite.
- type: wfAsteroidComposition
  id: WFAsteroidChromite
  minInert: 0.46
  maxInert: 0.66
  minResistance: 0.2
  maxResistance: 0.45
  minInstability: 0.1
  maxInstability: 0.4
  ores:
  - ore: LithiumOre
    weight: 9
    color: "#f2a8d8"
  - ore: NFOreUranium
    weight: 9
    color: "#5fe04a"
    volatility: 0.3
  - ore: NFOreSalt
    weight: 2.5
    color: "#f4f1ea"
  - ore: NFOrePlasma
    weight: 4
    color: "#b04cff"
    volatility: 1
  - ore: NFOreSteel
    weight: 5
    color: "#c98a6b"
  - ore: NFOreBananium
    weight: 1
    color: "#ffe94a"
  - ore: NFOreCoal
    weight: 3
    color: "#5a5652"
  - ore: NFOreSpaceQuartz
    weight: 1
    color: "#e6f2ff"
  - ore: NFOreGold
    weight: 1
    color: "#ffd040"
  - ore: NFOreSilver
    weight: 1
    color: "#d8dde3"
  - ore: CopperOre
    weight: 0.5
    color: "#3fb58a"
  - ore: OreArtifactFragment
    weight: 1
    color: "#c88cff"
  - ore: OreDiamond
    weight: 0.5
