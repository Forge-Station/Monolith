# TSFMC M82c hardsuit
- type: entity
  parent: [ClothingHeadHardsuitBaseMilitary, ClothingNightVision2TSFMC]
  id: ClothingHeadHelmetHardsuitTSFMCM82c
  name: TSFMC M82c helmet
  description: A hardsuit helmet issued to the TSF military forces. Outfitted with a basic NVG system.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Forge/Clothing/Head/Hardsuits/tsf_kalenval.rsi
  - type: Clothing
    sprite: _Forge/Clothing/Head/Hardsuits/tsf_kalenval.rsi
    equippedState: off-equipped-HELMET
  - type: PressureProtection
    highPressureMultiplier: 0.08
    lowPressureMultiplier: 1000
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.95
        Slash: 0.95
        Piercing: 0.95
        Heat: 0.95
  - type: HideLayerClothing
    slots:
    - Hair
    - Snout
    - HeadTop
    - HeadSide

