# Bulk orders: an open station wants a hold's worth over a long window, at a small premium and a flat price that ignores
# its shelf, so the last pays what the first did. The count paces how much that adds to the faucet. Luxuries and fuel stay out: their prices are too high for an order this size.
- type: wfTradeRush
  id: WFTradeBulkMedical
  group: Medical
  goods: wf-trade-goods-medical
  bulk: true
  chutes: [ CargoChuteTradeMall, CargoChuteDepot, CargoChuteDepotAlt, CargoChuteBaikal, CargoChuteTSFMC, CargoChuteZvezda ]
  count: 25,45
  minutes: 45,60
  minFactor: 1.15
  maxFactor: 1.25
  weight: 3

