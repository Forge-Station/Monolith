- type: entity
  parent: Clothing
  id: PortableRecharger
  name: portable recharger
  description: A high-tech recharger adapted for portability equipped with an inbuilt microreactor. # Mono
  components:
  - type: Item
    size: Huge # Mono Revert
  - type: Sprite
    sprite: Objects/Power/portable_recharger.rsi
    layers:
    - map: ["enum.PowerChargerVisualLayers.Base"]
      state: charging
    - map: ["enum.PowerChargerVisualLayers.Light"]
      state: charging-unlit
      shader: unshaded
  - type: Clothing
    equippedPrefix: charging
    quickEquip: false
    slots:
    - back
    - Belt # Mono
    - SuitStorage # Mono
  - type: Charger
    chargeRate: 150 # Frontier: chargeRate: 50 Mono
    slotId: charger_slot
    portable: true
  - type: PowerChargerVisuals
  - type: ApcPowerReceiver
    needsPower: false
    powerLoad: 0 # Mono Revert
  - type: StaticPrice
    price: 500
  - type: Tag
    tags: [] # ignore "WhitelistChameleon" tag
  - type: ContainerContainer
    containers:
      charger_slot: !type:ContainerSlot
  - type: ItemSlots
    slots:
      charger_slot:
        ejectOnInteract: false # Mono
        ejectOnUse: true # Mono
        whitelist:
          components:
          - BatteryAmmoProvider
