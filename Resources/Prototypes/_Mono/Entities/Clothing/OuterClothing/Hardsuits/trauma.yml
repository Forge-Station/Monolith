- type: entity
  parent: [ForgeClothingOuterHardsuitBase, BaseFactionGearOtherFactionT1, ClothingFlightProfileEasy] # Forge-change parent BaseFactionGearOtherFactionT1, add ForgeClothingOuterHardsuitBase, add ClothingFlightProfileEasy
  id: ClothingOuterHardsuitTrauma
  name: armed trauma unit T-23 tacsuit
  suffix: TTI # Forge
  description: The standard combat suit for the Armed Trauma Unit. It has an integrated limited-range mass scanner in the helmet.
  components:
  - type: Sprite
    sprite: _Forge/Clothing/OuterClothing/Hardsuits/tti_hardsuit.rsi # Forge-change
  - type: Item
    size: Huge
  - type: Clothing
    sprite: _Forge/Clothing/OuterClothing/Hardsuits/tti_hardsuit.rsi # Forge-change
  - type: PressureProtection
    highPressureMultiplier: 0.05
    lowPressureMultiplier: 1000
  - type: ExplosionResistance
    damageCoefficient: 0.8 # Forge-change 0.5-> 0.8
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.6
        Slash: 0.6
        Piercing: 0.6
        Heat: 0.8
        Radiation: 0.5
        Caustic: 0.6
  - type: StaminaDamageResistance # Mono - Stamres
    coefficient: 0.45
  - type: ClothingSpeedModifier
    walkModifier: 1.15
    sprintModifier: 1.15
  - type: ToggleableClothing # Goobstation - Modsuits change - Mono - this is a solution for helmet attachment/cover to not fit on hardsuits
    requiredSlot: outerclothing
    blockUnequipWhenAttached: false
    replaceCurrentClothing: true
    clothingPrototypes:
      head: ClothingHeadHelmetHardsuitTrauma
      helmetcover: ClothingHeadHelmetCoverBlock
      helmetattachment: ClothingHeadHelmetAttachmentBlock
  - type: StaticPrice
    price: 1400
    vendPrice: 10000
  - type: Tag # Forge-change
    tags:
    - Hardsuit
    - WhitelistChameleon
    - TTIEquip
  - type: Engraveable # Forge-change
    engravedMessage: engraving-TTIStaff
    hasEngravingText: forge-engraving-generic-has-message

- type: entity
  parent: [ForgeClothingOuterHardsuitBase, BaseFactionGearOtherFactionT1, ClothingFlightProfileEasy] # Forge-change parent BaseFactionGearOtherFactionT1, add ForgeClothingOuterHardsuitBase, add ClothingFlightProfileEasy
  id: ClothingOuterHardsuitTraumaLeader
  name: armed trauma unit T-53 tacsuit
  suffix: TTI # Forge
  description: Developed for extracting mission-critical patients under heavy fire, this is the standard gear of the Armed Trauma Unit's captain, with heavy plating and an integrated long-range mass scanner to match.
  components:
  - type: Sprite
    sprite: _Forge/Clothing/OuterClothing/Hardsuits/tti_commander_hardsuit.rsi # Forge-change
  - type: Item
    size: Huge
  - type: Clothing
    sprite: _Forge/Clothing/OuterClothing/Hardsuits/tti_commander_hardsuit.rsi # Forge-change
  - type: PressureProtection
    highPressureMultiplier: 0.05
    lowPressureMultiplier: 1000
  - type: ExplosionResistance
    damageCoefficient: 0.6
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.5 # Forge-change 0.6-> 0.5
        Slash: 0.5 # Forge-change 0.6-> 0.5
        Piercing: 0.45 # Forge-change 0.4-> 0.45
        Heat: 0.45 # Forge-change 0.55-> 0.45
        Radiation: 0.5
        Caustic: 0.6
  - type: StaminaDamageResistance
    coefficient: 0.3 # Forge-change 0.55-> 0.3
  - type: ClothingSpeedModifier
    walkModifier: 1 # Forge-change 1.05-> 1
    sprintModifier: 1 # Forge-change 1.05-> 1
  - type: HeldSpeedModifier
  - type: ToggleableClothing # Goobstation - Modsuits change - Mono - this is a solution for helmet attachment/cover to not fit on hardsuits
    requiredSlot: outerclothing
    blockUnequipWhenAttached: false
    replaceCurrentClothing: true
    clothingPrototypes:
      head: ClothingHeadHelmetHardsuitTraumaLeader
      helmetcover: ClothingHeadHelmetCoverBlock
      helmetattachment: ClothingHeadHelmetAttachmentBlock
  - type: StaticPrice
    price: 4200
    vendPrice: 25000
  - type: Tag # Forge-change
    tags:
    - Hardsuit
    - WhitelistChameleon
    - TTIEquip
  - type: Engraveable # Forge-change
    engravedMessage: engraving-TTIStaff
    hasEngravingText: forge-engraving-generic-has-message
