# Hand-written railings on upstream's pattern (a thin fixture on the edge they face, climbable). RMC's handrails and road
# barriers themselves are in _WF/Barricades.

- type: entity
  abstract: true
  parent: BaseStructure
  id: WFStreetsRailBase
  categories: [ WFStreets, WFStreetsBuildings ]
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    drawdepth: WallTops
    sprite: _WF/Streets/Structures/Walls/Barricades/barricade.rsi
  - type: Physics
    bodyType: Static
  - type: Rotatable
  - type: InteractionOutline
  - type: Repairable
  - type: Climbable
  - type: VehicleSmashable
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: FlimsyMetallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 30
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,-0.38"
        density: 500
        mask:
        - MidImpassable
        layer:
        - TableLayer

# Colonial Marines Universe's concrete barrier, without its barbed wire and damage overlays.
- type: entity
  parent: WFStreetsRailBase
  id: AU14JerseyBarricade
  name: concrete barrier
  description: A slab of cast concrete. It stops cars, and most other things.
  components:
  - type: Sprite
    sprite: _WF/Streets/CMU/Structures/concretebarrier.rsi
    state: concrete
  - type: VehicleSmashable
    minDestroyWeightClass: Heavy
  - type: Damageable
    damageModifierSet: StructuralMetallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 400
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
