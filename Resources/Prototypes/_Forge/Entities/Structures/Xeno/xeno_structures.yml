      types:
        Piercing: 4
        Slash: 2
    ignoreWhitelist:
      components:
      - ForgeXeno
  - type: SpeedModifierContacts
    walkSpeedModifier: 0.7
    sprintSpeedModifier: 0.7
    ignoreWhitelist:
      components:
      - ForgeXeno

- type: entity
  parent: BaseStructure
  id: XenoEgg
  name: xenomorph egg
  description: A leathery alien egg. Something inside wants out.
  suffix: Forge, Xeno, CM
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Clickable
  - type: InteractionOutline
  - type: Sprite
    sprite: _CM/Structures/Xenos/xeno_egg.rsi
    state: egg
    noRot: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.3
        density: 40
        mask:
        - MachineMask
        layer:
        - MidImpassable
        - LowImpassable
  - type: Damageable
    damageContainer: Biological
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 40
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: gib
      - !type:SpawnEntitiesBehavior
        spawn:
          MobXenoCMLarva:
            min: 0
            max: 1

- type: entity
  parent: XenoEgg
  id: XenoEggOpened
  name: opened xenomorph egg
  description: The egg has already hatched. The occupant is someone else's problem now.
  suffix: Forge, Xeno, CM, Opened
  components:
  - type: Sprite
    sprite: _CM/Structures/Xenos/xeno_egg.rsi
    state: egg_opened
    noRot: true
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 20
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  parent: BaseStructure
  id: XenoTunnel
  name: xenomorph tunnel
  description: A hole chewed through resin and deck plating. It does not lead anywhere useful... unless a mapper linked it.
  suffix: Forge, Xeno, CM
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Clickable
  - type: InteractionOutline
  - type: Sprite
    drawdepth: FloorTiles
    sprite: _CM/Structures/Xenos/xeno_tunnel.rsi
    state: hole
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.3,-0.3,0.3,0.3"
        density: 20
        mask:
        - MachineMask
        layer:
        - LowImpassable
  - type: Damageable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 80
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
