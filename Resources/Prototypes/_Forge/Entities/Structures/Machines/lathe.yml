#region Company
- type: entity
  id: DrakeMachine2x2Base
  abstract: true
  components:
  - type: Transform
    noRot: true
  - type: Sprite
    offset: 0.5,-0.5
    snapCardinals: false
  - type: Construction
    graph: Machine2x2
    node: machine
    containers:
    - machine_parts
    - machine_board
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25, -1.25, 1.25, 0.25"
        density: 250
        mask:
        - MachineMask
        layer:
        - MachineLayer

- type: entity
  parent: [OreProcessorIndustrial, DrakeMachine2x2Base]
