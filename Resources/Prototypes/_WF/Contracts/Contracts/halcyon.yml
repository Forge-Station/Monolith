    minDistance: 4000
    maxDistance: 6000

# New objectives.

- type: wfContract
  id: WFContractHalcyonBeacon
  contractor: WFContractorHalcyon
  category: Salvage
  tier: 2
  title: wf-contract-halcyon-beacon
  briefing: wf-contract-halcyon-beacon-brief
  reward: 16000, 21000
  deposit: 1000
  minutes: 55
  crewBonus: 0.25
  weight: 1
  objective: !type:WFContractRepair
    infestation:
    - entity: MobCarpSalvage
      count: 1, 3
    wrecks:
    - /Maps/Salvage/small-3.yml
    - /Maps/Salvage/small-tesla.yml
    - /Maps/Salvage/engineering-chunk.yml

- type: wfContract
  id: WFContractHalcyonFleetSalvage
  contractor: WFContractorHalcyon
  category: Salvage
  tier: 3
  title: wf-contract-halcyon-fleet-salvage
  briefing: wf-contract-halcyon-fleet-salvage-brief
  reward: 70000, 85000
  deposit: 5000
  minutes: 100
  minCrew: 3
  crewBonus: 0.3
  weight: 0.6
  requires:
  - tag: WFTowRope
    name: wf-contract-requires-rope
  - entity: WFTetherInstaller
    name: wf-contract-requires-tether-installer
  objective: !type:WFContractOperation
    item: WFContractFlightRecorder
    count: 2, 3
    anomalies: [ AnomalyGravity, AnomalyElectricity, AnomalyPyroclastic, AnomalyFlesh ]
    infestation:
    - entity: MobFleshJaredSalvage
      count: 2, 3
    - entity: MobFleshGolemSalvage
      count: 0, 1
    wrecks:
    - /Maps/Salvage/medium-pirate.yml
    - /Maps/Salvage/security-chunk.yml
    - /Maps/Salvage/medium-crashed-shuttle.yml
