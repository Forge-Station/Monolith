#region LMG

- type: entity
  name: РАВ-21 "Трунь"
  id: WeaponLightMachineGunMacRav21
  parent: [BaseWeaponLightMachineGun, BaseGunWieldable]
  description: Лёгкий пулемёт производства МАС в калибре 7,62×39 мм. Представлен конструкцией типа булл-пап, что обеспечивает удовлетворительную отдачу, а радиаторы на стволе отводят тепло, позволяя стрелять долго и быстро.
  components:
  - type: Sprite
    sprite: Forge/Objects/Weapons/Guns/LMGs/mac_rav21_trun.rsi
