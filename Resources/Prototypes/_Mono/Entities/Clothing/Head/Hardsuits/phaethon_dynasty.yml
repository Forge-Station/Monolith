        Slash: 0.9
        Piercing: 0.9
        Heat: 0.9
  - type: Sprite
    sprite: _Mono/Clothing/Head/Hardsuits/basilisk.rsi
  - type: Clothing
    sprite: _Mono/Clothing/Head/Hardsuits/basilisk.rsi
  - type: NightVision # Gen 4 quadtube-wide
