- type: entity
  name: 357_magnum bolt
  id: BulletEnergyGun357_magnum
  parent: BaseBullet
  categories: [ HideSpawnMenu ]
  components:
  - type: Reflective
    reflective:
    - Energy
  - type: FlyBySound
    sound:
      collection: EnergyMiss
      params:
        volume: 5
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/projectiles_tg.rsi
    layers:
    - state: heavylaser
      shader: unshaded
  - type: Ammo
  - type: Physics
  - type: Fixtures
    fixtures:
      projectile:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.2,-0.2,0.2,0.2"
        hard: false
        mask:
        - Opaque
  - type: Projectile
    impactEffect: BulletImpactEffectRedDisabler
    damage:
      types:
        Heat: 35
    armorPenetration: 0.1 # Forge-change
    soundHit:
      collection: MeatLaserImpact

- type: entity
  id: HeavyPulse
  parent: BulletEnergyGunLaser
  name: Heavy Pulse Bolt
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Impstation/Objects/Weapons/Guns/Projectiles/energybolts.rsi
    layers:
    - state: heavystun
      shader: unshaded
  - type: Projectile
    impactEffect: BulletImpactEffectDisabler
    damage:
      types:
        Heat: 50 # Forge-change 80->50
        Structural: 100 # Forge-change 1000->100
    armorPenetration: 0.25 # Forge-change

- type: entity
  id: HeavyPulseExp
  parent: BaseBulletTrigger
  name: Explosive Pulse Bolt
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Impstation/Objects/Weapons/Guns/Projectiles/energybolts.rsi
    layers:
    - state: heavystun
      shader: unshaded
  - type: Projectile
    impactEffect: BulletImpactEffectDisabler
    damage:
      types:
        Heat: 30 # Forge-change 50->30
        Structural: 50 # Forge-change 4500->50
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: Default
    totalIntensity: 125 # Forge-change 50->125
    intensitySlope: 5 # Forge-change 2->5
    maxIntensity: 5

- type: entity
  id: BulletLaserSlug
  parent: BulletEnergyGunLaser
  name: energy slug
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Impstation/Objects/Weapons/Guns/Projectiles/energybolts.rsi
    layers:
    - state: heavy
      shader: unshaded
  - type: Projectile
    impactEffect: BulletImpactEffectDisabler
    damage:
      types:
        Heat: 60 # Forge-change 55->60
        Structural: 175 # Forge-change 300->175
    armorPenetration: 0.15 # Forge-change

- type: entity
  id: BulletLaserPellet
  parent: BulletEnergyGunLaser
  name: energy
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Impstation/Objects/Weapons/Guns/Projectiles/energybolts.rsi
    layers:
    - state: light
      shader: unshaded
  - type: Projectile
    impactEffect: BulletImpactEffectDisabler
    damage:
      types:
        Heat: 18 # Forge-change 15->18
        Structural: 35 # Forge-change 12->35
    armorPenetration: 0.2 # Forge-change

- type: entity
  id: BulletLaserSpreadMono
  categories: [ HideSpawnMenu ]
  parent: BulletLaserPellet
  components:
  - type: ProjectileSpread
    proto: BulletLaserPellet
    count: 5
    spread: 15

# Monolithic projectiles

- type: entity
  name: gestalt bolt
  description: Zzz...t?
  id: BulletMonolithicGestalt
  parent: BaseBullet
  categories: [ HideSpawnMenu ]
  components:
  - type: Reflective
    reflective:
    - Energy
  - type: FlyBySound
    sound:
      collection: EnergyMiss
      params:
        volume: 5
  - type: Sprite
    sprite: _Impstation/Objects/Weapons/Guns/Projectiles/energybolts.rsi #imp
    layers:
    - state: mediumstun #imp
      shader: unshaded
  - type: Physics
  - type: Fixtures
    fixtures:
      projectile:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.15,-0.3,0.15,0.3"
        hard: false
        mask:
        - Opaque # Mono
  - type: Ammo
    muzzleFlash: MuzzleFlashEffectOmnilaser #imp
  - type: StaminaDamageOnCollide
    damage: 15 # Mono
  - type: Projectile
    impactEffect: BulletImpactEffectDisabler
    damage:
      types:
        Heat: 2
    soundHit:
      collection: WeakHit
    forceSound: true

# golom ranged crystal attack

- type: entity
  name: golum spike
  description: A pristine, nano-particulate weave crystal apparently made out of some sort of hard-light energy. It could probably revolutionize over five different industries if studied. Unfortunately, it seems to have been thrown right at you!
  id: BulletMonolithicGolomRanged
  parent: BaseBullet
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Mono/Objects/Materials/monolith_crystal.rsi
    layers:
    - state: crystal_small
      shader: unshaded
  - type: Physics
  - type: Ammo
    muzzleFlash: null
  - type: StaminaDamageOnCollide
    damage: 65
  - type: Projectile
    impactEffect: BulletImpactEffectKinetic
    damage:
      types:
        Blunt: 5
        Caustic: 15
        Cellular: 5
    soundHit:
      collection: ExplosionSmall
    forceSound: true

