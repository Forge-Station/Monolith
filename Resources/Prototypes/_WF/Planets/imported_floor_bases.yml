# Imported planet floors (Goon, Polaris, Nova, Aurora, Nebula, Chomp, Bay, Cit, RMC, Tg) were never
# brought over as their own sprites. These parents let the Wolfgate biome tiles inherit a floor we do have:
# dirt, grass, snow, ice, sand, basalt, or flesh. The biome children still add weather and subfloor.

