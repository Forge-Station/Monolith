- type: entity
  parent: BaseComputerAiAccess
  id: ComputerTurretCommandTSF
  name: TSF turret command console
  description: Sets the doctrine and friend or foe list for TSF turrets on this grid. Only the commanding officer can open it.
  components:
  - type: TurretCommandServer
    faction: TSF
    accent: "#4878a8"
  - type: TurretCommandConsole
  - type: AccessReader
    access: [["TurretCommandTSF"]]
  - type: ActivatableUIRequiresAccess
    popupMessage: turret-command-access-denied
  - type: ActivatableUI
    key: enum.TurretCommandUiKey.Key
  - type: UserInterface
    interfaces:
      enum.TurretCommandUiKey.Key:
        type: TurretCommandBoundUserInterface
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
  - type: Sprite
    sprite: Structures/Machines/computers.rsi
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: comm
    - map: ["computerLayerKeys"]
      state: generic_keys
    - map: ["enum.WiresVisualLayers.MaintenancePanel"]
      state: generic_panel_open

