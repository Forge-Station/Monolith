# Devices and targets placed aboard derelicts by contracts.

# Repair: weld it whole and fit a power cell. Starts damaged.
- type: entity
  id: WFContractNavBeacon
  name: derelict nav beacon
  description: A navigation beacon knocked out of service. It needs welding and a fresh power cell.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.3,-0.3,0.3,0.3"
        density: 200
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Sprite
    sprite: Objects/Devices/station_beacon.rsi
    state: icon
  - type: InteractionOutline
  - type: Clickable
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: Repairable
    doAfterDelay: 4
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 400
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        whitelist:
          components:
          - PowerCell
  - type: ContainerContainer
    containers:
      cell_slot: !type:ContainerSlot

# Download: a crewmate stands by it while it runs.
- type: entity
  id: WFContractDataTerminal
  name: derelict data terminal
  description: A terminal still holding data worth having. Stay close while it downloads; something else wants it too.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.35,-0.35,0.35,0.35"
        density: 200
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Sprite
    sprite: Structures/Machines/computers.rsi
    layers:
    - state: computer
    - state: generic_keyboard
    - state: comm_logs
      shader: unshaded
  - type: InteractionOutline
  - type: Clickable

