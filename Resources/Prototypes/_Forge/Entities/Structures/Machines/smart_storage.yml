- type: entity
  parent: BaseSmartStorage
  id: SmartVinylStorage
  name: SmartVinyl
  description: Stores a lot of vinyls and cds.
  components:
  - type: Machine
    board: SmartVinylCircuitboard
  - type: Sprite
    sprite: _Forge/Structures/Machines/smartvinylstorage.rsi
    snapCardinals: true
    layers:
    - state: smartvinyl
      map: ["enum.StorageVisualLayers.Base"]
    - state: smartvinyl_open
      map: ["enum.StorageVisualLayers.Door"]
      shader: unshaded
    - state: screen_open
      map: ["enum.StorageVisualLayers.Door"]
      shader: unshaded
  - type: PointLight
    color: "#4feffd"
  - type: SmartFridge
    flavorText: smart-fridge-request-vinyl
    whitelist:
      components:
      - Vinyl
      tags:
      - CD
      - VinylSleeveFit
