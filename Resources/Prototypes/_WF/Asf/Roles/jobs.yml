    appearanceDataInit:
      enum.PdaVisuals.PdaType:
        !type:String
        pda-envoy
  - type: PdaBorderColor
    borderColor: "#7B52B8"
    accentVColor: "#EBC913"

- type: entity
  parent: SpawnPointJobBase
  id: WFAsfSpawnPointEnvoy
