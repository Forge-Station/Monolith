- type: entity
  name: NEK'o AS-103 (5.7x28mm)
  parent: [BaseWeaponSubMachineGun, BaseGunWieldable]
  id: WeaponSubMachineGunAS103
  description: A light, convenient, but low-power of resistance forces. Uses small caliber cartridges.
  components:
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Guns/SMGs/masamune.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: GunWieldBonus
    minAngle: -14
    maxAngle: -14
  - type: Clothing
    sprite: _Mono/Objects/Weapons/Guns/SMGs/masamune.rsi
  - type: Gun
    minAngle: 16
    maxAngle: 24
    angleIncrease: 1.25
    angleDecay: 12
    fireRate: 9
    projectileSpeed: 40
    damageModifier: 1.1
    soundGunshot:
      path: /Audio/_Mono/Weapons/Guns/SmallArms/Gunshots/atreides_fire.ogg
    availableModes:
    - FullAuto
    - SemiAuto
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: Magazine57x28mmSubMachineGunFMJ
        insertSound: /Audio/Weapons/Guns/MagIn/smg_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/smg_magout.ogg
        priority: 2
        whitelist:
          tags:
          - Magazine57x28mmSubMachineGunFMJ
      gun_chamber:
        name: Chamber
        startingItem: Cartridge57x28mmFMJ
        priority: 1
        whitelist:
          tags:
          - Cartridge57x28mmFMJ
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance