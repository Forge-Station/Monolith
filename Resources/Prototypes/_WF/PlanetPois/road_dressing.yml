    blocks: false
    per100: 0.8
  - prototypes: [ RMCPropTrashFull ]
    where: Shoulder
    blocks: false
    per100: 1.0
  decals:
  - decals: [ RMCDecalRoadTiremark1, RMCDecalRoadTiremark2 ]
    axis: NorthSouth
    per100: 2.5
  - decals: [ RMCDecalRoadTiremark3, RMCDecalRoadTiremark4 ]
