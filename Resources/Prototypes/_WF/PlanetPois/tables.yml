# Every world keeps its procedural dungeons beside the authored sites. On Verda they sit off the roads, which join the
# house and the gas station; elsewhere the roads join the dungeons.
# The mechanic's garage and the roadside inn carry their own strip of asphalt, so they go only on the paved worlds:
# always on Verda, now and then on Merak. The hospital sits on its own stretch of road too, on Verda alone: its grounds
# are Verda's crocus grass.
# A site that finds no room is skipped, so the counts are ceilings.
# Armour (the Reaver APC road patrols) drives only Verda's and Merak's roads; the other worlds keep their parked
# civilian vehicles and nothing heavier.

