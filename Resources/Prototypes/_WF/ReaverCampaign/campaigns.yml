# One campaign per votable storyteller preset. Lists by tier run 0 (none) to 5 (overrun).

- type: wfReaverCampaign
  id: WFReaverCampaignQuiet
  preset: WFEncounterPresetQuiet
  faction: WFSectorFactionReavers
  firstStrongholdDelay: 60m
  regroupDelay: 45m
  spreadInterval: 20m
  quietMinutes: 15
  foundInterval: 90m
  cellsPerStronghold: 8
  maxStrongholds: 2
  supportRange: 2
  patrols: [ 0, 1, 1, 1, 1, 2 ]
  patrolInterval: 15m
  interceptDwell: 60s
  interceptCooldown: 10m
  intercepts: [ 0, 1, 1, 1, 1, 2 ]
  raidTier: 3
  raidInterval: [ 60m, 50m, 40m ]
  threatScale: [ 1, 1, 1, 1.1, 1.2, 1.3 ]
  maxThreatScale: 1.5
  tierThresholds: [ 10, 22, 40, 60, 80 ]
  strongholdBounty: [ 60000, 90000, 120000, 160000, 200000, 250000 ]
  patrolBounty: 20000
  # Spesos for retaking a held cell, by tier, split among the crews of the ships that held it through the countdown.
  retakeBounty: [ 8000, 10000, 12000, 14000, 16000, 20000 ]
  # Reinforcements dock to a stronghold hub one by one: the interval a hub stands before the next sets out, the level
  # cap by tier (0..5), and the convoy for each level from 1.
  reinforcementInterval: 20m
  maxLevelByTier: [ 0, 1, 1, 2, 2, 2 ]
  levelBountyScale: 0.5
  reinforcements: [ WFReaverReinforcementGunship, WFReaverReinforcementGunship, WFReaverReinforcementHeavy, WFReaverReinforcementHeavy ]
  credits:
  - entity: FederationMilitaryCredit1
    companies: [ TSF, TSFCivilian ]
    stronghold: 30
    patrol: 10
  - entity: Doubloon1
    companies: [ PDV, PDVCivilian ]
    stronghold: 30
    patrol: 10
  risingSound:
    path: /Audio/Misc/redalert.ogg
  fallingSound:
    path: /Audio/Misc/notice1.ogg
  risingColor: "#D84A3A"
  fallingColor: "#3FB8AF"

