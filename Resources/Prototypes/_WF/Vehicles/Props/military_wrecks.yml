# Burnt-out military vehicles for mappers and the random scenery spawners: the drivable vehicles' own sprites,
# darkened and broken, as static obstacles. None of them drives.

- type: entity
  abstract: true
  parent: RMCPropVehicleBase
  id: WFSceneryMilitaryWreckBase
  description: What is left of a military vehicle after a fight it lost. Nothing on it works.
  components:
  - type: Sprite
    offset: 0, 0
    color: "#8a8580"
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 3000
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 5
            max: 10
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  parent: WFSceneryMilitaryWreckBase
  id: WFSceneryTankWreck
  name: tank wreck
  components:
  - type: Sprite
    sprite: _WF/Vehicles/tank.rsi
    layers:
    - state: tank_base
    - state: wheels_0
    - state: tank_turret_0
    - state: ltb_cannon_1
    - state: damaged_frame
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-1.2,-1.6,1.2,1.6"
        density: 1000
        layer:
        - MobMask

