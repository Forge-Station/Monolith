- type: entity
  parent: ComputerCrewMonitoring
  id: ComputerCrewRenegadeMonitoring
  name: консоль мониторинга ВКР # crew renegate monitoring console
  description: Используется для просмотра статусов всех датчиков имплантов состава ВКР. Не дайте ей попасть в руки врага! # Used to monitor active health sensors built into most of the crew's renegate implants.
  components:
  - type: Sprite
    sprite: Forge/Structures/Machines/computers.rsi
    layers:
    - map: ["computerLayerBody"]
      state: computer_renegate
    - map: ["computerLayerKeyboard"]
      state: renegate_key
    - map: ["computerLayerScreen"]
      sprite: Forge/Structures/Machines/factions_crew_monitors_screens.rsi
      state: crew-renegate
    - map: ["computerLayerKeys"]
      state: ren_key
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: generic_panel_open
  - type: DeviceNetwork
    deviceNetId: Wireless
    receiveFrequencyId: CrewRenegadeMonitor

