    idleState: icon
    runningState: building
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25, -1.25, 1.25, 0.25"
        density: 250
        mask:
        - MachineMask
        layer:
        - MachineLayer

