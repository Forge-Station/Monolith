- type: species
  id: Moth
  name: species-name-moth
  roundStart: true
  prototype: MobMoth
  sprites: MobMothSprites
  defaultSkinTone: "#ffda93"
  markingLimits: MobMothMarkingLimits
  dollPrototype: MobMothDummy
  skinColoration: Hues
  maleFirstNames: names_moth_first_male
  femaleFirstNames: names_moth_first_female
  lastNames: names_moth_last

- type: speciesBaseSprites
  id: MobMothSprites
  sprites:
    Head: MobMothHead
    Hair: MobHumanoidAnyMarking # Mono
    Snout: MobHumanoidAnyMarking
    Chest: MobMothTorso
    UndergarmentTop: MobHumanoidAnyMarking # WOLFGATE - underwear/genital layers ported from HardLight
    UndergarmentBottom: MobHumanoidAnyMarking # WOLFGATE - underwear/genital layers ported from HardLight
    Genital: MobHumanoidAnyMarking # WOLFGATE - underwear/genital layers ported from HardLight
    Penis: MobHumanoidAnyMarking # WOLFGATE - underwear/genital layers ported from HardLight
    Breasts: MobHumanoidAnyMarking # WOLFGATE - underwear/genital layers ported from HardLight
    HeadTop: MobHumanoidAnyMarking
    HeadSide: MobHumanoidAnyMarking
    Tail: MobHumanoidAnyMarking
    TailBehind: MobHumanoidAnyMarking # WOLFGATE - split tail layers ported from HardLight/Floof
    TailOversuit: MobHumanoidAnyMarking # WOLFGATE - split tail layers ported from HardLight/Floof
    Eyes: MobMothEyes
    LArm: MobMothLArm
    RArm: MobMothRArm
    LHand: MobMothLHand
    RHand: MobMothRHand
    LLeg: MobMothLLeg
    RLeg: MobMothRLeg
    LFoot: MobMothLFoot
    RFoot: MobMothRFoot

- type: humanoidBaseSprite
  id: MobMothEyes
  baseSprite:
    sprite: Mobs/Species/Moth/parts.rsi
    state: eyes

- type: markingPoints
  id: MobMothMarkingLimits
  onlyWhitelisted: false # Mono
  points:
    Hair:
      points: 1 # Mono Moth Hair
      required: false
    FacialHair:
      points: 0
      required: false
    Tail:
      points: 1
      required: true
      defaultMarkings: [ MothWingsDefault ]
    Snout:
      points: 1
      required: false
    HeadTop:
      points: 1
      required: true
      defaultMarkings: [ MothAntennasDefault ]
    HeadSide:
      points: 1
      required: false
    Head:
      points: 4 # imp 1<4
      required: false
    Chest:
      points: 4 # imp 1<4
      required: false
    Legs:
      points: 4 # imp 2<4
      required: false
    Arms:
      points: 4 # imp 2<4
      required: false

