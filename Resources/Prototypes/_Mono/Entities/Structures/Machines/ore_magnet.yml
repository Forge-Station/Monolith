- type: entity
  parent: [BaseMachinePowered, ConstructibleMachine]
  id: MachineOreMagnet
  name: ore magnet
  description: Uses a powerful magnet to suck in ore. Has an internal storage.
  components:
  # WOLFGATE(AsteroidMining) START: pulls only ore it can see, with an arc and aura, and a new sprite
  # - type: MagnetPickup
  #   magnetEnabled: false
  #   magnetCanBeEnabled: false
  #   range: 30
  # - type: Sprite
  #   sprite: Structures/Machines/salvage.rsi
  #   layers:
  #   - state: salvage-magnet
  #   - state: salvage-magnet-o4
  #     shader: unshaded
  #     map: [ "enum.PowerDeviceVisualLayers.Powered" ]
  #   - state: salvage-magnet-ready-blinking
  #     visible: false
  #     map: [ "enum.ToggleableVisuals.Layer" ]
  - type: WFOreMagnet
    range: 30
  - type: Sprite
    sprite: _WF/AsteroidMining/Structures/ore_magnet.rsi
    layers:
    - state: off
      map: [ "enum.WFOreMagnetVisualLayers.Base" ]
    - state: glow
      shader: unshaded
      visible: false
      map: [ "enum.WFOreMagnetVisualLayers.Glow" ]
  # WOLFGATE END
  - type: LitOnPowered
  - type: PointLight
    radius: 1.5
    energy: 1.6
    # WOLFGATE(AsteroidMining): the field's cyan, to match the new sprite and pull arc
    # color: "#3db83b"
    color: "#5ec8ff"
    castShadows: false
  - type: AmbientSound
    volume: -10
    range: 5
    sound:
      path: /Audio/Ambience/Objects/hdd_buzz.ogg
  - type: Appearance
  - type: ApcPowerReceiver
    powerLoad: 7000
  - type: ExtensionCableReceiver
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 1
            max: 2
  - type: Rotatable
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        density: 500
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Storage
    grid:
    - 0,0,19,9
    maxItemSize: Normal
    storageOpenSound: /Audio/Effects/closetopen.ogg
    storageCloseSound: /Audio/Effects/closetclose.ogg
    whitelist:
      tags:
      - Ore
      - ArtifactFragment
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: Dumpable
    multiplier: 0.15
  - type: ItemToggle
    soundActivate: &soundActivate
      collection: sparks
      params:
        variation: 0.25
    soundDeactivate: *soundActivate
    onUse: false
    onAltUse: true
    onActivate: false
  - type: GenericVisualizer
    visuals:
      # WOLFGATE(AsteroidMining) START: on and off states while switched on and powered
      # enum.PowerDeviceVisuals.Powered:
      #   enum.PowerDeviceVisualLayers.Powered:
      #     True: { visible: true }
      #     False: { visible: false }
      # enum.ToggleableVisuals.Enabled:
      #   enum.ToggleableVisuals.Layer:
      #     True: { visible: True }
      #     False: { visible: False }
      enum.WFOreMagnetVisuals.Active:
        enum.WFOreMagnetVisualLayers.Base:
          True: { state: on }
          False: { state: off }
        enum.WFOreMagnetVisualLayers.Glow:
          True: { visible: true }
          False: { visible: false }
      # WOLFGATE END
  - type: ItemToggleExamine
    on: item-toggle-examine-magnet-on
    off: item-toggle-examine-magnet-off
  - type: Machine
    board: OreMagnetMachineCircuitboard
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: []
      machine_board: !type:Container
      machine_parts: !type:Container

- type: entity
  name: ore magnet flatpack
  id: OreMagnetFlatpack
  parent: BaseNFFlatpack
  description: A flatpack used for constructing an ore magnet.
  components:
  - type: Flatpack
    entity: MachineOreMagnet
  - type: StaticPrice
    price: 6500
    vendPrice: 10000
