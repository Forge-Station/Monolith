- type: entity
  parent: ComputerCrewMonitoring
  id: ComputerCrewRenegadeMonitoring
  name: консоль мониторинга ВКР # crew renegade monitoring console
  description: Используется для просмотра статусов всех датчиков имплантов состава ВКР. Не дайте ей попасть в руки врага! # Used to monitor active health sensors built into most of the crew's renegade implants.
  components:
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: crew
    - map: ["computerLayerKeys"]
      state: med_key
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: generic_panel_open
  - type: DeviceNetwork
    deviceNetId: Wireless
    receiveFrequencyId: CrewRenegadeMonitor

