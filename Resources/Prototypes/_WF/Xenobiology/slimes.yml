# Ported from Goobstation via Trauma Station (slimebase.yml, slimes_baby.yml, spawners.yml). Hunger replaces Goob's
# satiation with the same thresholds.

- type: entity
  abstract: true
  parent:
  - SimpleMobBase
  - MobCombat
  - BaseSlimeJigglePhysics
  id: BaseMobSlimeXenobio
  name: basic slime
  description: It looks so much like jelly. I wonder what it tastes like?
  components:
  - type: Appearance
  - type: ZombieImmune
  - type: Hunger
    baseDecayRate: 0.3
    thresholds:
      Overfed: 150
      Okay: 75
      Peckish: 25
      Starving: 10
      Dead: 0
    hungerThresholdDecayModifiers:
      Overfed: 1.5
      Okay: 1.5
      Peckish: 0.4
      Starving: 0.2
      Dead: 0.1
  - type: MobPrice
    price: 500
  - type: Sprite
    noRot: true
    drawdepth: OverMobs
    sprite: _WF/Xenobiology/Mobs/slimesBaby.rsi
    layers:
    - map:
      - enum.DamageStateVisualLayers.Base
      state: base
  - type: DamageStateVisuals
    states:
      Dead:
        Base: dead
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeCircle
          radius: 0.3
        density: 80
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: MobThresholds
    thresholds:
      0: Alive
      100: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 2
    baseSprintSpeed: 4
  - type: FootstepModifier
    footstepSoundCollection:
      path: /Audio/Effects/Footsteps/slime1.ogg
      params:
        volume: 3
  - type: Tag
    tags:
    - FootstepSound
    - DoorBumpOpener
    - XenoSlime
  - type: Respirator
    damage:
      types:
        Asphyxiation: 0.2
    damageRecovery:
      types:
        Asphyxiation: -1.0
    maxSaturation: 15
  - type: Damageable
    damageModifierSet: Slime
    damageContainer: Biological
  - type: Bloodstream
    bloodReagent: Slime
    bloodlossDamage:
      types:
        Bloodloss: 0.5
    bloodlossHealDamage:
      types:
        Bloodloss: -0.25
  - type: Barotrauma
    damage:
      types:
        Blunt: 0.45
  - type: Reactive
    groups:
      Flammable:
      - Touch
      Extinguish:
      - Touch
    reactions:
    - reagents:
      - Water
      - SpaceCleaner
      methods:
      - Touch
      effects:
      - !type:WashCreamPieReaction {}
    - reagents:
      - Water
      methods:
      - Touch
      effects:
      - !type:HealthChange
        damage:
          types:
            Caustic: 5
      - !type:PopupMessage
        type: Local
        messages:
        - slime-hurt-by-water-popup
        probability: 0.25
  - type: MeleeWeapon
    damage:
      types:
        Heat: 5
    animation: WeaponArcPunch
    soundHit: /Audio/Weapons/punch3.ogg
  - type: InteractionPopup
    successChance: 0.5
    interactSuccessString: petting-success-slimes
    interactFailureString: petting-failure-generic
  - type: Speech
    speechVerb: Slime
    speechSounds: Slime
  - type: TypingIndicator
    proto: slime
  - type: NpcFactionMember
    factions:
    - SimpleHostile
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: []
  - type: ActionGrant
    actions:
    - ActionSlimeLatch
  - type: HTN
    rootTask:
      task: XenoSlimeCompound
  - type: GuideHelp
    guides:
    - Xenobiology

- type: entity
  parent: BaseMobSlimeXenobio
  id: MobSlimeXenobioBaby
  categories:
  - HideSpawnMenu
  name: slime
  suffix: Baby
  description: It looks so much like jelly. I wonder what it tastes like?
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: _WF/Xenobiology/Mobs/slimesBaby.rsi
    layers:
    - map:
      - enum.DamageStateVisualLayers.Base
      state: base
      color: "#FFFFFF"
  - type: MobGrowth
    hungerRequired: 75
    currentStage: baby
    stages:
      baby:
        nextStage: adult
        sprite: _WF/Xenobiology/Mobs/slimesBaby.rsi
        displayName: baby
      adult:
        sprite: _WF/Xenobiology/Mobs/slimesAdult.rsi
        displayName: adult

- type: entity
  parent: MobSlimeXenobioBaby
  id: MobSlimeXenobioAdult
  categories:
  - HideSpawnMenu
  suffix: Adult
  components:
  - type: MobGrowth
    currentStage: adult

- type: entity
  abstract: true
  parent: MarkerBase
  id: MobSlimeXenobioBabyPending
  name: undetermined slime
  components:
  - type: PendingSlimeSpawn
  - type: Sprite
    layers:
    - state: green
    - sprite: _WF/Xenobiology/Mobs/slimesBaby.rsi
      state: base

- type: entity
  parent: MobSlimeXenobioBabyPending
  id: MobSlimeXenobioBabyGrey
  name: grey slime
  components:
  - type: PendingSlimeSpawn
    breed: GreyMutation
  # Bought from John Wolfgate or the Wolfgate vendor; breeding your own is the cheap way.
  - type: StaticPrice
    price: 500
    vendPrice: 5000

- type: entity
  id: MobSlimeXenobioBabyGreySpawner
  name: grey slime spawner
