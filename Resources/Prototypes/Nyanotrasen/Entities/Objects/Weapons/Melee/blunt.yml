- type: entity
  name: kanabou
  parent: BaseItem
  id: Kanabou
  description: The classic oni weapon, for those that forgo subtlety.
  components:
  # WOLFGATE(Wolfmed) START: a blunt weapon can execute, with bludgeoning lines in place of the throat-slitting ones
  - type: Execution
    internalMeleeExecutionMessage: wolfmed-execution-bludgeon-initial-internal
    externalMeleeExecutionMessage: wolfmed-execution-bludgeon-initial-external
    completeInternalMeleeExecutionMessage: wolfmed-execution-bludgeon-complete-internal
    completeExternalMeleeExecutionMessage: wolfmed-execution-bludgeon-complete-external
    internalSelfExecutionMessage: wolfmed-execution-bludgeon-self-initial-internal
    externalSelfExecutionMessage: wolfmed-execution-bludgeon-self-initial-external
    completeInternalSelfExecutionMessage: wolfmed-execution-bludgeon-self-complete-internal
    completeExternalSelfExecutionMessage: wolfmed-execution-bludgeon-self-complete-external
  # WOLFGATE END
  - type: Sprite
    sprite: Nyanotrasen/Objects/Weapons/Melee/kanabou.rsi
    state: icon
  - type: Item
    size: Normal
  - type: MeleeWeapon
    attackRate: 0.75
    range: 1.75
    damage:
      types:
        Blunt: 20
    bluntStaminaDamageFactor: 1.60 # 25.6 stamina damage
  - type: Wieldable
  - type: IncreaseDamageOnWield
    damage:
      types:
        Blunt: 18
  - type: Clothing
    sprite: Nyanotrasen/Objects/Weapons/Melee/kanabou.rsi
    quickEquip: false
    slots:
    - back

- type: entity
  name: shinai
  parent: BaseItem
  id: Shinai
  description: A bamboo sword, commonly used in kendo. Made some time after the realization that wooden swords hurt a lot.
  components:
  - type: Sprite
    sprite: Nyanotrasen/Objects/Weapons/Melee/shinai.rsi
    state: icon
  - type: MeleeWeapon
    attackRate: 1.25
    range: 1.75
    bluntStaminaDamageFactor: 2.0
    damage:
      types:
        Blunt: 4
    soundHit:
      collection: WoodDestroyHeavy
  - type: StaminaDamageOnHit
    damage: 10
  - type: Item
    size: Normal
    sprite: Nyanotrasen/Objects/Weapons/Melee/shinai.rsi
  - type: DisarmMalus
