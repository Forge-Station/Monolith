# Mechanical (W6) -------------------------------------------------------------
# The mechanical repair procedure. Servo damage carries no damage type, so neither the welder nor the cable
# coil's own healing block reaches it; the run behind the panel has to be replaced by hand.

- type: entity
  parent: SurgeryBase
  id: WFSurgeryReplaceServo
  name: Replace Damaged Servo
  categories: [ HideSpawnMenu ]
  components:
  - type: Surgery
    requirement: SurgeryOpenIncision
    steps:
    - WFSurgeryStepReplaceServo
    - SurgeryStepSealTendWound
  - type: WolfmedSurgeryWoundCondition
    woundPrototype: WFWolfmedServoDamageWound

# Evisceration (EVISC) --------------------------------------------------------
# Neither carries a `requirement`: the belly or the casing is already open, and WolfmedEviscerationSystem
# grants Shitmed's own incision state so the organ and component surgeries list without a scalpel. The
# clamp comes first for the same reason the artery repair's does - WolfmedArterialBleedBehavior refuses
# every treatment while the wound is still running, so nothing closes until the bleeders are held.
#
# Both complete with organ slots still empty, on purpose: a closed patient missing a liver is a transplant
# (the existing SurgeryInsert<Organ> chain), not a reason to leave an abdomen open on the table.

- type: entity
  parent: SurgeryBase
  id: WFSurgeryCloseEvisceration
  name: Close Evisceration
  categories: [ HideSpawnMenu ]
  components:
  - type: Surgery
    steps:
    - WFSurgeryStepClampEvisceration
    - WFSurgeryStepCloseEvisceration
  - type: WolfmedSurgeryWoundCondition
    woundPrototype: WFWolfmedEviscerationWound

- type: entity
  parent: SurgeryBase
  id: WFSurgeryWeldChassisBreach
  name: Weld Chassis Breach
  categories: [ HideSpawnMenu ]
  components:
  - type: Surgery
    steps:
    - WFSurgeryStepSeatChassisPlating
    - WFSurgeryStepWeldChassisBreach
  - type: WolfmedSurgeryWoundCondition
    woundPrototype: WFWolfmedChassisBreachWound

# Chassis repair (playtest 3 IPC round 2) -------------------------------------
# A hand welder and a cable coil, as procedures. Neither opens anything: both tools work from the outside. The weld
# runs until the part carries none of the four damage wounds, the rewire until its wiring faults are gone.

- type: entity
  parent: SurgeryBase
  id: WFSurgeryWeldChassis
  name: Weld Chassis
  categories: [ HideSpawnMenu ]
  components:
  - type: Surgery
    steps:
    - WFSurgeryStepWeldChassis
  - type: WolfmedSurgeryWoundCondition
    mechanical: true
    woundPrototypes:
    - IpcMechanicalDamageWound
    - WFWolfmedDentWound
    - WFWolfmedBreachWound
    - CyberneticMechanicalDamageWound

# ElectricalWound is flesh's too, so this one lists only on a machine part.
- type: entity
  parent: SurgeryBase
  id: WFSurgeryRewireChassis
  name: Rewire
  categories: [ HideSpawnMenu ]
  components:
  - type: Surgery
    steps:
    - WFSurgeryStepRewireChassis
  - type: WolfmedSurgeryWoundCondition
    mechanical: true
    woundPrototypes:
    - WFWolfmedShortCircuitWound
    - ElectricalWound

# Brain repair (BRAIN) --------------------------------------------------------

- type: entity
  parent: SurgeryBase
  id: WFSurgeryRepairBrain
  name: Repair Brain
  categories: [ HideSpawnMenu ]
  components:
  - type: Surgery
    requirement: SurgeryOpenIncision
    steps:
    - SurgeryStepSawBones
    - WFSurgeryStepRepairBrain
    - SurgeryStepSealOrganWound
  - type: SurgeryPartCondition
    part: Head
  # M4 (OD16): a synth's brain slot holds its core, which WFSurgeryRepairSynthCore (synth_core.yml) repairs.
  - type: SurgeryBodyComponentCondition
    components:
    - type: SynthBattery
    inverse: true
  - type: WolfmedSurgeryOrganDamagedCondition
    slot: brain
    # BRAIN/AUTODOC4: any damaged brain, not only a destroyed one. A brain at three per cent is alive, so
    # the destroyed-only test left the one patient who most needed this surgery with nothing listed.
    anyDamage: true

# Hand-only treatments as surgeries (AUTODOC4) --------------------------------
# Both list only while there is something to do, so the planner cannot queue either on a clean part. The
# extraction opens the part first because that is what makes the objects reachable, and closes after; the
# relocation needs neither, exactly as the hand verb needs neither.

- type: entity
  parent: SurgeryBase
  id: WFSurgeryRemoveEmbeddedObjects
  name: Remove Embedded Objects
  categories: [ HideSpawnMenu ]
  components:
  - type: Surgery
    requirement: SurgeryOpenIncision
    steps:
    - WFSurgeryStepExtractEmbedded
    - SurgeryStepSealTendWound
  - type: WolfmedSurgeryEmbeddedCondition

- type: entity
  parent: SurgeryBase
  id: WFSurgeryRelocateJoint
  name: Relocate Joint
  categories: [ HideSpawnMenu ]
  components:
  - type: Surgery
    steps:
    - WFSurgeryStepRelocateJoint
  - type: WolfmedSurgeryWoundCondition
    woundPrototype: WFWolfmedDislocationWound

# Core repair (M2, OD10) ------------------------------------------------------
# The positronic core's answer to brain repair: a destroyed core put back together where it sits, so the chassis's
# own mind comes back on the restart button rather than a different person in a new core. Chassis steps: unbolt the
# housing, re-flash the core, weld the housing shut. No trauma follows on a machine.

- type: entity
  parent: SurgeryBase
  id: WFSurgeryRepairCore
  name: Repair Positronic Core
  categories: [ HideSpawnMenu ]
  components:
  - type: Surgery
    steps:
    - WFSurgeryStepUnseatCore
    - WFSurgeryStepRepairCore
    - WFSurgeryStepReseatCore
  - type: SurgeryPartCondition
    part: Torso
  - type: WolfmedSurgeryOrganDamagedCondition
    slot: posbrain
    anyDamage: true
    # M6: a whole core with the housing still unbolted still lists, so the weld that closes it can be reached.
    validWhile:
    - type: WolfmedCoreHousingOpen
