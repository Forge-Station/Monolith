# Carcinoma's surface regions built from the Decor Import assets: scab shores, bone fields, hive pockets, meat marsh
# and dead crust at the grove edges. Every outdoor tile is a weather child; every id says "flesh" so the planet map
# keeps colouring the ground as flesh. The art is recoloured to the flesh palette (_WF/Planets/BoneField).

# Scab crust where a blood lake meets the shore.
- type: tile
  id: WFFloorFleshScab
  parent: NovaFloorMeatFresh
  sprite: /Textures/_WF/Planets/BoneField/scab_shore.png
  variants: 4
  placementVariants: [1, 1, 1, 1]
  weather: true

# The bone field's ground: calcified flesh at the base, bleached bone plates and cartilage patches on top. The ids keep
# their old Meaty/Spine/Straight names, which the planet's layers and tests already use.
- type: tile
  id: WFFloorFleshBoneMeaty
  parent: NovaFloorBoneMeaty
  sprite: /Textures/_WF/Planets/BoneField/calcified_flesh.png
  variants: 4
  placementVariants: [1, 1, 1, 1]
  weather: true

- type: tile
  id: WFFloorFleshBoneSpine
  parent: NovaFloorBoneSpine
  sprite: /Textures/_WF/Planets/BoneField/bleached_bone.png
  variants: 4
  placementVariants: [1, 1, 1, 1]
  weather: true

- type: tile
  id: WFFloorFleshBoneStraight
  parent: NovaFloorBoneStraight
  sprite: /Textures/_WF/Planets/BoneField/cartilage.png
  variants: 4
  placementVariants: [1, 1, 1, 1]
  weather: true

