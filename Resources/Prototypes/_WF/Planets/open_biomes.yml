  - !type:BiomeEntityLayer
    allowedTiles: [WFFloorVerdaPondMud]
    entities: [AuroraAssunzioneGrassAlt, AuroraFloraBushKonyangReeds]
    threshold: 0.4
    noise: { seed: 229, noiseType: OpenSimplex2, frequency: 3 }
  # Pond rings: reeds to cut, a lotus to eat, shore sage to heal with (Planets/Life/verda.yml).
  - !type:BiomeEntityLayer
    allowedTiles: [WFFloorVerdaPondMud]
    entities: [WFVerdaPlantReeds]
    threshold: 0.9
    noise: { seed: 301, noiseType: OpenSimplex2, frequency: 3 }
  - !type:BiomeEntityLayer
