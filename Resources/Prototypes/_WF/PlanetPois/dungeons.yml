# Site interiors: Frontier's planet-base dungeons dressed for the world they stand on (its rock for the walls, a decal
# tint to match), with a few of the world's mobs and some loot, since the bare configs have neither. A base keeps its
# own indoor floor; only the caves (mines, Carcinoma's ruin) take the world's ground for theirs. The mobs are the plain argocytes: the Expeditions ones despawn off a salvage map.

# Asclepiu: temperate, overgrown
- type: dungeonConfig
  id: WFPoiAsclepiuResearch
  data:
    colors:
      Decals: "#4f7a3aff"
    entities:
      Walls: WallSolidRust
      CornerWalls: WallSolidRust
  layers:
  - !type:PrototypeDunGen
    proto: NFExperiment
  - !type:EntityTableDunGen
    minCount: 4
    maxCount: 8
    table: !type:NestedSelector
      tableId: SalvageEquipmentSpawnerCommon
  - !type:MobsDunGen
    minCount: 3
    maxCount: 6
    groups:
    - id: MobArgocyteSlurva
      amount: 1

- type: dungeonConfig
  id: WFPoiAsclepiuClinic
