# A smuggler's run: a small freighter with a black market hold, wandering open space on no manifest and in no hurry. It warns
# off whatever comes near and fires on whatever ignores it, and the crew shoot boarders. Nothing is announced until it has been
# fought, and then only as a rumour. The hold is a few crates, and it is not worth hunting down for the haul.
- type: wfEncounter
  id: WFEncounterBlackMarketSmall
  name: wf-encounter-name-blackmarket
  announcement: wf-encounter-announce-blackmarket
  announcementSender: wf-encounter-sender-traffic
  start: Scheduled
  category: Threat
  cost: 1
  weight: 0.75
  minPlayers: 3
  hidden: true
  cooldown: 5400
  duration: 3600
  minDistance: 2500
  maxDistance: 4500
  stationClearance: 3000
  manifests: [ WFManifestContraband ]
  ships:
  - key: smuggler
    navigation: WFCrewNavigationFreight
    vessel: Twilight
    side: smugglers
    faction: PirateNF
    company: paycheckbratva
    profile: WFCrewProfileHauler
    captain: false
    deckhands: 0
    guards: 2
    roles: [ WFCrewPilot, WFCrewGunner, WFCrewDeckhand ]
    cargo: 6
    skill: Regular
    wander: 5
    wanderRadius: 3000
    wanderPause: 90
    warnRange: 800
    attackRange: 350
    zoneLines: wf-encounter-blackmarket-zone
    zoneTargets: Everyone
    evades: false
    distress: false
    disengage: Deter
    disengageRange: 1200

