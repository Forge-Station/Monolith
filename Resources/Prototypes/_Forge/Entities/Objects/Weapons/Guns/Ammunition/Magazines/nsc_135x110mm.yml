    shape:
    - 0,0,1,1
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
      - Cartridge135x110mm
    proto: Cartridge135x110mm
    capacity: 5
  - type: ContainerContainer
