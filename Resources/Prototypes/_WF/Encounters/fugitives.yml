# Fugitives: outlaw ships with a warrant on the PDA bounty board. They run from player ships, never start a fight and
# hit back when fired on or boarded. Kill the wanted man and the warrant is paid to the players who did it. Four tiers,
# by hull, crew, skill and gear. The lower tiers (evades: false) keep running while their guns answer an attacker; the
# top tier turns and fights.

# Outlaw crews wear what the Reavers wear and fight only whoever attacks them, marines included.
- type: wfCrewProfile
  id: WFCrewProfileFugitive
  bodies:
  - WFMobCrewBodyHuman
  - WFMobCrewBodyHuman
  - WFMobCrewBodyReptilian
  - WFMobCrewBodyDwarf
  - WFMobCrewBodyVulpkanin
  - WFMobCrewBodyTajaran
  - WFMobCrewBodyRodentia
  - WFMobCrewBodyArachnid
  - WFMobCrewBodyMoth
  skills: [ Green, Regular ]
  # Outlaws fly plastitanium as the Reavers do (WFCrewProfilePirate).
  hullSwaps:
    WFWallDurasteel: WallPlastitanium
    WFWallDurasteelDiagonal: WallPlastitaniumDiagonal
    WFWallDurasteelCapital: WallPlastitaniumCapital
    WFWallDurasteelDiagonalCapital: WallPlastitaniumDiagonalCapital
  engagement:
    WFCrewDeckhand: WhenAttacked
    WFCrewMarine: WhenAttacked
  loadouts:
    WFCrewDeckhand: [ WFCrewPirateHand, WFCrewPirateHand, WFCrewPirateBruiser ]
    WFCrewEngineer: [ WFCrewPirateHand ]
    WFCrewMarine: [ WFCrewPirateBruiser, WFCrewPirateHand ]
    WFCrewPilot: [ WFCrewPirateOfficer ]
    WFCrewRadioOperator: [ WFCrewPirateOfficer ]
    WFCrewCaptain: [ WFCrewPirateOfficer ]
    WFCrewGunner: [ WFCrewPirateHand, WFCrewPirateOfficer ]

# The hard cases: armour and rifles on the hands as well as the guards.
- type: wfCrewProfile
  id: WFCrewProfileFugitiveArmed
  bodies:
  - WFMobCrewBodyHuman
  - WFMobCrewBodyHuman
  - WFMobCrewBodyReptilian
  - WFMobCrewBodyDwarf
  - WFMobCrewBodyVulpkanin
  - WFMobCrewBodyTajaran
  skills: [ Veteran, Elite ]
  hullSwaps:
    WFWallDurasteel: WallPlastitanium
    WFWallDurasteelDiagonal: WallPlastitaniumDiagonal
    WFWallDurasteelCapital: WallPlastitaniumCapital
    WFWallDurasteelDiagonalCapital: WallPlastitaniumDiagonalCapital
  engagement:
    WFCrewDeckhand: WhenAttacked
    WFCrewMarine: WhenAttacked
  loadouts:
    WFCrewDeckhand: [ WFCrewPirateBruiser, WFCrewPirateRifle ]
    WFCrewEngineer: [ WFCrewPirateBruiser ]
    WFCrewMarine: [ WFCrewPirateRifle, WFCrewPirateRifle, WFCrewPirateBruiser ]
    WFCrewPilot: [ WFCrewPirateOfficer ]
    WFCrewRadioOperator: [ WFCrewPirateOfficer ]
    WFCrewCaptain: [ WFCrewPirateOfficer ]
    WFCrewGunner: [ WFCrewPirateBruiser, WFCrewPirateOfficer ]

# Fast enough to keep ahead of a hull that is not trying hard; the pilots stay short of the ceiling the raiders fly at.
- type: wfCrewNavigation
  id: WFCrewNavigationFugitive
  name: wf-crew-navigation-fugitive
  settings:
    cruiseSpeed: 20
    followSpeed: 20
    loiterSpeed: 12
    circleSpeed: 10
    attackSpeed: 14
    nearTargetSpeed: 6
    maximumTurnRate: 0.5
    thrustMultiplier: 1
    angularThrustMultiplier: 1
    dockApproachSpeed: 8
    dockCreepSpeed: 2.5
    undockSpeed: 6
    attackRange: 250

# A bail jumper in a small unarmed hull with a pilot. The easiest warrant on the board.
- type: wfEncounter
  id: WFEncounterFugitivePetty
  name: wf-encounter-name-fugitive-petty
  start: Scheduled
  category: Threat
  icon: Skull
  cost: 1
  weight: 2
  minPlayers: 2
  cooldown: 2400
  duration: 2400
  minDistance: 2500
  maxDistance: 4500
  stationClearance: 2500
  bounty:
    ship: fugitive
    target: Captain
    spesos: 12000
    title: wf-bounty-title-fugitive-petty
    description: wf-bounty-desc-fugitive-petty
    broadcast: wf-bounty-broadcast-fugitive
  ships:
  - key: fugitive
    navigation: WFCrewNavigationFreight
    vessels: [ Piva, Twilight ]
    side: fugitive
    profile: WFCrewProfileFugitive
    roles: [ WFCrewCaptain, WFCrewPilot ]
    deckhands: 0
    skill: Green
    distress: false
    evades: false
    flees: 1200
    disengage: Deter
    disengageRange: 800
    wander: 8
    wanderRadius: 2500
    wanderPause: 20
    objectives:
    - kind: Hold

