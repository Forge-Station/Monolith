#region Weapons
- type: entity
  id: BorgModuleForerunnerWeaponHeavy
  parent: [ BaseBorgModule, BaseProviderBorgModule ]
  name: pre-fracture advanced weapon cyborg module
  components:
  - type: Sprite
    sprite: _Forge/Objects/Specific/Robotics/borgmodule.rsi
    layers:
    - state: forerunner
    - state: icon-forerunner
  - type: ItemBorgModule
    moduleId: Security
    items:
    - WeaponPhaseBladeForge
    - WeaponRifleADMAutopulserForge
  - type: BorgModuleIcon
    icon: { sprite: _Forge/Interface/Action/actions_borg.rsi, state: advanced-weapon-module }

