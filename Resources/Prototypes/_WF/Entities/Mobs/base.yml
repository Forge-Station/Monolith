  - type: RandomHumanoidAppearance
    randomizeName: true
  - type: InputMover
  - type: MobMover
  - type: NpcFactionMember
    factions:
    - SimpleNeutral
  - type: HTN
    rootTask:
      task: WFCavernWalkerCompound
    blackboard:
      FollowCloseRange: !type:Single
        1.5
      FollowRange: !type:Single
        3
      IdleRange: !type:Single
        2

- type: entity
  abstract: true
  parent: WFCavernPersonBase
  id: WFMobTunnelRaiderBase
  components:
  - type: NpcFactionMember
    factions:
    - SimpleHostile
  - type: HTN
    rootTask:
      task: WFCavernRaiderCompound
  - type: NPCRetaliation
    attackMemoryLength: 10
  - type: WFNpcIntent
    set: WFIntentsTunnelRaider
    holds: true
  - type: WFCavernRaider
    loot:
    - ScrapSteel
    - PartRodMetal1
  - type: WFCavernTelegraph
    sound:
      collection: WFCavernEncounterRaiderChatter
    minInterval: 15
    maxInterval: 35

