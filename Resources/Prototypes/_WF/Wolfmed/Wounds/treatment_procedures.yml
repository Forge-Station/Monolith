# UI4: the analyzer's treatment procedures, one per wound prototype and one per part or body
# condition, plus a Mechanical variant wherever a chassis is treated differently.
#
# Each step names the item or reagent it is done with (drawn as that prototype's sprite) and the
# checks that grey the row out once the analyzer says it has been done. A step with no checks is
# never greyed on its own; the whole procedure greys when the finding is gone.
# Ids are derived by WolfmedTreatmentAdvice and a coverage test iterates every wound prototype.

