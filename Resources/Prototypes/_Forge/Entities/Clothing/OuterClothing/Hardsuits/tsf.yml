# TSFMC M82c hardsuit
- type: entity
  parent: [ ClothingOuterHardsuitBase, BaseFactionGearTSFT1, ClothingFlightProfileEasy]
  id: ClothingOuterHardsuitTSFMCM82c
  name: TSFMC M82c hardsuit
  description: A hardsuit issued to marines operating in low-pressure and high-risk environments. Specialized in bullet protection.
  components:
  - type: Sprite
    sprite: _Forge/Clothing/OuterClothing/Hardsuits/tsf_kalenval.rsi
  - type: Item
    size: Huge
  - type: Clothing
    sprite: _Forge/Clothing/OuterClothing/Hardsuits/tsf_kalenval.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.05
    lowPressureMultiplier: 1000
  - type: ExplosionResistance
    damageCoefficient: 0.75
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.6
        Slash: 0.6
        Piercing: 0.4
        Heat: 0.5
        Radiation: 0.3
        Caustic: 0.8
  - type: StaminaDamageResistance
    coefficient: 0.3
  - type: ClothingSpeedModifier
    walkModifier: 0.925
    sprintModifier: 0.925
  - type: HeldSpeedModifier
  - type: ToggleableClothing
    requiredSlot: outerclothing
    blockUnequipWhenAttached: false
    replaceCurrentClothing: true
    clothingPrototypes:
      head: ClothingHeadHelmetHardsuitTSFMCM82c
      helmetcover: ClothingHeadHelmetCoverBlock
      helmetattachment: ClothingHeadHelmetAttachmentBlock
  - type: StaticPrice
    price: 5000
    vendPrice: 7500

