# TSFMC M93-S stealth suit
- type: entity
  parent: [ClothingHeadHardsuitBaseMilitary, BaseToggleClothing, PowerCellSlotSmallItem, ClothingNightVision4TSFMC, ShowSecurityIcons]
  id: ClothingHeadHelmetHardsuitTSFMCStealth
  name: TSFMC M93-S stealth suit helmet
  description: A high-tech stealth suit developed by TSFMC for special operations. High stealth capabilities, but medium mobility and protection.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Forge/Clothing/Head/Hardsuits/tsf_stealth_mark1.rsi
  - type: Clothing
    sprite: _Forge/Clothing/Head/Hardsuits/tsf_stealth_mark1.rsi
    equippedState: off-equipped-HELMET
  - type: PressureProtection
    highPressureMultiplier: 0.08
    lowPressureMultiplier: 1000
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.95
        Slash: 0.95
        Piercing: 0.95
        Heat: 0.95
  - type: HideLayerClothing
    slots:
    - Hair
    - Snout
    - HeadTop
    - HeadSide
  - type: ThermalVision
    flashDurationMultiplier: 2
    pulseTime: 3
    isEquipment: true
    toggleAction: PulseThermalVision
  - type: ToggleClothing
    action: ActionTogglePhaseCloak
    disableOnUnequip: true
  - type: ComponentToggler
    parent: true
    components:
    - type: Stealth
      minVisibility: 0.01
      maxVisibility: 1
      damageVisibilityModifier: 1
      attackVisibilityModifier: 1
    - type: StealthOnMove
      passiveVisibilityRate: -0.2
      movementVisibilityRate: 0
  - type: UseDelay
    delay: 2
  - type: PowerCellDraw
    drawRate: 2
  - type: ToggleCellDraw
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default

