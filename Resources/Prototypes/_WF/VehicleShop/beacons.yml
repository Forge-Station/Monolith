# One use: the frame and every fitted part of a civilian vehicle made whole.
- type: entity
  parent: BaseItem
  id: WFVehicleRepairKit
  name: vehicle repair box
  description: Parts, plates, sealant and a manual. Enough to put one civilian vehicle right, once.
  components:
  - type: Item
    size: Normal
    sprite: Objects/Tools/Toolboxes/toolbox_yellow.rsi
  - type: Sprite
    sprite: Objects/Tools/Toolboxes/toolbox_yellow.rsi
    state: icon
  - type: WFVehicleRepairKit
  - type: StaticPrice
    price: 400
    vendPrice: 3000
