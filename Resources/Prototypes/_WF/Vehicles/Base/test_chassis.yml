# A bare driveable box: the grid mover, the two fixtures every RMC vehicle has and the spawn defaults a Wolfgate vehicle
# base gets. The integration tests spawn it; the real vehicles build on RMCVehicleBase.
- type: entity
  id: WFVehicleTestChassis
  categories: [ HideSpawnMenu, WFVehicles ]
  # A saved vehicle would point at an interior map that is gone on load.
  save: false
  components:
  # Hull cleanup and an arriving ship's FTL sweep both delete loose entities; neither may take a vehicle.
  - type: CleanupImmune
  - type: FTLSmashImmune
  # Test vehicles carry test guns and turrets, so they count as military chassis.
  - type: WFMilitaryVehicle
  - type: StaticPrice
    price: 1000
  - type: RMCVehicle
    movementKind: Grid
  - type: GridVehicleMover
    maxSpeed: 6
    acceleration: 5
    deceleration: 12
    turnDelay: 0.25
  - type: InputMover
  - type: Physics
    bodyType: Dynamic
  - type: Fixtures
    fixtures:
      world:
        shape:
          !type:PhysShapeAabb
          bounds: -0.425,-1.2,0.425,1.2
        density: 1000
        mask:
        - Impassable
        - HighImpassable
        - LowImpassable
        - LargeMobLayer
        - Vehicle
        layer:
        - LargeMobLayer
        - Vehicle
      mob:
        shape:
          !type:PhysShapeAabb
          bounds: -0.425,-1.2,0.425,1.2
        density: 1000
        mask:
        - MidImpassable
        - LargeMobLayer
        layer:
        - LargeMobLayer

# The same box, strong enough to shove another vehicle out of its way; for the push chain tests.
- type: entity
  id: WFVehicleTestPusher
  parent: WFVehicleTestChassis
  categories: [ HideSpawnMenu ]
  components:
  - type: GridVehicleMover
    canPushVehicles: true

# The same box with car-style steering; for the steering tests.
- type: entity
  id: WFVehicleTestSteeredChassis
  parent: WFVehicleTestChassis
  categories: [ HideSpawnMenu ]
  components:
  - type: GridVehicleMover
    freeSteering: true
    maxRotationSpeedDegrees: 90
    rotationAccelerationDegrees: 360
    rotationDecelerationDegrees: 360

# A steered box that can turn on the spot, as a tracked vehicle does.
- type: entity
  id: WFVehicleTestSteeredTracked
  parent: WFVehicleTestSteeredChassis
  categories: [ HideSpawnMenu ]
  components:
  - type: GridVehicleMover
    turnInPlace: true

# A plow for the test chassis, and a chassis that carries one; for the plow tests.
- type: entity
  parent: BaseItem
  id: WFVehicleTestPlow
  categories: [ HideSpawnMenu, WFVehicles ]
  components:
  - type: Sprite
    sprite: _WF/Vehicles/hardpoints/humvee.rsi
    state: snowplow
  - type: VehiclePlow

- type: entity
  id: WFVehicleTestPlowChassis
  parent: WFVehicleTestChassis
  categories: [ HideSpawnMenu ]
  components:
  - type: ItemSlots
    slots:
      plow:
        startingItem: WFVehicleTestPlow
  - type: ContainerContainer
    containers:
      plow: !type:ContainerSlot

# The same with the engine force to grind a wall down from a standstill.
- type: entity
  id: WFVehicleTestPlowGrinder
  parent: WFVehicleTestPlowChassis
  categories: [ HideSpawnMenu ]
  components:
  - type: VehiclePlowChassis
    poweredDemolitionDamagePerSecond: 2000
    poweredDemolitionWarmup: 0.5
