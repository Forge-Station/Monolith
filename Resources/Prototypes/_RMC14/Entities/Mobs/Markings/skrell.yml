# Tails, which are intended to be completely opt-in
- type: marking
  id: RMCTailSkrellFringeShort
  bodyPart: Tail
  markingCategory: Tail
  speciesRestriction: [Skrell]
  layering: # WOLFGATE - the anatomy zone of the south frame draws behind the body, so the tail never covers anatomy
    skrell_shortfringetail_BEHIND: TailBehind
    skrell_shortfringetail_fringe_BEHIND: TailBehind
  colorLinks: # WOLFGATE - both halves of a tail share one colour
    skrell_shortfringetail_BEHIND: skrell_shortfringetail_FRONT
    skrell_shortfringetail_fringe_BEHIND: skrell_shortfringetail_fringe_FRONT
  sprites:
    - sprite: _WF/Mobs/Customization/TailSplit/_RMC14/Mobs/Skrells/tails.rsi # WOLFGATE - split art, anatomy zone only
      state: skrell_shortfringetail_FRONT
    - sprite: _WF/Mobs/Customization/TailSplit/_RMC14/Mobs/Skrells/tails.rsi # WOLFGATE - split art, anatomy zone only
      state: skrell_shortfringetail_fringe_FRONT
    - sprite: _WF/Mobs/Customization/TailSplit/_RMC14/Mobs/Skrells/tails.rsi # WOLFGATE - anatomy zone of the south frame on TailBehind
