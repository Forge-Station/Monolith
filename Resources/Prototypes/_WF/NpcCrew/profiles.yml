# An independent freighter's crew: every kind of spacer in working clothes. Hands fight only whoever attacks them; the officers defend
# themselves, and one of them may have the ship's only gun. One hand in five is a coward who runs for the bridge instead.
- type: wfCrewProfile
  id: WFCrewProfileHauler
  bodies:
  - WFMobCrewBodyHuman
  - WFMobCrewBodyHuman
  - WFMobCrewBodyHuman
  - WFMobCrewBodyReptilian
  - WFMobCrewBodyReptilian
  - WFMobCrewBodyDwarf
  - WFMobCrewBodyMoth
  - WFMobCrewBodyVulpkanin
  - WFMobCrewBodyVulpkanin
  - WFMobCrewBodyTajaran
  - WFMobCrewBodyTajaran
  - WFMobCrewBodyRodentia
  - WFMobCrewBodyArachnid
  skills: [ Green, Green, Regular ]
  engagement:
    WFCrewDeckhand: WhenAttacked
  cowards:
    WFCrewDeckhand: 0.2
  loadouts:
    WFCrewDeckhand:
    - WFCrewHaulerHandCargo
    - WFCrewHaulerHandCargo
    - WFCrewHaulerHandHazard
    - WFCrewHaulerHandOveralls
    - WFCrewHaulerHandEngineer
    - WFCrewHaulerHandWinter
    - WFCrewHaulerHandWrench
    - WFCrewHaulerHandCrowbar
    WFCrewEngineer: [ WFCrewHaulerHandEngineer, WFCrewHaulerHandWrench ]
    WFCrewPilot:
    - WFCrewHaulerOfficerPlain
    - WFCrewHaulerOfficerBomber
    - WFCrewHaulerOfficerCoat
    WFCrewRadioOperator:
    - WFCrewHaulerOfficerPlain
    - WFCrewHaulerOfficerBomber
    - WFCrewHaulerOfficerCoat
    - WFCrewHaulerOfficerSidearm
    WFCrewGunner:
    - WFCrewHaulerOfficerPlain
    - WFCrewHaulerOfficerBomber
    - WFCrewHaulerHandEngineer
    WFCrewCaptain:
    - WFCrewHaulerOfficerBomber
    - WFCrewHaulerOfficerCoat
    - WFCrewHaulerOfficerSidearm
    - WFCrewHaulerOfficerSidearm
    WFCrewMarine:
    - WFCrewHaulerGuardSidearm
    - WFCrewHaulerGuardSidearm
    - WFCrewHaulerGuardCarbine

