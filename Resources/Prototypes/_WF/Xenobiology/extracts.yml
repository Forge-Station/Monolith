# Ported from Goobstation via Trauma Station (Extracts).

- type: entity
  abstract: true
  parent: BaseItem
  id: BaseSlimeExtract
  name: slime extract
  description: Goo extracted from a slime. Legends claim these to have "magical powers".
  components:
  - type: Item
    size: Small
  - type: Sprite
    layers:
    - sprite: _WF/Xenobiology/Specific/Xenobiology/extract.rsi
      state: core
      color: "#828282"
  - type: Appearance
  - type: SolutionContainerManager
    solutions:
      extract:
        maxVol: 100
  - type: InjectableSolution
    solution: extract
  - type: DrawableSolution
    solution: extract
  - type: ExaminableSolution
    solution: extract
  - type: SlimeExtract
  - type: Reactive
  - type: StatusEffects
    allowed:
    - Jitter
  - type: GuideHelp
    guides:
    - Xenobiology

- type: entity
  id: GreySlimeExtract
  parent: BaseSlimeExtract
  name: grey slime extract
  components:
  - type: Sprite
    layers:
    - sprite: _WF/Xenobiology/Specific/Xenobiology/extract.rsi
      state: core
      color: "#828282"
  - type: Reactive
    reactions:
    - reagents:
      - Water
      methods:
      - Touch
      - Injection
      effects:
      - !type:XenobioReaction
        base: XenobioExtractReagent
        effects:
        - !type:XenobioAdjustSolution
          reagent: Epinephrine
          amount: 15
    - reagents:
      - Plasma
      methods:
      - Touch
      - Injection
      effects:
      - !type:XenobioReaction
        base: XenobioExtractEvil
        effects:
        - !type:Jitter
          time: 3
          frequency: 20
        - !type:XenobioSpawnEntity
          entity: MobSlimeXenobioBabyGreySpawner
          number: 3
    - reagents:
      - Blood
      methods:
      - Touch
      - Injection
      effects:
      - !type:XenobioReaction
        base: XenobioExtractReaction
        effects:
        - !type:XenobioSpawnEntity
          entity: MonkeyCube
          number: 3
  - type: Tag
    tags:
    - XenobiologyGreyExtract

