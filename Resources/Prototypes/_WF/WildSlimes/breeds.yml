# Wild breeds: no other breed mutates into these, so they come only from their worlds and from each other.

# Carcinoma's slime. Blood heals it, the Gut's acid barely touches it, and it still hates water.
- type: breed
  breedName: carcinoma slime
  id: WFCarcinomaMutation
  producedExtract: WFCarcinomaSlimeExtract
  components:
  - type: Slime
    breed: WFCarcinomaMutation
    slimeColor: "#d0505e"
    defaultSlimeProto: WFMobSlimeTranslucentBaby
    maxOffspring: 4
    mutationChance: 0.1
    potentialMutations:
    - WFMetastaticMutation
  # Grows and splits only in Carcinoma's body warmth.
  - type: WFSlimeClimate
    minTemperature: 300
    maxTemperature: 330
  - type: Damageable
    damageModifierSet: WFCarcinomaSlime
    damageContainer: Biological
  - type: Reactive
    groups:
      Flammable:
      - Touch
      Extinguish:
      - Touch
    reactions:
    - reagents:
      - Water
      - SpaceCleaner
      methods:
      - Touch
      effects:
      - !type:WashCreamPieReaction {}
    - reagents:
      - Water
      methods:
      - Touch
      effects:
      - !type:HealthChange
        damage:
          types:
            Caustic: 5
      - !type:PopupMessage
        type: Local
        messages:
        - slime-hurt-by-water-popup
        probability: 0.25
    - reagents:
      - Blood
      methods:
      - Touch
      effects:
      - !type:HealthChange
        damage:
          groups:
            Brute: -2
  - type: WFReagentBathHeal
    reagents:
    - Blood
    heal:
      groups:
        Brute: -1
        Burn: -1

# Bred only from carcinoma slimes; it breeds back to them.
- type: breed
  breedName: metastatic slime
  id: WFMetastaticMutation
