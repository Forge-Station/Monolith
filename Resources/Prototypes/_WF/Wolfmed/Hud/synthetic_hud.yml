# HUD: the wound-to-readout table the synthetic diagnostics overlay is built from. Every line a mechanical
# body puts on its own screen is one of these rows; nothing in the overlay hardcodes a fault string.
#
# A row is keyed either on a wound prototype or on a condition the body reports some other way. `severity`
# is the tag until `escalateAt`, then `escalated`. `advice` is the single line the SYSTEM block shows when
# this is the worst fault on the readout; the analyzer's own advice keys are whole paragraphs, so the HUD
# keeps its own terse ones here.

- type: syntheticHudLine
  id: WFSyntheticHudDent
  wound: WFWolfmedDentWound
  line: wolfmed-synthetic-line-dent
  severity: Info
  minSeverity: 10
  escalateAt: 60
  escalated: Warn
  advice: wolfmed-synthetic-advice-dent

- type: syntheticHudLine
  id: WFSyntheticHudBreach
  wound: WFWolfmedBreachWound
  line: wolfmed-synthetic-line-breach
  severity: Warn
  escalateAt: 60
  escalated: Crit
  advice: wolfmed-synthetic-advice-breach

- type: syntheticHudLine
  id: WFSyntheticHudShortCircuit
  wound: WFWolfmedShortCircuitWound
  line: wolfmed-synthetic-line-short-circuit
  severity: Warn
  escalateAt: 50
  escalated: Crit
  advice: wolfmed-synthetic-advice-short-circuit

- type: syntheticHudLine
  id: WFSyntheticHudServo
  wound: WFWolfmedServoDamageWound
  line: wolfmed-synthetic-line-servo
  severity: Crit
  escalateAt: 30
  escalated: Fail
  advice: wolfmed-synthetic-advice-servo

- type: syntheticHudLine
  id: WFSyntheticHudOverheating
  wound: WFWolfmedOverheatingWound
  line: wolfmed-synthetic-line-overheating
  severity: Warn
  escalateAt: 45
  escalated: Crit
  advice: wolfmed-synthetic-advice-overheating

- type: syntheticHudLine
  id: WFSyntheticHudChassisBreach
  wound: WFWolfmedChassisBreachWound
  line: wolfmed-synthetic-line-chassis-breach
  severity: Fail
  advice: wolfmed-synthetic-advice-chassis-breach

# The generic chassis total, which every damaged part carries. It only earns a row once the part is really
# hurt, or it would fill the readout on its own and push the specific findings off the bottom.
- type: syntheticHudLine
  id: WFSyntheticHudFrame
  wound: IpcMechanicalDamageWound
  line: wolfmed-synthetic-line-frame
  severity: Info
  minSeverity: 25
  escalateAt: 60
  escalated: Warn
  advice: wolfmed-synthetic-advice-frame

