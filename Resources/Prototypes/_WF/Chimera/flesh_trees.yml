- type: entity
  id: WFFleshTree
  parent: WFFleshTreeBase
  components:
  - type: RandomSprite
    available:
    - tree:
        tree01: ""
        tree02: ""
        tree03: ""
        tree04: ""
        tree05: ""
        tree06: ""
        tree07: ""
        tree08: ""
        tree09: ""
