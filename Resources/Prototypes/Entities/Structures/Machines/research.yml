- type: entity
  id: ResearchAndDevelopmentServer
  parent: [ BaseMachinePowered, ConstructibleMachine ]
  name: R&D server
  description: Contains the collective knowledge of the station's scientists. Destroying it would send them back to the stone age. You don't want that do you?
  components:
  - type: Sprite
    sprite: Structures/Machines/server.rsi
    layers:
      - state: server
      - state: variant-research
      - state: server_o
        map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: ResearchServer
  - type: TechnologyDatabase
    supportedDisciplines:
    - Industrial
    - Arsenal
    - Experimental
    - ShipArmory
    - CivilianServices
    - MechaEngineering
    - FactionUniversal
  - type: ApcPowerReceiver
    powerLoad: 200
  - type: ExtensionCableReceiver
  - type: WiresPanel
  - type: WiresVisuals
  - type: Machine
    board: ResearchAndDevelopmentServerMachineCircuitboard
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 600
      behaviors:
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 1
            max: 2
  - type: Appearance
  - type: AmbientOnPowered
  - type: AmbientSound
    volume: -9
    range: 5
    sound:
      path: /Audio/Ambience/Objects/server_fans.ogg
  - type: ContainerContainer
    containers:
      machine_board: !type:Container
      machine_parts: !type:Container
      disk_slot: !type:ContainerSlot
        showEnts: false
        occludes: true
        ent: null
  - type: ItemSlots
    slots:
      disk_slot:
        name: disk-slot-name
        insertSound: /Audio/Machines/terminal_insert_disc.ogg
        ejectSound: /Audio/Machines/terminal_insert_disc.ogg
        whitelist:
          components:
          - DisciplinesDisk
  - type: GuideHelp
    guides:
    - Science

- type: entity
  abstract: true # Mono: Abstract
  id: BaseResearchAndDevelopmentPointSource
  parent: DatafarmResearchFaction # Mono: Changed to parent off of new research generation servers to replace existing mapped generators
  name: bolted data farm (Research) # Mono
  suffix: Unused
  description: A power-hungry server dedicated towards scraping data from... somewhere. This one generates research points at a rate of 200 per second. It seems to be bolted to the floor. # Mono
  # We should make this abstract once there are actual point sources.
  components:
  - type: ResearchClient
  - type: ResearchPointSource
    pointsPerSecond: 200
    active: true
  - type: PointLight
    radius: 1.5
    energy: 1.5
    color: "#93005b"
  - type: Sprite # Mono: Changed sprite
    sprite: _Mono/Structures/Machines/neapolitan_server.rsi
    layers:
    - state: icon
    - state: unlit
      shader: unshaded
      map: [ "enum.PowerDeviceVisualLayers.Powered" ]
    - state: stripe
      color: "#b3aa79"
    - state: stripe2
      color: "#5b0093"
