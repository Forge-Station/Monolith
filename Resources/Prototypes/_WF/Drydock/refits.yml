# The landing thruster kit's conversion, done by the cranes on every linear thruster and kept through repairs. Priced
# per thruster at twice the kit's value, in the kit's own materials. Combines with the thruster line.
- type: wfShipRefit
  id: WFRefitLandingThrusters
  name: drydock-upgrade-landing-thrusters
  mark: drydock-upgrade-landing-thrusters-mark
  lamp: drydock-upgrade-landing-thrusters-lamp
  effect: !type:WFLandingThrusterRefit
  tiers:
  - price: 800
    materials:
      Steel: 1500
      Plastic: 500
      Glass: 300

# Durasteel plating: every plastitanium wall replaced in place by its durasteel wall, five thirds as tough. At 1,000 cr a
# wall, about three quarters of what a hull is worth per wall, plating a whole hull costs most of what the hull did. A
# mobile drydock bills 15 plasteel and 5 plastitanium units per wall, so plating a Luda (398 walls) takes about 60
# plasteel and 20 plastitanium sheets.
- type: wfShipRefit
  id: WFRefitDurasteel
  name: drydock-upgrade-durasteel
  mark: drydock-upgrade-durasteel-mark
  lamp: drydock-upgrade-durasteel-lamp
  effect: !type:WFHullPlatingRefit
    plating:
      WallPlastitanium: WFWallDurasteel
      WallPlastitaniumDiagonal: WFWallDurasteelDiagonal
      WallPlastitaniumCapital: WFWallDurasteelCapital
      WallPlastitaniumDiagonalCapital: WFWallDurasteelDiagonalCapital
  tiers:
  - price: 1000
    materials:
      Plasteel: 15
      Plastitanium: 5
