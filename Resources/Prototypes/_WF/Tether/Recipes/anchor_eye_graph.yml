# 2 steel + 1 rod, welder to finish. Deconstruct: welder then wrench, returns the materials.
- type: constructionGraph
  id: TetherAnchorEye
  start: start
  graph:
  - node: start
    edges:
    - to: eye
      steps:
      - material: Steel
        amount: 2
      - material: MetalRod
        amount: 1
      - tool: Welding
        doAfter: 3

  - node: eye
    entity: TetherAnchorEye
    edges:
    - to: start
      completed:
      - !type:SpawnPrototype
        prototype: SheetSteel1
        amount: 2
      - !type:SpawnPrototype
        prototype: PartRodMetal1
        amount: 1
      - !type:DeleteEntity {}
      steps:
      - tool: Welding
        doAfter: 2
      - tool: Anchoring
        doAfter: 2
