#region Hydroponic
- type: entity
  parent: BaseComputerAiAccess
  id: ComputerHydroponics
  name: hydroponics tray console
  description: Lists every hydroponics tray linked with a network configurator and reports plant health, atmosphere needs, and mutations.
  components:
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: generic
    - map: ["computerLayerKeys"]
      state: generic_keys
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: generic_panel_open
  - type: HydroponicsConsole
  - type: DeviceNetwork
    deviceNetId: Wired
    receiveFrequencyId: BasicDevice
    prefix: device-address-prefix-hydroponics-console
  - type: WiredNetworkConnection
  - type: DeviceList
    deviceLimit: 32
  - type: ActivatableUI
    key: enum.HydroponicsConsoleUiKey.Key
  - type: UserInterface
    interfaces:
      enum.HydroponicsConsoleUiKey.Key:
        type: HydroponicsConsoleBoundUserInterface
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
  - type: Computer
    board: HydroponicsConsoleCircuitboard
  - type: PointLight
    radius: 1.5
    energy: 1.6
    color: "#67d64b"
  - type: GuideHelp
    guides:
    - Botany
  - type: ShipRepairable
    repairTime: 4
    repairCost: 8

- type: entity
  parent: BaseComputerCircuitboard
  id: HydroponicsConsoleCircuitboard
  name: hydroponics tray console board
  description: A computer printed circuit board for a hydroponics tray console.
  components:
  - type: Sprite
    state: cpu_service
  - type: ComputerBoard
    prototype: ComputerHydroponics

#region Other
- type: entity
  parent: [BaseStructureDisableToolUse, BaseComputerAiAccess]
  id: RemnantMultitoolConsole
  name: remnant signal console
  description: A precursor console with renameable signal buttons. Probe it with a multitool to read stored text. Button labels and Message are set in mapping.
  suffix: Forge, Remnant
  components:
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: generic
    - map: ["computerLayerKeys"]
      state: generic_keys
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: generic_panel_open
  - type: ApcPowerReceiver
    needsPower: false
  - type: RemnantConsole
    message: remnant-console-default-message
    buttons:
    - port: RemnantButton1
      label: remnant-console-button-1
    - port: RemnantButton2
      label: remnant-console-button-2
    - port: RemnantButton3
      label: remnant-console-button-3
    - port: RemnantButton4
      label: remnant-console-button-4
  - type: ActivatableUI
    key: enum.RemnantConsoleUiKey.Key
  - type: UserInterface
    interfaces:
      enum.RemnantConsoleUiKey.Key:
        type: RemnantConsoleBoundUserInterface
  - type: DeviceNetwork
    deviceNetId: Wireless
  - type: WirelessNetworkConnection
    range: 200
  - type: DeviceLinkSource
    ports:
    - RemnantButton1
    - RemnantButton2
    - RemnantButton3
    - RemnantButton4

