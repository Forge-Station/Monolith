#reinforced secret door
- type: entity
  id: ReinforcedSecretDoorAssembly
  name: secret reinforced door assembly
  parent: BaseSecretDoorAssembly
  components:
  - type: Sprite
    sprite: _NF/Structures/Doors/secret_door_reinforced.rsi
    state: assembly
  - type: Construction
    graph: ReinforcedSecretDoorGraph
    node: assembly

- type: entity
  id: SolidReinforcedSecretDoor
  name: reinforced wall
  parent: BaseSecretDoor
  components:
  - type: Construction
    graph: ReinforcedSecretDoorGraph
    node: ReinforcedSecretDoorNode
    containers:
    - battery-container
  - type: Sprite
    sprite: _NF/Structures/Doors/secret_door_reinforced.rsi
  - type: IconSmooth
    key: walls
    states:
    - !type:CardinalCornerSpriteSmoothing
      rsi: Structures/Walls/solid-reinforced.rsi
      mask: [ walls, walls-plastitanium ]
      altMask:
      - windows
      - windows-reinf
      - windows-tinted
      - windows-plasma
      - windows-plasma-reinf
      - windows-uranium
      - windows-uranium-reinf
      - windows-exo
      - windows-shuttle
      - windows-plastitanium
      - windows-regal
      - walls-exo
      - walls-shuttle
      - walls-material
      - walls-marble
      - grilles
      - doors
      base: wall

