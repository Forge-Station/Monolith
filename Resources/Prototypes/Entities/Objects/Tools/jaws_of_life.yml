- type: entity
  name: jaws of life
  parent: [BaseItem, RecyclableItemSteelMedium] # Frontier: added RecyclableItemSteelMedium
  id: JawsOfLife
  description: A set of jaws of life, compressed through the magic of science.
  components:
  # WOLFGATE(Wolfmed) START: a blunt weapon can execute, with bludgeoning lines in place of the throat-slitting ones
  - type: Execution
    internalMeleeExecutionMessage: wolfmed-execution-bludgeon-initial-internal
    externalMeleeExecutionMessage: wolfmed-execution-bludgeon-initial-external
    completeInternalMeleeExecutionMessage: wolfmed-execution-bludgeon-complete-internal
    completeExternalMeleeExecutionMessage: wolfmed-execution-bludgeon-complete-external
    internalSelfExecutionMessage: wolfmed-execution-bludgeon-self-initial-internal
    externalSelfExecutionMessage: wolfmed-execution-bludgeon-self-initial-external
    completeInternalSelfExecutionMessage: wolfmed-execution-bludgeon-self-complete-internal
    completeExternalSelfExecutionMessage: wolfmed-execution-bludgeon-self-complete-external
  # WOLFGATE END
  - type: Tag
    tags:
    - JawsOfLife
  - type: Sprite
    sprite: _Forge/Objects/Tools/Standart/jaws_of_life.rsi
    state: jaws_pry
  - type: Item
    size: Normal
  - type: Clothing
    sprite: _Forge/Objects/Tools/Standart/jaws_of_life.rsi
    quickEquip: false
    slots:
      - Belt
  - type: ToolTileCompatible
    delay: 0.5
  - type: Tool
    qualities:
      - Prying
    useSound: /Audio/Items/jaws_pry.ogg
  - type: Prying
    speedModifier: 1.5
    pryPowered: true
    useSound: /Audio/Items/jaws_pry.ogg
  - type: UseDelay # Goobstation - For insta prying
    delay: 1
  - type: MultipleTool
    statusShowBehavior: true
    entries:
      - behavior: Prying
        sprite:
          sprite: _Forge/Objects/Tools/Standart/jaws_of_life.rsi
          state: jaws_pry
        useSound: /Audio/Items/jaws_pry.ogg
        changeSound: /Audio/Items/change_jaws.ogg
      - behavior: Cutting
        sprite:
          sprite: _Forge/Objects/Tools/Standart/jaws_of_life.rsi
          state: jaws_cutter
        useSound: /Audio/Items/jaws_cut.ogg
        changeSound: /Audio/Items/change_jaws.ogg
  - type: MeleeWeapon
    wideAnimationRotation: 90
    damage:
      types:
        Blunt: 20
    soundHit:
      collection: MetalThud
  - type: NailClipper # Mono
    allowedClawTypes: ["SharpClaw"]

- type: entity
  name: advanced jaws of life # Mono
  parent: JawsOfLife # Mono # Forge-Change-delete: BaseFactionGearPDVT1
  id: SyndicateJawsOfLife
  description: Useful for entering the station or its departments.
  components:
  - type: Sprite
    sprite: _Forge/Objects/Tools/Standart/jaws_of_life.rsi
    state: syn_jaws_pry
  - type: Item
    inhandVisuals:
      left:
      - state: syn_inhand-left
      right:
      - state: syn_inhand-right
    size: Normal
  - type: Prying
    speedModifier: 3.0
  - type: MultipleTool
    entries:
      - behavior: Prying
        sprite:
          sprite: _Forge/Objects/Tools/Standart/jaws_of_life.rsi
          state: syn_jaws_pry
        useSound: /Audio/Items/jaws_pry.ogg
        changeSound: /Audio/Items/change_jaws.ogg
      - behavior: Cutting
        sprite:
          sprite: _Forge/Objects/Tools/Standart/jaws_of_life.rsi
          state: syn_jaws_cutter
        useSound: /Audio/Items/jaws_cut.ogg
        changeSound: /Audio/Items/change_jaws.ogg
