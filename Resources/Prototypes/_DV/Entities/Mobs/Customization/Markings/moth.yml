- type: marking
  id: MothWingsClassicSelene
  bodyPart: Tail
  markingCategory: Tail
  forcedColoring: true
  speciesRestriction: [Moth, ProtoMoth]
  coloring:
    default:
      type:
        !type:SimpleColoring
          color: "#FFFFFF"
  layering: # WOLFGATE - the anatomy zone of the south frame draws behind the body, so the tail never covers anatomy
    selene_BEHIND: TailBehind
  colorLinks: # WOLFGATE - both halves of a tail share one colour
    selene_BEHIND: selene_FRONT
  sprites:
  - sprite: _WF/Mobs/Customization/TailSplit/_DV/Mobs/Customization/Moth/moth_wings.rsi # WOLFGATE - split art, anatomy zone only
    state: selene_FRONT
  - sprite: _WF/Mobs/Customization/TailSplit/_DV/Mobs/Customization/Moth/moth_wings.rsi # WOLFGATE - anatomy zone of the south frame on TailBehind
    state: selene_BEHIND

