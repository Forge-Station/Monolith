- type: marking
  id: HarpyTailForkedWhitescale
  bodyPart: Tail
  markingCategory: Tail
  speciesRestriction: [Harpy]
  coloring:
    default:
      type:
        !type:CategoryColoring
          category: Hair
      fallbackTypes:
        - !type:SimpleColoring
  layering: # WOLFGATE - the anatomy zone of the south frame draws behind the body, so the tail never covers anatomy
    whitescale_forked_tailfin_BEHIND: TailBehind
  colorLinks: # WOLFGATE - both halves of a tail share one colour
    whitescale_forked_tailfin_BEHIND: whitescale_forked_tailfin_FRONT
  sprites:
    - sprite: _WF/Mobs/Customization/TailSplit/_EE/Mobs/Customization/Harpy/harpy_tails.rsi # WOLFGATE - split art, anatomy zone only
      state: whitescale_forked_tailfin_FRONT
    - sprite: _WF/Mobs/Customization/TailSplit/_EE/Mobs/Customization/Harpy/harpy_tails.rsi # WOLFGATE - anatomy zone of the south frame on TailBehind
      state: whitescale_forked_tailfin_BEHIND

