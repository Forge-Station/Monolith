name: FTL Localization

on:
  push:
    branches: [ main, staging, stable ]
  merge_group:
  pull_request:
    types: [ opened, reopened, synchronize, ready_for_review ]
    branches: [ main, staging, stable ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-localization:
    name: Check FTL Localization
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Run checker tests
        run: python -m unittest discover -s .github/ftlchecker -p "test_*.py" -v

      - name: Check C# localization keys
        id: csharp-check
        continue-on-error: true
        run: python ".github/ftlchecker/check_c#_ftl.py"

      - name: Check prototype localization keys
        id: prototype-check
        continue-on-error: true
        run: python .github/ftlchecker/check_prototype_ftl.py

      - name: Fail if a localization check found issues
        if: ${{ steps.csharp-check.outcome == 'failure' || steps.prototype-check.outcome == 'failure' }}
        run: exit 1
