- type: entity
  categories: [ HideSpawnMenu ]
  id: ForgeVoidDrakeStarfireGun
  name: drake starfire lung
  description: For breathing dying stars.
  components:
  - type: RechargeBasicEntityAmmo
    rechargeCooldown: 1.4
    rechargeSound:
      path: /Audio/Animals/space_dragon_roar.ogg
  - type: BasicEntityAmmoProvider
    proto: ProjectileForgeVoidDrakeStarfire
    capacity: 1
    count: 1
  - type: Gun
    soundGunshot:
      path: /Audio/Magic/fireball.ogg
    soundEmpty: null
    projectileSpeed: 32

- type: entity
  categories: [ HideSpawnMenu ]
  parent: BaseBulletTrigger
  id: ProjectileForgeVoidDrakeStarfire
  name: starfire
  description: A condensed shard of a dying star.
  components:
  - type: PointLight
    color: "#C44DFF"
    radius: 3.5
    energy: 6.0
  - type: Sprite
    sprite: _Forge/Mobs/Leviathans/projectiles.rsi
    layers:
    - state: starfire
      shader: unshaded
  - type: Projectile
    damage:
      types:
        Heat: 80
        Structural: 1400
  - type: IgnitionSource
    temperature: 1200
    ignited: true
  - type: RepeatingTrigger
    delay: 0.4
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: Default
    totalIntensity: 120
    intensitySlope: 4
    maxIntensity: 40
    canCreateVacuum: false
    deleteAfterExplosion: false
    repeatable: true
  - type: TimedDespawn
    lifetime: 4

- type: entity
  categories: [ HideSpawnMenu ]
  id: ForgeVoidWormAcidGun
  name: void worm gland
  description: Spits cosmic acid.
  components:
  - type: RechargeBasicEntityAmmo
    rechargeCooldown: 4
    rechargeSound:
      path: /Audio/Effects/Fluids/splat.ogg
  - type: BasicEntityAmmoProvider
    proto: ProjectileForgeVoidWormAcid
    capacity: 1
    count: 1
  - type: Gun
    soundGunshot:
      path: /Audio/Effects/Fluids/splat.ogg
    soundEmpty: null
    projectileSpeed: 16

- type: entity
  categories: [ HideSpawnMenu ]
  parent: BaseBulletTrigger
  id: ProjectileForgeVoidWormAcid
  name: void acid
  description: Do not lick.
  components:
  - type: PointLight
    color: "#5DFFC8"
    radius: 2.2
    energy: 3.5
  - type: Sprite
    sprite: _Forge/Mobs/Leviathans/projectiles.rsi
    layers:
    - state: acid
      shader: unshaded
  - type: Projectile
    deleteOnCollide: true
    damage:
      types:
        Caustic: 28
        Poison: 8
        Structural: 25
  - type: TimedDespawn
    lifetime: 3.5

- type: entity
  id: ActionForgeVoidDrakeStarfire
  name: "[color=#c44dff]Starfire Breath[/color]"
  description: Exhale a shard of a dying star. Melts hulls and cooks anyone in the way.
  categories: [ HideSpawnMenu ]
  components:
  - type: WorldTargetAction
    icon:
      sprite: _Forge/Interface/Actions/leviathans.rsi
      state: starfire
    event: !type:ActionGunShootEvent
    priority: 2
    checkCanAccess: false
    checkCanInteract: false
    range: 0
    itemIconStyle: BigAction

