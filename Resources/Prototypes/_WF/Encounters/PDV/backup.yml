# A Dynasty gunboat has been jumped by a Federation strike pair and calls for backup. Shoot the Federation ships and the Dynasty
# boat takes you for an ally and pays when they are beaten; Dynasty players get data chits as well. Shoot the Dynasty boat and
# the strike pair leaves you be, but they pay nothing: what you can take off the wreck is the reward.
