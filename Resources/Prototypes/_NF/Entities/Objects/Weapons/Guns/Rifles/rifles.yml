- type: entity
  id: WeaponRifleSVS
  name: NCI SVS-42 (7.62x54mmR)
  parent: [ BaseWeaponRifle, BaseGunMelee ]
  description: "Originally designed by Samonov, this old surplus rifle looks like it's seen a few wars. Uses low capacity 10 rounder 762x54mmR magazines. Equipped with bayonet."
  components:
  - type: Sprite
    sprite: _NF/Objects/Weapons/Guns/Rifles/svs42.rsi
    layers:
      - state: mag-0
        map: ["enum.GunVisualLayers.Mag"]
      - state: base
        map: ["enum.GunVisualLayers.Base"]
  - type: Clothing
    sprite: _NF/Objects/Weapons/Guns/Rifles/svs42.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: Item # Forge-change
    size: Huge # Forge-change
    shape: # Forge-change
    - 0,0,4,3 # Forge-change
  - type: GunWieldBonus # Forge-change
    minAngle: 0 # Forge-change
    maxAngle: 0 # Forge-change
  - type: GunRequiresWield # Forge-change
  - type: Gun
    fireRate: 1.8 # Forge-change 1.9->1.8
    projectileSpeed: 55 # Forge-change
    angleIncrease: 1.5 # Forge-change
    angleDecay: 2 # Forge-change
    minAngle: 2 # Forge-change
    maxAngle: 8 # Forge-change
    selectedMode: SemiAuto
    availableModes:
      - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/rifle2.ogg
  - type: ChamberMagazineAmmoProvider
    soundRack:
      path: /Audio/Weapons/Guns/Cock/ltrifle_cock.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: Magazine762x54mmRFMJ
        insertSound: /Audio/Weapons/Guns/MagIn/ltrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/ltrifle_magout.ogg
        priority: 2
        whitelist:
          tags:
            - Magazine762x54mmRFMJ
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        startingItem: Cartridge762x54mmRFMJ
        priority: 1
        whitelist:
          tags:
            - Cartridge762x54mmRFMJ
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
  - type: CursorOffsetRequiresWield
  - type: EyeCursorOffset
    maxOffset: 1.5
    pvsIncrease: 0.15
  - type: SpeedModifiedOnWield # Mono
    walkModifier: 0.9 # Forge-change 0.95->0.9
    sprintModifier: 0.9 # Forge-change 0.95->0.9
  - type: AltFireMelee
    attackType: Light
  - type: PirateBountyItem # Mono
    id: StandardFactionLongarm

