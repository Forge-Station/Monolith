  id: SeniorOfficerSheath
  name: ножны сабли Старшего офицера
  description: Ножны для сабли Старшего офицера.
  components:
  - type: Sprite
    sprite: _Forge/Objects/Weapons/Melee/sheath_tsf.rsi
    state: sheath
  - type: Clothing
    sprite: _Forge/Objects/Weapons/Melee/sheath_tsf.rsi
  - type: ItemSlots
    slots:
      item:
        name: Сабля
        insertVerbText: sheath-insert-verb
        ejectVerbText: sheath-eject-verb
        insertSound: /Audio/Items/sheath.ogg
        ejectSound: /Audio/Items/unsheath.ogg
        whitelist:
          tags:
          - SeniorOfficerSabre
  - type: ItemMapper
    mapLayers:
      sheath-sabre:
        whitelist:
          tags:
          - SeniorOfficerSabre
  - type: Appearance

- type: entity
  id: SeniorOfficerSheathFilled
  parent: SeniorOfficerSheath
  suffix: Заполненные
  components:
  - type: ContainerFill
    containers:
      item:
      - MeleeSeniorOfficer


