# The base slime's resistances, and the Gut's digestive acid barely hurts. Water's harm ignores resistances.
- type: damageModifierSet
  id: WFCarcinomaSlime
  coefficients:
    Blunt: 0.6
    Slash: 1.2
    Piercing: 1.2
    Cold: 1.5
    Poison: 0.8
    Cellular: 0.2
    Caustic: 0.1
