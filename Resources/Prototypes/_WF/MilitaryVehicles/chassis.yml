        startingItem: VehicleTankArmorBallistic
        disableEject: true
        whitelist:
          components:
          - HardpointItem
      primary:
        startingItem: VehicleTankTurretPMC
        disableEject: true
        whitelist:
          components:
          - HardpointItem
      secondary:
        disableEject: true
        whitelist:
          components:
          - HardpointItem
      support:
        disableEject: true
        whitelist:
          components:
          - HardpointItem
      wheel-1:
        startingItem: VehicleTankTreads
