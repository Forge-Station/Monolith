# Spits an ember at anything that comes within five metres. Grows by the lava.
- type: entity
  id: WFEmberSpit
  parent: BaseBullet
  name: ember
  categories: [HideSpawnMenu]
  components:
  - type: Projectile
    damage:
      types:
        Heat: 5
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/magic.rsi
    layers:
    - state: fireball
      shader: unshaded
    scale: 0.5, 0.5
  - type: PointLight
    color: "#E25822"
    radius: 1.5
    energy: 3.0
  - type: IgniteOnCollide
    fireStacks: 0.3
  - type: Ammo
    muzzleFlash: null

- type: entity
  id: WFFloraPlasmaSpitter
  parent: TgFloraAshPlasmaFlower
  components:
  - type: Sprite
    layers:
    - state: plasma_flower1
      map: ["flower"]
      color: "#ff9a5a"
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.WFReactiveFloraVisuals.State:
        flower:
          Idle: { scale: "1,1", color: "#ff9a5a" }
          Armed: { scale: "1.2,1.2", color: "#ffe08a" }
          Spent: { scale: "1,1", color: "#ff9a5a" }
  - type: WFReactiveFlora
    behaviour: Spit
    range: 5
    cooldown: 10
    checkInterval: 1
    ignoreFactions: [Xeno]
    projectile: WFEmberSpit
    projectileSpeed: 9
    sound:
      collection: WFFloraSpit
    popup: wf-flora-spitter-spit

# Puffs a short smoke cloud with a weak toxin when someone passes close.
- type: entity
  id: WFFloraAshLung
  parent: TgFloraAshVahrezjia
  components:
  - type: Sprite
    layers:
    - state: flowerpod1
      map: ["pod"]
      color: "#b8a89a"
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.WFReactiveFloraVisuals.State:
        pod:
          Idle: { scale: "1,1", color: "#b8a89a" }
          Armed: { scale: "1.4,1.4", color: "#d8cfc4" }
          Spent: { scale: "1,1", color: "#b8a89a" }
  - type: WFReactiveFlora
    behaviour: Cloud
    range: 1.3
    cooldown: 20
    checkInterval: 0.75
    ignoreFactions: [Xeno]
    activeTime: 1.5
    sound:
      collection: WFFloraSporePuff
    popup: wf-flora-ashlung-puff
    cloudPrototype: Smoke
    cloudDuration: 5
    cloudSpread: 3
    solution:
      reagents:
      - ReagentId: Toxin
        Quantity: 4
