# Verda (Asclepiu): the DI/RMC ground and scenery behind its biome (biomes.yml, open_biomes.yml).
# Every outdoor tile is a weather child of an imported floor, set up as the planet's own ground is (FloorPlanetGrass):
# open to the weather, bare ground to build on, not pried up or blown apart. The imports do none of that.
# A tile's words classify it on the orbit map (WFPlanetMapSystem): sand|dirt|mud, then grass, then snow.

- type: tile
  id: WFFloorVerdaMeadowGrass
  parent: FloorGrassLight
  weather: true
  isSubfloor: true
  indestructible: true
  baseTurf: FloorPlanetDirt
  deconstructTools: []

- type: tile
  id: WFFloorVerdaForestGrass
  parent: FloorGrassDark
  weather: true
  isSubfloor: true
  indestructible: true
  baseTurf: FloorPlanetDirt
  deconstructTools: []

