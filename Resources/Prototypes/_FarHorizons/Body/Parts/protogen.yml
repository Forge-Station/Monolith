# Wolfgate: ported from HardLight - Protogen subspecies.
# The base Protogen prototypes are NOT taken; Wolfgate already has its own under _Mono.
# Each gets an explicit Icon so it does not inherit the _Mono protogen icon.

- type: entity
  id: TorsoProtoVulp
  name: "proto-vulp torso"
  parent: TorsoProtogen
  components:
  - type: Sprite
    sprite: _FarHorizons/Mobs/Species/Proto-Vulp/parts.rsi
    state: "torso_m"
  - type: Icon # Wolfgate: else it inherits PartProtogen's _Mono icon
    sprite: _FarHorizons/Mobs/Species/Proto-Vulp/parts.rsi
    state: "torso_m"

