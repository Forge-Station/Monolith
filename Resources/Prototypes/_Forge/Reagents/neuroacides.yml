        - n611p-effect-fifth
        - n611p-effect-sixth
        probability: 0.8
        conditions:
        - !type:ReagentThreshold
          min: 5
      - !type:GenericStatusEffect
        key: SeeingRainbows
        component: SeeingRainbows
        type: Add
        time: 8
        refresh: false
        conditions:
        - !type:ReagentThreshold
          min: 5
      - !type:Drunk
        boozePower: 5
        slurSpeech: false
        conditions:
