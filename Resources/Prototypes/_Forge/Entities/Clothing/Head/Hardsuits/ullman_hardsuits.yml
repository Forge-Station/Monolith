# UI Advanced Light hardsuit helmet
- type: entity
  parent: [ClothingHeadHardsuitBaseMilitary, ShowMedicalIcons, ShowSecurityIcons, ClothingNightVision4Ullman]
  id: ClothingHeadHelmetHardsuitUllmanMedical
  name: ullman medical hardsuit helmet
  description: The medical hardsuit helmet is used by the Ullman Industries medical staff.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Forge/Clothing/Head/Hardsuits/ui_med_hardsuit_helm.rsi
  - type: Clothing
    sprite: _Forge/Clothing/Head/Hardsuits/ui_med_hardsuit_helm.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.08
    lowPressureMultiplier: 1000
  - type: RadarConsole
    followEntity: true
    noRotate: true
  - type: ActivatableUI
    key: enum.RadarConsoleUiKey.Key
    singleUser: true
  - type: UserInterface
    interfaces:
      enum.RadarConsoleUiKey.Key:
        type: RadarConsoleBoundUserInterface
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.9
        Slash: 0.9
        Piercing: 0.9
        Heat: 0.9
  - type: HideLayerClothing
    slots:
    - Hair
    - Special
    - FacialHair
    - Snout
    - Head
    - HeadTop
    - HeadSide

# UI Light Jagernaut hardsuit helmet
- type: entity
  parent: [ClothingHeadHardsuitBaseMilitary, ClothingNightVision2Ullman, ShowMedicalIcons]
  id: ClothingHeadHelmetHardsuitUllmanLightJuggernaut
  name: ullman light juggernaut hardsuit helmet
  description: A helmet of the UI Light Jagernaut hardsuit "Terminus". Specialized in bullet protection.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Forge/Clothing/Head/Hardsuits/ui_light_juggernaut_helmet.rsi
  - type: Clothing
    sprite: _Forge/Clothing/Head/Hardsuits/ui_light_juggernaut_helmet.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.08
    lowPressureMultiplier: 1000
  - type: Armor
    modifiers:
      flatReductions:
        Blunt: 10
        Slash: 10
        Piercing: 10
  - type: HideLayerClothing
    slots:
    - Hair
    - Snout
    - HeadTop
    - HeadSide
