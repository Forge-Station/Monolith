- type: entity
  id: ActionXenoRegurgitate
  parent: ActionXenoBase
  name: Regurgitate
  description: Eject any devoured marines.
  components:
  - type: InstantAction
    itemIconStyle: NoItem
    icon:
      sprite: _WF/Xenonids/Actions/xeno_actions.rsi
      state: regurgitate
    event: !type:XenoRegurgitateActionEvent
  - type: RMCDazeableAction

- type: entity
  id: ActionXenoPheromones
  parent: ActionXenoBase
  name: Emit Pheromones (35) # TODO RMC14 proper plasma costs
  description: Gives a buff to nearby xenonids. [color=cyan]Consumes 2.5 plasma per second.[/color]
  components:
  - type: InstantAction
    itemIconStyle: NoItem
    icon:
      sprite: _WF/Xenonids/Actions/xeno_actions.rsi
      state: emit_pheromones
    useDelay: 0.33
    event: !type:XenoPheromonesActionEvent

- type: entity
  parent: ActionXenoBase
  id: ActionXenoHeal
  name: Heal Xenonid (600) # TODO RMC14 proper plasma costs
  description: Heals xenonids in a 4 tile range around where you click for 30% of their health over 20 seconds.
  components:
  - type: WorldTargetAction
    itemIconStyle: NoItem
    icon:
      sprite: _WF/Xenonids/Actions/xeno_actions.rsi
      state: heal_xeno
    useDelay: 8
    checkCanAccess: false
    range: -1
    event: !type:XenoHealActionEvent
  - type: XenoActionPlasma
    cost: 600

- type: entity
  parent: ActionXenoBase
  id: ActionXenoHealerDroneTransferPlasma
  name: Transfer plasma (100) # TODO RMC14 proper plasma costs
  description: Give plasma to a nearby xenonid.
  components:
  - type: EntityTargetAction
    itemIconStyle: NoItem
    icon:
      sprite: _WF/Xenonids/Actions/xeno_actions.rsi
      state: transfer_plasma
    range: 1.5
    event: !type:XenoTransferPlasmaActionEvent
      amount: 100

- type: entity
  parent: ActionXenoBase
  id: ActionXenoApplySalve
  name: Apply Salve (200)
  description: Apply a salve to use some of your health to heal allied Xenos up to 100 health over 5 seconds. You can stack multiple salves.
  components:
  - type: EntityTargetAction
    itemIconStyle: NoItem
    icon:
      sprite: _WF/Xenonids/Actions/xeno_actions.rsi
      state: apply_salve
    useDelay: 0.5
    range: 2
    event: !type:XenoApplySalveActionEvent
  - type: RMCDazeableAction
  - type: ActionBlockIfResting

- type: entity
  parent: ActionXenoBase
  id: ActionXenoSacrifice
  name: Sacrifice
  description: Sacrifice your life to heal a sister. [color=red]YOU WILL ONLY RESPAWN IF YOU MAXED OUT YOUR TRANSFERRED HEALTH BY HEALING SISTERS.[/color]
  components:
  - type: EntityTargetAction
    itemIconStyle: NoItem
    icon:
      sprite: _WF/Xenonids/Actions/xeno_actions.rsi
      state: screech
    range: 1.5
    event: !type:XenoSacrificeHealActionEvent
      componentsRemove:
      - type: RMCSlowdown
      - type: RMCSuperSlowdown
      - type: RMCRooted

- type: entity
  id: ActionJoinXeno
  name: Join as Xeno
  description: Find burrowed larva to join as.
  components:
  - type: InstantAction
    checkCanInteract: false
    icon:
      sprite: _WF/Xenonids/Actions/observer_actions.rsi
      state: join_xeno
    useDelay: 0.5
    event: !type:JoinXenoActionEvent
