# The flamers, from CMU. RMC's napalm tank and tile fire do not exist here, so both throw jets that set alight what they
# hit and end in a small fire-bomb burst (Weapons/projectiles.yml). The DRGN keeps CMU's numbers; the tank flamer's hundred
# units of napalm became a hundred jets, and its nine tiles of reach became the range of the gun. Both jets fly at the
# 53 of the other guns, not CMU's 20: at 20 a jet fired at a moving ship's own wall could end a fifth of a tile inside it.
