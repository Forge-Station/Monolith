      grabbers: 2

# The chair a prisoner is strapped to. Bolted down, so nobody carries off the cell.
- type: entity
  parent: Chair
  id: WFAbductCellChair
  name: prisoner chair
  description: A steel chair bolted to the deck, with worn straps. Someone has been kept here.
  components:
  - type: Transform
    anchored: true
  - type: WFAbductCell

# Their batons come out switched on, an NPC doesn't stop to thumb the switch, and do no harm. WFCrewGrabberSystem keeps them charged in crew hands.
- type: entity
  parent: Stunbaton
  id: WFCrewAbductorBaton
  suffix: NPC crew
  components:
  - type: ItemToggle
    activated: true
  - type: MeleeWeapon
    angle: 0
    wideAnimationRotation: -135
    damage:
      types:
        Blunt: 0
    animation: WeaponArcSlash

- type: startingGear
  id: WFCrewAbductorGear
  equipment:
    jumpsuit: ClothingUniformJumpsuitColorGrey
    shoes: ClothingShoesColorBlack
    ears: WFCrewHeadset
    outerClothing: ClothingOuterHardsuitSpatio
    head: ClothingHeadHelmetHardsuitSpatio
    mask: ClothingMaskBreath
    suitstorage: OxygenTankFilled
    belt: WFCrewAbductorBaton
    pocket1: Handcuffs
    pocket2: Handcuffs

# The Ashfall Reavers' pirate crew, armed to take people alive.
- type: wfCrewProfile
  id: WFCrewProfileAbductor
  firstNames: WFNamesPirateFirst
  lastNames: WFNamesPirateLast
  hullSwaps:
    WFWallDurasteel: WallPlastitanium
    WFWallDurasteelDiagonal: WallPlastitaniumDiagonal
    WFWallDurasteelCapital: WallPlastitaniumCapital
    WFWallDurasteelDiagonalCapital: WallPlastitaniumDiagonalCapital
  components:
  - type: WFCrewNonLethal
  - type: PirateAccent
  - type: WFCrewSuitUp
  - type: PressureImmunity
  - type: BreathingImmunity
  bodies:
  - WFMobCrewBodyHuman
  - WFMobCrewBodyHuman
  - WFMobCrewBodyReptilian
  - WFMobCrewBodyDwarf
  - WFMobCrewBodyVulpkanin
  skills: [ Green, Regular, Regular, Veteran ]
  loadouts:
    WFCrewCaptain: [ WFCrewAbductorGear ]
    WFCrewPilot: [ WFCrewAbductorGear ]
    WFCrewGunner: [ WFCrewAbductorGear ]
    WFCrewRadioOperator: [ WFCrewAbductorGear ]
    WFCrewMarine: [ WFCrewAbductorGear ]
    WFCrewEngineer: [ WFCrewAbductorGear ]
    WFCrewDeckhand: [ WFCrewAbductorGear ]
