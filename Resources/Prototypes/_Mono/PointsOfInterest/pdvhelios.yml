# PDV Helios Fortress is not spawned as a point of interest.
- type: gameMap
  id: HeliosFortress
  mapName: 'PDV Helios Fortress'
  mapPath: /Maps/_Mono/POI/pdvhelios.yml
  minPlayers: 0
  stations:
    HeliosFortress:
      stationProto: RecordsFrontierOutpostCargo
      gridComponents:
      - type: VesselInfo
        description: "An oppressive imperial aura lurks here. Glory to the Sultan."
      - type: JamDeathrattles
        exclusions:
        - FreelanceTrackingImplant
      - type: JamOverwatch
        excludedFactions:
        - PDV
      - type: DeleteNearbyDrones
        distance: 5000
      - type: ApplyIFFFlagsToDockedShips
        flags:
        - HideLabelAlways # hide all docked ships
      components:
        - type: StationNameSetup
          mapNameTemplate: 'PDV Helio Fortress'
        - type: ExtraStationInformation
          icon: /Textures/_NF/Interface/Pirate/piratelogo.png
          stationSubtext: 'frontier-lobby-pirate-subtext'
          stationDescription: 'frontier-lobby-pirate-description'
        - type: StationJobs
          availableJobs:
            # PdvCivilian: [ -1, -1 ]
            PirateCaptain: [ 1, 1 ]
            PirateFirstMate: [ 1, 1 ]
            PDVDenasvar: [ 3, 3 ]
            WFPdvJarrah: [ 2, 2 ] # WOLFGATE(PdvMedic): PDV field medic slots
            # PDVInfiltrator: [ 2, 2 ]
            Pirate: [ -1, -1 ]
            PdvBorg: [ 2, 2 ]
          tags:
          - GrandVizier
        - type: StationDeadDropReporting
          messageSet: Pirate
        - type: StationDeadDropHintExempt

### Hyperwar

# PDV Helios Fortress hyperwar variant is not spawned as a point of interest.
- type: gameMap
  id: HeliosFortressHyperwar
  mapName: 'PDV Helios Fortress'
  mapPath: /Maps/_Mono/POI/pdvhelios_hw.yml
  minPlayers: 0
  stations:
    HeliosFortressHyperwar:
      stationProto: RecordsFrontierOutpostCargo
      gridComponents:
      - type: VesselInfo
        description: "An oppressive imperial aura lurks here. Glory to the Sultan."
      - type: Tag
        tags:
        - PdvStation
      components:
        - type: StationNameSetup
          mapNameTemplate: 'PDV Helio Fortress'
        - type: StationEventEligible
        - type: NpcFactionMember
          factions:
          - PirateNF
        - type: ExtraStationInformation
          icon: /Textures/_NF/Interface/Pirate/piratelogo.png
          stationSubtext: 'frontier-lobby-pirate-subtext'
          stationDescription: 'frontier-lobby-pirate-description'
        - type: StationJobs
          availableJobs:
            PirateCaptain: [ 1, 1 ]
            PDVTarkhan: [ 3, 3 ]
            PirateFirstMate: [ 3, 3 ]
            PDVDenasvar: [ 6, 6 ]
            WFPdvJarrah: [ 4, 4 ] # WOLFGATE(PdvMedic): PDV field medic slots
            # PDVInfiltrator: [ 2, 2 ]
            Pirate: [ -1, -1 ]
            PdvBorg: [ 2, 2 ]
          tags:
          - CentralCommand
        - type: StationDeadDropReporting
          messageSet: Pirate
        - type: StationDeadDropHintExempt
