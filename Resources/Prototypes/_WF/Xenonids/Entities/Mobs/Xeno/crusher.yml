- type: entity
  abstract: true
  parent:
  - CMXenoDeveloped
  - CMXenoTail
  - CMXenoFlammable
  - RMCXenoSpeechSounds
  # WOLFGATE: cut parent RMCXenoCommendationReceiver
  - RMCXenoMobCollision
  id: CMXenoCrusherBase
  name: Crusher
  description: A huge alien with an enormous armored crest.
  components:
  - type: GuideHelp
    guides:
    - RMCGuideRoleCrusher
  - type: Sprite
    sprite: _WF/Xenonids/Mobs/Xenonids/Crusher/crusher.rsi
  - type: MobState
    allowedStates:
    - Alive
    - Critical
    - Dead
  - type: MobThresholds
    thresholds:
      0: Alive
      700: Critical
      800: Dead
  - type: Xeno
    role: CMXenoCrusher
    actionIds:
    - ActionXenoRest
    - ActionXenoRegurgitate
    - ActionXenoWatch
    - ActionXenoTailStab
    - ActionXenoStomp
    - ActionXenoDevolve
    tier: 3
    hudOffset: -0.15,0.1
    unlockAt: 900 # 15 minutes
  - type: XenoRegen
    standHealingMultiplier: 0.66
  - type: XenoHeavy
  - type: XenoDevolve
    devolvesTo:
    - CMXenoWarrior
  - type: XenoDevour
  - type: XenoStomp
    damage:
      types:
        Blunt: 65
    selfEffect: CMEffectSelfStomp
  - type: XenoAnimateMovement
  - type: XenoPlasma
    plasma: 400
    maxPlasma: 400
    plasmaRegenOnWeeds: 4
  - type: CMArmor
    xenoArmor: 30
    explosionArmor: 100
  - type: XenoClaws
    clawType: VerySharp
  - type: MeleeWeapon
    damage:
      groups:
        Brute: 40
  - type: XenoTailStab
    tailDamage:
      groups:
        Brute: 48
  - type: XenoMeleeSlow
    slowTime: 3.5
  - type: Tackle
    chance: 0.25
  - type: MovementSpeedModifier
    baseWalkSpeed: 1.66
    baseSprintSpeed: 3
  - type: SlowOnPull
    # WOLFGATE: humanoids stand in for marines
    slowdowns:
    - multiplier: 0.68
      whitelist:
        components:
        - HumanoidAppearance
    - multiplier: 0.755
      whitelist:
        components:
        - XenoLight
    - multiplier: 0.5275
      whitelist:
        components:
        - XenoHeavy
  - type: XenoBrutalize
    damage:
      types:
        Blunt: 16
  - type: RMCSize
    size: Immobile
  - type: RMCXenoDamageVisuals
    prefix: crusher
  # WOLFGATE: cut TacticalMapIcon (tactical map)
  - type: StunOnExplosionReceived
    weak: false
  # WOLFGATE: cut IntelRecoverCorpseObjectiveOnDeath (intel)
  - type: TantrumSpeedBuff
  - type: FixedIdentity
    name: cm-job-name-xeno-crusher
  # WOLFGATE: cut RMCSurgeryXenoHeart (RMC medical)

- type: entity
  parent: CMXenoCrusherBase
  id: RMCXenoCrusher
  components:
  - type: Xeno
    actionIds:
    - ActionXenoRest
    - ActionXenoRegurgitate
    - ActionXenoWatch
    - ActionXenoTailStab
    - ActionXenoCharge
    - ActionXenoStomp
    - ActionXenoDefensiveShield
    - ActionXenoDevolve
  - type: CrusherShield
  - type: XenoCharge
    damage:
      types:
        Blunt: 60
        Structural: 750
  - type: XenoShield
  - type: XenoEvolution
    strains:
    - RMCXenoCrusherCharger
  # WOLFGATE: cut RMCActionOrder

- type: entity
  parent: CMXenoCrusherBase
  id: RMCXenoCrusherCharger
  suffix: Charger
  components:
  - type: Sprite
    sprite: _WF/Xenonids/Mobs/Xenonids/Crusher/charger_crusher.rsi
  - type: MobThresholds
    thresholds:
      0: Alive
      780: Critical
      880: Dead
  - type: Xeno
    ignorePheromones: Frenzy
    actionIds:
    - ActionXenoRest
    - ActionXenoRegurgitate
    - ActionXenoWatch
    - ActionXenoTailStab
    - ActionXenoToggleCharging
    - ActionXenoStomp
    - ActionXenoTumble
    - ActionXenoRam
    - ActionXenoDevolve
  - type: CMArmor
    xenoArmor: 20
    frontalArmor: 30
    sideArmor: 15
  - type: MeleeWeapon
    damage:
      groups:
        Brute: 30
  - type: XenoTailStab
    tailDamage:
      groups:
        Brute: 36
  - type: MovementSpeedModifier
    baseWalkSpeed: 1.9
    baseSprintSpeed: 3.4
  - type: XenoStrain
    name: rmc-xeno-charger-name
    description: rmc-xeno-charger-description
    popup: rmc-xeno-charger-popup
  - type: CombatMode
    toggleMouseRotator: false
  - type: XenoTumble
    damage:
      types:
        Blunt: 15
  - type: XenoFling
    paralyzeTime: 0
    slowTime: 8
  - type: XenoStomp # TODO RMC14 screen shake?
    plasmaCost: 25
    paralyzeUnderOnly: true
    range: 3.95
    damage:
      types:
        Blunt: 75
  - type: XenoToggleCharging
  - type: XenoToggleChargingDefaultCollide
    damagePerStage:
      types:
        Blunt: 5
        Structural: 5
    barricadeDamagePerStage: # CM13: momentum * 22
      types:
        Blunt: 22
        Structural: 22
    structureDamagePerStage: # CM13: momentum * 40
      types:
        Blunt: 40
        Structural: 40
    maxStageDamageMultiplier: 1.0
    sound:
      path: /Audio/_WF/Xenonids/Effects/metal_crash.ogg
  - type: XenoHidden
  # WOLFGATE: cut RMCActionOrder
