#region rocket

- type: entity
  id: CartridgeMacCastRocket
  name: light torpedo (MAC Cast adapter)
  parent: BaseItem
  description: Корабельная лёгкая торпеда, адаптированная для РПВ-41 «Каст».
  components:
  - type: Tag
    tags:
    - CartridgeMacCastRocket
  - type: Item
    size: Small
  - type: CartridgeAmmo
    proto: BulletMacCastRocket
    deleteOnSpawn: true
  - type: Sprite
    sprite: _Mono/Objects/SpaceArtillery/mini_rocket.rsi
    state: mini-rocket
