    tile: WFCavernFloorUmbralDusk
    threshold: -1
  - !type:BiomeEntityLayer
    allowedTiles: [WFCavernFloorUmbralDusk]
    entities: [CrystalPink]
    threshold: 0.88
    noise: { seed: 310, noiseType: OpenSimplex2, frequency: 1 }
  - !type:BiomeEntityLayer
    allowedTiles: [WFCavernFloorUmbralDusk]
    entities: [WFCavernGeodeCluster]
    threshold: 0.9
    noise: { seed: 581, noiseType: OpenSimplex2, frequency: 1 }
  - !type:BiomeEntityLayer
    allowedTiles: [WFCavernFloorUmbralDusk]
    entities: [WFCavernFaunaAerumnaGeode]
    threshold: 0.955
    noise: { seed: 582, noiseType: OpenSimplex2, frequency: 3 }
  - !type:BiomeEntityLayer
    allowedTiles: [WFCavernFloorUmbralDusk]
    entities: [WFCavernPaleLichenPlant]
    threshold: 0.94
    noise: { seed: 583, noiseType: OpenSimplex2, frequency: 1 }
  # Rare.
  - !type:BiomeEntityLayer
    allowedTiles: [WFCavernFloorUmbralDusk]
    entities: [WFCavernGeodeBloom]
    threshold: 0.982
    noise: { seed: 584, noiseType: OpenSimplex2, frequency: 1 }
  - !type:BiomeEntityLayer
    allowedTiles: [WFCavernFloorUmbralDusk]
    entities: [WFCavernRadiantCrystal]
    threshold: 0.99
    noise: { seed: 585, noiseType: OpenSimplex2, frequency: 1 }

# The deep nest: dark crust under wild weeds, with small resin chambers, resin doors and eggs in them. Everything it
# lays stands on the nest floor only; the weeds never spread and the eggs lie dormant until walked up to.
- type: biomeTemplate
  id: WFCavernNestAerumna
  layers:
  - !type:BiomeTileLayer
    tile: WFCavernFloorNest
    threshold: -1
  # Wild weeds over most of the ground, thinning out in patches.
  - !type:BiomeEntityLayer
    allowedTiles: [WFCavernFloorNest]
    entities: [WFXenoWeedsWild]
    threshold: -0.55
    noise: { seed: 120, noiseType: OpenSimplex2, frequency: 0.6 }
  - !type:BiomeEntityLayer
    allowedTiles: [WFCavernFloorNest]
    entities: [WFCavernFaunaAerumnaNest]
    threshold: 0.93
    noise: { seed: 121, noiseType: OpenSimplex2, frequency: 3 }
  # Small chambers: a ring of resin with gaps and doors round a floor of weeds and eggs.
  - !type:BiomeMetaLayer
    template: WFCavernNestChambersAerumna
    threshold: 0.22
    noise: { seed: 122, noiseType: OpenSimplex2, frequency: 0.08 }

- type: biomeTemplate
