    prototype: KiasManagementConsole
  - type: Sprite
    sprite: _Forge/KIAS/Pack/board.rsi
    color: White
    layers:
    - state: base
      map: ["0"]
- type: latheRecipe
  id: KiasManagementConsoleBoard
  parent: BaseGoldCircuitboardRecipe
  result: KiasManagementConsoleBoard

