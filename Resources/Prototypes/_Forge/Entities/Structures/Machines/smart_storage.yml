- type: entity
  parent: BaseSmartStorage
  id: SmartVinylStorage
  name: SmartVinyl
  description: Stores a lot of combat-related items & tools.
  components:
  # - type: Machine
  #   board: SmartArmoryCircuitboard #поменять
  - type: Sprite
    sprite: _Forge/Structures/Machines/smartvinylstorage.rsi
    snapCardinals: true
    layers:
    - state: smartvinyl
      map: ["enum.StorageVisualLayers.Base"]
    - state: smartvinyl_open
      map: ["enum.StorageVisualLayers.Door"]
      shader: unshaded
    - state: screen_open
      map: ["enum.StorageVisualLayers.Door"]
      shader: unshaded
  - type: PointLight
    color: "#9dc5c9"
  - type: SmartFridge
    flavorText: smart-fridge-request-armory #поменять
    whitelist:
      components:
      - Vinyl
      tags:
      - CD
      - VinylSleeveFit
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:DoActsBehavior
        acts: ["Breakage"]
    - trigger:
        !type:DamageTrigger
        damage: 500
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: ExplosionResistance
    damageCoefficient: 0.1